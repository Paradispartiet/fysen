name: Fysen review native black tagliatelle photo
on:
  push:
    branches: [art/pasta-bolognese-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-pasta-bolognese.yml"
      - "scripts/preview-pasta-bolognese-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bolognese-black-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate whole-plate preview with source SHA verification
        run: python scripts/preview-pasta-bolognese-black.py
      - name: Check this is only a photo review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony")
          d=json.loads((p/"black-review.json").read_text())
          assert d["review_native_dimensions"]==[4000,3000]
          assert d["original_pixels_upscaled"] is False
          assert d["visual_review_completed"] is False
          assert d["approved_for_fysen"] is False
          assert d["published"] is False
          assert (p/"black-native-detail-1400.jpg").is_file()
          print("Source-locked bolognese is ready for visual review, not yet approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tagliatelle-native-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-native-master.png
            assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-preview.jpg
            assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-native-detail-1400.jpg
            assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-review.json
      - name: Commit previews and license review only
        run: |
          rm -f assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-preview.jpg
          git add assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[bolognese-preview-bot] Stage black source and 1:1 food detail"
          git push origin HEAD:"$GITHUB_REF_NAME"
