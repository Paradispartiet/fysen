name: Fysen preview chicken katsu on black (unapproved)
on:
  push:
    branches: [art/chicken-katsu-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-preview-chicken-katsu.yml"
      - "scripts/preview-chicken-katsu-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-chicken-katsu-mask-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install image masking libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate source-locked review images
        run: python scripts/preview-chicken-katsu-black.py
      - name: Do not approve or publish mask-only previews
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice")
          a=json.loads((c/"black-review.json").read_text(encoding="utf8"))
          assert a["source_native_dimensions"]==[5472,3648]
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["visual_review_completed"] and not a["approved_for_fysen"] and not a["published"]
          for variant in a["variants"]:
              assert (c/f"{variant}-preview.jpg").is_file()
              assert (c/f"{variant}-native-detail-1400.jpg").is_file()
          print("3 mask previews unapproved, no published changes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-chicken-katsu-black-masks-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-*.jpg
            assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-review.json
      - name: Commit only small black-background previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-*.jpg
          git add assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[katsu-preview-bot] Stage 3 unapproved mask previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
