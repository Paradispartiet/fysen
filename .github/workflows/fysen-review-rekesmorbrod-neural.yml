name: Fysen assess neural shrimp sandwich matte (review only)
on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-rekesmorbrod-neural.yml"
      - "scripts/preview-rekesmorbrod-neural.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-shrimp-neural-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local segmentation and image codecs
        run: python -m pip install --disable-pip-version-check "rembg[cpu]==2.0.67" "Pillow==11.3.0"
      - name: Make source-pixel-preserving foreground preview
        run: python scripts/preview-rekesmorbrod-neural.py
      - name: Check approval remains off and original dimensions valid
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/rekesmorbrod/40853857")
          meta=json.loads((p/"black-neural-review.json").read_text())
          assert meta["crop_native_dimensions"] == [3950,3340]
          assert meta["native_food_pixels_resized"] is False
          assert meta["approved_for_fysen"] is False
          assert meta["visual_review_completed"] is False
          assert meta["published"] is False
          print("Neural matte staged for visual inspection; NOT approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-rekesmorbrod-neural-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-native-master.png
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-review.json
      - name: Commit only preview and audit evidence to open PR
        run: |
          rm -f assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-preview.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-detail-1400.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-neural-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-neural-bot] Stage foreground-matte source review"
          git push origin HEAD:"$GITHUB_REF_NAME"
