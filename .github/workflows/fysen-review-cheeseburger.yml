name: Fysen review native black cheeseburger

on:
  push:
    branches: [art/cheeseburger-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-cheeseburger.yml"
      - "scripts/preview-cheeseburger-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-cheeseburger-black-review
  cancel-in-progress: false
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo segmentation tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.11.0.86
      - name: Build black-background review without resizing food pixels
        run: python scripts/preview-cheeseburger-black.py
      - name: Confirm images remain unapproved before visual review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/cheeseburger/11812583")
          x=json.loads((p/"black-review.json").read_text())
          assert x["native_black_size"]==[6000,4000]
          assert x["visual_review_completed"] is False
          assert x["approved_for_fysen"] is False
          assert x["published"] is False
          assert (p/"black-preview.jpg").exists()
          print("Review-only black burger photo 6000x4000, original unchanged")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-cheeseburger-black-native-review
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/fysen-image-candidates/cheeseburger/11812583/black-native-6000x4000.png
            assets/fysen-image-candidates/cheeseburger/11812583/black-native-detail-1400.jpg
            assets/fysen-image-candidates/cheeseburger/11812583/black-preview.jpg
            assets/fysen-image-candidates/cheeseburger/11812583/black-review.json
      - name: Keep only previews and verification evidence in PR
        run: |
          rm -f assets/fysen-image-candidates/cheeseburger/11812583/black-native-6000x4000.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/cheeseburger/11812583/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/cheeseburger/11812583/black-preview.jpg
          git add assets/fysen-image-candidates/cheeseburger/11812583/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[cheeseburger-preview-bot] Stage black-background image and native detail for review"
          git push origin HEAD:"$GITHUB_REF_NAME"
