name: Fysen promote reviewed native pizza photo

on:
  push:
    branches: [art/pizza-margherita-native-candidates-20261119]
    paths:
      - ".github/workflows/fysen-promote-pizza-margherita.yml"
      - "scripts/promote-reviewed-pizza-margherita.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fysen-promote-pizza-margherita
  cancel-in-progress: false

jobs:
  promote-reviewed-pizza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86
      - name: Promote SHA-locked reviewed original, master and thumbnail
        run: python scripts/promote-reviewed-pizza-margherita.py
      - name: Run only relevant gallery and provenance tests
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs
      - name: Verify no public deploy has been initiated
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          manifest = json.loads(Path("apps/web/public/dish-images/manifest.json").read_text())
          pizza = next(x for x in manifest["images"] if x["id"] == "pizza-margherita")
          assert pizza["largeViewEnabled"] is True
          assert pizza["largeSource"] == "pizza-margherita-master-3000.avif"
          assert pizza["atlas"] == "pizza-margherita-thumb-512.avif"
          evidence = json.loads(Path("assets/fysen-image-candidates/pizza-margherita/31136887/black-review.json").read_text())
          assert evidence["approved_for_fysen"] is True
          assert evidence["published"] is False
          print("Pizza master and thumbnail verified on PR branch; no production deployment")
          PY
      - name: Commit reviewed media into the same PR, not main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/pizza-margherita.png
          git add assets/fysen-image-candidates/pizza-margherita/31136887/black-review.json
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/public/dish-images/pizza-margherita-master-3000.avif
          git add apps/web/public/dish-images/pizza-margherita-thumb-512.avif
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/pizza-margherita.md
          git diff --cached --quiet && exit 0
          git commit -m "[pizza-promote-bot] Integrate reviewed 3000px margherita and separate 512px thumbnail"
          git push origin HEAD:"$GITHUB_REF_NAME"
