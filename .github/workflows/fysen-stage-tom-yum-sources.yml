name: Fysen Tom yum photo source review (no release)
on:
  push:
    branches: [art/tom-yum-native-source-review-20261120]
    paths:
      - ".github/workflows/fysen-stage-tom-yum-sources.yml"
      - "scripts/stage-tom-yum-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-tom-yum-native-sources
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch and inspect native-resolution Tom yum source photographs
        run: python scripts/stage-tom-yum-sources.py
      - name: Ensure every candidate is blocked from promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path("assets/fysen-image-candidates/tom-yum").glob("*/review.json"))
          assert len(paths)>=2, f"Expected >=2 valid sources, found {len(paths)}"
          for path in paths:
              d=json.loads(path.read_text())
              assert d["dish_id"]=="tom-yum"
              assert min(d["original_dimensions"])>=1600
              assert d["approved_for_fysen"] is False
              assert d["published"] is False
              assert d["visual_review_completed"] is False
              assert (path.parent/"native-detail-1400.jpg").is_file()
          print(f"Validated {len(paths)} genuine native source candidates; NO PROMOTION")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tom-yum-native-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/tom-yum/*/source.jpeg
            assets/fysen-image-candidates/tom-yum/*/preview.jpg
            assets/fysen-image-candidates/tom-yum/*/native-detail-1400.jpg
            assets/fysen-image-candidates/tom-yum/*/review.json
      - name: Commit only small visual review files to draft branch
        run: |
          find assets/fysen-image-candidates/tom-yum -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/tom-yum
          git diff --cached --quiet && exit 0
          git commit -m "[tom-yum-review-bot] Native-source previews; NOT approved"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
