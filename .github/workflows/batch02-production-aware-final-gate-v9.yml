name: TEMP Batch 02 production-aware final gate v9

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-production-aware-final-gate-v9.yml"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Prove published-refresh fail-closed safety contract
        run: pnpm --filter @fysen/menu-worker exec vitest run src/onboarding-refresh-safety.test.ts src/catalog-onboarding-failure-policy.test.ts src/production-menu-mutation-workflow.test.ts

      - name: Validate current 56 catalog serially
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';
          const files=(await readdir('catalog')).filter((x)=>x.endsWith('.json'));
          const slugs=[];
          for(const file of files) slugs.push(JSON.parse(await readFile(`catalog/${file}`,'utf8')).restaurant.slug);
          if(files.length!==56||new Set(slugs).size!==56) throw new Error(`Catalog=${files.length}/${new Set(slugs).size}; expected 56/56`);
          NODE
          set +e
          node dist/index.js validate:batch catalog | tee research/final-gate-all56-primary.json
          exit 0

      - name: Build transport/action-only retry set
        id: retryset
        working-directory: apps/menu-worker
        shell: bash
        run: |
          rm -rf research/final-gate-retry && mkdir -p research/final-gate-retry
          node --input-type=module <<'NODE'
          import {readdir,readFile,writeFile} from 'node:fs/promises';
          const primary=JSON.parse(await readFile('research/final-gate-all56-primary.json','utf8'));
          const allowed=new Set(['transport','action']);
          const retryable=[]; const nonRetryable=[];
          for(const r of (primary.results??[]).filter((x)=>!x.accepted)){
            const families=r.failureFamilies??[];
            const row={slug:r.slug,failureFamilies:families,error:r.error??null,menuError:r.validation?.menu?.error??null,itemCount:r.validation?.menu?.quality?.itemCount??null};
            (families.length>0&&families.every((f)=>allowed.has(f))?retryable:nonRetryable).push(row);
          }
          const retrySlugs=new Set(retryable.map((x)=>x.slug)); let copied=0;
          for(const file of (await readdir('catalog')).filter((x)=>x.endsWith('.json'))){
            const raw=await readFile(`catalog/${file}`,'utf8'); const m=JSON.parse(raw);
            if(!retrySlugs.has(m.restaurant.slug)) continue;
            await writeFile(`research/final-gate-retry/${file}`,raw); copied++;
          }
          if(copied!==retryable.length) throw new Error(`retry manifest mismatch ${copied}/${retryable.length}`);
          await writeFile('research/final-gate-retryset.json',JSON.stringify({retryable,nonRetryable},null,2)+'\n');
          await writeFile(process.env.GITHUB_OUTPUT,`retry_count=${retryable.length}\n`,{flag:'a'});
          NODE

      - name: Retry transport/action-only failures
        if: steps.retryset.outputs.retry_count != '0'
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/final-gate-retry | tee research/final-gate-retry-results.json
          exit 0

      - name: Empty retry result
        if: steps.retryset.outputs.retry_count == '0'
        working-directory: apps/menu-worker
        run: printf '%s\n' '{"manifestCount":0,"acceptedCount":0,"failedCount":0,"results":[]}' > research/final-gate-retry-results.json

      - name: Gate combined 56 catalog evidence
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const p=JSON.parse(await readFile('research/final-gate-all56-primary.json','utf8'));
          const s=JSON.parse(await readFile('research/final-gate-retryset.json','utf8'));
          const r=JSON.parse(await readFile('research/final-gate-retry-results.json','utf8'));
          const accepted=new Set((p.results??[]).filter((x)=>x.accepted).map((x)=>x.slug));
          for(const x of r.results??[]) if(x.accepted) accepted.add(x.slug);
          const unresolved=(r.results??[]).filter((x)=>!x.accepted).map((x)=>x.slug);
          const summary={primaryAccepted:p.acceptedCount,primaryFailed:p.failedCount,retryable:s.retryable,nonRetryable:s.nonRetryable,retryAccepted:r.acceptedCount,retryFailed:r.failedCount,combinedAccepted:accepted.size,unresolved};
          await writeFile('research/final-gate-all56-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(s.nonRetryable.length) throw new Error(`Non-retryable failures ${JSON.stringify(s.nonRetryable)}`);
          if(unresolved.length) throw new Error(`Unresolved retry failures ${JSON.stringify(unresolved)}`);
          if(accepted.size!==56) throw new Error(`Combined catalog=${accepted.size}/56`);
          NODE

      - name: Restore Batch 02 plan and build four target plan
        shell: bash
        run: |
          rm -rf /tmp/batch02 && mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const bySlug=new Map(source.restaurants.map((x)=>[x.restaurant.slug,x]));
          const variants=[
            {slug:'benares-tordenskiolds-gate-oslo',url:'https://benares.no/meny?menu=menu',fetchMode:'browser'},
            {slug:'the-golden-chimp-torggata-oslo',url:'https://www.thegoldenchimp.no/menu',fetchMode:'http'},
            {slug:'kverneriet-majorstua-oslo',url:'https://kverneriet.com/majorstua/menu/',fetchMode:'http'},
            {slug:'kverneriet-solli-oslo',url:'https://kverneriet.com/solli/menu/',fetchMode:'http'},
          ];
          const restaurants=variants.map((v)=>{
            const base=structuredClone(bySlug.get(v.slug));
            if(!base) throw new Error(`Missing Batch 02 seed ${v.slug}`);
            base.menuSource={...base.menuSource,url:v.url,sourceType:'html',fetchMode:v.fetchMode,sourceSupport:{redirectOrigins:[],browserDataOrigins:[]}};
            return base;
          });
          const plan={...source,outputDirectory:'research/final-gate-generated',concurrency:1,restaurants};
          await mkdir('apps/menu-worker/research/final-gate-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/final-gate.plan.json',JSON.stringify(plan,null,2)+'\n');
          NODE

      - name: Fresh residual-four intake
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/final-gate.plan.json | tee research/final-gate-intake.json

      - name: Independent residual-four validation
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/final-gate-generated | tee research/final-gate-validation.json

      - name: Gate exact residual-four output
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const intake=JSON.parse(await readFile('research/final-gate-intake.json','utf8'));
          const validation=JSON.parse(await readFile('research/final-gate-validation.json','utf8'));
          const rows=(validation.results??[]).map((r)=>({slug:r.slug,accepted:r.accepted,itemCount:r.validation?.menu?.quality?.itemCount??null,names:r.validation?.menu?.observedDishNames??[],variants:r.validation?.menu?.observedDishVariants??[],extractorVersion:r.validation?.menu?.extractorVersion??null,error:r.validation?.menu?.error??r.error??null}));
          const bySlug=new Map(rows.map((r)=>[r.slug,r]));
          const forbidden=new Set(['Chicken','DUMPLINGS','PROTEINS','SIDES','DESSERT','Upgrades & Extras','SN','SY']);
          const qualityFailures=[];
          for(const row of rows) for(const name of row.names) if(forbidden.has(name)) qualityFailures.push(`${row.slug}:${name}`);
          const benares=bySlug.get('benares-tordenskiolds-gate-oslo');
          const chimp=bySlug.get('the-golden-chimp-torggata-oslo');
          const major=bySlug.get('kverneriet-majorstua-oslo');
          const solli=bySlug.get('kverneriet-solli-oslo');
          if(!benares||!chimp||!major||!solli) throw new Error('Missing target result');
          const requiredChimpPrefixes=['Pork Gyoza with Japanese ketchup','Grilled Chicken Yakiniku','Grilled Seabass'];
          for(const prefix of requiredChimpPrefixes) if(!chimp.names.some((name)=>name.startsWith(prefix))) qualityFailures.push(`golden-chimp:missing-prefix:${prefix}`);
          const requiredKverneriet=['Triple Chili Cheese','Original Ribs','The Godfather'];
          for(const row of [major,solli]) for(const name of requiredKverneriet) if(!row.names.includes(name)) qualityFailures.push(`${row.slug}:missing:${name}`);
          const counts={benares:benares.itemCount,chimp:chimp.itemCount,major:major.itemCount,solli:solli.itemCount};
          if((benares.itemCount??0)<69) qualityFailures.push(`benares:coverage:${benares.itemCount}`);
          if((chimp.itemCount??0)<15) qualityFailures.push(`chimp:coverage:${chimp.itemCount}`);
          if((major.itemCount??0)<20) qualityFailures.push(`major:coverage:${major.itemCount}`);
          if((solli.itemCount??0)<20) qualityFailures.push(`solli:coverage:${solli.itemCount}`);
          const summary={revision:'f90d2f88ab9706154de1943ce2625ecfd5fad283',intake:{requested:intake.requestedCount,generated:intake.generatedCount,failed:intake.failedCount},validation:{manifestCount:validation.manifestCount,accepted:validation.acceptedCount,failed:validation.failedCount},counts,qualityFailures,rows};
          await writeFile('research/final-gate-residual-four-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(intake.requestedCount!==4||intake.generatedCount!==4||intake.failedCount!==0) throw new Error('Residual-four intake gate failed');
          if(validation.manifestCount!==4||validation.acceptedCount!==4||validation.failedCount!==0) throw new Error('Residual-four validation gate failed');
          if(qualityFailures.length) throw new Error(`Residual-four quality failures ${JSON.stringify(qualityFailures)}`);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-production-aware-final-gate-v9
          path: |
            apps/menu-worker/research/final-gate-all56-primary.json
            apps/menu-worker/research/final-gate-retryset.json
            apps/menu-worker/research/final-gate-retry-results.json
            apps/menu-worker/research/final-gate-all56-summary.json
            apps/menu-worker/research/final-gate.plan.json
            apps/menu-worker/research/final-gate-intake.json
            apps/menu-worker/research/final-gate-validation.json
            apps/menu-worker/research/final-gate-residual-four-summary.json
            apps/menu-worker/research/final-gate-generated/*.json
          if-no-files-found: warn
