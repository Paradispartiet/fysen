name: Fysen promote carbonara native 2600px
on:
  push:
    branches: [art/matlyst-carbonara-native-2600-20261119]
    paths: [".github/workflows/fysen-promote-carbonara.yml", "scripts/promote-reviewed-carbonara.py", "apps/web/tests/dish-photo-gallery.test.mjs"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-promote-carbonara-native-2600
  cancel-in-progress: false
jobs:
  promote:
    if: "!contains(github.event.head_commit.message, '[photo-promote-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Produce reviewed native AVIF and small thumbnail
        run: python scripts/promote-reviewed-carbonara.py
      - name: Focused source authenticity and gallery tests
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/home-discovery-refresh.test.mjs
      - name: Commit verified image bytes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/pasta-carbonara.png apps/web/public/dish-images/pasta-carbonara-master-2600.avif apps/web/public/dish-images/carbonara-thumb-512.avif apps/web/public/dish-images/manifest.json docs/fysen-image-reviews/pasta-carbonara.md
          git diff --cached --quiet && exit 0
          git commit -m "[photo-promote-bot] Integrate native 2600px carbonara image"
          git push origin HEAD:"$GITHUB_REF_NAME"
