name: Stage Carbonara CC0 candidate
on:
  push:
    branches: [art/carbonara-cc0-candidate]
    paths:
      - scripts/stage-carbonara-cc0-candidate.py
      - .github/workflows/fysen-carbonara-cc0-candidate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-carbonara-cc0-candidate
  cancel-in-progress: false
jobs:
  stage:
    if: "!contains(github.event.head_commit.message, '[photo-candidate-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Stage candidate for visual review
        run: python scripts/stage-carbonara-cc0-candidate.py
      - name: Retain review images
        uses: actions/upload-artifact@v4
        with:
          name: carbonara-cc0-visual-review
          path: assets/fysen-image-candidates/pasta-carbonara-cc0/
          if-no-files-found: error
      - name: Commit candidate outside public assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pasta-carbonara-cc0
          git diff --cached --quiet && exit 0
          git commit -m "[photo-candidate-bot] Stage unapproved Carbonara CC0 candidate"
          git push origin HEAD:"$GITHUB_REF_NAME"
