name: Fysen preview CC0 Banh mi source on black (unapproved)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "scripts/preview-banh-mi-cc0-black.py"
      - ".github/workflows/fysen-preview-banh-mi-cc0-black.yml"
permissions:
  contents: write
concurrency:
  group: fysen-banh-mi-source-review-cc0
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'art/fysen-next-source-review-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/fysen-next-source-review-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image source mask dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Recreate source-locked unapproved whole Banh mi on black
        run: python scripts/preview-banh-mi-cc0-black.py
      - name: Verify nonpublication and retained native source detail
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0")
          r=json.loads((p/"black-grabcut-review.json").read_text(encoding="utf8"))
          assert r["dish_id"]==r["catalog_id"]=="banh-mi"
          assert r["no_upscale"] and not r["generated_food_pixels"]
          assert not r["approved_for_fysen"] and not r["published"]
          assert not r["visual_review_completed"]
          assert min(r["processed_native_dimensions"])>=2000
          assert (p/"black-grabcut-preview.jpg").is_file()
          assert (p/"black-grabcut-detail-1400.jpg").is_file()
          print("ORIGINAL NATIVE DETAIL RETAINED, NO PUBLIC GALLERY CHANGES")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-banh-mi-cc0-original-size-black-mask-unapproved
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-native.png
            assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-preview.jpg
            assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-detail-1400.jpg
            assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-review.json
      - name: Commit only preview/detail/review metadata (not original, not public)
        run: |
          rm assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-native.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/banh-mi/andy-li-special-baguette-cc0/black-grabcut-*
          git diff --cached --quiet && exit 0
          git commit -m "[banh-mi-review-bot] Stage unapproved source-locked black backdrop"
          git pull --rebase origin art/fysen-next-source-review-20261121
          git push origin HEAD:art/fysen-next-source-review-20261121
