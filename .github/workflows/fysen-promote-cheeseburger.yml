name: Fysen promote reviewed cheeseburger large photo

on:
  push:
    branches: [art/cheeseburger-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-promote-cheeseburger.yml"
      - "scripts/promote-cheeseburger-reviewed.py"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fysen-cheeseburger-photo-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: "!contains(github.event.head_commit.message, '[cheeseburger-promote-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AVIF and native photo support
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6
      - name: Promote SHA-locked 2185x1800 editorial original
        run: python scripts/promote-cheeseburger-reviewed.py
      - name: Check gallery and large-image quality only
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs
      - name: Check published-status guard and exact dish mapping
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("apps/web/public/dish-images/manifest.json")
          m=json.loads(p.read_text())
          images=m["images"]
          entry=next(x for x in images if x["id"]=="cheeseburger")
          assert sum(x.get("largeViewEnabled") is True for x in images)==6
          assert entry["largeViewEnabled"] is True
          assert entry["largeSource"]=="cheeseburger-master-2185.avif"
          assert entry["atlas"]=="cheeseburger-thumb-512.avif"
          assert entry["largeSourceNativeWidth"]==2185
          assert entry["largeSourceNativeHeight"]==1800
          evidence=json.loads(Path("assets/fysen-image-candidates/cheeseburger/18713426/black-alt-review.json").read_text())
          assert evidence["approved_for_fysen"] is True
          assert evidence["published"] is False
          print("Six verified large sources in PR; no public deployment.")
          PY
      - name: Commit approved source, AVIF master, mini and exact metadata to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/cheeseburger.png
          git add assets/fysen-image-candidates/cheeseburger/18713426/black-alt-review.json
          git add apps/web/public/dish-images/cheeseburger-master-2185.avif
          git add apps/web/public/dish-images/cheeseburger-thumb-512.avif
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/cheeseburger.md
          git diff --cached --quiet && exit 0
          git commit -m "[cheeseburger-promote-bot] Integrate verified bacon-cheeseburger with independent AVIF mini"
          git push origin HEAD:"$GITHUB_REF_NAME"
