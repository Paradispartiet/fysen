name: TEMP apply generic Elementor menu-root parser fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-menu-root-scope-v9-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-menu-root-scope-v9
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Apply permanent generic parser changes
        shell: bash
        run: |
          cat > apps/menu-worker/src/html-elementor-price-list-recovery.ts <<'TS'
          import {
            createMenuItemSourceKey,
            normalizeDishName,
            type MenuObservedItem,
          } from "@fysen/menu-core";
          import { load } from "cheerio";

          export const HTML_ELEMENTOR_PRICE_LIST_RECOVERY_VERSION =
            "elementor-price-list-v1";

          const CARD_SELECTOR = ".elementor-price-list-item";
          const TITLE_SELECTOR = ".elementor-price-list-title";
          const PRICE_SELECTOR = ".elementor-price-list-price";
          const DESCRIPTION_SELECTOR = ".elementor-price-list-description";
          const PRICE =
            /^(?:(?:NOK|kr\.?)\s*)?([1-9]\d{1,3})(?:[.,](\d{1,2}))?(?:\s*(?:,-|kr\.?|NOK))?$/iu;
          const UI_TITLE =
            /^(?:menu|meny|drinks?|drikke|events?|kontakt|contact|booking|reservations?)$/iu;

          function normalizeText(value: string): string {
            return value.normalize("NFKC").replace(/\s+/g, " ").trim();
          }

          function parsePriceMinor(value: string): number | null {
            const match = normalizeText(value).match(PRICE);
            if (!match?.[1]) return null;
            const whole = Number(match[1]);
            const decimals = (match[2] ?? "").padEnd(2, "0").slice(0, 2);
            const priceMinor = whole * 100 + Number(decimals || "0");
            return priceMinor >= 4_000 && priceMinor <= 1_000_000
              ? priceMinor
              : null;
          }

          function plausibleTitle(value: string): boolean {
            const title = normalizeText(value);
            return (
              title.length >= 2 &&
              title.length <= 220 &&
              /\p{L}/u.test(title) &&
              !UI_TITLE.test(title) &&
              !/^(?:https?:\/\/|www\.|©|™)/iu.test(title)
            );
          }

          export function recoverElementorPriceListHtmlItems(
            html: string,
          ): readonly MenuObservedItem[] {
            const $ = load(html);
            const cards = $(CARD_SELECTOR);
            if (cards.length < 4) return [];

            const items: MenuObservedItem[] = [];
            const normalizedNames = new Set<string>();
            let invalid = false;

            cards.each((position, element) => {
              if (invalid) return;
              const card = $(element);
              const titles = card.find(TITLE_SELECTOR);
              const prices = card.find(PRICE_SELECTOR);
              if (titles.length !== 1 || prices.length !== 1) {
                invalid = true;
                return;
              }

              const name = normalizeText(titles.first().text());
              const priceText = normalizeText(prices.first().text());
              const priceMinor = parsePriceMinor(priceText);
              const normalizedName = normalizeDishName(name);
              if (
                !plausibleTitle(name) ||
                priceMinor === null ||
                !normalizedName ||
                normalizedNames.has(normalizedName)
              ) {
                invalid = true;
                return;
              }
              normalizedNames.add(normalizedName);

              const description =
                normalizeText(card.find(DESCRIPTION_SELECTOR).first().text()) || null;
              items.push({
                sourceKey: createMenuItemSourceKey(name),
                name,
                normalizedName,
                description,
                sectionName: null,
                priceMinor,
                currency: "NOK",
                position,
                extractionMethod: "html_heuristic",
                confidence: 0.995,
                sourceExcerpt: [name, priceText, description]
                  .filter(Boolean)
                  .join(" — ")
                  .slice(0, 1000),
              });
            });

            if (invalid || items.length !== cards.length) return [];
            return items;
          }
          TS

          cat > apps/menu-worker/src/html-elementor-price-list-recovery.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import {
            HTML_ELEMENTOR_PRICE_LIST_RECOVERY_VERSION,
            recoverElementorPriceListHtmlItems,
          } from "./html-elementor-price-list-recovery.js";

          function card(title: string, price: string, description = ""): string {
            return `<div class="elementor-price-list-item"><div class="elementor-price-list-header"><span class="elementor-price-list-title">${title}</span><span class="elementor-price-list-price">${price}</span></div><p class="elementor-price-list-description">${description}</p></div>`;
          }

          describe("Elementor price-list structural recovery", () => {
            it("binds every complete card to its explicit title and price", () => {
              const html = [
                card("KITFO / ክትፎ", "kr349.00", "Raw beef with spices"),
                card("Zilzil Tebsi/ ዝልዝል ጥብሲ", "kr389.00", "Chili nivo / gluten fri"),
                card("Spesialbestiling (to dager før) Dero hel full høne 12 egg Spesialbestilles", "kr2600.00"),
                card("Suppe med linser og pasta", "kr239.00", "Soup with lenses and pasta"),
              ].join("");
              const items = recoverElementorPriceListHtmlItems(html);
              expect(HTML_ELEMENTOR_PRICE_LIST_RECOVERY_VERSION).toBe(
                "elementor-price-list-v1",
              );
              expect(items.map((item) => [item.name, item.priceMinor])).toEqual([
                ["KITFO / ክትፎ", 34900],
                ["Zilzil Tebsi/ ዝልዝል ጥብሲ", 38900],
                [
                  "Spesialbestiling (to dager før) Dero hel full høne 12 egg Spesialbestilles",
                  260000,
                ],
                ["Suppe med linser og pasta", 23900],
              ]);
              expect(items.every((item) => item.confidence === 0.995)).toBe(true);
            });

            it("fails closed instead of partially preferring an incomplete card family", () => {
              const html = [
                card("Dish one", "100"),
                card("Dish two", "110"),
                card("Dish three", "120"),
                `<div class="elementor-price-list-item"><span class="elementor-price-list-title">Dish four</span></div>`,
              ].join("");
              expect(recoverElementorPriceListHtmlItems(html)).toEqual([]);
            });

            it("fails closed on duplicate titles because section identity is not explicit", () => {
              const html = [
                card("House dish", "100"),
                card("House dish", "110"),
                card("Dish three", "120"),
                card("Dish four", "130"),
              ].join("");
              expect(recoverElementorPriceListHtmlItems(html)).toEqual([]);
            });
          });
          TS

          cat > apps/menu-worker/src/html-elementor-menu-root-regression.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { extractScopedHtmlMenu } from "./html-source-extractor.js";
          import { filterHtmlBeverageSectionItemsWithScopedProvenance } from "./html-text-section-scope.js";

          function card(title: string, price: string, description = ""): string {
            return `<div class="elementor-price-list-item"><div class="elementor-price-list-header"><span class="elementor-price-list-title">${title}</span><span class="elementor-price-list-price">${price}</span></div><p class="elementor-price-list-description">${description}</p></div>`;
          }

          describe("Elementor menu-root regression", () => {
            it("does not let a pre-menu Drinks navigation label poison the food menu", () => {
              const html = `<html><body>
                <nav><a>Menu</a><a>Drinks</a><a>Events</a></nav>
                <h1>MENU</h1><h2>OUR MENU</h2>
                ${card("KITFO / ክትፎ", "kr349.00")}
                ${card("Zilzil Tebsi/ ዝልዝል ጥብሲ", "kr389.00", "Chili nivo / gluten fri")}
                ${card("Spesialbestiling (to dager før) Dero hel full høne 12 egg Spesialbestilles", "kr2600.00", "Linser (rod eller gul) 269kr")}
                ${card("Suppe med linser og pasta", "kr239.00", "Vegan soup with lenser and pasta")}
              </body></html>`;
              const extracted = extractScopedHtmlMenu(html);
              expect(extracted.items.map((item) => item.name)).toEqual([
                "KITFO / ክትፎ",
                "Zilzil Tebsi/ ዝልዝል ጥብሲ",
                "Spesialbestiling (to dager før) Dero hel full høne 12 egg Spesialbestilles",
                "Suppe med linser og pasta",
              ]);
              expect(extracted.items.map((item) => item.priceMinor)).toEqual([
                34900,
                38900,
                260000,
                23900,
              ]);

              const scoped = filterHtmlBeverageSectionItemsWithScopedProvenance(
                extracted.items,
                extracted.visibleText,
                extracted.visibleText,
              );
              expect(scoped.map((item) => item.name)).toEqual(
                extracted.items.map((item) => item.name),
              );
            });
          });
          TS

          python - <<'PY'
          from pathlib import Path

          source = Path('apps/menu-worker/src/html-source-extractor.ts')
          s = source.read_text()
          s = s.replace(
              'import {\n  extractHtmlMenu,\n  stripExplicitlyHiddenHtmlContent,\n  type ExtractedHtmlMenu,\n} from "./html-extractor.js";\n\nexport const HTML_SOURCE_EXTRACTOR_VERSION = "html-v20";',
              'import {\n  extractHtmlMenu,\n  stripExplicitlyHiddenHtmlContent,\n  type ExtractedHtmlMenu,\n} from "./html-extractor.js";\nimport { recoverElementorPriceListHtmlItems } from "./html-elementor-price-list-recovery.js";\n\nexport const HTML_SOURCE_EXTRACTOR_VERSION = "html-v21";'
          )
          needle = '  const visibleText = scopedText.visibleText;\n  const numbered = extractNumberedMenuItems(visibleText);'
          replacement = '''  const visibleText = scopedText.visibleText;\n  const elementorPriceListItems = recoverElementorPriceListHtmlItems(visibleHtml);\n  if (elementorPriceListItems.length >= 4) {\n    return {\n      items: elementorPriceListItems,\n      method: "html_heuristic",\n      visibleText,\n    };\n  }\n  const numbered = extractNumberedMenuItems(visibleText);'''
          if needle not in s:
              raise SystemExit('html-source-extractor integration anchor missing')
          s = s.replace(needle, replacement, 1)
          if 'html-v20' in s or 'recoverElementorPriceListHtmlItems' not in s:
              raise SystemExit('html-source-extractor patch incomplete')
          source.write_text(s)

          scope = Path('apps/menu-worker/src/html-text-section-scope.ts')
          s = scope.read_text()
          s = s.replace('text-section-scope-v8', 'text-section-scope-v9', 1)
          anchor = 'const MENU_END_SECTION_LABEL =\n'
          root = 'const MENU_ROOT_SECTION_LABEL = /^(?:menu|meny|our\\s+menu|vår\\s+meny)$/iu;\n'
          if root not in s:
              if anchor not in s:
                  raise SystemExit('scope root anchor missing')
              s = s.replace(anchor, root + anchor, 1)
          beverage = '    if (!countedSection && BEVERAGE_SECTION_LABEL.test(sectionLabel)) {\n'
          reset = '''    if (!countedSection && !sawPrice && MENU_ROOT_SECTION_LABEL.test(sectionLabel)) {\n      state = "unknown";\n      states[index] = "unknown";\n      continue;\n    }\n'''
          if reset not in s:
              if beverage not in s:
                  raise SystemExit('scope state anchor missing')
              s = s.replace(beverage, reset + beverage, 1)
          scope.write_text(s)

          for test in Path('apps/menu-worker/src').glob('*.test.ts'):
              t = test.read_text()
              t = t.replace('"html-v20"', '"html-v21"')
              t = t.replace('"text-section-scope-v8"', '"text-section-scope-v9"')
              test.write_text(t)
          PY
      - name: Targeted parser tests
        run: pnpm --filter @fysen/menu-worker test -- html-elementor-price-list-recovery.test.ts html-elementor-menu-root-regression.test.ts html-text-section-scope.test.ts html-source-extractor.test.ts menu-source-runtime-version.test.ts html-direct-priced-food-title-regression.test.ts
      - name: Build menu worker graph
        run: pnpm --filter @fysen/menu-worker... build
      - name: Commit permanent code only
        shell: bash
        run: |
          rm .github/workflows/batch02-menu-root-scope-v9-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src .github/workflows/batch02-menu-root-scope-v9-apply.yml
          git diff --cached --check
          git commit -m "Fix menu-root scope and Elementor price lists"
          git push origin HEAD:agent/batch02-menu-root-scope-v9
