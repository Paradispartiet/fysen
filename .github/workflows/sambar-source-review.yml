name: Sambar source acquisition (review only)
on:
  push:
    branches: [art/sambar-native-source-20261128]
    paths:
      - scripts/stage-sambar-native-candidate.py
      - .github/workflows/sambar-source-review.yml
permissions:
  contents: write
jobs:
  stage:
    if: github.repository == 'Paradispartiet/fysen' && github.ref == 'refs/heads/art/sambar-native-source-20261128'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/stage-sambar-native-candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: sambar-native-source-review
          path: assets/fysen-image-candidates/sambar/raksanand-cc-by-sa-4/
          retention-days: 7
      - name: Record unapproved candidate on this branch only
        run: |
          test "$GITHUB_REF" = refs/heads/art/sambar-native-source-20261128
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/sambar/raksanand-cc-by-sa-4/
          git commit -m "Stage unapproved licensed Sambar source"
          git push origin HEAD:refs/heads/art/sambar-native-source-20261128
