name: Fysen kebab black background photo review
on:
  push:
    branches: [art/kebab-pita-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-kebab-commons-black-review.yml"
      - "scripts/preview-kebab-commons-black.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-kebab-commons-black-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only photo processing dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reuse source-verified original from prior run
        uses: actions/download-artifact@v4
        with:
          name: fysen-kebab-commons-original-source-review
          run-id: 44790058147
          github-token: ${{ github.token }}
          path: /tmp/fysen-kebab-commons-download
      - name: Produce native-pixel review masks (not public)
        run: python scripts/preview-kebab-commons-black.py
      - name: Archive original-resolution alternatives for review
        uses: actions/upload-artifact@v4
        with:
          name: fysen-kebab-commons-black-reviews
          retention-days: 7
          if-no-files-found: error
          path: |
            /tmp/fysen-kebab-commons-black/*.png
            assets/fysen-image-candidates/kebab-pita/commons-lauren-pita/black-*.jpg
            assets/fysen-image-candidates/kebab-pita/commons-lauren-pita/black-review.json
      - name: Save only unapproved previews in draft PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/kebab-pita/commons-lauren-pita/black-*.jpg
          git add assets/fysen-image-candidates/kebab-pita/commons-lauren-pita/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[kebab-preview-bot] Stage unapproved black kebab previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
