name: Preserve approved Matlyst dish images

on:
  pull_request:
    paths:
      - "apps/web/public/dish-images/manifest.json"
      - "apps/web/components/dish-photo-gallery.tsx"
      - "scripts/verify-matlyst-image-preservation.mjs"
      - "scripts/verify-matlyst-image-preservation.test.mjs"
      - ".github/workflows/preserve-approved-matlyst-images.yml"

permissions:
  contents: read

jobs:
  approved-image-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR with base history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare PR image manifest with its exact base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git show "$BASE_SHA:apps/web/public/dish-images/manifest.json" \
            > "$RUNNER_TEMP/fysen-base-dish-manifest.json"
          node scripts/verify-matlyst-image-preservation.mjs \
            "$RUNNER_TEMP/fysen-base-dish-manifest.json" \
            apps/web/public/dish-images/manifest.json
      - name: Test preservation guard using synthetic manifests
        shell: bash
        run: node --test scripts/verify-matlyst-image-preservation.test.mjs
