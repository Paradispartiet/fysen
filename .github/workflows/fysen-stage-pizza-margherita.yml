name: Fysen stage native pizza margherita photo candidates

on:
  push:
    branches: [art/pizza-margherita-native-candidates-20261119]
    paths:
      - ".github/workflows/fysen-stage-pizza-margherita.yml"
      - "scripts/stage-pizza-margherita-candidates.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fysen-pizza-margherita-review
  cancel-in-progress: false

jobs:
  stage-source-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image inspection codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download licensed original photos and native-detail samples
        run: python scripts/stage-pizza-margherita-candidates.py
      - name: Confirm that none of the candidate images is approved or public
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = list(Path("assets/fysen-image-candidates/pizza-margherita").glob("*/review.json"))
          assert candidates, "No photo candidates staged"
          for path in candidates:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["source_verified"] is True
              assert data["visual_review_completed"] is False
              assert data["approved_for_fysen"] is False
              assert data["published"] is False
              assert min(data["source_original_width"], data["source_original_height"]) >= 2400
              assert (path.parent / "native-detail-1400.jpg").exists()
          print(f"{len(candidates)} candidates staged; no public Fysen image changed")
          PY
      - name: Keep unmodified source JPEGs for private review
        uses: actions/upload-artifact@v4
        with:
          name: fysen-pizza-margherita-native-candidates
          path: |
            assets/fysen-image-candidates/pizza-margherita/*/source.jpeg
            assets/fysen-image-candidates/pizza-margherita/*/preview.jpg
            assets/fysen-image-candidates/pizza-margherita/*/native-detail-1400.jpg
            assets/fysen-image-candidates/pizza-margherita/*/review.json
          if-no-files-found: error
          retention-days: 7
      - name: Save only review previews and metadata in this PR
        run: |
          find assets/fysen-image-candidates/pizza-margherita -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pizza-margherita
          git diff --cached --quiet && exit 0
          git commit -m "[pizza-candidate-bot] Stage native photo detail previews for review"
          git push origin HEAD:"$GITHUB_REF_NAME"
