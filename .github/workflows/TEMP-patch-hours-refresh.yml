name: TEMP patch hours extractor refresh

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/hours-extractor-refresh-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Patch hours extractor refresh semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('apps/menu-worker/src/opening-hours-source-runtime.ts')
          text = runtime.read_text()
          version = 'export const OPENING_HOURS_RUNTIME_EXTRACTOR_VERSION = `${OPENING_HOURS_SOURCE_EXTRACTOR_VERSION}+${OPENING_HOURS_DUPLICATE_SECTION_RECOVERY_VERSION}+${OPENING_HOURS_SCOPE_HINT_RESOLVER_VERSION}+${OPENING_HOURS_MARKER_NORMALIZER_VERSION}+${OPENING_HOURS_REDUNDANT_CUTOFF_NORMALIZER_VERSION}`;\n'
          helper = version + '''\nexport function shouldForceOpeningHoursReextract(\n  previousExtractorVersion: string | null,\n): boolean {\n  return (\n    previousExtractorVersion !== null &&\n    previousExtractorVersion !== OPENING_HOURS_RUNTIME_EXTRACTOR_VERSION\n  );\n}\n'''
          if 'shouldForceOpeningHoursReextract' not in text:
              if version not in text:
                  raise SystemExit('hours runtime version anchor missing')
              text = text.replace(version, helper, 1)
          runtime.write_text(text)

          sources = Path('packages/database/src/restaurant-hours-sources.ts')
          text = sources.read_text()
          row_anchor = '''interface RestaurantHoursSourceRow extends QueryResultRow {\n'''
          row_insert = '''interface RestaurantHoursSnapshotVersionRow extends QueryResultRow {\n  extractor_version: string;\n}\n\n''' + row_anchor
          if 'interface RestaurantHoursSnapshotVersionRow' not in text:
              if row_anchor not in text:
                  raise SystemExit('hours source row anchor missing')
              text = text.replace(row_anchor, row_insert, 1)
          func_anchor = '''export async function upsertRestaurantHoursSource(\n'''
          func = '''export async function getLatestRestaurantHoursSnapshotExtractorVersion(\n  pool: Pool,\n  sourceId: string,\n): Promise<string | null> {\n  const result = await pool.query<RestaurantHoursSnapshotVersionRow>(\n    `SELECT extractor_version\n       FROM fysen.restaurant_hours_snapshots\n      WHERE source_id = $1\n      ORDER BY fetched_at DESC, created_at DESC\n      LIMIT 1`,\n    [sourceId],\n  );\n  return result.rows[0]?.extractor_version ?? null;\n}\n\n''' + func_anchor
          if 'getLatestRestaurantHoursSnapshotExtractorVersion' not in text:
              if func_anchor not in text:
                  raise SystemExit('hours source helper anchor missing')
              text = text.replace(func_anchor, func, 1)
          sources.write_text(text)

          hours = Path('packages/database/src/restaurant-hours.ts')
          text = hours.read_text()
          count_old = '''interface CountRow extends QueryResultRow {\n  interval_count: number;\n}\n'''
          count_new = '''interface SnapshotStateRow extends QueryResultRow {\n  interval_count: number;\n  extractor_version: string;\n}\n'''
          if 'interface SnapshotStateRow' not in text:
              if count_old not in text:
                  raise SystemExit('hours snapshot state interface anchor missing')
              text = text.replace(count_old, count_new, 1)
          query_old = '''    const previousResult = await client.query<CountRow>(\n      `SELECT interval_count\n         FROM fysen.restaurant_hours_snapshots\n        WHERE source_id = $1\n        ORDER BY fetched_at DESC, created_at DESC\n        LIMIT 1`,\n      [input.sourceId],\n    );\n    const previousCount = previousResult.rows[0]?.interval_count ?? null;\n'''
          query_new = '''    const previousResult = await client.query<SnapshotStateRow>(\n      `SELECT interval_count, extractor_version\n         FROM fysen.restaurant_hours_snapshots\n        WHERE source_id = $1\n        ORDER BY fetched_at DESC, created_at DESC\n        LIMIT 1`,\n      [input.sourceId],\n    );\n    const previousSnapshot = previousResult.rows[0] ?? null;\n    const previousCount = previousSnapshot?.interval_count ?? null;\n'''
          if 'const previousSnapshot = previousResult.rows[0] ?? null;' not in text:
              if query_old not in text:
                  raise SystemExit('hours previous snapshot query anchor missing')
              text = text.replace(query_old, query_new, 1)
          same_old = '''    if (source.last_schedule_fingerprint === input.scheduleFingerprint) {\n      await client.query(\n'''
          same_new = '''    const scheduleUnchanged =\n      source.last_schedule_fingerprint === input.scheduleFingerprint;\n    const extractorUnchanged =\n      previousSnapshot?.extractor_version === input.extractorVersion;\n\n    if (scheduleUnchanged && extractorUnchanged) {\n      await client.query(\n'''
          if 'const extractorUnchanged' not in text:
              if same_old not in text:
                  raise SystemExit('hours unchanged branch anchor missing')
              text = text.replace(same_old, same_new, 1)
          update_old = '''              last_changed_at = $5,\n              next_check_at = $6,\n'''
          update_new = '''              last_changed_at = CASE\n                WHEN last_schedule_fingerprint IS DISTINCT FROM $4 THEN $5\n                ELSE last_changed_at\n              END,\n              next_check_at = $6,\n'''
          if 'WHEN last_schedule_fingerprint IS DISTINCT FROM $4 THEN $5' not in text:
              if update_old not in text:
                  raise SystemExit('hours changed timestamp anchor missing')
              text = text.replace(update_old, update_new, 1)
          return_old = '''      outcome: "changed",\n      startedAt: input.startedAt,\n'''
          return_new = '''      outcome: scheduleUnchanged ? "unchanged" : "changed",\n      startedAt: input.startedAt,\n'''
          if 'outcome: scheduleUnchanged ? "unchanged" : "changed"' not in text:
              if return_old not in text:
                  raise SystemExit('hours watch outcome anchor missing')
              text = text.replace(return_old, return_new, 1)
          final_old = '''    return { outcome: "changed", snapshotId };\n'''
          final_new = '''    return {\n      outcome: scheduleUnchanged ? "unchanged" : "changed",\n      snapshotId,\n    };\n'''
          if 'outcome: scheduleUnchanged ? "unchanged" : "changed",\n      snapshotId' not in text:
              if final_old not in text:
                  raise SystemExit('hours observation return anchor missing')
              text = text.replace(final_old, final_new, 1)
          hours.write_text(text)

          runner = Path('apps/menu-worker/src/run-opening-hours.ts')
          text = runner.read_text()
          import_old = '''  createDatabasePool,\n  getRestaurantHoursSourceById,\n  listDueRestaurantHoursSources,\n'''
          import_new = '''  createDatabasePool,\n  getLatestRestaurantHoursSnapshotExtractorVersion,\n  getRestaurantHoursSourceById,\n  listDueRestaurantHoursSources,\n'''
          if 'getLatestRestaurantHoursSnapshotExtractorVersion' not in text:
              if import_old not in text:
                  raise SystemExit('hours DB import anchor missing')
              text = text.replace(import_old, import_new, 1)
          runtime_import_old = '''import { resolveOpeningHoursSource } from "./opening-hours-source-runtime.js";\n'''
          runtime_import_new = '''import {\n  resolveOpeningHoursSource,\n  shouldForceOpeningHoursReextract,\n} from "./opening-hours-source-runtime.js";\n'''
          if 'shouldForceOpeningHoursReextract' not in text:
              if runtime_import_old not in text:
                  raise SystemExit('hours runtime import anchor missing')
              text = text.replace(runtime_import_old, runtime_import_new, 1)
          try_old = '''  try {\n    const resolved = await resolveOpeningHoursSource(\n'''
          try_new = '''  try {\n    const previousExtractorVersion =\n      await getLatestRestaurantHoursSnapshotExtractorVersion(pool, source.id);\n    const forceReextract = shouldForceOpeningHoursReextract(\n      previousExtractorVersion,\n    );\n    const resolved = await resolveOpeningHoursSource(\n'''
          if 'const forceReextract = shouldForceOpeningHoursReextract' not in text:
              if try_old not in text:
                  raise SystemExit('hours force refresh anchor missing')
              text = text.replace(try_old, try_new, 1)
          validators_old = '''        etag: source.etag,\n        lastModified: source.lastModified,\n'''
          validators_new = '''        etag: forceReextract ? null : source.etag,\n        lastModified: forceReextract ? null : source.lastModified,\n'''
          if 'etag: forceReextract ? null : source.etag' not in text:
              if validators_old not in text:
                  raise SystemExit('hours validators anchor missing')
              text = text.replace(validators_old, validators_new, 1)
          notmod_old = '''    if (resolved.kind === "not_modified") {\n      await recordRestaurantHoursNotModified(pool, {\n'''
          notmod_new = '''    if (resolved.kind === "not_modified") {\n      if (forceReextract) {\n        const errorCode = "FORCED_HOURS_REEXTRACT_NOT_MODIFIED";\n        const errorMessage =\n          "Hours source returned HTTP 304 while a newer runtime extractor required a full re-extraction";\n        await recordRestaurantHoursFailure(pool, {\n          sourceId: source.id,\n          outcome: "fetch_error",\n          startedAt,\n          completedAt,\n          httpStatus: resolved.fetched.status,\n          errorCode,\n          errorMessage,\n        });\n        return {\n          sourceId: source.id,\n          outcome: "fetch_error",\n          intervalCount: null,\n          snapshotId: null,\n          errorCode,\n        };\n      }\n      await recordRestaurantHoursNotModified(pool, {\n'''
          if 'FORCED_HOURS_REEXTRACT_NOT_MODIFIED' not in text:
              if notmod_old not in text:
                  raise SystemExit('hours forced 304 anchor missing')
              text = text.replace(notmod_old, notmod_new, 1)
          runner.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/opening-hours-source-runtime.ts apps/menu-worker/src/run-opening-hours.ts packages/database/src/restaurant-hours-sources.ts packages/database/src/restaurant-hours.ts
      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/opening-hours-source-runtime.ts apps/menu-worker/src/run-opening-hours.ts packages/database/src/restaurant-hours-sources.ts packages/database/src/restaurant-hours.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Force hours refresh on extractor changes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
