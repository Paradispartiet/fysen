name: Post-338 read-only production state

on:
  pull_request:
    paths:
      - ".github/workflows/post338-readonly-production-state.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Require production database secret
        run: |
          test -n "$DATABASE_URL" || { echo "Missing production DB secret" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: 196c0b5e7ee5167f68657ef082a1f70fff91ea71
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/database... build
      - name: Snapshot production state read-only
        shell: bash
        run: |
          mkdir -p apps/menu-worker/research
          node --input-type=module <<'NODE' | tee apps/menu-worker/research/post338-production-state.json
          import { readdir, readFile } from 'node:fs/promises';
          import { createDatabasePool } from './packages/database/dist/index.js';

          const files = (await readdir('apps/menu-worker/catalog')).filter((x) => x.endsWith('.json')).sort();
          const manifests = [];
          for (const file of files) manifests.push(JSON.parse(await readFile(`apps/menu-worker/catalog/${file}`, 'utf8')));
          const catalogSlugs = new Set(manifests.map((m) => m.restaurant.slug));
          const targets = ['coyo-sorenga-oslo','hrimnir-ramen-storgata','lahori-dera-gronland-oslo','oche-aker-brygge-oslo','oche-torggata-oslo','registan-gronland-oslo','viet-kitchen-bjolsen-oslo'];
          const pool = createDatabasePool();
          try {
            const totals = await pool.query(`SELECT
              (SELECT count(*)::int FROM fysen.restaurants WHERE active=true) AS active_restaurants,
              (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled=true) AS enabled_menu_sources`);
            const restaurants = await pool.query(`SELECT r.slug, r.active,
              count(ms.id) FILTER (WHERE ms.enabled)::int AS enabled_source_count
              FROM fysen.restaurants r LEFT JOIN fysen.menu_sources ms ON ms.restaurant_id=r.id
              GROUP BY r.id,r.slug,r.active ORDER BY r.slug`);
            const inactiveCanonical = restaurants.rows.filter((r) => catalogSlugs.has(r.slug) && !r.active);
            const activeNotCatalog = restaurants.rows.filter((r) => r.active && !catalogSlugs.has(r.slug));
            const targetSources = await pool.query(`SELECT r.slug, r.active,
              ms.id AS menu_source_id, ms.url, ms.source_type, ms.fetch_mode, ms.enabled,
              ms.minimum_expected_items, ms.last_http_status, ms.consecutive_failures,
              snap.extractor_version, snap.fetched_at AS snapshot_fetched_at,
              snap.item_count AS snapshot_item_count,
              wr.outcome AS latest_watch_outcome, wr.http_status AS latest_watch_http_status,
              wr.extracted_item_count, wr.error_code, wr.error_message,
              wr.started_at AS latest_watch_started_at
              FROM fysen.restaurants r
              JOIN fysen.menu_sources ms ON ms.restaurant_id=r.id
              LEFT JOIN LATERAL (
                SELECT s.extractor_version,s.fetched_at,count(mi.id)::int AS item_count
                FROM fysen.menu_snapshots s
                LEFT JOIN fysen.menu_items mi ON mi.snapshot_id=s.id
                WHERE s.menu_source_id=ms.id
                GROUP BY s.id,s.extractor_version,s.fetched_at
                ORDER BY s.fetched_at DESC,s.created_at DESC LIMIT 1
              ) snap ON true
              LEFT JOIN LATERAL (
                SELECT w.outcome,w.http_status,w.extracted_item_count,w.error_code,w.error_message,w.started_at
                FROM fysen.menu_watch_runs w WHERE w.menu_source_id=ms.id
                ORDER BY w.started_at DESC LIMIT 1
              ) wr ON true
              WHERE r.slug=ANY($1::text[])
              ORDER BY r.slug,ms.created_at ASC`, [targets]);
            const hours = await pool.query(`SELECT r.slug, hs.enabled, hs.consecutive_failures,
              hs.url, snap.extractor_version, snap.fetched_at AS snapshot_fetched_at,
              snap.interval_count, wr.outcome AS latest_watch_outcome,
              wr.error_code,wr.error_message,wr.started_at AS latest_watch_started_at
              FROM fysen.restaurants r
              JOIN fysen.restaurant_hours_sources hs ON hs.restaurant_id=r.id
              LEFT JOIN LATERAL (
                SELECT s.extractor_version,s.fetched_at,s.interval_count
                FROM fysen.restaurant_hours_snapshots s WHERE s.source_id=hs.id
                ORDER BY s.fetched_at DESC,s.created_at DESC LIMIT 1
              ) snap ON true
              LEFT JOIN LATERAL (
                SELECT w.outcome,w.error_code,w.error_message,w.started_at
                FROM fysen.restaurant_hours_watch_runs w WHERE w.source_id=hs.id
                ORDER BY w.started_at DESC LIMIT 1
              ) wr ON true
              WHERE r.slug=ANY($1::text[]) ORDER BY r.slug`, [targets]);
            console.log(JSON.stringify({
              mergeCommit:'196c0b5e7ee5167f68657ef082a1f70fff91ea71',
              catalogCount: manifests.length,
              totals: totals.rows[0],
              inactiveCanonical,
              activeNotCatalog,
              targetSources: targetSources.rows,
              targetHours: hours.rows,
            }, null, 2));
          } finally { await pool.end(); }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: post338-readonly-production-state
          path: apps/menu-worker/research/post338-production-state.json
          if-no-files-found: error
