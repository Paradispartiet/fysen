name: TEMP Batch 02 Sawan current runtime proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-sawan-current-runtime-proof.yml"

permissions:
  contents: read

jobs:
  trace-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-sawan-current-runtime-proof
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Trace strong-title and standalone-price DOM relationships
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research
          node --input-type=module <<'NODE' | tee research/sawan-current-dom-trace.json
          import {createHash} from 'node:crypto';
          import {load} from 'cheerio';

          const url='https://www.sawan.no/meny';
          const response=await fetch(url,{headers:{'user-agent':process.env.FYSEN_MENU_BOT_USER_AGENT,'accept':'text/html,application/xhtml+xml'}});
          const body=await response.text();
          if(!response.ok) throw new Error(`Sawan HTTP ${response.status}`);
          const $=load(body);
          $('script,style,noscript,svg,template').remove();
          const text=(node)=>$(node).text().normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/gu,'').replace(/\s+/g,' ').trim();
          const purePrice=/^(?:(?:NOK|kr\.?)\s*)?[1-9]\d{1,3}(?:[.,]\d{1,2})?\s*(?:,?[-–—]|kr\.?|NOK)?(?:\s+per\s+person)?$/iu;
          const short=(value,max=360)=>value.length<=max?value:`${value.slice(0,max)}…`;
          const nodeInfo=(node)=>({
            tag:(node?.tagName??node?.name??'').toLowerCase(),
            class:($(node).attr('class')??'').trim()||null,
            text:short(text(node)),
            strong:[...$(node).find('strong').toArray()].map((s)=>text(s)).filter(Boolean).slice(0,8),
          });
          const minimalPrices=[];
          $('p,div,span,li').each((_,el)=>{
            const value=text(el);
            if(!purePrice.test(value)) return;
            const childExact=$(el).children('p,div,span,li').toArray().some((child)=>purePrice.test(text(child)));
            if(childExact) return;
            minimalPrices.push(el);
          });
          const priceRows=minimalPrices.slice(0,120).map((el,index)=>{
            const levels=[];
            let current=el;
            for(let depth=0;depth<5&&current;depth+=1){
              const currentInfo=nodeInfo(current);
              const previous=$(current).prevAll().slice(0,6).toArray().map(nodeInfo);
              levels.push({depth,current:currentInfo,previous});
              current=$(current).parent().get(0);
            }
            return {index,price:text(el),levels};
          });
          const strongRows=[];
          $('strong').each((index,el)=>{
            const value=text(el);
            if(!value) return;
            const parent=$(el).parent().get(0);
            const grandparent=parent?$(parent).parent().get(0):null;
            const followingParent=parent?$(parent).nextAll().slice(0,5).toArray().map(nodeInfo):[];
            const followingGrand=grandparent?$(grandparent).nextAll().slice(0,5).toArray().map(nodeInfo):[];
            strongRows.push({index,strong:value,parent:parent?nodeInfo(parent):null,grandparent:grandparent?nodeInfo(grandparent):null,followingParent,followingGrand});
          });
          const report={
            url,
            finalUrl:response.url,
            status:response.status,
            sourceSha256:createHash('sha256').update(body).digest('hex'),
            sourceBytes:Buffer.byteLength(body),
            minimalPriceCount:minimalPrices.length,
            priceRows,
            strongCount:strongRows.length,
            strongRows:strongRows.slice(0,120),
          };
          console.log(JSON.stringify(report,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-sawan-current-dom-trace
          path: apps/menu-worker/research/sawan-current-dom-trace.json
          if-no-files-found: error
