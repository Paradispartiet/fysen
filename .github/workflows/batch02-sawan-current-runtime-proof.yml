name: TEMP Batch 02 strong-title writer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-sawan-current-runtime-proof.yml"

permissions:
  contents: write

jobs:
  write-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-strong-title-price-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Wire generic strong-title recovery into runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("apps/menu-worker/src/menu-source-runtime.ts")
          text = path.read_text()

          import_anchor = '} from "./html-adjacent-heading-price-recovery.js";\n'
          import_block = '''import {
            HTML_STRONG_TITLE_PRICE_RECOVERY_VERSION,
            recoverStrongTitlePriceHtmlItems,
          } from "./html-strong-title-price-recovery.js";
          '''
          if import_anchor not in text:
              raise SystemExit("missing adjacent-heading import anchor")
          if "html-strong-title-price-recovery.js" not in text:
              text = text.replace(import_anchor, import_anchor + import_block, 1)

          old_version = '+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}'
          new_version = '+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_STRONG_TITLE_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}'
          if old_version not in text and new_version not in text:
              raise SystemExit("missing version anchor")
          text = text.replace(old_version, new_version, 1)

          if "const strongTitlePriceItems =" not in text:
              marker = "    const headingPriceItems =\n"
              if marker not in text:
                  raise SystemExit("missing heading marker")
              text = text.replace(marker, '''    const strongTitlePriceItems =
              extracted.method === "html_heuristic"
                ? recoverStrongTitlePriceHtmlItems(recoveryHtml)
                : [];
          ''' + marker, 1)

          if "const strongTitlePricePreferred =" not in text:
              marker = "    const semanticCategoryCardsPreferred =\n"
              if marker not in text:
                  raise SystemExit("missing semantic marker")
              text = text.replace(marker, '''    const strongTitlePricePreferred =
              strongTitlePriceItems.length >= 6 &&
              strongTitlePriceItems.length >= recoveredItems.length &&
              strongTitlePriceItems.length >= trailingPriceCardItems.length;
          ''' + marker, 1)

          if "const isolatedSemanticRecoveryPreferred =" not in text:
              pattern = r'(    const isolatedTrailingRecoveryPreferred =\n\s+semanticCategoryCardsPreferred \|\| strongNumberedCardsPreferred;\n)'
              replacement = r'\1    const isolatedSemanticRecoveryPreferred =\n      isolatedTrailingRecoveryPreferred || strongTitlePricePreferred;\n'
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("missing isolated recovery block")

          if "const preferredItems = strongTitlePricePreferred" not in text:
              pattern = r'    const preferredItems = trailingPriceCardQualifies\n\s+\? trailingPriceCardItems\n\s+: headingPriceItems\.length >= 4 &&\n'
              replacement = '''    const preferredItems = strongTitlePricePreferred
              ? strongTitlePriceItems
              : trailingPriceCardQualifies
                ? trailingPriceCardItems
                : headingPriceItems.length >= 4 &&
          '''
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("missing preferred-items block")

          text = text.replace("!isolatedTrailingRecoveryPreferred", "!isolatedSemanticRecoveryPreferred")

          if "!strongTitlePricePreferred\n        ? supplementStrongHeadingRecovery" not in text:
              pattern = r'(    const headingSupplementedItems =\n\s+)extracted\.method === "html_heuristic"\n(\s+)\? supplementStrongHeadingRecovery\('
              replacement = r'\1extracted.method === "html_heuristic" &&\n      !strongTitlePricePreferred\n\2? supplementStrongHeadingRecovery('
              text, count = re.subn(pattern, replacement, text, count=1)
              if count != 1:
                  raise SystemExit("missing heading supplement block")

          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/menu-source-runtime.ts
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker test -- html-strong-title-price-recovery.test.ts html-strong-title-price-runtime.test.ts
      - run: pnpm --filter @fysen/menu-worker typecheck
      - run: pnpm --filter @fysen/menu-worker build
      - name: Commit runtime wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src/menu-source-runtime.ts
          git diff --cached --check
          git commit -m "Wire semantic strong-title menu recovery"
          git push origin HEAD:agent/batch02-strong-title-price-v1
