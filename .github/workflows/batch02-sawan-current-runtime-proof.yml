name: TEMP Batch 02 strong-title writer

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-sawan-current-runtime-proof.yml"

permissions:
  contents: write

jobs:
  write-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-strong-title-price-v1
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Wire generic strong-title recovery into runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/menu-worker/src/menu-source-runtime.ts")
          text = path.read_text()

          import_anchor = '} from "./html-adjacent-heading-price-recovery.js";\n'
          import_block = '''import {
            HTML_STRONG_TITLE_PRICE_RECOVERY_VERSION,
            recoverStrongTitlePriceHtmlItems,
          } from "./html-strong-title-price-recovery.js";
          '''
          if import_anchor not in text:
              raise SystemExit("missing adjacent-heading import anchor")
          if "html-strong-title-price-recovery.js" not in text:
              text = text.replace(import_anchor, import_anchor + import_block, 1)

          version_anchor = '+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}'
          version_new = '+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_STRONG_TITLE_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}'
          if version_anchor not in text and version_new not in text:
              raise SystemExit("missing runtime version anchor")
          text = text.replace(version_anchor, version_new, 1)

          heading_marker = '    const headingPriceItems =\n'
          strong_block = '''    const strongTitlePriceItems =
              extracted.method === "html_heuristic"
                ? recoverStrongTitlePriceHtmlItems(recoveryHtml)
                : [];
          '''
          if heading_marker not in text:
              raise SystemExit("missing heading marker")
          if "const strongTitlePriceItems =" not in text:
              text = text.replace(heading_marker, strong_block + heading_marker, 1)

          semantic_marker = '    const semanticCategoryCardsPreferred =\n'
          preference_block = '''    const strongTitlePricePreferred =
              strongTitlePriceItems.length >= 6 &&
              strongTitlePriceItems.length >= recoveredItems.length &&
              strongTitlePriceItems.length >= trailingPriceCardItems.length;
          '''
          if semantic_marker not in text:
              raise SystemExit("missing semantic preference marker")
          if "const strongTitlePricePreferred =" not in text:
              text = text.replace(semantic_marker, preference_block + semantic_marker, 1)

          preferred_old = '''    const preferredItems = trailingPriceCardQualifies
              ? trailingPriceCardItems
              : headingPriceItems.length >= 4 &&
          '''
          preferred_new = '''    const preferredItems = strongTitlePricePreferred
              ? strongTitlePriceItems
              : trailingPriceCardQualifies
                ? trailingPriceCardItems
                : headingPriceItems.length >= 4 &&
          '''
          if preferred_old not in text and "const preferredItems = strongTitlePricePreferred" not in text:
              raise SystemExit("missing preferred-items block")
          text = text.replace(preferred_old, preferred_new, 1)

          isolated_line = '    const isolatedTrailingRecoveryPreferred =\n      semanticCategoryCardsPreferred || strongNumberedCardsPreferred;\n'
          isolated_new = isolated_line + '    const isolatedSemanticRecoveryPreferred =\n      isolatedTrailingRecoveryPreferred || strongTitlePricePreferred;\n'
          if isolated_line not in text and "const isolatedSemanticRecoveryPreferred =" not in text:
              raise SystemExit("missing isolated recovery anchor")
          if "const isolatedSemanticRecoveryPreferred =" not in text:
              text = text.replace(isolated_line, isolated_new, 1)

          text = text.replace(
              "!isolatedTrailingRecoveryPreferred",
              "!isolatedSemanticRecoveryPreferred",
          )

          heading_old = '''    const headingSupplementedItems =
              extracted.method === "html_heuristic"
                ? supplementStrongHeadingRecovery(
          '''
          heading_new = '''    const headingSupplementedItems =
              extracted.method === "html_heuristic" &&
              !strongTitlePricePreferred
                ? supplementStrongHeadingRecovery(
          '''
          if heading_old not in text and "!strongTitlePricePreferred\n        ? supplementStrongHeadingRecovery" not in text:
              raise SystemExit("missing heading supplement block")
          text = text.replace(heading_old, heading_new, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/menu-source-runtime.ts
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker test -- html-strong-title-price-recovery.test.ts html-strong-title-price-runtime.test.ts
      - run: pnpm --filter @fysen/menu-worker typecheck
      - run: pnpm --filter @fysen/menu-worker build
      - name: Commit runtime wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src/menu-source-runtime.ts
          git diff --cached --check
          git commit -m "Wire semantic strong-title menu recovery"
          git push origin HEAD:agent/batch02-strong-title-price-v1
