name: Publish existing verified Fysen Android QA APK
# One-time bootstrap: the permanent release publication is already part of
# native-android-apk.yml for subsequent successful main builds.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-first-android-qa-release.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 7aa6f30b4f74012eda362a3f5f3c43ac5553f84f
      VERIFIED_RUN: "40115755531"
    steps:
      - name: Fetch the previously verified installer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GH_REPO" -n fysen-android-qa-apk -D dist
          test -s dist/app-release.apk
          test -s dist/qa-build-info.txt
          grep -Fx "Source commit: $SOURCE_SHA" dist/qa-build-info.txt
          grep -F "CI checkout: " dist/qa-build-info.txt
          grep -F 'Signing: debug key' dist/qa-build-info.txt
          mv dist/app-release.apk dist/Fysen-Android-test.apk

      - name: Publish an accessible download in official GitHub Releases
        shell: bash
        run: |
          set -euo pipefail
          tag="fysen-native-android-qa-${SOURCE_SHA:0:12}"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $tag already exists; no duplicate upload." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$tag" \
              dist/Fysen-Android-test.apk \
              dist/qa-build-info.txt \
              --repo "$GH_REPO" \
              --target "$SOURCE_SHA" \
              --title "Fysen Native Android – testversjon 24. oktober 2026" \
              --notes "INSTALLERBAR ANDROID-TESTVERSJON (APK). Bygget fra verifisert Fysen Native PR #1027 og signert med QA-utviklingsnøkkel; ikke offisiell Google Play eller App Store-utgivelse. Kan brukes på Android-telefoner og nettbrett. APK-en bruker Fysens live API, og krever internett for ferske menyer. Testutgaven kan måtte avinstalleres før en senere produksjonssignert versjon, noe som kan slette lokale favoritter." \
              --prerelease
          fi
          echo "Direct APK: https://github.com/$GH_REPO/releases/download/$tag/Fysen-Android-test.apk" >> "$GITHUB_STEP_SUMMARY"
