name: TEMP Gandhi final head proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/TEMP-gandhi-final-head-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Isolate Gandhi
        working-directory: apps/menu-worker
        shell: bash
        run: |
          rm -rf research/gandhi-final
          mkdir -p research/gandhi-final
          node --input-type=module <<'NODE'
          import { readdir, readFile, copyFile } from 'node:fs/promises';
          let found = false;
          for (const file of (await readdir('catalog')).filter((name) => name.endsWith('.json'))) {
            const manifest = JSON.parse(await readFile(`catalog/${file}`, 'utf8'));
            if (manifest.restaurant.slug === '1947-gandhi-majorstuen-oslo') {
              await copyFile(`catalog/${file}`, `research/gandhi-final/${file}`);
              found = true;
              break;
            }
          }
          if (!found) throw new Error('Gandhi manifest missing');
          NODE
      - name: Validate Gandhi on exact final head
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/gandhi-final | tee research/gandhi-final-proof.json
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gandhi-final-head-proof
          path: apps/menu-worker/research/gandhi-final-proof.json
          if-no-files-found: error
