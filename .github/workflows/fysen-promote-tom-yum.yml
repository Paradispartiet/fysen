name: Fysen promote high-resolution Tom yum to draft PR (no release)
on:
  push:
    branches: [art/tom-yum-native-source-review-20261120]
    paths:
      - ".github/workflows/fysen-promote-tom-yum.yml"
      - "scripts/promote-reviewed-tom-yum.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-tom-yum-fullsize
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image tooling and AVIF codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Download SHA-locked source from successful source stage
        uses: actions/download-artifact@v4
        with:
          name: fysen-tom-yum-native-originals
          run-id: 44780550767
          github-token: ${{ github.token }}
          path: /tmp/fysen-tom-yum-originals
      - name: Produce genuine 3334px photo, 512px mini and draft-only integrations
        run: python scripts/promote-reviewed-tom-yum.py
      - name: Run only the relevant gallery and original-image controls
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify exact dimensions, source, and draft-only state
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pillow_avif
          from PIL import Image
          root=Path("apps/web/public/dish-images")
          d=json.loads((root/"manifest.json").read_text())
          assert len(d["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in d["images"])==16
          x=d["images"][33]
          assert x["id"]=="tom-yum" and x["largeSource"]=="tom-yum-master-3334.avif"
          assert x["atlas"]=="tom-yum-thumb-512.avif"
          with Image.open(root/x["largeSource"]) as im:assert im.size==(3334,3334)
          with Image.open(root/x["atlas"]) as im:assert im.size==(512,512)
          assert x["photoSource"].startswith("https://www.pexels.com/photo/")
          source=json.loads(Path("assets/fysen-image-candidates/tom-yum/34699478/review.json").read_text())
          assert source["published"] is False
          print("16/44 on DRAFT branch only; production unchanged")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tom-yum-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/tom-yum/34699478/black-preview.jpg
            docs/fysen-image-reviews/tom-yum.md
      - name: Commit only reviewed image assets and necessary galleri changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/tom-yum.png
          git add assets/fysen-image-candidates/tom-yum/34699478/black-preview.jpg
          git add apps/web/public/dish-images/tom-yum-master-3334.avif
          git add apps/web/public/dish-images/tom-yum-thumb-512.avif
          git add apps/web/public/dish-images/tom-yum-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/styles/home-discovery-refresh.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/tom-yum.md
          git diff --cached --quiet && exit 0
          git commit -m "[tom-yum-promotion-bot] Native 3334px Tom yum and dedicated 512 mini; draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
