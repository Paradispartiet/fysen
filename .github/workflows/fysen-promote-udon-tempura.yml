name: Fysen integrate authentic udon with reketempura (draft only)
on:
  push:
    branches: [art/udon-tempura-native-photo-20261121]
    paths: [".github/workflows/fysen-promote-udon-tempura.yml","scripts/promote-reviewed-udon-tempura.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-udon-ebi-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install native photo and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Produce source-locked CC BY udon full-size AVIF and separate 512 miniature
        run: python scripts/promote-reviewed-udon-tempura.py
      - name: Run ONLY two relevant Fysen dish-photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check native dimensions, license and unpublished status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          images=Path("apps/web/public/dish-images")
          manifest=json.loads((images/"manifest.json").read_text(encoding="utf8"))
          assert len(manifest["images"])==44
          assert sum(p.get("largeViewEnabled") is True for p in manifest["images"])==26
          item=manifest["images"][26]
          assert item["id"]==item["catalogId"]=="udon"
          assert item["atlas"]=="udon-tempura-thumb-512.avif"
          assert item["largeSource"]=="udon-tempura-master-2900.avif"
          assert item["kind"]=="Redaksjonelt rettfoto"
          assert item["photoCredit"]=="Immanuelle / Wikimedia Commons · CC BY 4.0"
          assert item["photoLicense"]=="https://creativecommons.org/licenses/by/4.0/"
          notice=(images/"udon-tempura-LICENSE.txt").read_text(encoding="utf8")
          assert "CC BY 4.0" in notice and "Bearbeidelse:" in notice
          with Image.open(images/item["largeSource"]) as img:assert img.size==(2900,3080)
          with Image.open(images/item["atlas"]) as img:assert img.size==(512,512)
          audit=json.loads(Path("assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-review.json").read_text(encoding="utf8"))
          assert audit["reviewed_variant"]=="black-clean-grabcut"
          assert audit["approved_for_fysen"] and audit["published"] is False
          assert audit["no_upscale"] and not audit["generated_food_pixels"]
          print("Udon 26/44 original-source images on UNPUBLISHED draft branch")
          PY
      - name: Commit only udon photo and focused gallery integration to draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/udon.png
          git add assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/review.json
          git add assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-review.json
          git add apps/web/public/dish-images/udon-tempura-master-2900.avif
          git add apps/web/public/dish-images/udon-tempura-thumb-512.avif
          git add apps/web/public/dish-images/udon-tempura-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/udon.md
          git diff --cached --quiet && exit 0
          git commit -m "[udon-photo-bot] Add 2900px authentic tempura udon and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
