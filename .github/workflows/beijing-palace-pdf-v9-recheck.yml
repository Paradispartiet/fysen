name: Beijing Palace PDF v9 recheck

on:
  pull_request:
    paths:
      - "apps/menu-worker/research/beijing-palace-pdf-v9-recheck.seed.json"
      - ".github/workflows/beijing-palace-pdf-v9-recheck.yml"
      - "apps/menu-worker/src/pdf-extractor.ts"
      - "apps/menu-worker/src/pdf-source-extractor.ts"

permissions:
  contents: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build
      - name: Print final PDF text reconstruction
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import { extractPdfMenu } from './dist/pdf-extractor.js';
          const url = 'https://beijingpalace.no/wp-content/uploads/2024/05/Microsoft-Word-middags-meny-2024.pdf';
          const response = await fetch(url, { headers: { 'user-agent': process.env.FYSEN_MENU_BOT_USER_AGENT } });
          if (!response.ok) throw new Error(`PDF fetch ${response.status}`);
          const extracted = await extractPdfMenu(new Uint8Array(await response.arrayBuffer()));
          console.log(JSON.stringify({
            pageCount: extracted.pageCount,
            tail: extracted.visibleText.split('\n').slice(-30),
            tailItems: extracted.items.slice(-12).map((item) => ({
              name: item.name,
              priceMinor: item.priceMinor,
              sectionName: item.sectionName,
              sourceExcerpt: item.sourceExcerpt,
            })),
          }, null, 2));
          NODE
      - name: Prepare generated directory
        run: mkdir -p apps/menu-worker/research/beijing-palace-pdf-v9-generated
      - name: Generate live manifest
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/beijing-palace-pdf-v9-recheck.seed.json | tee research/beijing-palace-pdf-v9-intake.json
      - name: Validate live manifest independently
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/beijing-palace-pdf-v9-generated | tee research/beijing-palace-pdf-v9-validation.json
      - name: Print canonical output
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const intake = JSON.parse(await readFile('research/beijing-palace-pdf-v9-intake.json', 'utf8'));
          const validation = JSON.parse(await readFile('research/beijing-palace-pdf-v9-validation.json', 'utf8'));
          console.log(JSON.stringify({
            intake: {
              requestedCount: intake.requestedCount,
              generatedCount: intake.generatedCount,
              failedCount: intake.failedCount,
              results: intake.results,
            },
            validation: validation.results.map((result) => ({
              slug: result.slug,
              accepted: result.accepted,
              itemCount: result.validation?.menu?.quality?.itemCount ?? null,
              extractorVersion: result.validation?.menu?.extractorVersion ?? null,
              observedDishNames: result.validation?.menu?.observedDishNames ?? [],
              observedDishVariants: result.validation?.menu?.observedDishVariants ?? [],
              error: result.error,
            })),
          }, null, 2));
          NODE
