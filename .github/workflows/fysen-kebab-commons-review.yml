name: Fysen kebab original photo source review
on:
  push:
    branches:
      - art/kebab-pita-native-photo-20261119
    paths:
      - ".github/workflows/fysen-kebab-commons-review.yml"
      - "scripts/stage-kebab-commons-review.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-kebab-commons-source-review
  cancel-in-progress: false
jobs:
  source_review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo decoder only
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download exactly two licensed native originals, without approval
        run: python scripts/stage-kebab-commons-review.py
      - name: Retain source originals and review reports for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fysen-kebab-commons-original-source-review
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/fysen-kebab-commons-source-review/*
            assets/fysen-image-candidates/kebab-pita/commons-*/preview.jpg
            assets/fysen-image-candidates/kebab-pita/commons-*/native-detail-1400.jpg
            assets/fysen-image-candidates/kebab-pita/commons-*/review.json
      - name: Preserve only unapproved review evidence on existing draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/kebab-pita/commons-* || true
          git diff --cached --quiet && exit 0
          git commit -m "[kebab-source-bot] Stage unapproved Commons kebab previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
