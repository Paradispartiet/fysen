name: Fysen stage CC BY real ebi tempura udon original
on:
  push:
    branches: [art/udon-tempura-native-photo-20261121]
    paths: [".github/workflows/fysen-stage-udon-commons.yml","scripts/stage-udon-commons-source.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-udon-commons-source
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/stage-udon-commons-source.py
      - name: Verify source only, not approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi")
          d=json.loads((p/"review.json").read_text(encoding="utf8"))
          assert d["source_verified"] and d["no_upscale"]
          assert (d["native_width"],d["native_height"])==(3024,4032)
          assert d["license"]=="CC BY 4.0"
          assert not d["approved_for_fysen"] and not d["published"]
          for n in ("source.jpeg","preview.jpg","detail-1400.jpg"): assert (p/n).exists()
          print("Unapproved CC BY 4.0 udon original verified")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: udon-ebi-original-wikimedia
          retention-days: 7
          if-no-files-found: error
          path: assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi
      - name: Commit small review previews and metadata
        run: |
          rm -f assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/source.jpeg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi
          git diff --cached --quiet && exit 0
          git commit -m "[udon-source-bot] Stage exact tempura udon CC BY original review"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
