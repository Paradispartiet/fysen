name: TEMP trace Der Peppern Gror public source graph

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-der-peppern-gror-source-trace.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile

      - name: Trace exact official WeOrder chain
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research/der-peppern-gror-source-trace
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright-core';
          import { writeFile } from 'node:fs/promises';

          const userAgent = process.env.FYSEN_MENU_BOT_USER_AGENT || 'FysenMenuBot/0.1';
          const targets = [
            { name: 'official-link-page', url: 'https://derpepperngror.no/juletider/' },
            { name: 'official-weorder-short', url: 'https://weorder.xyz/AvdelingRadhusplassen' },
            { name: 'official-weorder-restaurant', url: 'https://order.weorder.com/restaurant/22539?skipProfile=true' },
          ];
          const interesting = /(?:weorder|quickorder|orderyoyo|order|menu|meny|api|restaurant|product|catalog|location|item|category)/i;
          const absoluteUrlPattern = /https:\/\/[^\s"'<>\\)]+/g;

          async function httpProbe(target) {
            const started = Date.now();
            try {
              const response = await fetch(target.url, {
                redirect: 'follow',
                signal: AbortSignal.timeout(15_000),
                headers: { 'user-agent': userAgent, accept: 'text/html,application/xhtml+xml,application/json;q=0.9,*/*;q=0.8' },
              });
              const body = await response.text();
              const urls = [...new Set(body.match(absoluteUrlPattern) ?? [])].slice(0, 500);
              return {
                ...target,
                ok: response.ok,
                status: response.status,
                finalUrl: response.url,
                contentType: response.headers.get('content-type'),
                bytes: Buffer.byteLength(body),
                durationMs: Date.now() - started,
                interestingUrls: urls.filter((url) => interesting.test(url)).slice(0, 200),
                allOrigins: [...new Set(urls.map((url) => { try { return new URL(url).origin; } catch { return null; } }).filter(Boolean))].sort(),
                officialRadhusplassenLinkPresent: body.includes('https://weorder.xyz/AvdelingRadhusplassen'),
              };
            } catch (error) {
              return { ...target, ok: false, error: error instanceof Error ? error.message : String(error), durationMs: Date.now() - started };
            }
          }

          const browser = await chromium.launch({ channel: 'chrome', headless: true, chromiumSandbox: true });
          const context = await browser.newContext({ acceptDownloads: false, ignoreHTTPSErrors: false, javaScriptEnabled: true, serviceWorkers: 'block', userAgent });

          async function browserProbe(target) {
            const page = await context.newPage();
            const requests = [];
            const responses = [];
            const jsonBodies = [];
            const bodyTasks = [];
            page.on('request', (request) => {
              if (requests.length < 1000) requests.push({ url: request.url(), method: request.method(), resourceType: request.resourceType() });
            });
            page.on('response', (response) => {
              const resourceType = response.request().resourceType();
              if (responses.length < 1000) responses.push({ url: response.url(), status: response.status(), resourceType });
              const contentType = response.headers()['content-type'] ?? '';
              if ((resourceType === 'xhr' || resourceType === 'fetch') && /json/i.test(contentType) && bodyTasks.length < 50) {
                bodyTasks.push(response.text().then((text) => {
                  jsonBodies.push({ url: response.url(), status: response.status(), contentType, bytes: Buffer.byteLength(text), sample: text.slice(0, 160000) });
                }).catch(() => undefined));
              }
            });
            page.on('dialog', (dialog) => void dialog.dismiss());
            const started = Date.now();
            try {
              const response = await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 18_000 });
              await page.waitForLoadState('networkidle', { timeout: 8_000 }).catch(() => undefined);
              await page.waitForTimeout(1500);
              await Promise.all(bodyTasks);
              const pageData = await page.evaluate(() => ({
                title: document.title,
                textSample: (document.body?.innerText ?? '').slice(0, 25000),
                anchors: Array.from(document.querySelectorAll('a[href]')).map((a) => ({ text: (a.textContent ?? '').replace(/\s+/g, ' ').trim(), href: a.href })),
                forms: Array.from(document.querySelectorAll('form')).map((form) => ({ action: form.action, method: form.method })),
                scripts: Array.from(document.querySelectorAll('script[src]')).map((script) => script.src),
              }));
              return {
                ...target,
                ok: true,
                status: response?.status() ?? null,
                finalUrl: page.url(),
                durationMs: Date.now() - started,
                title: pageData.title,
                textSample: pageData.textSample,
                interestingAnchors: pageData.anchors.filter(({ text, href }) => interesting.test(`${text} ${href}`)),
                forms: pageData.forms,
                interestingScripts: pageData.scripts.filter((url) => interesting.test(url)),
                requestOrigins: [...new Set(requests.map(({ url }) => { try { return new URL(url).origin; } catch { return null; } }).filter(Boolean))].sort(),
                documentRequests: requests.filter(({ resourceType }) => resourceType === 'document'),
                dataRequests: requests.filter(({ resourceType }) => resourceType === 'xhr' || resourceType === 'fetch'),
                interestingRequests: requests.filter(({ url, resourceType }) => ['document', 'xhr', 'fetch', 'script'].includes(resourceType) && interesting.test(url)),
                jsonBodies,
              };
            } catch (error) {
              await Promise.all(bodyTasks);
              return {
                ...target,
                ok: false,
                finalUrl: page.url(),
                error: error instanceof Error ? error.message : String(error),
                requestOrigins: [...new Set(requests.map(({ url }) => { try { return new URL(url).origin; } catch { return null; } }).filter(Boolean))].sort(),
                documentRequests: requests.filter(({ resourceType }) => resourceType === 'document'),
                dataRequests: requests.filter(({ resourceType }) => resourceType === 'xhr' || resourceType === 'fetch'),
                jsonBodies,
              };
            } finally {
              await page.close().catch(() => undefined);
            }
          }

          const http = [];
          const browserRows = [];
          for (const target of targets) {
            http.push(await httpProbe(target));
            browserRows.push(await browserProbe(target));
          }

          const result = {
            baseRevision: process.env.GITHUB_SHA,
            tracedAt: new Date().toISOString(),
            restaurantId: 22539,
            officialLinkChain: ['https://weorder.xyz/AvdelingRadhusplassen', 'https://order.weorder.com/restaurant/22539?skipProfile=true'],
            http,
            browser: browserRows,
            candidateOrigins: [...new Set(browserRows.flatMap((row) => row.requestOrigins ?? []))].sort(),
            candidateDataUrls: [...new Set(browserRows.flatMap((row) => row.dataRequests?.map((entry) => entry.url) ?? []))].slice(0, 400),
          };

          await writeFile('research/der-peppern-gror-source-trace/result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          await context.close();
          await browser.close();
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-der-peppern-gror-source-trace
          path: apps/menu-worker/research/der-peppern-gror-source-trace/result.json
          if-no-files-found: error
