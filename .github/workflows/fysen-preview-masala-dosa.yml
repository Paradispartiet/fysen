name: Fysen preview masala dosa on black (review only)
on:
  push:
    branches: [art/masala-dosa-native-photo-20261121]
    paths: [".github/workflows/fysen-preview-masala-dosa.yml","scripts/preview-masala-dosa-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-masala-dosa-mask-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install authentic image processing packages
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate source-locked unapproved mask previews
        run: python scripts/preview-masala-dosa-black.py
      - name: Verify mask previews cannot count as approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=Path("assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark")
          a=json.loads((c/"black-review.json").read_text(encoding="utf8"))
          assert a["source_native_dimensions"]==[9504,6336]
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["visual_review_completed"] and not a["approved_for_fysen"] and not a["published"]
          for label in a["variants"]:
              assert (c/f"{label}-preview.jpg").is_file()
              assert (c/f"{label}-native-detail-1400.jpg").is_file()
          print("3 masks unapproved, no catalog or public image changes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-masala-dosa-black-photo-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-*.jpg
            assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-review.json
      - name: Commit only unapproved small previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-*.jpg
          git add assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[dosa-preview-bot] Stage black original-photo previews only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
