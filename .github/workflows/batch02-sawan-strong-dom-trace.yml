name: TEMP Batch 02 Sawan strong DOM trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-sawan-strong-dom-trace.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-sawan-strong-dom-trace
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Fetch fresh canonical Sawan bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p trace
          curl --fail --silent --show-error --location --max-redirs 3 --connect-timeout 15 --max-time 60 -D trace/headers.txt -o trace/sawan.html 'https://www.sawan.no/meny'
          wc -c trace/sawan.html | tee trace/size.txt
          sha256sum trace/sawan.html | tee trace/sha256.txt
      - name: Trace DOM and actual parser stages
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee ../../trace/sawan-trace.json
          import {readFile} from 'node:fs/promises';
          import {load} from 'cheerio';
          import {extractScopedHtmlMenu} from './dist/html-source-extractor.js';
          import {extractMenuSource,extractorVersionForSourceType} from './dist/menu-source-runtime.js';
          const raw=await readFile('../../trace/sawan.html','utf8');
          const $=load(raw);
          const norm=(s)=>s.normalize('NFKC').replace(/\s+/g,' ').trim();
          const price=/^(?:(?:kr\.?|nok)\s*)?[1-9]\d{1,3}(?:[.,]\d{1,2})?(?:\s*(?:,-|kr\.?|nok))?$/iu;
          const strong=[];
          $('strong').each((i,el)=>{
            const title=norm($(el).text());
            if(!title) return;
            const parent=$(el).parent();
            const parentText=norm(parent.text()).slice(0,700);
            const nextTexts=[];
            let node=parent.next();
            for(let n=0;n<5&&node.length;n++,node=node.next()){
              const t=norm(node.text());
              if(t) nextTexts.push(t.slice(0,400));
            }
            const localPrices=[...parentText.split(/\s+/)].filter(x=>price.test(x));
            strong.push({i,title,parentTag:parent.get(0)?.tagName??null,parentClass:parent.attr('class')??null,parentText,nextTexts,localPrices});
          });
          const headings=[];
          $('h1,h2,h3,h4,h5,h6').each((i,el)=>{const t=norm($(el).text());if(t)headings.push({tag:el.tagName,text:t});});
          const scoped=extractScopedHtmlMenu(raw);
          const runtime=await extractMenuSource('html',{body:raw});
          const pack=(items)=>items.map(x=>({name:x.name,priceMinor:x.priceMinor,sectionName:x.sectionName,confidence:x.confidence,sourceExcerpt:x.sourceExcerpt}));
          console.log(JSON.stringify({
            bytes:Buffer.byteLength(raw),
            extractorVersion:extractorVersionForSourceType('html'),
            dom:{strongCount:strong.length,strong:strong.slice(0,250),headings:headings.slice(0,150)},
            scoped:{count:scoped.items.length,items:pack(scoped.items).slice(0,150)},
            runtime:{count:runtime.items.length,items:pack(runtime.items).slice(0,150)}
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-sawan-strong-dom-trace
          path: trace/**
          if-no-files-found: error
