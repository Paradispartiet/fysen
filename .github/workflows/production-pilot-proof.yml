name: Fysen production pilot proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Materialize Fysen production catalog"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-pilot-proof.yml"
      - "scripts/production-pilot-proof.mjs"
      - "scripts/revenue-production-proof.mjs"
      - "apps/web/app/search/**"
      - "apps/web/app/claim/**"
      - "apps/web/app/pro/**"
      - "apps/web/app/min-mat/**"
      - "apps/web/app/api/pro/**"
      - "apps/web/app/api/aha/**"
      - "apps/web/app/api/min-mat/**"
      - "apps/web/app/layout.tsx"
      - "apps/web/components/global-header.tsx"
      - "apps/web/components/dish-result.tsx"
      - "apps/web/components/dish-browse.tsx"
      - "apps/web/components/restaurant-claim-form.tsx"
      - "apps/web/components/fysen-pro-login-form.tsx"
      - "apps/web/components/save-min-mat-button*"
      - "apps/web/components/min-mat-*"
      - "apps/web/lib/aha-*"
      - "apps/web/styles/min-mat.css"
      - "apps/api/src/dish-search.controller.ts"
      - "apps/api/src/dish-search.service.ts"
      - "apps/api/src/restaurant-claims.controller.ts"
      - "apps/api/src/restaurant-claims.service.ts"
      - "apps/api/src/fysen-pro.controller.ts"
      - "apps/api/src/fysen-pro.service.ts"
      - "apps/api/src/aha-min-mat.*"
      - "packages/contracts/src/aha-min-mat.ts"
      - "packages/database/migrations/0014_search_demand_source.sql"
      - "packages/database/migrations/0015_restaurant_claims.sql"
      - "packages/database/migrations/0016_fysen_pro_sessions.sql"
      - "packages/database/migrations/0017_aha_min_mat.sql"
      - "packages/database/src/browse.ts"
      - "packages/database/src/restaurant-claims.ts"
      - "packages/database/src/fysen-pro.ts"
      - "packages/database/src/aha-min-mat.ts"

permissions:
  contents: read

concurrency:
  group: fysen-production-pilot-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_PUBLIC_API_URL: https://fysen-api.vercel.app
      FYSEN_PUBLIC_WEB_URL: https://fysen.vercel.app
      AHA_PUBLIC_API_URL: https://aha-canonical-api-production.redground-9c6e20c2.northeurope.azurecontainerapps.io
      AHA_PUBLIC_WEB_URL: https://paradispartiet.github.io/AHA-EchoNet
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build proof dependencies
        run: |
          pnpm --filter @fysen/menu-core build
          pnpm --filter @fysen/database build

      - name: Verify catalog, watcher, direct production search, API and web
        shell: bash
        run: |
          node scripts/production-pilot-proof.mjs | tee /tmp/fysen-production-pilot-proof.json
          {
            echo '## Fysen production pilot proof'
            echo
            echo 'This proof reads the canonical production catalog dynamically, verifies every catalog restaurant against production DB + watcher state, runs representative `searchDishes` calls directly without recording funnel events, then checks the public browse API and web surface.'
            echo
            echo '```json'
            cat /tmp/fysen-production-pilot-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Demand, Revenue R3/R4 and AHA Min mat production boundaries
        if: always()
        shell: bash
        run: |
          node scripts/revenue-production-proof.mjs | tee /tmp/fysen-revenue-production-proof.json
          {
            echo
            echo '## Fysen revenue + AHA Min mat production proof'
            echo
            echo 'This proof is non-mutating: it verifies Demand provenance, R3/R4 and AHA Min mat schema, hash-only secret storage, consumer/Pro isolation, fail-closed unauthenticated API surfaces, the public Min mat/Claim/Pro web surfaces, PKCE redirect wiring, AHA static handoff pages, and that the AHA Fysen exchange is enabled with the exact production callback allowlisted.'
            echo
            echo '```json'
            cat /tmp/fysen-revenue-production-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"