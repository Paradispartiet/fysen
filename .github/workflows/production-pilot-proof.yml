name: Fysen production pilot proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/production-pilot-proof.mjs"
      - "scripts/production-pilot-proof-html.mjs"
      - ".github/workflows/production-pilot-proof.yml"
  workflow_call:
    inputs:
      source_sha:
        description: Exact source revision that was materially deployed
        required: false
        type: string
        default: ''
    secrets:
      FYSEN_PRODUCTION_DATABASE_URL:
        required: true
  workflow_run:
    workflows: ["Materialize Fysen production catalog"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fysen-production-pilot-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_PUBLIC_API_URL: https://fysen-api.vercel.app
      FYSEN_PUBLIC_WEB_URL: https://fysen.vercel.app
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || (github.event_name == 'workflow_run' && github.event.workflow_run.head_sha) || github.sha }}
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build proof dependencies
        run: |
          pnpm --filter @fysen/menu-core build
          pnpm --filter @fysen/database build

      - name: Verify catalog, watcher, direct production search, API and web
        shell: bash
        run: |
          node scripts/production-pilot-proof.mjs | tee /tmp/fysen-production-pilot-proof.json
          {
            echo '## Fysen production pilot proof'
            echo
            echo 'This proof reads the canonical production catalog dynamically, verifies every catalog restaurant against production DB + watcher state, runs the locked Oslo v1 search scenarios directly without recording funnel events, then verifies the canonical consumer browse API and web surface.'
            echo
            echo 'Revenue/Pro/AHA boundaries are intentionally owned by the separate revenue production proof and are not rerun after every restaurant materialization.'
            echo
            echo '```json'
            cat /tmp/fysen-production-pilot-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
