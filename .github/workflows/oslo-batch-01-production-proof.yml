name: Oslo batch 01 production proof

on:
  pull_request:
    paths:
      - ".github/workflows/oslo-batch-01-production-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout exact batch merge
        uses: actions/checkout@v4
        with:
          ref: 700d24cb3c1e96a8fb5db5f2aa5f2457132d24c5
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build database dependency graph
        run: pnpm --filter @fysen/database... build

      - name: Count canonical catalog manifests
        shell: bash
        run: |
          count=$(find apps/menu-worker/catalog -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          echo "catalog_manifest_count=$count"
          test "$count" -eq 45

      - name: Read exact post-merge production proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createDatabasePool } from './packages/database/dist/index.js';

          const mergeTime = new Date('2026-08-20T17:08:16Z');
          const slugs = [
            'dalat-cafe-torggata-oslo',
            'kebabish-original-breigata-oslo',
            'kinabolle-ensjo-oslo',
            'kinabolle-gronland-oslo',
            'oche-aker-brygge-oslo',
            'oche-torggata-oslo',
            'villa-paradiso-tivoli-oslo',
          ];
          const failing = new Set([
            'blocked_by_robots',
            'fetch_error',
            'extraction_error',
            'quarantined',
          ]);
          const pool = createDatabasePool();
          try {
            const { rows } = await pool.query(
              `SELECT DISTINCT ON (r.slug)
                 r.slug,
                 r.active,
                 r.created_at AS restaurant_created_at,
                 ms.enabled,
                 ms.url,
                 ms.created_at AS menu_source_created_at,
                 ms.last_http_status,
                 ms.consecutive_failures,
                 ms.last_checked_at,
                 ms.last_menu_fingerprint,
                 w.outcome AS latest_outcome,
                 w.http_status AS latest_watch_http_status,
                 w.extracted_item_count,
                 w.error_code,
                 w.error_message,
                 w.started_at AS latest_watch_started_at,
                 w.completed_at AS latest_watch_completed_at
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               LEFT JOIN LATERAL (
                 SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at, completed_at
                 FROM fysen.menu_watch_runs
                 WHERE menu_source_id = ms.id
                 ORDER BY started_at DESC
                 LIMIT 1
               ) w ON true
               WHERE r.slug = ANY($1::text[])
               ORDER BY r.slug, ms.created_at DESC`,
              [slugs],
            );
            const counts = await pool.query(
              `SELECT
                 (SELECT count(*)::int FROM fysen.restaurants WHERE active = true) AS active_restaurants,
                 (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled = true) AS enabled_menu_sources`,
            );
            console.log(JSON.stringify({
              expectedCatalogManifestCount: 45,
              promotedCount: rows.length,
              promotedRows: rows,
              databaseCounts: counts.rows[0],
            }, null, 2));

            const expected = [...slugs].sort();
            const actual = rows.map((row) => row.slug).sort();
            if (rows.length !== slugs.length || JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Expected seven promoted production rows, got ${JSON.stringify(rows)}`);
            }
            for (const row of rows) {
              if (!row.active || !row.enabled) throw new Error(`${row.slug} is not active/enabled`);
              if (!row.latest_outcome || failing.has(row.latest_outcome)) {
                throw new Error(`${row.slug} latest watcher outcome is ${row.latest_outcome}`);
              }
              if (Number(row.consecutive_failures) !== 0) {
                throw new Error(`${row.slug} has consecutive_failures=${row.consecutive_failures}`);
              }
              if (!row.last_menu_fingerprint) {
                throw new Error(`${row.slug} is missing a production menu fingerprint`);
              }
              if (!row.last_checked_at || new Date(row.last_checked_at) < mergeTime) {
                throw new Error(`${row.slug} was not checked after the batch merge`);
              }
              if (!row.latest_watch_started_at || new Date(row.latest_watch_started_at) < mergeTime) {
                throw new Error(`${row.slug} has no post-merge watcher row`);
              }
            }
          } finally {
            await pool.end();
          }
          NODE
