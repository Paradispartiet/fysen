name: Oslo batch 01 production proof

on:
  pull_request:
    paths:
      - ".github/workflows/oslo-batch-01-production-proof.yml"

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-mutation
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout exact batch merge
        uses: actions/checkout@v4
        with:
          ref: 700d24cb3c1e96a8fb5db5f2aa5f2457132d24c5
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Count canonical catalog manifests
        shell: bash
        run: |
          count=$(find apps/menu-worker/catalog -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')
          echo "catalog_manifest_count=$count"
          test "$count" -eq 45

      - name: Materialize exact production catalog
        run: pnpm --filter @fysen/menu-worker onboard:catalog

      - name: Watch promoted menu sources explicitly
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            createDatabasePool,
            getMenuSourceSupport,
            MenuIndexRepository,
          } from './packages/database/dist/index.js';
          import { HttpMenuClient } from './apps/menu-worker/dist/http-client.js';
          import { watchMenuSourceOnce } from './apps/menu-worker/dist/watcher.js';

          const slugs = [
            'dalat-cafe-torggata-oslo',
            'kebabish-original-breigata-oslo',
            'kinabolle-ensjo-oslo',
            'kinabolle-gronland-oslo',
            'oche-aker-brygge-oslo',
            'oche-torggata-oslo',
            'villa-paradiso-tivoli-oslo',
          ];
          const failing = new Set([
            'blocked_by_robots',
            'fetch_error',
            'extraction_error',
            'quarantined',
          ]);
          const pool = createDatabasePool();
          try {
            const { rows } = await pool.query(
              `SELECT DISTINCT ON (r.slug)
                 r.slug,
                 ms.id::text AS source_id,
                 ms.url
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               WHERE r.slug = ANY($1::text[])
                 AND r.active = true
                 AND ms.enabled = true
               ORDER BY r.slug, ms.created_at DESC`,
              [slugs],
            );
            const expected = [...slugs].sort();
            const actual = rows.map((row) => row.slug).sort();
            if (rows.length !== slugs.length || JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Expected seven promoted enabled sources, got ${JSON.stringify(rows)}`);
            }

            const repository = new MenuIndexRepository(pool);
            const httpClient = new HttpMenuClient();
            const results = [];
            for (const row of rows) {
              const support = await getMenuSourceSupport(pool, row.source_id);
              const summary = await watchMenuSourceOnce(
                repository,
                row.source_id,
                httpClient,
                support,
              );
              results.push({ slug: row.slug, url: row.url, ...summary });
            }
            console.log(JSON.stringify({ promotedWatchCount: results.length, results }, null, 2));
            const failures = results.filter((result) => failing.has(result.outcome));
            if (failures.length > 0) {
              throw new Error(`Promoted watcher failures: ${JSON.stringify(failures)}`);
            }
          } finally {
            await pool.end();
          }
          NODE

      - name: Read exact production proof
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createDatabasePool } from './packages/database/dist/index.js';

          const slugs = [
            'dalat-cafe-torggata-oslo',
            'kebabish-original-breigata-oslo',
            'kinabolle-ensjo-oslo',
            'kinabolle-gronland-oslo',
            'oche-aker-brygge-oslo',
            'oche-torggata-oslo',
            'villa-paradiso-tivoli-oslo',
          ];
          const failing = new Set([
            'blocked_by_robots',
            'fetch_error',
            'extraction_error',
            'quarantined',
          ]);
          const pool = createDatabasePool();
          try {
            const { rows } = await pool.query(
              `SELECT DISTINCT ON (r.slug)
                 r.slug,
                 r.active,
                 ms.enabled,
                 ms.url,
                 ms.last_http_status,
                 ms.consecutive_failures,
                 ms.last_checked_at,
                 ms.last_menu_fingerprint,
                 w.outcome AS latest_outcome,
                 w.http_status AS latest_watch_http_status,
                 w.extracted_item_count,
                 w.error_code,
                 w.error_message,
                 w.started_at AS latest_watch_started_at
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               LEFT JOIN LATERAL (
                 SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at
                 FROM fysen.menu_watch_runs
                 WHERE menu_source_id = ms.id
                 ORDER BY started_at DESC
                 LIMIT 1
               ) w ON true
               WHERE r.slug = ANY($1::text[])
               ORDER BY r.slug, ms.created_at DESC`,
              [slugs],
            );
            const counts = await pool.query(
              `SELECT
                 (SELECT count(*)::int FROM fysen.restaurants WHERE active = true) AS active_restaurants,
                 (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled = true) AS enabled_menu_sources`,
            );
            console.log(JSON.stringify({ promotedRows: rows, databaseCounts: counts.rows[0] }, null, 2));

            const expected = [...slugs].sort();
            const actual = rows.map((row) => row.slug).sort();
            if (rows.length !== slugs.length || JSON.stringify(actual) !== JSON.stringify(expected)) {
              throw new Error(`Expected seven promoted production rows, got ${JSON.stringify(rows)}`);
            }
            for (const row of rows) {
              if (!row.active || !row.enabled) throw new Error(`${row.slug} is not active/enabled`);
              if (!row.latest_outcome || failing.has(row.latest_outcome)) {
                throw new Error(`${row.slug} latest watcher outcome is ${row.latest_outcome}`);
              }
              if (Number(row.consecutive_failures) !== 0) {
                throw new Error(`${row.slug} has consecutive_failures=${row.consecutive_failures}`);
              }
              if (!row.last_menu_fingerprint) {
                throw new Error(`${row.slug} is missing a production menu fingerprint`);
              }
            }
          } finally {
            await pool.end();
          }
          NODE
