name: TEMP Korndokki v3 live proof

on:
  pull_request:
    paths:
      - ".github/workflows/temp-korndokki-v3-live-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Prove live Korndokki target coverage
        shell: bash
        run: |
          cd apps/menu-worker
          node --input-type=module <<'NODE'
          import {
            extractorVersionForSourceType,
            extractMenuSource,
            fetchMenuSource,
          } from './dist/menu-source-runtime.js';

          const fetched = await fetchMenuSource({
            url: 'https://www.foodora.no/restaurant/q839/korndokki-mathallen',
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
          });
          if (fetched.kind !== 'content') throw new Error(`Expected content, got ${fetched.kind}`);

          const extracted = await extractMenuSource('html', fetched);
          const targetNames = new Set(['Beef Bulgogi Bowl', 'Tteokbokki']);
          const targets = extracted.items.filter((item) => targetNames.has(item.name));
          const missing = [...targetNames].filter((name) => !targets.some((item) => item.name === name));

          console.log(JSON.stringify({
            httpStatus: fetched.status,
            extractorVersion: extractorVersionForSourceType('html'),
            itemCount: extracted.items.length,
            targets: targets.map((item) => ({
              name: item.name,
              sectionName: item.sectionName,
              priceMinor: item.priceMinor,
              priceKind: item.priceKind ?? 'exact',
              confidence: item.confidence,
            })),
            missing,
          }, null, 2));

          if (missing.length > 0) {
            throw new Error(`Missing live Korndokki targets: ${missing.join(', ')}`);
          }
          NODE
