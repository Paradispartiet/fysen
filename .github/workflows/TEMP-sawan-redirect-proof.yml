name: TEMP Sawan browser menu proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/TEMP-sawan-redirect-proof.yml"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    if: github.event.pull_request.head.ref == 'agent/sawan-redirect-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Restore immutable Sawan identity and use current first-party rendered menu
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const restaurants=source.restaurants.filter((x)=>x.restaurant.slug==='sawan-president-harbitz-gate-oslo');
          if(restaurants.length!==1) throw new Error(`Sawan rows=${restaurants.length}`);
          const row=structuredClone(restaurants[0]);
          row.menuSource={
            ...row.menuSource,
            url:'https://www.sawan.no/meny',
            sourceType:'html',
            fetchMode:'browser',
            sourceSupport:{redirectOrigins:[],browserDataOrigins:[]},
          };
          const plan={...source,outputDirectory:'research/sawan-browser-generated',concurrency:1,restaurants:[row]};
          await mkdir('apps/menu-worker/research/sawan-browser-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/sawan-browser.plan.json',JSON.stringify(plan,null,2)+'\n');
          NODE

      - name: Fresh Sawan intake
        working-directory: apps/menu-worker
        shell: bash
        run: node dist/index.js intake:batch research/sawan-browser.plan.json | tee research/sawan-browser-intake.json

      - name: Independent Sawan validation
        working-directory: apps/menu-worker
        shell: bash
        run: node dist/index.js validate:batch research/sawan-browser-generated | tee research/sawan-browser-validation.json

      - name: Gate and summarize
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const intake=JSON.parse(await readFile('research/sawan-browser-intake.json','utf8'));
          const validation=JSON.parse(await readFile('research/sawan-browser-validation.json','utf8'));
          const result=validation.results?.[0];
          const generated=JSON.parse(await readFile('research/sawan-browser-generated/sawan-president-harbitz-gate-oslo.json','utf8'));
          const summary={
            sourceUrl:generated.menuSource.url,
            fetchMode:generated.menuSource.fetchMode,
            intake:{requested:intake.requestedCount,generated:intake.generatedCount,failed:intake.failedCount,observedItems:intake.results?.[0]?.observedItemCount,extractorVersion:intake.results?.[0]?.extractorVersion,error:intake.results?.[0]?.error??null},
            validation:{accepted:validation.acceptedCount,failed:validation.failedCount,itemCount:result?.validation?.menu?.quality?.itemCount,extractorVersion:result?.validation?.menu?.extractorVersion,names:result?.validation?.menu?.observedDishNames??[],variants:result?.validation?.menu?.observedDishVariants??[],error:result?.validation?.menu?.error??result?.error??null},
            minimumExpectedItems:generated.menuSource.minimumExpectedItems,
          };
          await writeFile('research/sawan-browser-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(intake.requestedCount!==1||intake.generatedCount!==1||intake.failedCount!==0) throw new Error('Sawan browser intake failed');
          if(validation.manifestCount!==1||validation.acceptedCount!==1||validation.failedCount!==0) throw new Error('Sawan browser validation failed');
          if(summary.fetchMode!=='browser') throw new Error('Sawan browser mode mismatch');
          if((summary.validation.itemCount??0)<20) throw new Error(`Sawan coverage too small: ${summary.validation.itemCount}`);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sawan-browser-menu-proof
          path: |
            apps/menu-worker/research/sawan-browser.plan.json
            apps/menu-worker/research/sawan-browser-intake.json
            apps/menu-worker/research/sawan-browser-validation.json
            apps/menu-worker/research/sawan-browser-summary.json
            apps/menu-worker/research/sawan-browser-generated/*.json
          if-no-files-found: warn
