name: Fysen revenue and AHA production proof

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fysen batched Vercel production release"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fysen-revenue-production-proof
  cancel-in-progress: true

jobs:
  proof:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_PUBLIC_API_URL: https://fysen-api.vercel.app
      FYSEN_PUBLIC_WEB_URL: https://fysen.vercel.app
      AHA_PUBLIC_API_URL: https://aha-canonical-api-production.redground-9c6e20c2.northeurope.azurecontainerapps.io
      AHA_PUBLIC_WEB_URL: https://paradispartiet.github.io/AHA-EchoNet
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build proof dependencies
        run: |
          pnpm --filter @fysen/menu-core build
          pnpm --filter @fysen/database build

      - name: Verify Demand, Revenue R3/R4 and AHA Min mat production boundaries
        shell: bash
        run: |
          node scripts/revenue-production-proof.mjs | tee /tmp/fysen-revenue-production-proof.json
          {
            echo '## Fysen revenue + AHA Min mat production proof'
            echo
            echo 'This proof is non-mutating and runs after product deployment or explicit manual dispatch, not after unrelated restaurant catalog materialization.'
            echo
            echo '```json'
            cat /tmp/fysen-revenue-production-proof.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
