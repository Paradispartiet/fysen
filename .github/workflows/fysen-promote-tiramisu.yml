name: Fysen promote reviewed native tiramisu
on:
  push:
    branches: [art/tiramisu-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-tiramisu.yml"
      - "scripts/promote-reviewed-tiramisu.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-tiramisu-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authentic photo and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Reuse exact previously fetched native source photo
        uses: actions/download-artifact@v4
        with:
          name: fysen-tiramisu-originals
          run-id: 44712212323
          github-token: ${{ github.token }}
          path: /tmp/fysen-tiramisu-originals
      - name: Promote exact reviewed original to AVIF 6240px master and 512px thumb
        run: python scripts/promote-reviewed-tiramisu.py
      - name: Run only relevant photo-gallery and large-source quality tests
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check photo source, dimensions, credit and unpublished status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text())
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==14
          p=next(x for x in m["images"] if x["id"]=="tiramisu")
          assert p["kind"]=="Redaksjonelt rettfoto" and p["catalogId"] is None
          assert p["atlas"]=="tiramisu-thumb-512.avif"
          assert p["largeSource"]=="tiramisu-master-6240.avif"
          assert "Arian Fernandez / Pexels" in p["photoCredit"]
          assert p["photoLicenseNotice"]=="/dish-images/tiramisu-LICENSE.txt"
          assert "Pexels" in (root/"tiramisu-LICENSE.txt").read_text()
          with Image.open(root/p["atlas"]) as image: assert image.size==(512,512)
          with Image.open(root/p["largeSource"]) as image: assert image.size==(6240,4160)
          audit=json.loads(Path("assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-review.json").read_text())
          assert audit["approved_for_fysen"] and audit["visual_review_completed"]
          assert audit["reviewed_variant"]=="black-grabcut" and audit["published"] is False
          print("14/44 reviewed source-locked masters in draft PR; main remains 10/44, no Vercel")
          PY
      - name: Save only reviewed dish image and matching gallery files to draft PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/tiramisu.png
          git add assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/review.json
          git add assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-review.json
          git add apps/web/public/dish-images/tiramisu-master-6240.avif
          git add apps/web/public/dish-images/tiramisu-thumb-512.avif
          git add apps/web/public/dish-images/tiramisu-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/tiramisu.md
          git diff --cached --quiet && exit 0
          git commit -m "[tiramisu-promote-bot] Integrate source-verified original and own sharp AVIF mini"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
