name: TEMP Dognvill ALT debug

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Inspect ALT provenance
        shell: bash
        run: |
          mkdir -p apps/menu-worker/research
          node --input-type=module <<'NODE' | tee apps/menu-worker/research/dognvill-alt-debug.json
          import { writeFile } from 'node:fs/promises';
          import { extractMenuSource, fetchMenuSource } from './apps/menu-worker/dist/menu-source-runtime.js';

          const url = 'https://www.dognvillburger.no/en/meny/bjorvika';
          const fetched = await fetchMenuSource({
            url,
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: process.env.FYSEN_MENU_BOT_USER_AGENT ?? 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
            sourceSupport: { redirectOrigins: [], browserDataOrigins: [] },
          });
          if (fetched.kind !== 'content') throw new Error('unexpected not_modified');
          const extracted = await extractMenuSource('html', fetched);
          const compact = (item) => ({
            name: item.name,
            normalizedName: item.normalizedName,
            priceMinor: item.priceMinor,
            sectionName: item.sectionName,
            extractionMethod: item.extractionMethod,
            confidence: item.confidence,
            position: item.position,
            sourceExcerpt: item.sourceExcerpt,
          });
          const altItems = extracted.items.filter((item) => /^(?:ALT|SMAK PÅ ALT)$/iu.test(item.name)).map(compact);
          const body = String(fetched.body ?? '').replace(/\s+/g, ' ');
          const snippets = [];
          for (const token of ['SMAK PÅ ALT', '>ALT<', 'ALT']) {
            let from = 0;
            for (let count = 0; count < 6; count += 1) {
              const folded = body.toLocaleLowerCase('nb-NO');
              const index = folded.indexOf(token.toLocaleLowerCase('nb-NO'), from);
              if (index < 0) break;
              snippets.push({ token, excerpt: body.slice(Math.max(0, index - 350), Math.min(body.length, index + token.length + 500)) });
              from = index + token.length;
            }
          }
          const output = {
            head: process.env.GITHUB_SHA,
            url,
            status: fetched.status,
            extractorVersion: extracted.extractorVersion,
            itemCount: extracted.items.length,
            altItems,
            snippets,
          };
          await writeFile('apps/menu-worker/research/dognvill-alt-debug-structured.json', JSON.stringify(output, null, 2) + '\n');
          console.log(JSON.stringify(output, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: dognvill-alt-debug
          path: |
            apps/menu-worker/research/dognvill-alt-debug.json
            apps/menu-worker/research/dognvill-alt-debug-structured.json
          if-no-files-found: error
