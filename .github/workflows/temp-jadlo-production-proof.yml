name: TEMP Jadlo production proof

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-mutation
  cancel-in-progress: false

jobs:
  proof:
    if: github.event.pull_request.head.ref == 'ops/jadlo-production-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout canonical main revision
        uses: actions/checkout@v4
        with:
          ref: f7bd449b8acb957282ecf024aeb91400fa494226
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Materialize canonical production catalog
        continue-on-error: true
        run: pnpm --filter @fysen/menu-worker onboard:catalog

      - name: Search Bigos in production without Revenue events
        shell: bash
        env:
          SMOKE_QUERY: "Bigos & Pieczywo"
          SMOKE_CITY: Oslo
          SMOKE_EXPECTED_RESTAURANT_SLUG: polskie-jadlo-oslo
          SMOKE_EXPECTED_DISH_NAME: "Bigos & Pieczywo"
          SMOKE_EXPECTED_PRICE_MINOR: "16000"
          SMOKE_EXPECTED_PRICE_KIND: exact
          SMOKE_EXPECTED_MATCH_TYPE: exact
          SMOKE_EXPECTED_OPENING: unknown
          SMOKE_EXPECTED_ACTION: none
          SMOKE_MIN_COUNT: "1"
        run: node scripts/production-search-smoke.mjs

      - name: Search pierogi in production without Revenue events
        shell: bash
        env:
          SMOKE_QUERY: "Pierogi z Mięsem Okraszone Skwarkami"
          SMOKE_CITY: Oslo
          SMOKE_EXPECTED_RESTAURANT_SLUG: polskie-jadlo-oslo
          SMOKE_EXPECTED_DISH_NAME: "Pierogi z Mięsem Okraszone Skwarkami"
          SMOKE_EXPECTED_PRICE_MINOR: "24900"
          SMOKE_EXPECTED_PRICE_KIND: exact
          SMOKE_EXPECTED_MATCH_TYPE: exact
          SMOKE_EXPECTED_OPENING: unknown
          SMOKE_EXPECTED_ACTION: none
          SMOKE_MIN_COUNT: "1"
        run: node scripts/production-search-smoke.mjs
