name: Fysen verify real beef bibimbap photo originals
on:
  push:
    branches: [art/beef-bibimbap-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-beef-bibimbap.yml"
      - "scripts/stage-beef-bibimbap-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bibimbap-photo-source
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch original authentic photographs and detail evidence
        run: python scripts/stage-beef-bibimbap-sources.py
      - name: Ensure no approval, catalog, or restaurant data changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates=list(Path("assets/fysen-image-candidates/bibimbap").glob("*/review.json"))
          assert candidates
          for file in candidates:
            r=json.loads(file.read_text(encoding="utf8"))
            assert r["dish_id"]=="bibimbap" and r["catalog_id"] is None
            assert r["native_original_verified"] and r["no_upscale"]
            assert not r["approved_for_fysen"] and not r["published"]
            assert not r["visual_review_completed"]
            assert min(r["original_width"],r["original_height"])>=1600
            assert (file.parent/"preview.jpg").is_file()
            assert (file.parent/"native-detail-1400.jpg").is_file()
          print(len(candidates),"sources. None approved or published; bibimbap remains editorial only.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-bibimbap-native-source-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/bibimbap/*/source.jpeg
            assets/fysen-image-candidates/bibimbap/*/preview.jpg
            assets/fysen-image-candidates/bibimbap/*/native-detail-1400.jpg
            assets/fysen-image-candidates/bibimbap/*/review.json
      - name: Commit lightweight review evidence ONLY
        run: |
          find assets/fysen-image-candidates/bibimbap -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/bibimbap
          git diff --cached --quiet && exit 0
          git commit -m "[bibimbap-source-bot] Stage unapproved authentic photo previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
