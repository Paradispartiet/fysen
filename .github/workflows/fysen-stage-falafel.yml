name: Fysen stage real falafel photo originals (unapproved)
on:
  push:
    branches: [art/falafel-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-falafel.yml"
      - "scripts/stage-falafel-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-falafel-source-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo library
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download and SHA-check real photo originals
        run: python scripts/stage-falafel-sources.py
      - name: Confirm candidates have no approved or public status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records=list(Path("assets/fysen-image-candidates/falafel").glob("*/review.json"))
          assert records
          for f in records:
            r=json.loads(f.read_text(encoding="utf8"))
            assert r["dish_id"]==r["catalog_id"]=="falafel"
            assert r["download_verified"] and r["no_upscale"]
            assert not r["visual_review_completed"] and not r["approved_for_fysen"] and not r["published"]
            assert min(r["native_width"],r["native_height"])>=1600
            assert (f.parent/"preview.jpg").is_file() and (f.parent/"native-detail-1400.jpg").is_file()
          print(len(records),"photo candidates staged; 0 approved/published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-falafel-full-originals-for-inspection
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/falafel/*/source.jpeg
            assets/fysen-image-candidates/falafel/*/preview.jpg
            assets/fysen-image-candidates/falafel/*/native-detail-1400.jpg
            assets/fysen-image-candidates/falafel/*/review.json
      - name: Commit previews, not source bytes or gallery assets
        run: |
          find assets/fysen-image-candidates/falafel -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/falafel
          git diff --cached --quiet && exit 0
          git commit -m "[falafel-source-bot] Stage unapproved original photo previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
