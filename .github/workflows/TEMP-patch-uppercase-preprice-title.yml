name: TEMP patch uppercase pre-price title

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Patch immediate uppercase title recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('apps/menu-worker/src/html-source-extractor.ts')
          source = source_path.read_text()
          helper_anchor = '''function looksLikeStandaloneHeadingTitle(value: string): boolean {\n  const title = canonicalCardTitle(value);\n  if (\n    !plausibleCardTitle(title) ||\n    isBeverageItemName(title) ||\n    isObviousMetadataItem(title) ||\n    isPlainFoodSectionLabel(title)\n  ) {\n    return false;\n  }\n  const words = title.split(/\\s+/).filter(Boolean);\n  if (words.length > 16 || /[,;:]$/u.test(title)) return false;\n  return !/^(?:with|served|topped|contains?|including|med|servert|toppet|inneholder|inkludert)\\b/iu.test(title);\n}\n'''
          helper_new = helper_anchor + '''\nfunction looksLikeImmediateUppercaseTitle(value: string): boolean {\n  const title = canonicalCardTitle(value);\n  if (!looksLikeStandaloneHeadingTitle(title)) return false;\n  const letters = title.replace(/[^\\p{L}]+/gu, "");\n  return letters.length >= 3 && title === title.toLocaleUpperCase("nb-NO");\n}\n'''
          if 'function looksLikeImmediateUppercaseTitle' not in source:
              if helper_anchor not in source:
                  raise SystemExit('uppercase title helper anchor missing')
              source = source.replace(helper_anchor, helper_new, 1)

          title_anchor = '''    let titleIndex: number | null = null;\n    let name: string | null = null;\n\n    if (lastHeading !== null) {\n'''
          title_new = '''    let titleIndex: number | null = null;\n    let name: string | null = null;\n\n    const immediateTitleIndex = pricePosition - 1;\n    const immediateTitle = lines[immediateTitleIndex]?.trim() ?? "";\n    if (\n      immediateTitleIndex >= blockStart &&\n      looksLikeImmediateUppercaseTitle(immediateTitle)\n    ) {\n      titleIndex = immediateTitleIndex;\n      name = canonicalCardTitle(immediateTitle);\n    }\n\n    if (titleIndex === null && lastHeading !== null) {\n'''
          if 'const immediateTitleIndex = pricePosition - 1;' not in source:
              if title_anchor not in source:
                  raise SystemExit('immediate title selection anchor missing')
              source = source.replace(title_anchor, title_new, 1)
          source_path.write_text(source)

          test_path = Path('apps/menu-worker/src/batch02-output-cleanup.test.ts')
          test = test_path.read_text()
          test_anchor = '''  it("matches beverage evidence after trailing allergen codes are removed from the item name", () => {\n'''
          test_insert = '''  it("prefers an uppercase dish-like line immediately before price over an earlier section or brand line", () => {\n    const html = `\n      <html><body>\n        <h2>TANDOORI</h2>\n        <p>CHICKEN PERI PERI TIKKA (M, N, G)</p>\n        <p>299.0</p>\n        <p>Restaurant Brand</p>\n        <p>SWEET DISHES</p>\n        <p>MALAI AAM</p>\n        <p>119,-</p>\n      </body></html>\n    `;\n\n    expect(extractScopedHtmlMenu(html).items.map((entry) => entry.name)).toEqual([\n      "CHICKEN PERI PERI TIKKA",\n      "MALAI AAM",\n    ]);\n  });\n\n''' + test_anchor
          if 'prefers an uppercase dish-like line immediately before price' not in test:
              if test_anchor not in test:
                  raise SystemExit('uppercase title test anchor missing')
              test = test.replace(test_anchor, test_insert, 1)
          test_path.write_text(test)
          PY

          git diff --check
          git diff -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/batch02-output-cleanup.test.ts

      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/batch02-output-cleanup.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Prefer immediate uppercase dish titles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
