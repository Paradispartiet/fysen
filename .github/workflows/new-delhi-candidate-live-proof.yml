name: New Delhi candidate live proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Assert exact candidate blob
        shell: bash
        run: test "$(git hash-object apps/menu-worker/candidates/new-delhi-tjuvholmen-oslo.json)" = "d4d9e139a8ae6a145bf565f009ae36edda2663e6"
      - name: Validate candidate pass 1
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch candidates | tee research/new-delhi-candidate-pass1.json
      - name: Validate candidate pass 2
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch candidates | tee research/new-delhi-candidate-pass2.json
      - name: Gate exact output
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const p1=JSON.parse(await readFile('research/new-delhi-candidate-pass1.json','utf8'));
          const p2=JSON.parse(await readFile('research/new-delhi-candidate-pass2.json','utf8'));
          const compact=(p)=>{const r=p.results?.[0]; return {accepted:p.acceptedCount,failed:p.failedCount,itemCount:r?.validation?.menu?.quality?.itemCount??null,names:r?.validation?.menu?.observedDishNames??[],variants:r?.validation?.menu?.observedDishVariants??[],extractorVersion:r?.validation?.menu?.extractorVersion??null,fingerprint:r?.validation?.menu?.fingerprint??null};};
          const a=compact(p1), b=compact(p2);
          const check=(x,label)=>{
            const byName=new Map(x.variants.map((v)=>[v.name,v]));
            if(x.accepted!==1||x.failed!==0||x.itemCount!==81) throw new Error(`${label} ${JSON.stringify(x)}`);
            if(byName.get('Mixed Ice Cream')?.priceMinor!==12900) throw new Error(`${label} Mixed Ice Cream`);
            if(byName.get('Murgh Malai Chicken Tikka')?.priceMinor!==14900) throw new Error(`${label} Murgh Malai`);
            if(x.names.includes('With wine package')) throw new Error(`${label} wine package leak`);
          };
          check(a,'pass1'); check(b,'pass2');
          const summary={blob:'d4d9e139a8ae6a145bf565f009ae36edda2663e6',pass1:a,pass2:b};
          await writeFile('research/new-delhi-candidate-live-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-delhi-candidate-live-proof
          path: |
            apps/menu-worker/research/new-delhi-candidate-pass1.json
            apps/menu-worker/research/new-delhi-candidate-pass2.json
            apps/menu-worker/research/new-delhi-candidate-live-summary.json
          if-no-files-found: error
