name: TEMP tighten direct-priced title guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Tighten direct-priced title provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/html-description-title-recovery.ts')
          text = path.read_text()
          anchor = '''function sourceExcerptDirectlyPricesObservedName(\n  item: MenuObservedItem,\n): boolean {\n'''
          helper = '''function looksLikeDirectlyPricedObservedTitle(value: string): boolean {\n  const line = normalizeVisibleLine(value);\n  if (\n    !line ||\n    PRICE_METADATA_LEAD.test(line) ||\n    ALLERGEN_PREFIX.test(line) ||\n    looksLikeAllergenMetadata(line)\n  ) {\n    return false;\n  }\n\n  const letters = line.replace(/[^\\p{L}]+/gu, "");\n  if (letters.length < 3 || line !== line.toLocaleUpperCase("nb-NO")) {\n    return false;\n  }\n\n  return !/^(?:serveres?|served|with|med|contains?|inneholder|allergener?|allergens?)\\b/iu.test(\n    line,\n  );\n}\n\n''' + anchor
          if 'function looksLikeDirectlyPricedObservedTitle' not in text:
              if anchor not in text:
                  raise SystemExit('direct-priced title helper anchor missing')
              text = text.replace(anchor, helper, 1)

          old = '''    const directlyPricedObservedName =\n      sourceExcerptDirectlyPricesObservedName(item);\n'''
          new = '''    const directlyPricedObservedName =\n      looksLikeDirectlyPricedObservedTitle(item.name) &&\n      sourceExcerptDirectlyPricesObservedName(item);\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('direct-priced guard anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-description-title-recovery.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-description-title-recovery.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Tighten directly priced title provenance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
