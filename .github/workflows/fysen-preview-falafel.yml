name: Fysen preview genuine falafel-and-hummus plate on black
on:
  push:
    branches: [art/falafel-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-falafel.yml"
      - "scripts/preview-falafel-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-falafel-black-source-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native-image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Recreate original pixel SHA-locked falafel and hummus previews
        run: python scripts/preview-falafel-black.py
      - name: Confirm preview-only nonpublication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("assets/fysen-image-candidates/falafel/saya-p-bowl-pexels")
          data=json.loads((root/"black-review.json").read_text())
          assert data["source_native_dimensions"]==[4284,5712]
          assert data["catalog_id"]=="falafel"
          assert data["no_upscale"] and not data["generated_food_pixels"]
          assert not data["visual_review_completed"] and not data["approved_for_fysen"] and not data["published"]
          for name in ["black-contour","black-grabcut"]:
            assert (root/f"{name}-preview.jpg").is_file()
            assert (root/f"{name}-native-detail-1400.jpg").is_file()
          print("Two native real food photo previews, not approved/published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-falafel-black-source-native-previews
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-*-native.png
            assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-*-preview.jpg
            assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-review.json
      - name: Commit lightweight unapproved previews ONLY
        run: |
          find assets/fysen-image-candidates/falafel -name 'black-*-native.png' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-review.json
          git add assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "[falafel-preview-bot] Save unapproved authentic black food previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
