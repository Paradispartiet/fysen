name: Fysen promote visually reviewed sushi photo

on:
  push:
    branches:
      - art/fysen-sharp-sushi-ramen-carbonara-butter-chicken-20261112
    paths:
      - ".github/workflows/fysen-promote-reviewed-photo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-reviewed-photo:
    if: "!contains(github.event.head_commit.message, '[photo-promote-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image codec
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Promote ONLY visually reviewed high-resolution sushi
        run: python scripts/promote-reviewed-food-photo.py
      - name: Test large-view authenticity and photo gallery
        run: |
          node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/home-discovery-refresh.test.mjs
      - name: Commit first approved master, original provenance and matching thumbnail
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/sushi.png
          git add apps/web/public/dish-images/sushi-master-2100.avif
          git add apps/web/public/dish-images/sushi-thumb-512.avif
          git add apps/web/public/dish-images/manifest.json
          git add docs/fysen-image-reviews/sushi.md
          git diff --cached --quiet && exit 0
          git commit -m "[photo-promote-bot] Integrate reviewed native sushi source and 512px thumbnail"
          git push origin "HEAD:${GITHUB_REF_NAME}"
