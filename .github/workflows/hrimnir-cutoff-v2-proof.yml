name: Hrimnir cutoff v2 proof

on:
  pull_request:
    paths:
      - ".github/workflows/hrimnir-cutoff-v2-proof.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Inspect actual Hrimnir hours DOM and normalization
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { load } from 'cheerio';
          import { HttpMenuClient } from './dist/http-client.js';
          import { extractCanonicalOpeningHours } from './dist/opening-hours-source-extractor.js';
          import { normalizeRedundantAbsoluteKitchenCloseHtml } from './dist/opening-hours-redundant-cutoff-normalizer.js';

          const url = 'https://www.hrimnir-ramen.no/meny-storgata';
          const client = new HttpMenuClient();
          const fetched = await client.fetchSource({ url, userAgent: 'FysenMenuBot/0.1', etag: null, lastModified: null });
          if (fetched.kind !== 'content') throw new Error(`Unexpected ${fetched.kind}`);
          const collect = (html) => {
            const $ = load(html);
            const rows = [];
            $('body *').each((_, element) => {
              const text = $(element).text().normalize('NFKC').replace(/\s+/g, ' ').trim();
              if (!text || !/(Åpningstider|Storgata|Fredensborg|Kjøkken til|Kjøkkenet stenger)/iu.test(text)) return;
              if (text.length > 500) return;
              rows.push({
                tag: element.tagName,
                id: $(element).attr('id') ?? null,
                className: $(element).attr('class') ?? null,
                childCount: $(element).children().length,
                text,
              });
            });
            return rows;
          };
          const before = collect(fetched.body);
          const normalized = normalizeRedundantAbsoluteKitchenCloseHtml(fetched.body, ['Storgata']);
          const after = collect(normalized);
          let extraction = null;
          let extractionError = null;
          try {
            extraction = extractCanonicalOpeningHours(normalized, ['Storgata']);
          } catch (error) {
            extractionError = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
          }
          const report = {
            status: fetched.status,
            bodyBytes: fetched.bodyBytes.length,
            before,
            after,
            changed: normalized !== fetched.body,
            extractionError,
            intervals: extraction?.intervals ?? null,
            visibleText: extraction?.visibleText ?? null,
          };
          await writeFile('research/hrimnir-v2-dom-debug.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(report, null, 2));
          NODE

      - name: Validate exact Hrimnir canonical manifest
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          rm -rf research/hrimnir-v2-proof
          mkdir -p research/hrimnir-v2-proof
          cp catalog/hrimnir-ramen-storgata.json research/hrimnir-v2-proof/hrimnir-ramen-storgata.json
          node dist/index.js validate:batch research/hrimnir-v2-proof | tee research/hrimnir-v2-result.json
          exit 0

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrimnir-cutoff-v2-proof
          path: |
            apps/menu-worker/research/hrimnir-v2-result.json
            apps/menu-worker/research/hrimnir-v2-dom-debug.json
          if-no-files-found: error
