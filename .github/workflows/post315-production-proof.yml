name: Post-315 restaurant production proof

on:
  pull_request:
    paths:
      - ".github/workflows/post315-production-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Checkout exact merge
        uses: actions/checkout@v4
        with:
          ref: cabf16eae2a36aeb47360216d3169630779eb410
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build database dependency graph
        run: pnpm --filter @fysen/database... build

      - name: Prove catalog and Villa production state read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { createDatabasePool } from './packages/database/dist/index.js';

          const directory = 'apps/menu-worker/catalog';
          const files = (await readdir(directory)).filter((name) => name.endsWith('.json')).sort();
          const manifests = [];
          for (const file of files) {
            const manifest = JSON.parse(await readFile(`${directory}/${file}`, 'utf8'));
            manifests.push({
              file,
              slug: manifest.restaurant.slug,
              min: manifest.menuSource.minimumExpectedItems,
            });
          }
          const manifestSlugs = manifests.map((row) => row.slug);
          const expectedVilla = new Map([
            ['villa-paradiso-grunerlokka-oslo', { count: 48, fingerprint: '43eec094732eba91d6fbadd9c30031e96ec334d7325930748d2386977b5441eb' }],
            ['villa-paradiso-majorstua-oslo', { count: 50, fingerprint: 'f9f619055f66765a67382cf7c34908c8e8377a0eaf3b111a5b1cc859e5ca951a' }],
            ['villa-paradiso-munch-brygge-oslo', { count: 53, fingerprint: '81680c4ebdc8479dc7999422efff2eac90fb8b2916ae9374fb0e281743eabb44' }],
            ['villa-paradiso-tivoli-oslo', { count: 47, fingerprint: 'cb0d5136acd7f11124ff1d76489f1cca1b0c39576afec963f95b9d718b50731c' }],
          ]);
          const mergedAt = new Date('2026-08-20T20:49:51Z');

          const pool = createDatabasePool();
          try {
            const db = await pool.query(
              `SELECT r.slug, r.active,
                      count(ms.id) FILTER (WHERE ms.enabled)::int AS enabled_menu_source_count
                 FROM fysen.restaurants r
                 LEFT JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
                GROUP BY r.id, r.slug, r.active
                ORDER BY r.slug`,
            );
            const dbBySlug = new Map(db.rows.map((row) => [row.slug, row]));
            const inactiveCanonical = manifests.filter((row) => !dbBySlug.get(row.slug)?.active);
            const activeNotCatalog = db.rows.filter((row) => row.active && !manifestSlugs.includes(row.slug));
            const totals = await pool.query(
              `SELECT
                 (SELECT count(*)::int FROM fysen.restaurants WHERE active = true) AS active_restaurants,
                 (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled = true) AS enabled_menu_sources`,
            );
            const villa = await pool.query(
              `SELECT DISTINCT ON (r.slug)
                      r.slug, r.active, ms.enabled, ms.last_http_status,
                      ms.consecutive_failures, ms.last_menu_fingerprint,
                      ms.extractor_version,
                      w.outcome AS latest_outcome,
                      w.http_status AS latest_watch_http_status,
                      w.extracted_item_count,
                      w.error_code, w.error_message,
                      w.started_at AS latest_watch_started_at
                 FROM fysen.restaurants r
                 JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
                 LEFT JOIN LATERAL (
                   SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at
                     FROM fysen.menu_watch_runs
                    WHERE menu_source_id = ms.id
                    ORDER BY started_at DESC
                    LIMIT 1
                 ) w ON true
                WHERE r.slug = ANY($1::text[])
                ORDER BY r.slug, ms.created_at DESC`,
              [[...expectedVilla.keys()]],
            );

            const result = {
              manifestCount: manifests.length,
              uniqueManifestSlugs: new Set(manifestSlugs).size,
              activeCanonicalRestaurants: manifests.filter((row) => dbBySlug.get(row.slug)?.active).length,
              inactiveCanonical,
              activeNotCatalog,
              databaseCounts: totals.rows[0],
              villaRows: villa.rows,
            };
            console.log(JSON.stringify(result, null, 2));

            if (manifests.length !== 48 || new Set(manifestSlugs).size !== 48) {
              throw new Error(`Expected 48 unique manifests, got ${manifests.length}/${new Set(manifestSlugs).size}`);
            }
            if (inactiveCanonical.length || activeNotCatalog.length) {
              throw new Error(`Catalog/DB drift: inactive=${JSON.stringify(inactiveCanonical)} activeNotCatalog=${JSON.stringify(activeNotCatalog)}`);
            }
            if (Number(totals.rows[0]?.active_restaurants) !== 48 || Number(totals.rows[0]?.enabled_menu_sources) !== 48) {
              throw new Error(`Expected 48 active/48 enabled, got ${JSON.stringify(totals.rows[0])}`);
            }
            if (villa.rows.length !== 4) throw new Error(`Expected four Villa rows, got ${villa.rows.length}`);
            const accepted = new Set(['changed', 'unchanged', 'not_modified']);
            for (const row of villa.rows) {
              const expected = expectedVilla.get(row.slug);
              if (!expected) throw new Error(`Unexpected Villa slug ${row.slug}`);
              if (!row.active || !row.enabled) throw new Error(`${row.slug} is not active/enabled`);
              if (Number(row.consecutive_failures) !== 0) throw new Error(`${row.slug} failures=${row.consecutive_failures}`);
              if (row.last_menu_fingerprint !== expected.fingerprint) throw new Error(`${row.slug} fingerprint=${row.last_menu_fingerprint}`);
              if (!String(row.extractor_version ?? '').includes('pdf-text-v8')) throw new Error(`${row.slug} extractor=${row.extractor_version}`);
              if (!accepted.has(row.latest_outcome)) throw new Error(`${row.slug} watcher=${row.latest_outcome}`);
              if (!row.latest_watch_started_at || new Date(row.latest_watch_started_at) < mergedAt) throw new Error(`${row.slug} has no post-merge watch`);
              if (row.latest_outcome !== 'not_modified' && Number(row.extracted_item_count) !== expected.count) {
                throw new Error(`${row.slug} items=${row.extracted_item_count}/${expected.count}`);
              }
            }
          } finally {
            await pool.end();
          }
          NODE
