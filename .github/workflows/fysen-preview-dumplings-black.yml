name: Fysen preview source-locked CC0 dumplings on black (unapproved)
on:
  push:
    branches: [art/dumplings-native-photo-20261121]
    paths: [".github/workflows/fysen-preview-dumplings-black.yml","scripts/preview-dumplings-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-dumplings-black-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install photo segmentation libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Create SHA-locked native photo mask previews
        run: python scripts/preview-dumplings-black.py
      - name: Check only original-photo previews, not approvals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/dumplings/charles-deluvio-cc0")
          a=json.loads((p/"black-review.json").read_text(encoding="utf8"))
          assert a["source_native_dimensions"]==[5472,3648]
          assert a["license"]=="CC0 1.0"
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["approved_for_fysen"] and not a["published"]
          for name in a["variants"]:
            assert (p/f"{name}-preview.jpg").is_file()
            assert (p/f"{name}-detail-1400.jpg").is_file()
          print("Three authentic preview masks for review; no public changes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-dumplings-black-previews
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-*.jpg
            assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-review.json
      - name: Commit only small unapproved previews and source note
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-*.jpg
          git add assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[dumplings-preview-bot] Stage unapproved original-photo black masks"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
