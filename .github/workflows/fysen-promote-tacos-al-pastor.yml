name: Fysen integrate reviewed tacos al pastor native photo (draft only)
on:
  push:
    branches: [art/tacos-al-pastor-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-tacos-al-pastor.yml"
      - "scripts/promote-reviewed-tacos-al-pastor.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-tacos-al-pastor-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native-photo and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate source-locked full-size photo, AVIF and mini
        run: python scripts/promote-reviewed-tacos-al-pastor.py
      - name: Run only the two targeted dish-photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify precise dimensions and unpublished state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          path=Path("apps/web/public/dish-images")
          data=json.loads((path/"manifest.json").read_text(encoding="utf8"))
          assert len(data["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in data["images"])==21
          p=data["images"][21]
          assert p["id"]==p["catalogId"]=="tacos-al-pastor"
          assert p["atlas"]=="tacos-al-pastor-thumb-512.avif"
          assert p["largeSource"]=="tacos-al-pastor-master-7008.avif"
          assert p["photoCredit"]=="Abner Velázquez / Pexels"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "Pexels License" in (path/"tacos-al-pastor-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(path/p["atlas"]) as im: assert im.size==(512,512)
          with Image.open(path/p["largeSource"]) as im: assert im.size==(7008,4672)
          audit=json.loads(Path("assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-review.json").read_text(encoding="utf8"))
          assert audit["reviewed_variant"]=="black-clean-grabcut"
          assert audit["approved_for_fysen"] and audit["published"] is False
          assert audit["no_upscale"] and not audit["generated_food_pixels"]
          print("21/44 native large photos verified ON UNPUBLISHED DRAFT")
          PY
      - name: Commit draft image assets and only their photo integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/tacos-al-pastor.png
          git add assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/review.json
          git add assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-review.json
          git add apps/web/public/dish-images/tacos-al-pastor-master-7008.avif
          git add apps/web/public/dish-images/tacos-al-pastor-thumb-512.avif
          git add apps/web/public/dish-images/tacos-al-pastor-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/tacos-al-pastor.md
          git diff --cached --quiet && exit 0
          git commit -m "[tacos-photo-bot] Add reviewed native 7008px tacos photo and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
