name: Fysen promote reviewed Commons shrimp sandwich
on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths: [".github/workflows/fysen-promote-rekesmorbrod.yml","scripts/promote-reviewed-rekesmorbrod.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-promote-shrimp-commons
  cancel-in-progress: false
jobs:
  reviewed-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Reproduce SHA-locked native shrimp image and separate AVIF thumbnail
        run: python scripts/promote-reviewed-rekesmorbrod.py
      - name: Only focused gallery and original-image quality tests
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs
      - name: Check exact dish and verified CC BY-SA attribution, not public deploy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("apps/web/public/dish-images/manifest.json")
          images=json.loads(p.read_text())["images"]
          dish=next(x for x in images if x["id"]=="rekesmorbrod")
          assert sum(x.get("largeViewEnabled") is True for x in images)==9
          assert dish["atlas"]=="rekesmorbrod-thumb-512.avif"
          assert dish["largeSource"]=="rekesmorbrod-master-5899.avif"
          assert dish["largeSourceNativeWidth"]==5899
          assert dish["largeSourceNativeHeight"]==4000
          assert dish["catalogId"] is None
          assert "Susanne Nilsson" in dish["photoCredit"]
          assert "by-sa/2.0" in dish["photoLicense"]
          notice=Path("apps/web/public/dish-images/rekesmorbrod-LICENSE.txt")
          assert "CC BY-SA 2.0" in notice.read_text()
          evidence=json.loads(Path("assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-review.json").read_text())
          assert evidence["approved_for_fysen"] is True and evidence["published"] is False
          print("Nine source-verified images in PR; shrimp rights and attribution present; not deployed")
          PY
      - name: Commit reviewed master, mini and attribution to existing PR only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/rekesmorbrod.png
          git add assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-review.json
          git add apps/web/public/dish-images/rekesmorbrod-master-5899.avif
          git add apps/web/public/dish-images/rekesmorbrod-thumb-512.avif
          git add apps/web/public/dish-images/rekesmorbrod-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/rekesmorbrod.md
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-promote-bot] Add verified CC BY-SA shrimp original, 512px mini and visible credit"
          git push origin HEAD:"$GITHUB_REF_NAME"
