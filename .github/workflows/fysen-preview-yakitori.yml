name: Fysen – preview black-background yakitori (no approval)
on:
  push:
    branches: [art/yakitori-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-preview-yakitori.yml"
      - "scripts/preview-yakitori-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-yakitori-mask-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Produce source-hashed masks from real yakitori JPEG
        run: python scripts/preview-yakitori-black.py
      - name: Confirm only visual review previews exist
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/yakitori/airam-single-black-plate")
          a=json.loads((p/"black-review.json").read_text(encoding="utf8"))
          assert a["native_dimensions"]==[4000,5000]
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["approved_for_fysen"] and not a["published"]
          for variant in a["variants"]:
              assert (p/f"{variant}-preview.jpg").exists()
              assert (p/f"{variant}-detail-1400.jpg").exists()
          print("Yakitori masks ready for inspection, zero public images")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yakitori-black-masks-for-visual-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/yakitori/airam-single-black-plate/black-*.jpg
            assets/fysen-image-candidates/yakitori/airam-single-black-plate/black-review.json
      - name: Commit only small previews and review metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/yakitori/airam-single-black-plate/black-*.jpg
          git add assets/fysen-image-candidates/yakitori/airam-single-black-plate/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[yakitori-photo-bot] Stage 3 black background candidates"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
