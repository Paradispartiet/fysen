name: Batch 02 next three proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Restore Batch 02 and isolate next three
        shell: bash
        run: |
          rm -rf /tmp/batch02 && mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const targets=new Set(['benares-tordenskiolds-gate-oslo','mesob-motzfeldts-gate-oslo','sawan-president-harbitz-gate-oslo']);
          const restaurants=source.restaurants.filter((x)=>targets.has(x.restaurant.slug)).map((entry)=>{
            if(entry.restaurant.slug!=='sawan-president-harbitz-gate-oslo') return entry;
            return {...entry,menuSource:{...entry.menuSource,url:'https://www.sawan.no/SawanAlacarteActive.pdf'}};
          });
          if(restaurants.length!==3) throw new Error(`Expected 3 rows, got ${restaurants.length}`);
          const plan={...source,outputDirectory:'research/batch02-next-three-generated',concurrency:1,restaurants};
          await mkdir('apps/menu-worker/research/batch02-next-three-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/batch02-next-three.plan.json',JSON.stringify(plan,null,2)+'\n');
          NODE
      - name: Fresh intake three
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js intake:batch research/batch02-next-three.plan.json | tee research/batch02-next-three-intake.json
          exit 0
      - name: Validate generated three
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/batch02-next-three-generated | tee research/batch02-next-three-validation.json
          exit 0
      - name: Summarize
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const intake=JSON.parse(await readFile('research/batch02-next-three-intake.json','utf8'));
          const validation=JSON.parse(await readFile('research/batch02-next-three-validation.json','utf8'));
          const compact=(r)=>({slug:r.slug,accepted:r.accepted??null,outcome:r.outcome??null,observedItemCount:r.observedItemCount??null,itemCount:r.validation?.menu?.quality?.itemCount??null,failureFamilies:r.failureFamilies??[],error:r.error??null,menuError:r.validation?.menu?.error??null,names:r.validation?.menu?.observedDishNames??[]});
          const summary={intake:{requested:intake.requestedCount,generated:intake.generatedCount,failed:intake.failedCount,results:(intake.results??[]).map(compact)},validation:{manifests:validation.manifestCount,accepted:validation.acceptedCount,failed:validation.failedCount,results:(validation.results??[]).map(compact)}};
          await writeFile('research/batch02-next-three-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-next-three-proof
          path: |
            apps/menu-worker/research/batch02-next-three.plan.json
            apps/menu-worker/research/batch02-next-three-intake.json
            apps/menu-worker/research/batch02-next-three-validation.json
            apps/menu-worker/research/batch02-next-three-summary.json
            apps/menu-worker/research/batch02-next-three-generated/*.json
          if-no-files-found: warn
