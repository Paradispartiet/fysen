name: Matlyst v3 production proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/matlyst-production-proof.yml
      - apps/web/tests/matlyst-live-browser-proof.mjs
  workflow_run:
    workflows: ["Fysen batched Vercel production release"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: fysen-matlyst-v3-production-proof
  cancel-in-progress: false

jobs:
  proof:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FYSEN_PUBLIC_WEB_URL: https://fysen.vercel.app
    steps:
      - name: Check that the upstream release deployed an app
        if: github.event_name == 'workflow_run'
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          jobs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/jobs?per_page=100")"
          deployed="$(jq -r '[.jobs[] | select(.name == "web" or .name == "api") | select(.conclusion == "success")] | length > 0' <<< "$jobs")"
          echo "deployed=$deployed" >> "$GITHUB_OUTPUT"
          if [[ "$deployed" == false ]]; then
            echo 'Upstream release deployed neither web nor API; Matlyst production proof is deferred.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout browser proof
        if: github.event_name != 'workflow_run' || steps.upstream.outputs.deployed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup browser proof workspace
        if: github.event_name != 'workflow_run' || steps.upstream.outputs.deployed == 'true'
        uses: ./.github/actions/setup-node-pnpm

      - name: Verify Matlyst v3 public consumer journeys
        if: github.event_name != 'workflow_run' || steps.upstream.outputs.deployed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = (process.env.FYSEN_PUBLIC_WEB_URL || "https://fysen.vercel.app").replace(/\/$/, "");

          async function fetchHtml(path) {
            const url = `${base}${path}`;
            let lastStatus = null;
            let lastError = null;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              try {
                const response = await fetch(url, {
                  cache: "no-store",
                  headers: { "user-agent": "FysenMatlystProductionProof/1.2" },
                  signal: AbortSignal.timeout(15_000),
                });
                lastStatus = response.status;
                if (response.ok) return { url, html: await response.text() };
              } catch (error) {
                lastError = error instanceof Error ? error.message : String(error);
              }
              await new Promise((resolve) => setTimeout(resolve, 5_000));
            }
            throw new Error(`Could not fetch ${url}; status=${lastStatus ?? "none"}; error=${lastError ?? "none"}`);
          }

          function normalizeRenderedHtml(html) {
            // React inserts empty hydration comments between adjacent static and dynamic text
            // nodes (for example: "Alle retter i <!-- -->Oslo"). They are not visible text.
            return html.replaceAll("<!-- -->", "");
          }

          function requireText(surface, ...texts) {
            const renderedHtml = normalizeRenderedHtml(surface.html);
            const missing = texts.filter((text) => !renderedHtml.includes(text));
            if (missing.length > 0) {
              throw new Error(`${surface.url} is missing Matlyst production markers: ${missing.join(" | ")}`);
            }
          }

          function requireOccurrences(surface, text, minimum) {
            const count = surface.html.split(text).length - 1;
            if (count < minimum) {
              throw new Error(`${surface.url} has ${count} occurrences of ${text}; expected at least ${minimum}`);
            }
          }

          const home = await fetchHtml("/");
          const homeCuisines = ["Asiatisk", "Indisk", "Fast food", "Italiensk", "Midtøsten", "Mexicansk"];
          requireText(
            home,
            "Hva har du lyst på?",
            "Søk etter en rett og se hvilke restauranter som har den på menyen nå.",
            "Se alle retter i Oslo",
            "Matlyst",
            "På menyen nå",
            ...homeCuisines,
          );
          requireOccurrences(home, "cuisineCard cuisineCardInteractive", homeCuisines.length);

          const journeys = [
            ["Japansk", "/search?city=Oslo&cuisine=Japansk", "Ramen"],
            ["Italiensk", "/search?city=Oslo&cuisine=Italiensk", "Carbonara"],
            ["Nepalsk", "/search?city=Oslo&cuisine=Nepalsk", "Momo"],
            ["Polsk", "/search?city=Oslo&cuisine=Polsk", "Pierogi"],
            ["Etiopisk", "/search?city=Oslo&cuisine=Etiopisk", "Doro wat"],
            ["Filippinsk", "/search?city=Oslo&cuisine=Filippinsk", "Sisig"],
            ["Egyptisk", "/search?city=Oslo&cuisine=Egyptisk", "Koshari"],
            ["Levantinsk", "/search?city=Oslo&cuisine=Levantinsk", "Falafel"],
          ];

          const verified = [];
          for (const [cuisine, path, representativeDish] of journeys) {
            const surface = await fetchHtml(path);
            requireText(
              surface,
              "Alle retter i Oslo",
              cuisine,
              representativeDish,
              "Production-backed canonical Matlyst-retter",
            );
            verified.push({ cuisine, representativeDish, url: surface.url });
          }

          process.stdout.write(`${JSON.stringify({
            status: "verified",
            home: home.url,
            homeCuisines,
            activeCuisineCount: 19,
            journeys: verified,
          }, null, 2)}\n`);
          NODE

      - name: Verify live restaurant examples in the mobile browser
        if: github.event_name != 'workflow_run' || steps.upstream.outputs.deployed == 'true'
        run: pnpm --filter @fysen/web exec node tests/matlyst-live-browser-proof.mjs
