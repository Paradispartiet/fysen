name: TEMP Batch 02 Der Peppern Gror Radhusplassen API probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-residual-source-discovery.yml"

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Probe only exact public WeOrder endpoints for Radhusplassen
        shell: bash
        run: |
          rm -rf /tmp/weorder-radhusplassen
          mkdir -p /tmp/weorder-radhusplassen
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const ua = 'FysenMenuBot/0.1';
          const base = 'https://api.weorder.com';
          const urls = [
            `${base}/api/navigation/derpeppern/null/6.1.7`,
            `${base}/api/restaurant_details/22539/null/0/6.1.7/0`,
            `${base}/api/restaurant/22539/restaurant_menu/en/25525.254/0/6.1.7`,
            `${base}/api/restaurant/22539/restaurant_menu/en/0/0/6.1.7`,
            `${base}/api/restaurant/22539/restaurant_menu/en/null/0/6.1.7`,
          ];

          const results = [];
          for (const url of urls) {
            const response = await fetch(url, {
              redirect: 'manual',
              headers: { 'user-agent': ua, accept: 'application/json,text/plain;q=0.9,*/*;q=0.8' },
            });
            const body = await response.text();
            let parsed = null;
            try { parsed = JSON.parse(body); } catch {}
            const data = parsed && typeof parsed === 'object' ? parsed.data : null;
            results.push({
              url,
              status: response.status,
              location: response.headers.get('location'),
              contentType: response.headers.get('content-type'),
              bodyLength: body.length,
              summary: data && typeof data === 'object' ? {
                id: data.id ?? null,
                version: data.version ?? null,
                menuVersion: data.menuVersion ?? null,
                menuStructure: data.menuStructure ?? null,
                restaurantId: data.restaurantId ?? null,
                name: data.name ?? null,
                menuCount: Array.isArray(data.menu) ? data.menu.length : null,
                restaurantCount: Array.isArray(data.restaurants) ? data.restaurants.length : null,
              } : null,
              body: body.slice(0, 120000),
            });
          }
          const report = { testedRevision: process.env.GITHUB_SHA, results };
          await writeFile('/tmp/weorder-radhusplassen/report.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify(results.map(({ body, ...entry }) => entry), null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: batch02-weorder-radhusplassen-api-probe
          path: /tmp/weorder-radhusplassen
          if-no-files-found: error
