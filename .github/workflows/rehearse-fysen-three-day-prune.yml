name: Rehearse approved Fysen three-day pruning (isolated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/rehearse-fysen-three-day-prune.yml"]

permissions:
  contents: read
  actions: read

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Fetch existing validated Fysen backup (no production connection)
        uses: actions/download-artifact@v4
        with:
          name: fysen-menu-history-2026-11-02
          run-id: 41507713036
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: original

      - name: Fetch archived search-result provenance (no production connection)
        uses: actions/download-artifact@v4
        with:
          name: fysen-search-links-before-prune-2026-11-02
          run-id: 41518576377
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: search

      - name: Verify checksum and archive table manifest
        shell: bash
        run: |
          set -euo pipefail
          cd original
          sed -i 's|  export/|  |' SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          test -s fysen-menu-history.pgdump
          file fysen-menu-history.pgdump
          cd ../search
          sha256sum --check SHA256SUMS.txt
          test -s fysen-search-links-2026-11-02.pgdump

      - name: Restore full archive into temporary local PostGIS PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          # Keep the ephemeral container inspectable if Postgres stops unexpectedly.
          # The exit trap removes it even when restoration fails.
          docker run -d --name fysen-history-restore --shm-size=256m \
            -e POSTGRES_PASSWORD=local-restore-test-only \
            -e POSTGRES_USER=postgres \
            postgis/postgis:17-3.5
          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo "::group::Isolated PostgreSQL failure diagnostics"
              docker inspect --format '{{json .State}}' fysen-history-restore || true
              docker logs --tail 100 fysen-history-restore || true
              df -h || true
              free -m || true
              echo "::endgroup::"
            fi
            docker rm -f fysen-history-restore >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # PostGIS's entrypoint starts a *temporary* PostgreSQL server to
          # install extensions, then shuts it down before the final startup.
          # pg_isready alone races with that temporary server (run #43174156331).
          ready=0
          for attempt in $(seq 1 90); do
            if docker logs fysen-history-restore 2>&1 | grep -Fq 'PostgreSQL init process complete; ready for start up.' &&
               docker exec fysen-history-restore pg_isready -U postgres -d postgres >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo "Final PostGIS PostgreSQL startup confirmed before restore."

          docker exec fysen-history-restore psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            -c 'CREATE SCHEMA IF NOT EXISTS fysen' \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public'
          docker cp original/fysen-menu-history.pgdump fysen-history-restore:/tmp/fysen-menu-history.pgdump

          docker exec fysen-history-restore pg_restore --list /tmp/fysen-menu-history.pgdump >/dev/null
          docker exec fysen-history-restore pg_restore -U postgres -d postgres \
            --no-owner --no-acl --exit-on-error --jobs=2 \
            /tmp/fysen-menu-history.pgdump

          echo "Restore completed; checking exact six-table counts and foreign-key integrity."
          docker exec -i fysen-history-restore psql -v ON_ERROR_STOP=1 -At -U postgres -d postgres <<'SQL'
          DO $$
          DECLARE
            r bigint;
            ms bigint;
            sn bigint;
            it bigint;
            ch bigint;
            wr bigint;
          BEGIN
            SELECT count(*) INTO r FROM fysen.restaurants;
            SELECT count(*) INTO ms FROM fysen.menu_sources;
            SELECT count(*) INTO sn FROM fysen.menu_snapshots;
            SELECT count(*) INTO it FROM fysen.menu_items;
            SELECT count(*) INTO ch FROM fysen.menu_changes;
            SELECT count(*) INTO wr FROM fysen.menu_watch_runs;
            IF (r, ms, sn, it, ch, wr) IS DISTINCT FROM
               (1116::bigint, 1154::bigint, 40707::bigint,
                1997348::bigint, 100172::bigint, 111963::bigint) THEN
              RAISE EXCEPTION 'Restored row counts differ from source database baseline';
            END IF;
            RAISE NOTICE 'Restore verified: restaurants %, sources %, snapshots %, items %, changes %, watch runs %',
                         r, ms, sn, it, ch, wr;
          END $$;
          SQL

          echo "Restoring search-reference archive alongside menus"
          docker cp search/fysen-search-links-2026-11-02.pgdump fysen-history-restore:/tmp/fysen-search-links-2026-11-02.pgdump
          docker exec fysen-history-restore pg_restore -U postgres -d postgres \
            --no-owner --no-acl --exit-on-error \
            /tmp/fysen-search-links-2026-11-02.pgdump

          echo "Index old snapshot FK references inside the isolated DB, not in production."
          docker exec -i fysen-history-restore psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE INDEX stg_changes_current_snapshot_idx ON fysen.menu_changes(current_snapshot_id);
          CREATE INDEX stg_changes_previous_snapshot_idx ON fysen.menu_changes(previous_snapshot_id);
          CREATE INDEX stg_watch_snapshot_idx ON fysen.menu_watch_runs(snapshot_id);
          ANALYZE fysen.menu_changes;
          ANALYZE fysen.menu_watch_runs;
          SQL

          echo "Simulate ONLY in the isolated ephemeral database: no production connection."
          docker exec -i fysen-history-restore psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          \set ON_ERROR_STOP on
          SET statement_timeout = '20min';
          BEGIN;

          -- Frozen cutoff from read-only production audit, November 2 2026.
          CREATE TEMP TABLE stg_keep AS
            WITH ranked AS (
              SELECT s.id, s.menu_source_id, s.fetched_at, s.http_status,
                     row_number() OVER (
                       PARTITION BY s.menu_source_id
                       ORDER BY s.fetched_at DESC, s.id DESC
                     ) AS rn
              FROM fysen.menu_snapshots AS s
            )
            SELECT id, menu_source_id, fetched_at, http_status
            FROM ranked
            WHERE rn = 1 OR fetched_at >= '2026-10-30 21:21:32+00'::timestamptz;
          CREATE UNIQUE INDEX ON stg_keep(id);
          ANALYZE stg_keep;

          DO $$
          DECLARE n_sources bigint; n_keep bigint; n_items bigint; n_refs bigint; n_success bigint;
          BEGIN
            SELECT count(DISTINCT menu_source_id), count(*),
              count(*) FILTER (WHERE http_status BETWEEN 200 AND 299)
              INTO n_sources, n_keep, n_success FROM stg_keep;
            SELECT count(*) INTO n_items
            FROM fysen.menu_items i JOIN stg_keep k ON k.id = i.snapshot_id;
            SELECT count(*) INTO n_refs
            FROM fysen.search_result_impressions i
            JOIN fysen.menu_items m ON m.id=i.menu_item_id
            WHERE NOT EXISTS (SELECT 1 FROM stg_keep k WHERE k.id=m.snapshot_id);
            IF (n_sources, n_keep, n_items, n_refs, n_success) IS DISTINCT FROM
               (1154::bigint, 3096::bigint, 151408::bigint, 5150::bigint, 3096::bigint) THEN
              RAISE EXCEPTION 'Prune selection deviates from frozen production audit: sources %, kept snapshots %, items %, affected search refs %, successful snapshots %', n_sources,n_keep,n_items,n_refs,n_success;
            END IF;
            RAISE NOTICE 'Preflight passed: %, %, %, %, %', n_sources,n_keep,n_items,n_refs,n_success;
          END $$;

          -- Preserve stable identifiers for every search impression whose
          -- historical menu item would be removed by this *isolated* rehearsal.
          -- Mapping is stored ONLY in the short-lived staging database.
          -- The private full-history dump is needed to resolve these IDs.
          CREATE TABLE fysen.staging_archived_search_item_refs AS
            SELECT imp.id AS impression_id,
                   imp.menu_item_id AS historical_menu_item_id,
                   item.snapshot_id AS historical_snapshot_id,
                   snap.menu_source_id AS historical_menu_source_id,
                   snap.fetched_at AS historical_observed_at
            FROM fysen.search_result_impressions AS imp
            JOIN fysen.menu_items AS item ON item.id = imp.menu_item_id
            JOIN fysen.menu_snapshots AS snap ON snap.id = item.snapshot_id
            WHERE NOT EXISTS (
              SELECT 1 FROM stg_keep AS keep WHERE keep.id = item.snapshot_id
            );
          CREATE UNIQUE INDEX staging_archived_search_item_refs_impression_idx
            ON fysen.staging_archived_search_item_refs(impression_id);

          DO $archive_map_check$
          BEGIN
            IF (SELECT count(*) FROM fysen.staging_archived_search_item_refs) <> 5150 THEN
              RAISE EXCEPTION 'Isolated archive-reference map must preserve exactly 5150 old impression links';
            END IF;
          END $archive_map_check$;

          DELETE FROM fysen.menu_snapshots s
          WHERE NOT EXISTS (SELECT 1 FROM stg_keep k WHERE k.id=s.id);

          DO $$
          DECLARE r bigint; ms bigint; sn bigint; it bigint; ch bigint; wr bigint;
          DECLARE e bigint; imp bigint; linked bigint; unset bigint; dangling bigint; sources_missing bigint;
          DECLARE archived_links bigint; preserved_null_links bigint;
          BEGIN
            SELECT count(*) INTO r FROM fysen.restaurants;
            SELECT count(*) INTO ms FROM fysen.menu_sources;
            SELECT count(*) INTO sn FROM fysen.menu_snapshots;
            SELECT count(*) INTO it FROM fysen.menu_items;
            SELECT count(*) INTO ch FROM fysen.menu_changes;
            SELECT count(*) INTO wr FROM fysen.menu_watch_runs;
            SELECT count(*) INTO e FROM fysen.search_events;
            SELECT count(*), count(*) FILTER (WHERE menu_item_id IS NOT NULL),
                   count(*) FILTER (WHERE menu_item_id IS NULL)
              INTO imp, linked, unset FROM fysen.search_result_impressions;
            SELECT count(*) INTO dangling FROM fysen.search_result_impressions i
              LEFT JOIN fysen.menu_items m ON m.id=i.menu_item_id
              WHERE i.menu_item_id IS NOT NULL AND m.id IS NULL;
            SELECT count(*) INTO sources_missing FROM fysen.menu_sources src
              WHERE NOT EXISTS(SELECT 1 FROM fysen.menu_snapshots s WHERE s.menu_source_id=src.id);
            SELECT count(*) INTO archived_links
              FROM fysen.staging_archived_search_item_refs;
            SELECT count(*) INTO preserved_null_links
              FROM fysen.staging_archived_search_item_refs a
              JOIN fysen.search_result_impressions i ON i.id = a.impression_id
              WHERE i.menu_item_id IS NULL
                AND a.historical_menu_item_id IS NOT NULL
                AND a.historical_snapshot_id IS NOT NULL
                AND a.historical_menu_source_id IS NOT NULL;
            IF (r,ms,sn,it,ch,wr,e,imp,linked,unset,dangling,sources_missing)
               IS DISTINCT FROM
               (1116::bigint,1154::bigint,3096::bigint,151408::bigint,
                2184::bigint,111963::bigint,1266::bigint,7261::bigint,
                2111::bigint,5150::bigint,0::bigint,0::bigint)
            THEN
              RAISE EXCEPTION 'Post-prune staging verification failed: restaurants %, sources %, snapshots %, items %, changes %, watch_runs %, searches %, impressions %, linked %, unset %, dangling %, sources_missing %',
                r,ms,sn,it,ch,wr,e,imp,linked,unset,dangling,sources_missing;
            END IF;
            IF archived_links <> 5150 OR preserved_null_links <> 5150 THEN
              RAISE EXCEPTION 'Historic search links not fully mapped: mapped %, null-and-preserved %', archived_links, preserved_null_links;
            END IF;
            RAISE NOTICE 'STAGING PRUNE PASSED: 3096 snapshots, 151408 menu items, 5150 former links set null AND preserved in isolated historical reference map, 0 orphans';
          END $$;
          COMMIT;

          -- In staging ONLY, measure estimated size after PostgreSQL table rewrite.
          VACUUM (FULL, ANALYZE) fysen.menu_items;
          VACUUM (FULL, ANALYZE) fysen.menu_snapshots;
          VACUUM (FULL, ANALYZE) fysen.menu_changes;
          VACUUM (FULL, ANALYZE) fysen.menu_watch_runs;
          VACUUM (FULL, ANALYZE) fysen.search_result_impressions;
          SELECT pg_size_pretty(pg_database_size(current_database())) AS staging_compacted_database_size,
                 pg_database_size(current_database()) AS staging_compacted_bytes;
          SQL

          # Report physical size only after the isolated VACUUM FULL has finished.
          # This container is removed at the end of this step. No Supabase
          # credentials, production network connection or persisted row data.
          compacted_bytes="$(docker exec fysen-history-restore psql -v ON_ERROR_STOP=1 -At \
            -U postgres -d postgres -c 'SELECT pg_database_size(current_database())')"
          test "$compacted_bytes" -gt 0

          table_sizes="$(docker exec fysen-history-restore psql -v ON_ERROR_STOP=1 -At -F '|' \
            -U postgres -d postgres -c "
            SELECT names.name, pg_total_relation_size(format('fysen.%I', names.name)::regclass)
            FROM (VALUES ('restaurants'), ('menu_sources'), ('menu_snapshots'),
                         ('menu_items'), ('menu_changes'), ('menu_watch_runs'),
                         ('search_events'), ('search_result_impressions'),
                         ('staging_archived_search_item_refs')) AS names(name)
            ORDER BY pg_total_relation_size(format('fysen.%I', names.name)::regclass) DESC
          ")"

          {
            echo "## Fysen Free: isolated 3-day rehearsal"
            echo
            echo "Restored historical snapshot of 2 November 2026. This job pruned **only the temporary Docker Postgres** and then compacted tables. Historical Google Drive backup and original Supabase remain untouched."
            echo
            echo "- Exact retained items: 151,408 (asserted in SQL)"
            echo "- Historical search-impression item references preserved in staging map: 5,150 (asserted in SQL)"
            echo "- Physical database size after VACUUM FULL: **${compacted_bytes} bytes**"
            echo "- Free comparison threshold (500 MB decimal): **500,000,000 bytes**"
            echo "- Conservative planning budget (20% headroom): **400,000,000 bytes**"
            if [ "$compacted_bytes" -le 400000000 ]; then
              echo "- **Preliminary size gate: BELOW planning budget.** Live operation, growth, index completeness, WAL and organizational fair-use restrictions remain unverified."
            elif [ "$compacted_bytes" -le 500000000 ]; then
              echo "- **Preliminary size gate: WITHIN nominal quota but WITHOUT planned growth headroom.** Not approved for migration."
            else
              echo "- **Preliminary size gate: EXCEEDS 500 MB Free quota.** Do not migrate this candidate."
            fi
            echo
            echo "| Isolated table | Total table and index bytes |"
            echo "| --- | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS='|' read -r table_name table_bytes; do
            printf '| `%s` | %s |\n' "$table_name" "$table_bytes" >> "$GITHUB_STEP_SUMMARY"
          done <<< "$table_sizes"

          echo "Measured compacted staging database: $compacted_bytes bytes (not production approval)"
