name: TEMP strip hidden menu DOM

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Add hidden DOM sanitation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/menu-worker/src/html-extractor.ts')
          text = path.read_text()
          old_version = 'export const HTML_EXTRACTOR_VERSION = "html-v7";'
          if text.count(old_version) != 1:
              raise SystemExit(f'html extractor version count={text.count(old_version)}')
          text = text.replace(old_version, 'export const HTML_EXTRACTOR_VERSION = "html-v8";', 1)
          anchor = '''export interface ExtractedHtmlMenu {\n  readonly items: readonly MenuObservedItem[];\n  readonly method: "json_ld" | "html_heuristic";\n  readonly visibleText: string;\n}\n\n'''
          helper = anchor + '''export function stripExplicitlyHiddenHtmlContent(html: string): string {\n  const $ = load(html);\n  $("[hidden], [aria-hidden='true'], .w-condition-invisible").remove();\n  return $.html();\n}\n\n'''
          if 'stripExplicitlyHiddenHtmlContent' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'html sanitizer anchor count={text.count(anchor)}')
              text = text.replace(anchor, helper, 1)
          path.write_text(text)

          path = Path('apps/menu-worker/src/html-source-extractor.ts')
          text = path.read_text()
          old_import = 'import { extractHtmlMenu, type ExtractedHtmlMenu } from "./html-extractor.js";'
          new_import = '''import {\n  extractHtmlMenu,\n  stripExplicitlyHiddenHtmlContent,\n  type ExtractedHtmlMenu,\n} from "./html-extractor.js";'''
          if text.count(old_import) != 1:
              raise SystemExit(f'source extractor import count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old = '''  const firstPass = extractHtmlMenu(html);\n  if (firstPass.method === "json_ld") return firstPass;\n\n  const sourceLines = annotatedVisibleLines(html);\n'''
          new = '''  const firstPass = extractHtmlMenu(html);\n  if (firstPass.method === "json_ld") return firstPass;\n\n  const visibleHtml = stripExplicitlyHiddenHtmlContent(html);\n  const sourceLines = annotatedVisibleLines(visibleHtml);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'source extractor visible HTML anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()
          old_import = '''import {\n  extractHtmlVisibleText,\n  HTML_EXTRACTOR_VERSION,\n} from "./html-extractor.js";'''
          new_import = '''import {\n  extractHtmlVisibleText,\n  HTML_EXTRACTOR_VERSION,\n  stripExplicitlyHiddenHtmlContent,\n} from "./html-extractor.js";'''
          if text.count(old_import) != 1:
              raise SystemExit(f'runtime html extractor import count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)
          old = '''    const normalizedHtml = normalizeHtmlPriceNotation(\n      normalizeHtmlHeadingLineBreaks(fetched.body),\n    );\n    const fullVisibleText = extractHtmlVisibleText(normalizedHtml);\n    const extracted = extractScopedHtmlMenu(normalizedHtml);\n'''
          new = '''    const normalizedHtml = normalizeHtmlPriceNotation(\n      normalizeHtmlHeadingLineBreaks(fetched.body),\n    );\n    const extracted = extractScopedHtmlMenu(normalizedHtml);\n    const recoveryHtml =\n      extracted.method === "html_heuristic"\n        ? stripExplicitlyHiddenHtmlContent(normalizedHtml)\n        : normalizedHtml;\n    const fullVisibleText = extractHtmlVisibleText(recoveryHtml);\n'''
          if text.count(old) != 1:
              raise SystemExit(f'runtime normalized HTML anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          # Every raw-HTML heuristic recovery must consume recoveryHtml; scoped-text recoveries stay unchanged.
          for old_call, new_call in [
              ('recoverEmbeddedStructuredMenuJson(normalizedHtml)', 'recoverEmbeddedStructuredMenuJson(recoveryHtml)'),
              ('recoverTrailingPriceCardHtmlItems(normalizedHtml)', 'recoverTrailingPriceCardHtmlItems(recoveryHtml)'),
              ('recoverAdjacentHeadingPriceHtmlItems(normalizedHtml)', 'recoverAdjacentHeadingPriceHtmlItems(recoveryHtml)'),
          ]:
              if text.count(old_call) != 1:
                  raise SystemExit(f'raw recovery anchor {old_call} count={text.count(old_call)}')
              text = text.replace(old_call, new_call, 1)
          path.write_text(text)

          path = Path('apps/menu-worker/src/batch02-output-cleanup.test.ts')
          text = path.read_text()
          anchor = '''  it("uses full-page beverage evidence after full-HTML recoveries add drink cards", async () => {\n'''
          test = '''  it("removes explicitly hidden Webflow menu cards before raw HTML recoveries", async () => {\n    const html = `\n      <html><body>\n        <h2>SNACKS</h2>\n        <div><h3>SPICY POPCORN</h3><p>65</p></div>\n        <div><h3>HOMEMADE PICKLES</h3><p>69</p></div>\n        <div>\n          <div class="snackswrap w-condition-invisible">\n            <h5>ALT</h5><p>339</p>\n          </div>\n          <div class="extrainfo">\n            <h3>PERFEKT Å DELE!</h3>\n            <h3>SMAK PÅ ALT</h3><p>339</p>\n          </div>\n        </div>\n      </body></html>\n    `;\n\n    const extracted = await extractMenuSource("html", fetchedHtml(html));\n    expect(extracted.items.some((entry) => entry.name === "ALT")).toBe(false);\n    expect(extracted.items.some((entry) => entry.name === "SMAK PÅ ALT")).toBe(true);\n  });\n\n''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'batch02 hidden DOM test anchor count={text.count(anchor)}')
          text = text.replace(anchor, test, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-extractor.ts apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/batch02-output-cleanup.test.ts
      - name: Commit permanent fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-extractor.ts apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/batch02-output-cleanup.test.ts
          git commit -m "Ignore explicitly hidden menu DOM"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
