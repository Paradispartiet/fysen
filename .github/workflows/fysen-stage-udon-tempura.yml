name: Fysen verify udon tempura originals (unapproved)
on:
  push:
    branches: [art/udon-tempura-native-photo-20261121]
    paths: [".github/workflows/fysen-stage-udon-tempura.yml","scripts/stage-udon-tempura-sources.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-udon-tempura-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify original pixels and hashes
        run: python scripts/stage-udon-tempura-sources.py
      - name: Source gate - not approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("assets/fysen-image-candidates/udon-tempura").glob("*/review.json"))
          assert files
          for path in files:
            r=json.loads(path.read_text(encoding="utf8"))
            assert r["dish_id"]==r["catalog_id"]=="udon"
            assert r["source_verified"] and r["no_upscale"]
            assert not r["visual_review_completed"] and not r["approved_for_fysen"] and not r["published"]
            assert min(r["native_width"],r["native_height"])>=2000
            assert (path.parent/"source.jpeg").is_file()
            assert (path.parent/"preview.jpg").is_file()
          print(f"Verified {len(files)} unapproved authentic candidates")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: udon-tempura-native-photo-originals
          retention-days: 7
          if-no-files-found: error
          path: assets/fysen-image-candidates/udon-tempura
      - name: Commit only small unapproved previews
        run: |
          find assets/fysen-image-candidates/udon-tempura -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/udon-tempura
          git diff --cached --quiet && exit 0
          git commit -m "[udon-source-bot] Stage unapproved licensed source previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
