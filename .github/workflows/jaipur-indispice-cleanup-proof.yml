name: Jaipur IndiSpice cleanup proof

on:
  pull_request:
    paths:
      - ".github/workflows/jaipur-indispice-cleanup-proof.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Dump targeted live source evidence
        shell: bash
        run: |
          mkdir -p apps/menu-worker/research
          node --input-type=module <<'NODE' | tee apps/menu-worker/research/jaipur-indispice-target-debug.json
          import { writeFile } from 'node:fs/promises';
          import { extractHtmlVisibleText } from './apps/menu-worker/dist/html-extractor.js';
          import { extractMenuSource, fetchMenuSource } from './apps/menu-worker/dist/menu-source-runtime.js';

          const targets = [
            {
              slug: 'jaipur-karl-johans-gate-oslo',
              url: 'https://jaipur.no/our-menu',
              tokens: ['CHILDREN MENU', 'MALAI AAM'],
            },
            {
              slug: 'indi-spice-welhavens-gate-oslo',
              url: 'https://indispiceoslo.no/meny/',
              tokens: ['TASTING MENU', 'LEN DEG TILBAKE', '595'],
            },
          ];

          function contexts(lines, token) {
            const normalizedToken = token.toLocaleLowerCase('nb-NO');
            const matches = [];
            for (let index = 0; index < lines.length; index += 1) {
              if (!lines[index].toLocaleLowerCase('nb-NO').includes(normalizedToken)) continue;
              matches.push({
                index,
                lines: lines.slice(Math.max(0, index - 5), Math.min(lines.length, index + 7)),
              });
              if (matches.length >= 6) break;
            }
            return matches;
          }

          const report = [];
          for (const target of targets) {
            const fetched = await fetchMenuSource({
              url: target.url,
              sourceType: 'html',
              fetchMode: 'http',
              userAgent: process.env.FYSEN_MENU_BOT_USER_AGENT ?? 'FysenMenuBot/0.1',
              etag: null,
              lastModified: null,
              sourceSupport: { redirectOrigins: [], browserDataOrigins: [] },
            });
            if (fetched.kind !== 'content') throw new Error(`${target.slug} returned not_modified`);
            const extracted = await extractMenuSource('html', fetched);
            const visibleLines = extractHtmlVisibleText(fetched.body)
              .split(/\n+/)
              .map((line) => line.replace(/\s+/g, ' ').trim())
              .filter(Boolean);
            const suspicious = extracted.items
              .filter((item) =>
                target.tokens.some((token) =>
                  item.name.toLocaleLowerCase('nb-NO').includes(token.toLocaleLowerCase('nb-NO')),
                ),
              )
              .map((item) => ({
                name: item.name,
                priceMinor: item.priceMinor,
                sectionName: item.sectionName,
                confidence: item.confidence,
                extractionMethod: item.extractionMethod,
                sourceExcerpt: item.sourceExcerpt,
              }));
            report.push({
              slug: target.slug,
              httpStatus: fetched.status,
              itemCount: extracted.items.length,
              extractorVersion: extracted.extractorVersion,
              suspicious,
              contexts: Object.fromEntries(target.tokens.map((token) => [token, contexts(visibleLines, token)])),
            });
          }
          const output = { cleanupHead: '36d81e4e762cd303422eb2326445a28255e8bcb2', report };
          await writeFile('apps/menu-worker/research/jaipur-indispice-target-debug-structured.json', JSON.stringify(output, null, 2) + '\n');
          console.log(JSON.stringify(output, null, 2));
          NODE

      - name: Restore immutable Batch 02 targets
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json', 'utf8'));
          const targets = new Set(['jaipur-karl-johans-gate-oslo','indi-spice-welhavens-gate-oslo']);
          const restaurants = source.restaurants.filter((entry) => targets.has(entry.restaurant.slug));
          if (restaurants.length !== 2) throw new Error(`Expected 2 targets, found ${restaurants.length}`);
          const plan = { ...source, outputDirectory: 'research/jaipur-indispice-cleanup-generated', concurrency: 1, restaurants };
          await mkdir('apps/menu-worker/research/jaipur-indispice-cleanup-generated', { recursive: true });
          await writeFile('apps/menu-worker/research/jaipur-indispice-cleanup.plan.json', JSON.stringify(plan, null, 2) + '\n');
          NODE

      - name: Fresh intake
        id: intake
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js intake:batch research/jaipur-indispice-cleanup.plan.json | tee research/jaipur-indispice-cleanup-intake.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Separate serial live validation
        id: validation
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/jaipur-indispice-cleanup-generated | tee research/jaipur-indispice-cleanup-validation.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gate and summarize complete names
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const intake = JSON.parse(await readFile('research/jaipur-indispice-cleanup-intake.json','utf8'));
          const validation = JSON.parse(await readFile('research/jaipur-indispice-cleanup-validation.json','utf8'));
          const summary = {
            cleanupHead: '36d81e4e762cd303422eb2326445a28255e8bcb2',
            intakeExitCode: '${{ steps.intake.outputs.exit_code }}',
            validationExitCode: '${{ steps.validation.outputs.exit_code }}',
            intake: { requestedCount: intake.requestedCount, generatedCount: intake.generatedCount, failedCount: intake.failedCount, results: intake.results },
            validation: {
              manifestCount: validation.manifestCount,
              acceptedCount: validation.acceptedCount,
              failedCount: validation.failedCount,
              failureFamilyCounts: validation.failureFamilyCounts,
              results: validation.results.map((result) => ({
                slug: result.slug,
                accepted: result.accepted,
                failureFamilies: result.failureFamilies ?? [],
                error: result.error ?? null,
                itemCount: result.validation?.menu?.quality?.itemCount ?? null,
                extractorVersion: result.validation?.menu?.extractorVersion ?? null,
                observedDishNames: result.validation?.menu?.observedDishNames ?? [],
              })),
            },
          };
          await writeFile('research/jaipur-indispice-cleanup-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (intake.requestedCount !== 2 || intake.generatedCount !== 2 || intake.failedCount !== 0) throw new Error(`Intake ${intake.generatedCount}/${intake.requestedCount}`);
          if (validation.manifestCount !== 2 || validation.acceptedCount !== 2 || validation.failedCount !== 0) throw new Error(`Validation ${validation.acceptedCount}/${validation.manifestCount}`);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaipur-indispice-cleanup-proof
          path: |
            apps/menu-worker/research/jaipur-indispice-target-debug.json
            apps/menu-worker/research/jaipur-indispice-target-debug-structured.json
            apps/menu-worker/research/jaipur-indispice-cleanup.plan.json
            apps/menu-worker/research/jaipur-indispice-cleanup-intake.json
            apps/menu-worker/research/jaipur-indispice-cleanup-validation.json
            apps/menu-worker/research/jaipur-indispice-cleanup-summary.json
            apps/menu-worker/research/jaipur-indispice-cleanup-generated/*.json
          if-no-files-found: warn
