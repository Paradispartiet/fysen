name: Fysen stage authentic prosciutto-pizza photo candidates
on:
  push:
    branches: [art/pizza-prosciutto-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-stage-pizza-prosciutto.yml"
      - "scripts/stage-pizza-prosciutto-native.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-prosciutto-source-review
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch original photos for non-publishing review
        run: python scripts/stage-pizza-prosciutto-native.py
      - name: Validate source evidence remains unapproved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          reviews=list(Path("assets/fysen-image-candidates/pizza-prosciutto").glob("*/review.json"))
          assert len(reviews)>=2
          for f in reviews:
              d=json.loads(f.read_text())
              assert d["source_verified"] is True
              assert d["approved_for_fysen"] is False and d["published"] is False
              assert d["visual_review_completed"] is False
              assert min(d["source_width"],d["source_height"])>=1800
              assert (f.parent/"native-detail-1400.jpg").is_file()
          print(f"{len(reviews)} original photographs ready for visual review")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-prosciutto-photo-candidates
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/fysen-image-candidates/pizza-prosciutto/*/source.jpeg
            assets/fysen-image-candidates/pizza-prosciutto/*/preview.jpg
            assets/fysen-image-candidates/pizza-prosciutto/*/native-detail-1400.jpg
            assets/fysen-image-candidates/pizza-prosciutto/*/review.json
      - name: Commit only previews to review branch
        run: |
          find assets/fysen-image-candidates/pizza-prosciutto -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pizza-prosciutto
          git diff --cached --quiet && exit 0
          git commit -m "[prosciutto-source-bot] Stage original pizza photo evidence"
          git push origin HEAD:"$GITHUB_REF_NAME"
