name: Fysen stage original kebab-pita photo candidates
on:
  push:
    branches: [art/kebab-pita-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-stage-kebab-pita.yml"
      - "scripts/stage-kebab-pita-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-kebab-pita-sources
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photographic image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch true native-source photos and examine native dimensions
        run: python scripts/stage-kebab-pita-sources.py
      - name: Validate candidate status remains unapproved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path("assets/fysen-image-candidates/kebab-pita").glob("*/review.json"))
          assert len(files)>=2
          for file in files:
              d=json.loads(file.read_text())
              assert d["source_verified"] is True
              assert d["approved_for_fysen"] is False and d["published"] is False
              assert min(d["native_width"],d["native_height"])>=1800
              assert (file.parent/"native-detail-1400.jpg").exists()
          print(len(files),"native candidates staged for visual inspection")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-kebab-pita-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/kebab-pita/*/native-source.bytes
            assets/fysen-image-candidates/kebab-pita/*/preview.jpg
            assets/fysen-image-candidates/kebab-pita/*/native-detail-1400.jpg
            assets/fysen-image-candidates/kebab-pita/*/review.json
      - name: Retain only small proof previews on the PR branch
        run: |
          find assets/fysen-image-candidates/kebab-pita -name native-source.bytes -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/kebab-pita
          git diff --cached --quiet && exit 0
          git commit -m "[kebab-source-bot] Stage native kebab pita photo previews without approval"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
