name: Fysen review native black steak source
on:
  push:
    branches: [art/grillet-biff-native-photo-20261119]
    paths: [".github/workflows/fysen-review-grillet-biff.yml","scripts/preview-grillet-biff-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-review-biff-native
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Black-matte source with no native pixel enlargement
        run: python scripts/preview-grillet-biff-black.py
      - name: Keep photo unapproved pending visual review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/grillet-biff/27643022")
          x=json.loads((p/"black-review.json").read_text())
          assert x["source_size"]==[6000,4000] and x["native_review_size"]==[6000,4000]
          assert x["visual_review_completed"] is False
          assert x["approved_for_fysen"] is False and x["published"] is False
          assert (p/"black-native-detail-1400.jpg").exists()
          print("Native food pixels retained; visual quality gate remains locked")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-steak-native-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/grillet-biff/27643022/black-native-master.png
            assets/fysen-image-candidates/grillet-biff/27643022/black-preview.jpg
            assets/fysen-image-candidates/grillet-biff/27643022/black-native-detail-1400.jpg
            assets/fysen-image-candidates/grillet-biff/27643022/black-review.json
      - name: Commit previews and evidence only, no public assets
        run: |
          rm -f assets/fysen-image-candidates/grillet-biff/27643022/black-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/grillet-biff/27643022/black-preview.jpg
          git add assets/fysen-image-candidates/grillet-biff/27643022/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/grillet-biff/27643022/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[steak-review-bot] Stage native black steak for visual review"
          git push origin HEAD:"$GITHUB_REF_NAME"
