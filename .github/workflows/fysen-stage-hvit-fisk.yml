name: Fysen stage genuine seared white-fish photographs
on:
  push:
    branches: [art/stekt-hvit-fisk-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-hvit-fisk.yml"
      - "scripts/stage-hvit-fisk-photos.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-white-fish-source-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check native fish photos without upscaling
        run: python scripts/stage-hvit-fisk-photos.py
      - name: Require original pixels and unapproved status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reviews=list(Path("assets/fysen-image-candidates/stekt-hvit-fisk").glob("*/review.json"))
          assert len(reviews)>=3
          for file in reviews:
              d=json.loads(file.read_text())
              assert min(d["native_width"],d["native_height"])>=1600
              assert d["approved_for_fysen"] is False and d["published"] is False
              assert (file.parent/"native-detail-1400.jpg").exists()
          print("Only authentic image source evidence staged; not approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-white-fish-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/stekt-hvit-fisk/*/source.jpeg
            assets/fysen-image-candidates/stekt-hvit-fisk/*/preview.jpg
            assets/fysen-image-candidates/stekt-hvit-fisk/*/native-detail-1400.jpg
            assets/fysen-image-candidates/stekt-hvit-fisk/*/review.json
      - name: Keep only previews and evidence on PR
        run: |
          find assets/fysen-image-candidates/stekt-hvit-fisk -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/stekt-hvit-fisk
          git diff --cached --quiet && exit 0
          git commit -m "[white-fish-source-bot] Stage real native fish previews without approval"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
