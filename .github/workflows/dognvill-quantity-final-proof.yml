name: Dognvill quantity final proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Restore immutable Batch 02 plan and isolate Dognvill three
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const targets = new Set([
            'dognvill-bjorvika-oslo',
            'dognvill-tjuvholmen-oslo',
            'dognvill-vulkan-oslo',
          ]);
          const restaurants = source.restaurants.filter((entry) => targets.has(entry.restaurant.slug));
          if (restaurants.length !== 3) throw new Error(`Expected 3 Dognvill targets, found ${restaurants.length}`);
          const plan = {
            ...source,
            outputDirectory: 'research/dognvill-quantity-generated',
            concurrency: 1,
            restaurants,
          };
          await mkdir('apps/menu-worker/research/dognvill-quantity-generated', { recursive: true });
          await writeFile('apps/menu-worker/research/dognvill-quantity.plan.json', JSON.stringify(plan, null, 2) + '\n');
          NODE
      - name: Fresh intake three
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/dognvill-quantity.plan.json | tee research/dognvill-quantity-intake.json
      - name: Independent validation three
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/dognvill-quantity-generated | tee research/dognvill-quantity-validation.json
      - name: Gate quantity and hidden output
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const validation = JSON.parse(await readFile('research/dognvill-quantity-validation.json','utf8'));
          const failures = [];
          for (const result of validation.results ?? []) {
            const names = result.validation?.menu?.observedDishNames ?? [];
            if (!names.some((name) => /^90 GRAM HAMBURGER$/iu.test(name))) {
              failures.push(`${result.slug}: missing 90 GRAM HAMBURGER`);
            }
            if (names.some((name) => /^GRAM HAMBURGER$/iu.test(name))) {
              failures.push(`${result.slug}: leaked GRAM HAMBURGER`);
            }
            if (names.some((name) => /^ALT$/iu.test(name))) {
              failures.push(`${result.slug}: leaked hidden ALT`);
            }
          }
          const summary = {
            head: 'cb9549e45f29042511525b00a45d93066d5649da',
            manifestCount: validation.manifestCount,
            acceptedCount: validation.acceptedCount,
            failedCount: validation.failedCount,
            results: (validation.results ?? []).map((result) => ({
              slug: result.slug,
              accepted: result.accepted,
              itemCount: result.validation?.menu?.quality?.itemCount ?? null,
              observedDishNames: result.validation?.menu?.observedDishNames ?? [],
              extractorVersion: result.validation?.menu?.extractorVersion ?? null,
            })),
            failures,
          };
          await writeFile('research/dognvill-quantity-final-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (validation.manifestCount !== 3 || validation.acceptedCount !== 3 || validation.failedCount !== 0 || failures.length > 0) {
            throw new Error(`Dognvill quantity gate failed: ${failures.join('; ')}`);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dognvill-quantity-final-proof
          path: |
            apps/menu-worker/research/dognvill-quantity-intake.json
            apps/menu-worker/research/dognvill-quantity-validation.json
            apps/menu-worker/research/dognvill-quantity-final-summary.json
            apps/menu-worker/research/dognvill-quantity-generated/*.json
          if-no-files-found: warn
