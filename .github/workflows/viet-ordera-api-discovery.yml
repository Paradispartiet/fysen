name: Viet Ordera API discovery

on:
  pull_request:
    paths:
      - ".github/workflows/viet-ordera-api-discovery.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Fetch public Ordera API and summarize product-shaped arrays
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { HttpMenuClient } from './dist/http-client.js';
          const url = 'https://order-api.ordera.no/api/v1/shop/all?agency=vietkitchen';
          const fetched = await new HttpMenuClient().fetchSource({
            url,
            userAgent: 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
          });
          if (fetched.kind !== 'content') throw new Error(`Unexpected ${fetched.kind}`);
          const json = JSON.parse(fetched.body);
          const arrays = [];
          const seen = new Set();
          const visit = (value, path, depth = 0) => {
            if (depth > 8 || value === null || typeof value !== 'object') return;
            if (seen.has(value)) return;
            seen.add(value);
            if (Array.isArray(value)) {
              const objectItems = value.filter((item) => item && typeof item === 'object' && !Array.isArray(item));
              const keySets = objectItems.slice(0, 10).map((item) => Object.keys(item).sort());
              const productLike = objectItems.filter((item) => typeof item.name === 'string' && (typeof item.price === 'number' || typeof item.origin_price === 'number'));
              if (value.length >= 2 || productLike.length > 0) {
                arrays.push({
                  path,
                  length: value.length,
                  productLikeCount: productLike.length,
                  sampleKeys: keySets,
                  productSamples: productLike.slice(0, 8).map((item) => ({
                    id: item.id ?? null,
                    name: item.name,
                    price: item.price ?? null,
                    dinein_price: item.dinein_price ?? null,
                    origin_price: item.origin_price ?? null,
                    soldout: item.soldout ?? null,
                    visibility: item.visibility ?? null,
                    description: typeof item.description === 'string' ? item.description.slice(0, 300) : null,
                  })),
                });
              }
              value.slice(0, 20).forEach((item, index) => visit(item, `${path}[${index}]`, depth + 1));
              return;
            }
            for (const [key, child] of Object.entries(value)) {
              visit(child, path ? `${path}.${key}` : key, depth + 1);
            }
          };
          visit(json, '$');
          arrays.sort((a, b) => b.productLikeCount - a.productLikeCount || b.length - a.length);
          const report = {
            url,
            status: fetched.status,
            contentType: fetched.contentType,
            bodyBytes: fetched.bodyBytes.length,
            rootType: Array.isArray(json) ? 'array' : typeof json,
            rootLength: Array.isArray(json) ? json.length : null,
            rootKeys: !Array.isArray(json) && json && typeof json === 'object' ? Object.keys(json) : null,
            arrays: arrays.slice(0, 80),
          };
          await writeFile('research/viet-ordera-api-shape.json', JSON.stringify(report, null, 2) + '\n');
          console.log(JSON.stringify({
            status: report.status,
            bodyBytes: report.bodyBytes,
            rootType: report.rootType,
            rootLength: report.rootLength,
            topArrays: report.arrays.slice(0, 20).map((entry) => ({ path: entry.path, length: entry.length, productLikeCount: entry.productLikeCount, productSamples: entry.productSamples.map((item) => [item.name, item.price]) })),
          }, null, 2));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viet-ordera-api-shape
          path: apps/menu-worker/research/viet-ordera-api-shape.json
          if-no-files-found: error
