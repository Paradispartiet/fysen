name: Oslo batch 02 residual quality

on:
  pull_request:
    paths:
      - ".github/workflows/oslo-batch-02-residual-quality.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read
  actions: read

jobs:
  residual-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Apply candidate structured-recovery patch in runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
            file = Path(path)
            text = file.read_text()
            count = text.count(old)
            if count != 1:
              raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
            file.write_text(text.replace(old, new, 1))

          heading_path = 'apps/menu-worker/src/html-adjacent-heading-price-recovery.ts'
          old_heading = '''const BEVERAGE_SECTION_HEADING = /^(?:drikke(?:meny)?|drinks?(?:\\s+menu)?|beverages?(?:\\s+menu)?|andre\\s+drikker?|other\\s+drinks?|bar(?:\\s+menu)?|mineralvann|soft\\s+drinks?|sodas?|brus|vinkart|vin(?:kart|liste|meny)?|wine(?:\\s+(?:list|menu))?|cocktails?|champagne(?:\\s+cocktails?)?|øl(?:\\s*,?\\s*cider.*)?|beer(?:s)?(?:\\s*,?\\s*cider.*)?|alkoholfritt|non[- ]alcoholic(?:\\s+drinks?)?|kaffedrinker|coffee\\s+drinks?|kaffe\\/te.*|coffee\\/tea.*)$/iu;'''
          new_heading = '''const BEVERAGE_SECTION_HEADING = /^(?:drikke(?:meny)?|drinks?(?:\\s+menu)?|beverages?(?:\\s+menu)?|andre\\s+drikker?|other\\s+drinks?|bar(?:\\s+menu)?|mineralvann|soft\\s+drinks?|sodas?|brus|vinkart|vin(?:kart|liste|meny)?|wine(?:\\s+(?:list|menu))?|white\\s+wine|red\\s+wine|sparkling\\s+wine|cocktails?|champagne(?:\\s+cocktails?)?|aperitif|mocktails?|milkshakes?|draught\\s+beer|draft\\s+beer|øl(?:\\s*,?\\s*cider.*)?|beer(?:s)?(?:\\s*,?\\s*cider.*)?|cider|øl\\s*\\/\\s*beer|fat\\s+øl\\s*\\/\\s*tap\\s+beer|flaske\\s+øl\\s*\\/\\s*bottle\\s+beer|vin\\s+glass\\s*\\/\\s*wine\\s+glass|hvitvin\\s*\\/\\s*white\\s+wine|rødvin\\s*\\/\\s*red\\s+wine|musserende\\s*\\/\\s*sparkling\\s+wine|alkoholfritt|non[- ]alcoholic(?:\\s+drinks?)?|kaffedrinker|coffee\\s+drinks?|kaffe\\s*\\/\\s*coffee|kaffe\\/te.*|coffee\\/tea.*|coffee\\s+(?:and|&)\\s+tea)$/iu;'''
          replace_once(heading_path, old_heading, new_heading)

          runtime_path = 'apps/menu-worker/src/menu-source-runtime.ts'
          old_selection = '''    const headingPriceCoverageThreshold = Math.ceil(
      recoveredItems.length * 0.75,
    );
    const preferredItems = trailingPriceCardQualifies
      ? trailingPriceCardItems
      : headingPriceItems.length >= 4 &&
          (recoveredItems.length === 0 ||
            headingPriceItems.length >= headingPriceCoverageThreshold)
        ? headingPriceItems
        : priceWrappedItems.length >= 3 &&
            priceWrappedItems.length >= recoveredItems.length * 2
          ? priceWrappedItems
          : recoveredItems;
    const recoveredSupplementedItems =
      extracted.method === "html_heuristic" &&
      !isolatedTrailingRecoveryPreferred
        ? mergeMissingRecoveredItems(preferredItems, recoveredItems)
        : preferredItems;'''
          new_selection = '''    const headingPriceCoverageThreshold = Math.ceil(
      recoveredItems.length * 0.75,
    );
    const denseHeadingPricePreferred = headingPriceItems.length >= 20;
    const isolatedStructuredRecoveryPreferred =
      isolatedTrailingRecoveryPreferred || denseHeadingPricePreferred;
    const preferredItems = isolatedTrailingRecoveryPreferred
      ? trailingPriceCardItems
      : denseHeadingPricePreferred
        ? headingPriceItems
        : trailingPriceCardQualifies
          ? trailingPriceCardItems
          : headingPriceItems.length >= 4 &&
              (recoveredItems.length === 0 ||
                headingPriceItems.length >= headingPriceCoverageThreshold)
            ? headingPriceItems
            : priceWrappedItems.length >= 3 &&
                priceWrappedItems.length >= recoveredItems.length * 2
              ? priceWrappedItems
              : recoveredItems;
    const recoveredSupplementedItems =
      extracted.method === "html_heuristic" &&
      !isolatedStructuredRecoveryPreferred
        ? mergeMissingRecoveredItems(preferredItems, recoveredItems)
        : preferredItems;'''
          replace_once(runtime_path, old_selection, new_selection)

          runtime = Path(runtime_path)
          text = runtime.read_text()
          remaining = text.count('!isolatedTrailingRecoveryPreferred')
          if remaining != 4:
            raise SystemExit(f'{runtime_path}: expected four remaining supplement guards, found {remaining}')
          runtime.write_text(text.replace('!isolatedTrailingRecoveryPreferred', '!isolatedStructuredRecoveryPreferred'))
          PY

      - name: Add dense structured recovery probe fixture
        shell: bash
        run: |
          cat > apps/menu-worker/src/menu-source-runtime-structured-quality.probe.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { extractMenuSource } from "./menu-source-runtime.js";

          describe("dense structured heading recovery probe", () => {
            it("prefers dense priced dish headings and excludes beverage sections and nearby description text", async () => {
              const food = Array.from({ length: 24 }, (_, index) => {
                const number = String(index + 1).padStart(2, "0");
                return `<article><h3>Dish ${number}</h3><p>Creamy sauce garlic coriander blend</p><p>${200 + index} NOK</p></article>`;
              }).join("\n");
              const html = `
                <html><body>
                  <h2>FAT ØL / TAP BEER</h2>
                  <article><h3>House Lager</h3><p>99 NOK</p></article>
                  <h2>KJØTT CURRIES / NON-VEG CURRIES</h2>
                  ${food}
                  <h2>MILKSHAKES</h2>
                  <article><h3>Vanilla Shake</h3><p>109 NOK</p></article>
                </body></html>
              `;
              const result = await extractMenuSource("html", {
                kind: "content",
                fetchedAt: "2026-08-21T00:00:00.000Z",
                status: 200,
                contentType: "text/html; charset=utf-8",
                body: html,
                bodyBytes: new TextEncoder().encode(html),
                rawSha256: "structured-probe",
                etag: null,
                lastModified: null,
                durationMs: 1,
                robotsAllowed: true,
              });
              const names = result.items.map((item) => item.name);
              expect(names).toHaveLength(24);
              expect(names[0]).toBe("Dish 01");
              expect(names.at(-1)).toBe("Dish 24");
              expect(names).not.toContain("House Lager");
              expect(names).not.toContain("Vanilla Shake");
              expect(names).not.toContain("Creamy sauce garlic coriander blend");
            });
          });
          EOF

      - name: Test candidate parser patch
        shell: bash
        run: |
          pnpm --filter @fysen/menu-worker test
          rm apps/menu-worker/src/menu-source-runtime-structured-quality.probe.test.ts

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Restore original Batch 02 plan and isolate held generated subset
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';

          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json', 'utf8'));
          const held = new Set([
            '1947-gandhi-majorstuen-oslo',
            'mesob-motzfeldts-gate-oslo',
            'jaipur-karl-johans-gate-oslo',
            'new-delhi-tjuvholmen-oslo',
            'beijing-palace-pilestredet-oslo',
            'dognvill-tjuvholmen-oslo',
            'dognvill-vulkan-oslo',
            'dognvill-bjorvika-oslo',
            'indi-spice-welhavens-gate-oslo',
          ]);
          const restaurants = source.restaurants.filter((entry) => held.has(entry.restaurant.slug));
          if (restaurants.length !== held.size) {
            throw new Error(`Expected ${held.size} held entries, found ${restaurants.length}`);
          }
          const plan = {
            ...source,
            outputDirectory: 'research/oslo-batch-02-residual-generated',
            concurrency: 4,
            restaurants,
          };
          await mkdir('apps/menu-worker/research/oslo-batch-02-residual-generated', { recursive: true });
          await writeFile(
            'apps/menu-worker/research/oslo-batch-02-residual.plan.json',
            JSON.stringify(plan, null, 2) + '\n',
          );
          console.log(JSON.stringify({ count: restaurants.length, slugs: restaurants.map((entry) => entry.restaurant.slug) }, null, 2));
          NODE

      - name: Run fresh intake with candidate parser
        id: intake
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js intake:batch research/oslo-batch-02-residual.plan.json | tee research/oslo-batch-02-residual-intake.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate every freshly generated manifest
        id: validation
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/oslo-batch-02-residual-generated | tee research/oslo-batch-02-residual-validation.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize residual output
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          const readJson = async (path) => JSON.parse(await readFile(path, 'utf8'));
          const intake = await readJson('apps/menu-worker/research/oslo-batch-02-residual-intake.json');
          let validation = null;
          try { validation = await readJson('apps/menu-worker/research/oslo-batch-02-residual-validation.json'); } catch {}
          const directory = 'apps/menu-worker/research/oslo-batch-02-residual-generated';
          const generatedFiles = (await readdir(directory)).filter((name) => name.endsWith('.json')).sort();
          const summary = {
            candidatePatch: 'dense-heading-v1',
            intakeExitCode: '${{ steps.intake.outputs.exit_code }}',
            validationExitCode: '${{ steps.validation.outputs.exit_code }}',
            intake: {
              requestedCount: intake.requestedCount,
              generatedCount: intake.generatedCount,
              failedCount: intake.failedCount,
              results: intake.results,
            },
            validation: validation ? {
              manifestCount: validation.manifestCount,
              acceptedCount: validation.acceptedCount,
              failedCount: validation.failedCount,
              failureFamilyCounts: validation.failureFamilyCounts,
              results: validation.results.map((result) => ({
                slug: result.slug,
                accepted: result.accepted,
                failureFamilies: result.failureFamilies,
                observedDishNames: result.validation?.menu?.observedDishNames ?? [],
                itemCount: result.validation?.menu?.quality?.itemCount ?? null,
                extractionMethod: result.validation?.menu?.extractionMethod ?? null,
                extractorVersion: result.validation?.menu?.extractorVersion ?? null,
                error: result.error,
              })),
            } : null,
            generatedFiles,
          };
          await writeFile(
            'apps/menu-worker/research/oslo-batch-02-residual-summary.json',
            JSON.stringify(summary, null, 2) + '\n',
          );
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload residual proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: oslo-batch-02-residual-quality
          path: |
            apps/menu-worker/research/oslo-batch-02-residual.plan.json
            apps/menu-worker/research/oslo-batch-02-residual-intake.json
            apps/menu-worker/research/oslo-batch-02-residual-validation.json
            apps/menu-worker/research/oslo-batch-02-residual-summary.json
            apps/menu-worker/research/oslo-batch-02-residual-generated/*.json
          if-no-files-found: error
