name: Fysen integrate CC0 braised pork gua bao (draft only)
on:
  push:
    branches: [art/braised-pork-bao-native-photo-20261121]
    paths: [".github/workflows/fysen-promote-braised-pork-bao.yml","scripts/promote-reviewed-braised-pork-bao.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-braised-pork-bao-draft
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install native source and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Build authentic source-hashed braised pork bao and dedicated AVIFs
        run: python scripts/promote-reviewed-braised-pork-bao.py
      - name: Run ONLY the two focused Fysen dish-photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Confirm native AVIF dimensions, source license and hold on publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(i.get("largeViewEnabled") is True for i in m["images"])==27
          b=m["images"][27]
          assert b["id"]==b["catalogId"]=="bao"
          assert b["kind"]=="Redaksjonelt rettfoto"
          assert b["atlas"]=="bao-braised-pork-thumb-512.avif"
          assert b["largeSource"]=="bao-braised-pork-master-5160.avif"
          assert b["photoCredit"]=="Andy Li / Wikimedia Commons · CC0 1.0"
          assert b["photoLicense"]=="https://creativecommons.org/publicdomain/zero/1.0/"
          assert "CC0 1.0" in (root/"bao-braised-pork-LICENSE.txt").read_text(encoding="utf8")
          assert "ikke vegetarisk" in b["variantCaution"]
          with Image.open(root/b["largeSource"]) as im:assert im.size==(5160,3400)
          with Image.open(root/b["atlas"]) as im:assert im.size==(512,512)
          a=json.loads(Path("assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-review.json").read_text(encoding="utf8"))
          assert a["reviewed_variant"]=="black-clean-grabcut"
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert a["approved_for_fysen"] and a["published"] is False
          print("BAO: 27/44 approved in UNPUBLISHED PR chain; main unchanged")
          PY
      - name: Commit ONLY reviewed bao assets, manifest and targeted photo tests to draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/bao.png
          git add assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/review.json
          git add assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-review.json
          git add apps/web/public/dish-images/bao-braised-pork-master-5160.avif
          git add apps/web/public/dish-images/bao-braised-pork-thumb-512.avif
          git add apps/web/public/dish-images/bao-braised-pork-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/bao.md
          git diff --cached --quiet && exit 0
          git commit -m "[bao-photo-bot] Add genuine braised pork bao 5160px and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
