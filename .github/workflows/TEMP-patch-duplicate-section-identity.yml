name: TEMP patch duplicate residual section identity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-residual-output-cleanup-v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Preserve same-name dishes across small-dish and classics sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('apps/menu-worker/src/html-source-extractor.ts')
          text=path.read_text()
          old='const DUPLICATE_DISH_SECTION_LABEL = /^(?:forretter?|starters?|appetizers?|småretter|hovedretter?|mains?|main\\s+courses?|dessert(?:er|s)?|tilbehør|sides?|pizza(?:er|s)?|pizzeria|kylling\\s+og\\s+lam|mezah[- ]retter|salater?\\s*(?:&|og)\\s*suppe(?:r)?|kylling|kjøttretter?|fiskeretter?|salater?|supper?)$/iu;'
          new='const DUPLICATE_DISH_SECTION_LABEL = /^(?:forretter?|starters?|appetizers?|small\\s+dishes?\\s*(?:&|and)\\s*sharing\\s+plates?|classics?|småretter|hovedretter?|mains?|main\\s+courses?|dessert(?:er|s)?|tilbehør|sides?|pizza(?:er|s)?|pizzeria|kylling\\s+og\\s+lam|mezah[- ]retter|salater?\\s*(?:&|og)\\s*suppe(?:r)?|kylling|kjøttretter?|fiskeretter?|salater?|supper?)$/iu;'
          if new not in text:
              if old not in text: raise SystemExit('duplicate section label anchor missing')
              text=text.replace(old,new,1)
          path.write_text(text)

          test=Path('apps/menu-worker/src/html-duplicate-dish-section-identity.test.ts')
          t=test.read_text()
          closing='\n});\n'
          block='''\n  it("keeps same-name dishes distinct across small-dishes and classics sections", () => {\n    const html = `\n      <html><body>\n        <h2>Small Dishes & Sharing Plates</h2>\n        <h3>Hot Wings 179,-</h3>\n        <p>Six glazed chicken wings.</p>\n        <h2>Classics</h2>\n        <h3>Hot Wings 289,-</h3>\n        <p>Twelve glazed chicken wings.</p>\n      </body></html>\n    `;\n    const result = extractScopedHtmlMenu(html);\n    expect(result.items.map((entry) => [entry.name, entry.sectionName, entry.priceMinor])).toEqual([\n      ["Hot Wings", "Small Dishes & Sharing Plates", 17900],\n      ["Hot Wings", "Classics", 28900],\n    ]);\n    expect(new Set(result.items.map((entry) => entry.sourceKey)).size).toBe(2);\n  });\n'''
          if 'keeps same-name dishes distinct across small-dishes and classics sections' not in t:
              if not t.endswith(closing): raise SystemExit('duplicate section test closing anchor missing')
              t=t[:-len(closing)]+block+closing
          test.write_text(t)
          PY
          git diff --check
      - name: Commit section identity correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-duplicate-dish-section-identity.test.ts
          git commit -m "Preserve duplicate residual section identity"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
