name: Fysen integrate reviewed masala dosa original photo (draft only)
on:
  push:
    branches: [art/masala-dosa-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-promote-masala-dosa.yml"
      - "scripts/promote-reviewed-masala-dosa.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-masala-dosa-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-image and AVIF processing
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Regenerate source-locked complete dosa and write independent AVIFs
        run: python scripts/promote-reviewed-masala-dosa.py
      - name: Run ONLY the two targeted Fysen dish-image test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check original dimensions, license, manifest and unpublished status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          base=Path("apps/web/public/dish-images")
          m=json.loads((base/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==23
          p=m["images"][23]
          assert p["id"]==p["catalogId"]=="dosa"
          assert p["kind"]=="Redaksjonelt rettfoto"
          assert p["atlas"]=="masala-dosa-thumb-512.avif"
          assert p["largeSource"]=="masala-dosa-master-9504.avif"
          assert p["photoCredit"]=="Jack Baghel / Pexels"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "Pexels License" in (base/"masala-dosa-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(base/p["atlas"]) as im:assert im.size==(512,512)
          with Image.open(base/p["largeSource"]) as im:assert im.size==(9504,6336)
          a=json.loads(Path("assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-review.json").read_text(encoding="utf8"))
          assert a["reviewed_variant"]=="black-food-isolate"
          assert a["approved_for_fysen"] and a["published"] is False
          assert a["no_upscale"] and not a["generated_food_pixels"]
          print("23/44 native photos verified on UNPUBLISHED DRAFT")
          PY
      - name: Commit only reviewed image, gallery metadata and targeted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/dosa.png
          git add assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/review.json
          git add assets/fysen-image-candidates/masala-dosa/jack-baghel-dosa-dark/black-review.json
          git add apps/web/public/dish-images/masala-dosa-master-9504.avif
          git add apps/web/public/dish-images/masala-dosa-thumb-512.avif
          git add apps/web/public/dish-images/masala-dosa-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/dosa.md
          git diff --cached --quiet && exit 0
          git commit -m "[dosa-photo-bot] Add authentic 9504px dosa plate and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
