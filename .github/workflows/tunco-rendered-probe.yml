name: Tunco rendered probe

on:
  pull_request:
    paths:
      - ".github/workflows/tunco-rendered-probe.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker
        run: pnpm --filter @fysen/menu-worker... build

      - name: Probe Tunco rendered source
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node --input-type=module <<'NODE' > /tmp/tunco-probe.txt 2>&1
          import { BrowserMenuClient } from "./apps/menu-worker/dist/browser-client.js";
          import { extractHtmlMenu } from "./apps/menu-worker/dist/html-extractor.js";

          const source = {
            url: "https://order.ninito.no/group/tunco/st-hanshaugen",
            userAgent: "FysenMenuBot/0.1",
          };

          try {
            const fetched = await new BrowserMenuClient().fetchSource(source);
            const extracted = extractHtmlMenu(fetched.body);
            console.log(JSON.stringify({
              ok: true,
              fetched: {
                status: fetched.status,
                contentType: fetched.contentType,
                byteLength: fetched.bodyBytes.length,
                durationMs: fetched.durationMs,
              },
              extraction: {
                method: extracted.method,
                itemCount: extracted.items.length,
                items: extracted.items.slice(0, 40).map((item) => ({
                  name: item.name,
                  priceMinor: item.priceMinor,
                  sectionName: item.sectionName,
                  description: item.description,
                })),
              },
            }, null, 2));
          } catch (error) {
            console.log(JSON.stringify({
              ok: false,
              error: {
                name: error instanceof Error ? error.name : typeof error,
                message: error instanceof Error ? error.message : String(error),
                code: typeof error === "object" && error !== null && "code" in error ? error.code : null,
                httpStatus: typeof error === "object" && error !== null && "httpStatus" in error ? error.httpStatus : null,
              },
            }, null, 2));
            process.exitCode = 1;
          }
          NODE
          status=$?
          cat /tmp/tunco-probe.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Comment probe result
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_STATUS: ${{ steps.probe.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const result = fs.existsSync('/tmp/tunco-probe.txt')
              ? fs.readFileSync('/tmp/tunco-probe.txt', 'utf8').slice(0, 60000)
              : 'Probe did not produce an output file.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Tunco rendered probe\n\nStatus: ${process.env.PROBE_STATUS || 'unknown'}\n\n\`\`\`json\n${result}\n\`\`\``,
            });
            if (process.env.PROBE_STATUS !== '0') {
              core.setFailed('Tunco rendered probe failed; see PR comment for the concrete browser error.');
            }
