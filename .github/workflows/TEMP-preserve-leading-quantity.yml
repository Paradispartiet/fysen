name: TEMP preserve leading quantity

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Preserve explicit leading quantity units
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/menu-worker/src/html-source-extractor.ts')
          text = path.read_text()
          old_version = 'export const HTML_SOURCE_EXTRACTOR_VERSION = "html-v17";'
          if text.count(old_version) != 1:
              raise SystemExit(f'source version count={text.count(old_version)}')
          text = text.replace(old_version, 'export const HTML_SOURCE_EXTRACTOR_VERSION = "html-v18";', 1)

          anchor = '''const TRAILING_ALLERGEN_CODES = /\\s+\\((?:[\\p{L}\\d]{1,5}\\s*,?\\s*){1,20}\\)$/u;\n\n'''
          addition = anchor + '''const LEADING_QUANTITY_UNIT =\n  /^\\d{1,4}\\s+(?:g|gram(?:s)?|kg|ml|cl|l|stk|st|pcs?|pieces?|biter|biter\\s+av)\\b/iu;\n\n'''
          if 'const LEADING_QUANTITY_UNIT' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'quantity constant anchor count={text.count(anchor)}')
              text = text.replace(anchor, addition, 1)

          old = '''function stripMenuNumber(value: string): string {\n  return normalizeVisibleLine(value).replace(/^\\d{1,3}\\s*[.)]?\\s+/u, "").trim();\n}\n'''
          new = '''function stripMenuNumber(value: string): string {\n  const normalized = normalizeVisibleLine(value);\n  if (LEADING_QUANTITY_UNIT.test(normalized)) return normalized;\n  return normalized.replace(/^\\d{1,3}\\s*[.)]?\\s+/u, "").trim();\n}\n'''
          if text.count(old) != 1:
              raise SystemExit(f'stripMenuNumber anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('apps/menu-worker/src/html-source-extractor.test.ts')
          text = path.read_text()
          if text.count('expect(HTML_SOURCE_EXTRACTOR_VERSION).toBe("html-v17");') != 1:
              raise SystemExit('source extractor version test anchor missing')
          text = text.replace(
              'expect(HTML_SOURCE_EXTRACTOR_VERSION).toBe("html-v17");',
              'expect(HTML_SOURCE_EXTRACTOR_VERSION).toBe("html-v18");',
              1,
          )
          anchor = '''  it("does not treat an extras label as a block boundary on an unnumbered menu", () => {\n'''
          regression = '''  it("preserves an explicit leading quantity unit instead of treating it as a menu index", () => {\n    const html = `\n      <html><body>\n        <h2>BURGERS</h2>\n        <p>90 GRAM HAMBURGER</p>\n        <p>For kids and smaller appetites.</p>\n        <p>139 kr</p>\n        <p>1 Satay</p>\n        <p>Chicken satay with peanut sauce.</p>\n        <p>125 kr</p>\n      </body></html>\n    `;\n\n    const result = extractScopedHtmlMenu(html);\n    expect(result.items.map((item) => item.name)).toEqual([\n      "90 GRAM HAMBURGER",\n      "Satay",\n    ]);\n    expect(result.items.map((item) => item.priceMinor)).toEqual([13900, 12500]);\n  });\n\n''' + anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'quantity regression anchor count={text.count(anchor)}')
          text = text.replace(anchor, regression, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-source-extractor.test.ts
      - name: Commit permanent fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-source-extractor.test.ts
          git commit -m "Preserve leading menu quantities"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
