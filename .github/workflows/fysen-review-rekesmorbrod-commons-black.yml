name: Fysen review authentic Commons shrimp sandwich on black
on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths: [".github/workflows/fysen-review-rekesmorbrod-commons-black.yml","scripts/preview-rekesmorbrod-commons-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-shrimp-commons-black-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Apply verified original-pixel plate matte and create native preview
        run: python scripts/preview-rekesmorbrod-commons-black.py
      - name: Keep approval closed until visual review
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404")
          x=json.loads((p/"black-commons-review.json").read_text())
          assert x["source_dimensions"]==[5899,4000]
          assert x["derivative_dimensions"]==[5899,4000]
          assert x["source_license_verified"] is True
          assert x["derivative_requires_attribution_and_sharealike"] is True
          assert x["visual_review_completed"] is False and x["approved_for_fysen"] is False
          assert x["published"] is False
          print("Verified original, licence and preview; NOT approved or deployed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-commons-shrimp-5899-native-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-native-master.png
            assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-native-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-review.json
      - name: Commit only review files and source licensing evidence
        run: |
          rm -f assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-preview.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-native-detail-1400.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/commons/shrimp-sandwich-29796272404/black-commons-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-commons-black-bot] Stage verified 5899px plate matte for visual review"
          git push origin HEAD:"$GITHUB_REF_NAME"
