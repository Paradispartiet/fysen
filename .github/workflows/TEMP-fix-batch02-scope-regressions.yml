name: TEMP fix Batch 02 scope regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Apply guarded regression correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Restore the original v17 standalone selection. The later coverage guard
          # was disproven by live A/B and breaks direct-heading/bilingual recovery.
          path = Path('apps/menu-worker/src/html-source-extractor.ts')
          text = path.read_text()
          old = '''  const standalone = extractStandalonePriceBlocks(visibleText, scopedText.headingLevels);\n  const standaloneQualifies =\n    standalone.priceCount >= 3 &&\n    standalone.items.length >= 3 &&\n    standalone.items.length * 4 >= standalone.priceCount * 3;\n\n  const scoped = extractHtmlMenu(syntheticHtmlFromVisibleText(visibleText));\n'''
          new = '''  const standalone = extractStandalonePriceBlocks(visibleText, scopedText.headingLevels);\n  if (\n    standalone.priceCount >= 3 &&\n    standalone.items.length >= 3 &&\n    standalone.items.length * 4 >= standalone.priceCount * 3\n  ) {\n    return {\n      items: standalone.items,\n      method: "html_heuristic",\n      visibleText,\n    };\n  }\n\n  const scoped = extractHtmlMenu(syntheticHtmlFromVisibleText(visibleText));\n'''
          if old not in text:
              raise SystemExit('source-extractor coverage guard anchor missing')
          text = text.replace(old, new, 1)
          obsolete = '''  if (standaloneQualifies && standalone.items.length > recovered.length) {\n    return {\n      items: standalone.items,\n      method: "html_heuristic",\n      visibleText,\n    };\n  }\n'''
          if obsolete not in text:
              raise SystemExit('source-extractor delayed standalone anchor missing')
          text = text.replace(obsolete, '', 1)
          path.write_text(text)

          # 2) Keep safe v5 section-evidence semantics, but version the correction as v7.
          path = Path('apps/menu-worker/src/html-text-section-scope.ts')
          text = path.read_text()
          if 'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v6";' not in text:
              raise SystemExit('text-section-scope version anchor missing')
          text = text.replace(
              'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v6";',
              'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v7";',
              1,
          )
          allergen_const = '''const TRAILING_ITEM_ALLERGEN_CODES =\n  /\\s+\\((?:[\\p{L}\\d]{1,5}\\s*(?:[,/+ ]\\s*)?){1,20}\\)$/u;\n'''
          if allergen_const not in text:
              raise SystemExit('trailing item allergen constant missing')
          text = text.replace(allergen_const, '', 1)
          old = '''function lineReferencesItem(line: string, itemName: string): boolean {\n  const evidenceLine = normalizeLine(line)\n    .replace(TRAILING_ITEM_ALLERGEN_CODES, "")\n    .trim();\n  const normalizedLine = normalizeDishName(evidenceLine);\n  const normalizedName = normalizeDishName(itemName);\n'''
          new = '''function lineReferencesItem(line: string, itemName: string): boolean {\n  const normalizedLine = normalizeDishName(line);\n  const normalizedName = normalizeDishName(itemName);\n'''
          if old not in text:
              raise SystemExit('lineReferencesItem v6 anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 3) Move misspelled cappuccino handling into the beverage-name filter,
          # and make full-page beverage evidence provenance-aware.
          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()
          old_regex = '(?:coffee|kaffe|espresso|americano|cappuccino|latte|tea|te)'
          new_regex = '(?:coffee|kaffe|espresso|americano|cappuccino|capuccino|cuppucino|latte|tea|te)'
          if old_regex not in text:
              raise SystemExit('beverage coffee regex anchor missing')
          text = text.replace(old_regex, new_regex, 1)
          if 'export const HTML_BEVERAGE_FILTER_VERSION = "beverage-v7";' not in text:
              raise SystemExit('beverage version anchor missing')
          text = text.replace(
              'export const HTML_BEVERAGE_FILTER_VERSION = "beverage-v7";',
              'export const HTML_BEVERAGE_FILTER_VERSION = "beverage-v8";',
              1,
          )

          anchor = '''function mergeMissingRecoveredItems(\n  items: readonly MenuObservedItem[],\n  recovered: readonly MenuObservedItem[],\n): readonly MenuObservedItem[] {\n'''
          helper = '''function scopedVisibleTextReferencesItem(\n  item: MenuObservedItem,\n  scopedVisibleText: string,\n): boolean {\n  const normalizedName = normalizeDishName(item.name);\n  if (!normalizedName) return false;\n  return scopedVisibleText\n    .split("\\n")\n    .map((line) => normalizeDishName(line))\n    .some(\n      (line) =>\n        line === normalizedName ||\n        line.startsWith(`${normalizedName} `),\n    );\n}\n\nexport function filterHtmlItemsByBeverageProvenance(\n  items: readonly MenuObservedItem[],\n  scopedVisibleText: string,\n  fullVisibleText: string,\n): readonly MenuObservedItem[] {\n  const scopedItems = filterPlainTextBeverageSectionItems(\n    items,\n    scopedVisibleText,\n  );\n  if (scopedItems.length === 0) return scopedItems;\n\n  const scopedEvidenceItems: MenuObservedItem[] = [];\n  const recoveryOnlyItems: MenuObservedItem[] = [];\n  for (const item of scopedItems) {\n    if (scopedVisibleTextReferencesItem(item, scopedVisibleText)) {\n      scopedEvidenceItems.push(item);\n    } else {\n      recoveryOnlyItems.push(item);\n    }\n  }\n\n  const recoveryOnlyFiltered = filterPlainTextBeverageSectionItems(\n    recoveryOnlyItems,\n    fullVisibleText,\n  );\n  return [...scopedEvidenceItems, ...recoveryOnlyFiltered].sort(\n    (left, right) => left.position - right.position,\n  );\n}\n\n''' + anchor
          if 'export function filterHtmlItemsByBeverageProvenance' not in text:
              if anchor not in text:
                  raise SystemExit('beverage provenance helper anchor missing')
              text = text.replace(anchor, helper, 1)

          old = '''    const beverageScopedItems =\n      extracted.method === "html_heuristic"\n        ? filterPlainTextBeverageSectionItems(canonicalItems, fullVisibleText)\n        : canonicalItems;\n'''
          new = '''    const beverageScopedItems =\n      extracted.method === "html_heuristic"\n        ? filterHtmlItemsByBeverageProvenance(\n            canonicalItems,\n            extracted.visibleText,\n            fullVisibleText,\n          )\n        : canonicalItems;\n'''
          if old not in text:
              raise SystemExit('runtime full-page beverage block missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # 4) Update regression tests to lock the safer responsibility split.
          path = Path('apps/menu-worker/src/batch02-output-cleanup.test.ts')
          text = path.read_text()
          old_imports = '''import { filterPlainTextBeverageSectionItems } from "./html-text-section-scope.js";\nimport { extractMenuSource } from "./menu-source-runtime.js";\n'''
          new_imports = '''import {\n  extractMenuSource,\n  filterHtmlItemsByBeverageProvenance,\n} from "./menu-source-runtime.js";\n'''
          if old_imports not in text:
              raise SystemExit('batch02 beverage imports anchor missing')
          text = text.replace(old_imports, new_imports, 1)
          old_test = '''  it("matches beverage evidence after trailing allergen codes are removed from the item name", () => {\n    const items = [item("Kulfi", 12900), item("CUPPUCINO", 5500)];\n    const visibleText = `\n      DESSERT\n      KULFI (M, N)\n      129\n      KAFFE / COFFEE\n      CUPPUCINO (M)\n      55\n    `;\n    expect(\n      filterPlainTextBeverageSectionItems(items, visibleText).map((entry) => entry.name),\n    ).toEqual(["Kulfi"]);\n  });\n\n'''
          new_test = '''  it("filters common cappuccino misspellings at the beverage-name boundary", async () => {\n    const html = `\n      <html><body>\n        <h2>DESSERT</h2>\n        <div><h3>KULFI</h3><p>129</p></div>\n        <h2>KAFFE / COFFEE</h2>\n        <div><h3>CUPPUCINO</h3><p>55</p></div>\n      </body></html>\n    `;\n    const extracted = await extractMenuSource("html", fetchedHtml(html));\n    expect(extracted.items.map((entry) => entry.name)).toEqual(["KULFI"]);\n  });\n\n  it("keeps food-scoped provenance while filtering recovery-only full-page drinks", () => {\n    const items = [\n      item("Hummus", 11900),\n      item("Thomas Henry Ginger Ale", 4900),\n    ];\n    const scopedVisibleText = `\n      Hummus (M)\n      119\n    `;\n    const fullVisibleText = `\n      DRINKS\n      Hummus (M)\n      119\n      Thomas Henry Ginger Ale\n      49\n    `;\n    expect(\n      filterHtmlItemsByBeverageProvenance(\n        items,\n        scopedVisibleText,\n        fullVisibleText,\n      ).map((entry) => entry.name),\n    ).toEqual(["Hummus"]);\n  });\n\n'''
          if old_test not in text:
              raise SystemExit('batch02 allergen beverage test anchor missing')
          text = text.replace(old_test, new_test, 1)
          path.write_text(text)

          path = Path('apps/menu-worker/src/menu-source-runtime-version.test.ts')
          text = path.read_text()
          if 'expect(HTML_BEVERAGE_FILTER_VERSION).toBe("beverage-v7");' not in text:
              raise SystemExit('beverage version test anchor missing')
          text = text.replace(
              'expect(HTML_BEVERAGE_FILTER_VERSION).toBe("beverage-v7");',
              'expect(HTML_BEVERAGE_FILTER_VERSION).toBe("beverage-v8");',
              1,
          )
          if 'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v6");' not in text:
              raise SystemExit('scope version test anchor missing')
          text = text.replace(
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v6");',
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v7");',
              1,
          )
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/batch02-output-cleanup.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/batch02-output-cleanup.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
          git commit -m "Protect scoped menu evidence in Batch 02 cleanup"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
