name: TEMP current catalog baseline

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/TEMP-current-catalog-baseline.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Isolate current baseline manifests
        working-directory: apps/menu-worker
        shell: bash
        run: |
          rm -rf research/current-baseline
          mkdir -p research/current-baseline
          node --input-type=module <<'NODE'
          import { readdir, readFile, copyFile } from 'node:fs/promises';
          const targets = new Set([
            '1947-gandhi-majorstuen-oslo',
            'habibi-mollergata-oslo',
            'mathus-chicken-vestli-oslo',
          ]);
          for (const file of (await readdir('catalog')).filter((name) => name.endsWith('.json'))) {
            const manifest = JSON.parse(await readFile(`catalog/${file}`, 'utf8'));
            if (targets.has(manifest.restaurant.slug)) {
              await copyFile(`catalog/${file}`, `research/current-baseline/${file}`);
              targets.delete(manifest.restaurant.slug);
            }
          }
          if (targets.size) throw new Error(`Missing targets: ${[...targets].join(', ')}`);
          NODE

      - name: Validate current main baseline
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/current-baseline | tee research/current-baseline.json
          status=${PIPESTATUS[0]}
          echo "baseline exit=${status}"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-catalog-baseline
          path: apps/menu-worker/research/current-baseline.json
          if-no-files-found: error
