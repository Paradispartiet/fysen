name: Fysen inspect black-background native tiramisu photo
on:
  push:
    branches: [art/tiramisu-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-tiramisu.yml"
      - "scripts/preview-tiramisu-black.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-tiramisu-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-pixel masking libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Download source-verified original from previous successful staging
        uses: actions/download-artifact@v4
        with:
          name: fysen-tiramisu-originals
          run-id: 44712212323
          github-token: ${{ github.token }}
          path: /tmp/fysen-tiramisu-originals
      - name: Create two natural black preview variants from source pixels
        run: python scripts/preview-tiramisu-black.py
      - name: Retain all candidates unapproved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate")
          d=json.loads((p/"black-review.json").read_text())
          assert d["original_dimensions"]==[6240,4160]
          assert not d["native_pixels_upscaled"] and not d["food_pixels_generated"]
          assert not d["approved_for_fysen"] and not d["published"]
          for name in ["black-contour","black-grabcut"]:
              assert (p/f"{name}-native-detail-1400.jpg").is_file()
          print("Preview only, not approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tiramisu-black-preview
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-native.png
            assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-preview.jpg
            assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-review.json
      - name: Commit only lightweight previews to draft PR
        run: |
          rm -f assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-native.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-preview.jpg
          git add assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-*-native-detail-1400.jpg
          git add assets/fysen-image-candidates/tiramisu/tiramisu-mint-plate/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[tiramisu-preview-bot] Stage native black dessert visual review"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
