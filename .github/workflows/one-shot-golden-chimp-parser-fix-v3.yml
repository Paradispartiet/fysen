name: TEMP rerun direct-priced food title fix v3

on:
  push:
    branches: [agent/batch02-residual-output-cleanup-v3]
    paths:
      - ".github/workflows/one-shot-golden-chimp-parser-fix-v3.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm --filter @fysen/menu-worker... build
      - name: Apply exact reviewed parser patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-shot-golden-chimp-parser-fix.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Focused tests before commit"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/apply-golden-chimp-fix.py').write_text(script)
          PY
          python3 /tmp/apply-golden-chimp-fix.py
          rm -f .github/workflows/one-shot-golden-chimp-parser-fix-v2.yml
          rm -f .github/workflows/one-shot-golden-chimp-parser-fix-v3.yml
      - name: Focused parser regression tests
        working-directory: apps/menu-worker
        run: |
          pnpm exec vitest run \
            src/html-description-title-recovery.test.ts \
            src/html-source-extractor.test.ts \
            src/html-text-section-scope.test.ts \
            src/menu-source-runtime-version.test.ts
          pnpm typecheck
      - name: Commit permanent parser changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Recover directly priced long food titles safely"
          git push origin HEAD:agent/batch02-residual-output-cleanup-v3
