name: Fysen promote reviewed gyoza native photo (draft only)
on:
  push:
    branches: [art/gyoza-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-gyoza.yml"
      - "scripts/promote-reviewed-gyoza.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-gyoza-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo and AVIF tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Regenerate SHA-locked visual photo; create native 4937px master and 512px mini
        run: python scripts/promote-reviewed-gyoza.py
      - name: ONLY run focused Matlyst gallery and full-native photo tests
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check dimensions, source claims, and unpublished approval state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==17
          p=next(x for x in m["images"] if x["id"]=="gyoza")
          assert p["kind"]=="Redaksjonelt rettfoto"
          assert p["atlas"]=="gyoza-thumb-512.avif"
          assert p["largeSource"]=="gyoza-master-4937.avif"
          assert p["photoSource"]=="https://www.pexels.com/photo/delicious-fried-dumplings-with-soy-sauce-dip-35583239/"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "Lara Bellens / Pexels" in p["photoCredit"]
          with Image.open(root/p["atlas"]) as im: assert im.size==(512,512)
          with Image.open(root/p["largeSource"]) as im: assert im.size==(4937,3662)
          audit=json.loads(Path("assets/fysen-image-candidates/gyoza/lara-bellens-pexels/black-review.json").read_text())
          assert audit["reviewed_variant"]=="black-grabcut"
          assert audit["approved_for_fysen"] is True
          assert audit["published"] is False
          print("17/44 reviewed photos in unpublished PR chain; NO production deployment.")
          PY
      - name: Commit ONLY photo assets, licenses, gallery and focused test edits to draft PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/gyoza.png
          git add assets/fysen-image-candidates/gyoza/lara-bellens-pexels/review.json
          git add assets/fysen-image-candidates/gyoza/lara-bellens-pexels/black-review.json
          git add apps/web/public/dish-images/gyoza-master-4937.avif
          git add apps/web/public/dish-images/gyoza-thumb-512.avif
          git add apps/web/public/dish-images/gyoza-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/gyoza.md
          git diff --cached --quiet && exit 0
          git commit -m "[gyoza-photo-bot] Add source-locked 4937px and 512px photo (draft only)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
