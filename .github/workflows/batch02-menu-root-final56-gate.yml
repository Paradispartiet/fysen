name: TEMP Batch 02 menu-root final 56 gate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-menu-root-final56-gate.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-menu-root-final56-gate
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Prove published-refresh fail-closed safety contract
        run: pnpm --filter @fysen/menu-worker exec vitest run src/onboarding-refresh-safety.test.ts src/catalog-onboarding-failure-policy.test.ts src/production-menu-mutation-workflow.test.ts
      - name: Validate current 56 catalog serially
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p research
          node --input-type=module <<'NODE'
          import {readdir,readFile} from 'node:fs/promises';
          const files=(await readdir('catalog')).filter((x)=>x.endsWith('.json'));
          const slugs=[];
          for(const file of files) slugs.push(JSON.parse(await readFile(`catalog/${file}`,'utf8')).restaurant.slug);
          if(files.length!==56||new Set(slugs).size!==56) throw new Error(`Catalog=${files.length}/${new Set(slugs).size}; expected 56/56`);
          NODE
          set +e
          node dist/index.js validate:batch catalog | tee research/final56-primary.json
          exit 0
      - name: Build transport/action-only retry set
        id: retryset
        working-directory: apps/menu-worker
        shell: bash
        run: |
          rm -rf research/final56-retry && mkdir -p research/final56-retry
          node --input-type=module <<'NODE'
          import {readdir,readFile,writeFile} from 'node:fs/promises';
          const primary=JSON.parse(await readFile('research/final56-primary.json','utf8'));
          const allowed=new Set(['transport','action']);
          const retryable=[]; const nonRetryable=[];
          for(const r of (primary.results??[]).filter((x)=>!x.accepted)){
            const families=r.failureFamilies??[];
            const row={slug:r.slug,failureFamilies:families,error:r.error??null,menuError:r.validation?.menu?.error??null,itemCount:r.validation?.menu?.quality?.itemCount??null};
            (families.length>0&&families.every((f)=>allowed.has(f))?retryable:nonRetryable).push(row);
          }
          const retrySlugs=new Set(retryable.map((x)=>x.slug)); let copied=0;
          for(const file of (await readdir('catalog')).filter((x)=>x.endsWith('.json'))){
            const raw=await readFile(`catalog/${file}`,'utf8'); const m=JSON.parse(raw);
            if(!retrySlugs.has(m.restaurant.slug)) continue;
            await writeFile(`research/final56-retry/${file}`,raw); copied++;
          }
          if(copied!==retryable.length) throw new Error(`retry manifest mismatch ${copied}/${retryable.length}`);
          await writeFile('research/final56-retryset.json',JSON.stringify({retryable,nonRetryable},null,2)+'\n');
          await writeFile(process.env.GITHUB_OUTPUT,`retry_count=${retryable.length}\n`,{flag:'a'});
          NODE
      - name: Retry transport/action-only failures
        if: steps.retryset.outputs.retry_count != '0'
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/final56-retry | tee research/final56-retry-results.json
          exit 0
      - name: Empty retry result
        if: steps.retryset.outputs.retry_count == '0'
        working-directory: apps/menu-worker
        run: printf '%s\n' '{"manifestCount":0,"acceptedCount":0,"failedCount":0,"results":[]}' > research/final56-retry-results.json
      - name: Gate combined 56 catalog evidence
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const p=JSON.parse(await readFile('research/final56-primary.json','utf8'));
          const s=JSON.parse(await readFile('research/final56-retryset.json','utf8'));
          const r=JSON.parse(await readFile('research/final56-retry-results.json','utf8'));
          const accepted=new Set((p.results??[]).filter((x)=>x.accepted).map((x)=>x.slug));
          for(const x of r.results??[]) if(x.accepted) accepted.add(x.slug);
          const unresolved=(r.results??[]).filter((x)=>!x.accepted).map((x)=>x.slug);
          const summary={revision:'8f22a74298f34fbb7f9e9b1c3a9745533b00d654',primaryAccepted:p.acceptedCount,primaryFailed:p.failedCount,retryable:s.retryable,nonRetryable:s.nonRetryable,retryAccepted:r.acceptedCount,retryFailed:r.failedCount,combinedAccepted:accepted.size,unresolved};
          await writeFile('research/final56-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(s.nonRetryable.length) throw new Error(`Non-retryable failures ${JSON.stringify(s.nonRetryable)}`);
          if(unresolved.length) throw new Error(`Unresolved retry failures ${JSON.stringify(unresolved)}`);
          if(accepted.size!==56) throw new Error(`Combined catalog=${accepted.size}/56`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-menu-root-final56-gate
          path: |
            apps/menu-worker/research/final56-primary.json
            apps/menu-worker/research/final56-retryset.json
            apps/menu-worker/research/final56-retry-results.json
            apps/menu-worker/research/final56-summary.json
          if-no-files-found: error
