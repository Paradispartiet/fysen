name: Publish Fysen public restaurant map
on:
  push:
    branches: [main]
    paths:
      - "apps/menu-worker/catalog/**"
      - "apps/web/scripts/generate-restaurant-coordinates.mjs"
      - "apps/web/scripts/export-restaurant-map.mjs"
      - "apps/web/tests/restaurant-map-export.test.mjs"
      - ".github/workflows/publish-fysen-restaurant-map.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-public-restaurant-map
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test and export public catalog coordinates
        run: |
          node --test apps/web/tests/restaurant-map-export.test.mjs
          node apps/web/scripts/export-restaurant-map.mjs "$GITHUB_SHA" "$RUNNER_TEMP/restaurants.json"
      - name: Publish isolated map-data branch without deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ref=refs/heads/fysen-public-restaurant-map
          previous="$(git ls-remote origin "$ref" | cut -f1)"
          parents=()
          if [[ -n "$previous" ]]; then
            git fetch --no-tags origin "$ref"
            parents=(-p "$previous")
          fi
          blob="$(git hash-object -w "$RUNNER_TEMP/restaurants.json")"
          tree="$(printf '100644 blob %s\trestaurants.json\n' "$blob" | git mktree)"
          commit="$(printf 'data: public restaurant map from %s\n' "$GITHUB_SHA" | git commit-tree "$tree" "${parents[@]}")"
          git push origin "$commit:$ref"
