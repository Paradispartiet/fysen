name: Semeny HTTP diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/semeny-http-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe current menu markup
        shell: bash
        run: |
          set -euo pipefail
          url="https://semeny.no/public/sted/4558fish"
          curl --fail-with-body -LsS --max-time 25 \
            -A 'FysenMenuBot/0.1' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: nb-NO,nb;q=0.9,en;q=0.7' \
            -o /tmp/semeny.html \
            "$url"
          python3 - <<'PY'
          from pathlib import Path
          html = Path('/tmp/semeny.html').read_text(encoding='utf-8', errors='replace')
          print('bytes=', len(html.encode('utf-8')))
          for needle in ('Våruller', 'Sushi Mix 15', '69', '225'):
              i = html.find(needle)
              print(f'=== {needle!r} at {i} ===')
              if i >= 0:
                  print(html[max(0, i-900):i+1400])
          PY
