name: Semeny HTTP diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/semeny-http-diagnostic.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe rendered menu delivery
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://semeny.no/public/sted/4558fish"
            "https://www.meny.semeny.no/public/sted/4558fish"
            "https://meny.semeny.no/public/sted/4558fish"
          )
          agents=(
            "FysenMenuBot/0.1"
            "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36"
          )
          for url in "${urls[@]}"; do
            for ua in "${agents[@]}"; do
              echo "=== $url :: $ua ==="
              rm -f /tmp/semeny.html /tmp/semeny.headers
              meta="$(curl --fail-with-body -LsS --max-time 25 \
                -A "$ua" \
                -H 'Accept: text/html,application/xhtml+xml' \
                -H 'Accept-Language: nb-NO,nb;q=0.9,en;q=0.7' \
                -D /tmp/semeny.headers \
                -o /tmp/semeny.html \
                -w 'status=%{http_code} final=%{url_effective} bytes=%{size_download}' \
                "$url")"
              echo "$meta"
              echo "vaaruller=$(grep -Foc 'Våruller' /tmp/semeny.html || true) sushi_mix=$(grep -Foc 'Sushi Mix 15' /tmp/semeny.html || true)"
              echo "scripts=$(grep -Eo '<script[^>]+src=[^ >]+' /tmp/semeny.html | head -n 12 | tr '\n' ' ' || true)"
              echo "api_refs=$(grep -Eo 'https://[^\"'"'"' <]+' /tmp/semeny.html | grep -Ei '(api|menu|meny|supabase|firebase)' | head -n 20 | tr '\n' ' ' || true)"
              echo "markers=$(grep -Eo '(__NEXT_DATA__|__NUXT__|_next/static|vite|supabase|firebase|graphql|api/)' /tmp/semeny.html | sort -u | tr '\n' ' ' || true)"
            done
          done
