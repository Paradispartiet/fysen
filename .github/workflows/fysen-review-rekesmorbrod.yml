name: Fysen review native black shrimp sandwich

on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-rekesmorbrod.yml"
      - "scripts/preview-rekesmorbrod-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-rekesmorbrod-black-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image support
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Generate reviewed image using only native food pixels
        run: python scripts/preview-rekesmorbrod-black.py
      - name: Verify proof stays review-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/rekesmorbrod/40853857")
          x=json.loads((p/"black-review.json").read_text())
          assert x["review_native_size"]==[3950,3340]
          assert x["approved_for_fysen"] is False
          assert x["visual_review_completed"] is False
          assert x["published"] is False
          assert (p/"black-native-detail-1400.jpg").exists()
          print("Full-resolution photo staged for human review; public app unchanged")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-shrimp-sandwich-native-black-review
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-native-master.png
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-native-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-review.json
      - name: Commit only source proof and reviews to PR
        run: |
          rm -f assets/fysen-image-candidates/rekesmorbrod/40853857/black-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-preview.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-preview-bot] Preview native shrimp sandwich in black"
          git push origin HEAD:"$GITHUB_REF_NAME"
