name: Fysen black preview alternatives for Commons prosciutto pizza
on:
  push:
    branches: [art/pizza-prosciutto-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-preview-prosciutto-commons.yml"
      - "scripts/preview-prosciutto-commons-black.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-prosciutto-commons-black-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install exact image libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reuse verified source from completed staging run (no new Wikimedia request)
        uses: actions/download-artifact@v4
        with:
          name: fysen-prosciutto-commons-originals
          run-id: 44607744351
          github-token: ${{ github.token }}
          path: /tmp/fysen-commons-originals
      - name: Preserve full-native pizza pixels, generate two black-preview masks
        run: python scripts/preview-prosciutto-commons-black.py
      - name: Confirm no food generation or publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok")
          d=json.loads((root/"black-alternatives-review.json").read_text())
          assert d["original_dimensions"]==[3949,2920]
          assert d["food_pixels_upscaled"] is False and d["synthetic_food_generated"] is False
          assert d["approved_for_fysen"] is False and d["published"] is False
          for mode in ["black-polygon","black-grabcut"]:
              assert (root/f"{mode}-native-detail-1400.jpg").is_file()
          print("Black variants generated but still NOT approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-prosciutto-commons-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-native-master.png
            assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-preview.jpg
            assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-alternatives-review.json
      - name: Commit small previews and metadata to PR only
        run: |
          rm -f assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-preview.jpg
          git add assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-*-native-detail-1400.jpg
          git add assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-alternatives-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[prosciutto-commons-preview-bot] Stage black source alternatives without approval"
          git push origin HEAD:"$GITHUB_REF_NAME"
