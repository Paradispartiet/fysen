name: Fysen promote approved 7364px ramen photo
on:
  push:
    branches: [art/ramen-native-black-master-20261119]
    paths: [".github/workflows/fysen-promote-ramen.yml", "scripts/promote-reviewed-ramen.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-promote-reviewed-ramen-photo
  cancel-in-progress: false
jobs:
  promote-reviewed-ramen:
    if: "!contains(github.event.head_commit.message, '[ramen-promote-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AVIF, image and segmentation codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless
      - name: Produce source-verified, isolated ramen photo
        run: python scripts/promote-reviewed-ramen.py
      - name: Test full-size provenance and compact gallery
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/home-discovery-refresh.test.mjs
      - name: Save lightweight review preview
        uses: actions/upload-artifact@v4
        with:
          name: fysen-ramen-reviewed-black-preview
          path: assets/fysen-image-candidates/ramen-alternatives/35773142/reviewed-black-preview.jpg
          retention-days: 7
      - name: Commit approved original, AVIF, thumbnail and exact provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/ramen.png apps/web/public/dish-images/ramen-master-7364.avif apps/web/public/dish-images/ramen-thumb-512.avif apps/web/public/dish-images/manifest.json docs/fysen-image-reviews/ramen.md
          git diff --cached --quiet && exit 0
          git commit -m "[ramen-promote-bot] Integrate native 7364px ramen photo with dedicated thumbnail"
          git push origin HEAD:"$GITHUB_REF_NAME"
