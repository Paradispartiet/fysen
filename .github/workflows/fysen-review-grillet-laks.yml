name: Fysen review native black grilled salmon

on:
  push:
    branches: [art/grillet-laks-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-grillet-laks.yml"
      - "scripts/preview-grillet-laks-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-grillet-laks-black-review
  cancel-in-progress: false
jobs:
  black-source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image processing
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
      - name: Make review-only salmon photos from SHA-locked native originals
        run: python scripts/preview-grillet-laks-black.py
      - name: Confirm source and no public publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for photo_id in ("29149758","31043029"):
              p=Path("assets/fysen-image-candidates/grillet-laks")/photo_id
              x=json.loads((p/"black-review.json").read_text())
              assert min(x["review_native_size"])>=3000
              assert x["visual_review_completed"] is False
              assert x["approved_for_fysen"] is False
              assert x["published"] is False
              assert (p/"black-native-detail-1400.jpg").exists()
          print("Black salmon candidates ready for visual review only")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-grillet-laks-black-native-review
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/fysen-image-candidates/grillet-laks/*/black-native-master.png
            assets/fysen-image-candidates/grillet-laks/*/black-preview.jpg
            assets/fysen-image-candidates/grillet-laks/*/black-native-detail-1400.jpg
            assets/fysen-image-candidates/grillet-laks/*/black-review.json
      - name: Commit small reviews only
        run: |
          find assets/fysen-image-candidates/grillet-laks -name black-native-master.png -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/grillet-laks
          git diff --cached --quiet && exit 0
          git commit -m "[salmon-preview-bot] Stage native salmon black-background comparisons"
          git push origin HEAD:"$GITHUB_REF_NAME"
