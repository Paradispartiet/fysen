name: Fysen Android installable test APK

# Build one QA APK on Android-workflow edits. Also produce a new exact-main
# installable APK when the native app config changes (e.g., a tablet release).
# Ordinary app UI PRs remain opt-in via workflow_dispatch to save CI minutes.
# No paid Expo, Google Play, or Apple account is required.
on:
  pull_request:
    paths:
      - ".github/workflows/native-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/app.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fysen-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Fysen
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Setup Java for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -d "${ANDROID_HOME:?}/platforms"
          test -d "$ANDROID_HOME/build-tools"
          echo "Using GitHub runner's preinstalled Android SDK: $ANDROID_HOME"

      - name: Build shared API types
        run: pnpm --filter @fysen/contracts build

      - name: Generate native Android project
        working-directory: apps/mobile
        env:
          CI: "1"
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Assemble standalone release-mode APK with debug signing
        working-directory: apps/mobile/android
        env:
          CI: "1"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK is installable and bundles app code
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/index.android.bundle'
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          test -n "$build_tools"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='no.fysen.app'"
          echo "APK is a signed, standalone Android QA artifact for no.fysen.app (debug credentials, not store distribution)." >> "$GITHUB_STEP_SUMMARY"

      - name: Record exact source used for QA
        env:
          FYSEN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          release_dir="apps/mobile/android/app/build/outputs/apk/release"
          cat > "$release_dir/qa-build-info.txt" <<EOF
          Fysen Native Android QA
          Source commit: $FYSEN_SOURCE_SHA
          CI checkout: $(git rev-parse HEAD)
          GitHub run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Package: no.fysen.app
          Signing: debug key (QA only; not Google Play)
          EOF
          cat "$release_dir/qa-build-info.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable Android QA APK
        uses: actions/upload-artifact@v4
        with:
          name: fysen-android-qa-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/qa-build-info.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
