name: Fysen iPhone simulator smoke

# Run for actual native UI changes, not documentation-only PRs.
# No Apple Developer account or signing identity is used.
on:
  pull_request:
    paths:
      - ".github/workflows/native-ios-simulator.yml"
      - "apps/mobile/App.tsx"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "packages/contracts/src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fysen-ios-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      CI: "1"
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - name: Checkout Fysen
        uses: actions/checkout@v4

      - name: Show Apple toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Setup canonical workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build shared Fysen types
        run: pnpm --filter @fysen/contracts build

      - name: Generate native iOS simulator project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build standalone Release iPhone simulator app (unsigned)
        working-directory: apps/mobile
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Fysen.xcworkspace \
            -scheme Fysen \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/fysen-ios-xcodebuild.log

      - name: Check embedded JavaScript and run in iPhone simulator
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          app="ios/build/Build/Products/Release-iphonesimulator/Fysen.app"
          test -d "$app"
          test -s "$app/main.jsbundle"
          test -f "$app/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          test "$bundle_id" = "no.fysen.app"
          device="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"],text=True))
          devices=[d for entries in data["devices"].values() for d in entries if d["name"].startswith("iPhone") and d["isAvailable"]]
          if not devices: raise SystemExit("No available iPhone simulator")
          print(devices[0]["udid"])
          PY
          )"
          echo "Testing iPhone simulator $device"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$app"

          # CoreSimulator may otherwise show "Open in Fysen?" and keep the
          # screenshot on a confirmation alert rather than navigating.
          # This is an isolated, throwaway CI simulator preference only.
          approval="$HOME/Library/Developer/CoreSimulator/Devices/$device/data/Library/Preferences/com.apple.launchservices.schemeapproval.plist"
          mkdir -p "$(dirname "$approval")"
          # Python plistlib creates a valid plist without plutil's missing-input
          # failure. Launch Services uses the exact bridge-->scheme key.
          python3 - "$approval" "$bundle_id" <<'PY'
          import pathlib, plistlib, sys
          path = pathlib.Path(sys.argv[1])
          path.parent.mkdir(parents=True, exist_ok=True)
          with path.open("wb") as output:
              plistlib.dump({"com.apple.CoreSimulator.CoreSimulatorBridge-->fysen": sys.argv[2]}, output)
          with path.open("rb") as inp:
              assert plistlib.load(inp)["com.apple.CoreSimulator.CoreSimulatorBridge-->fysen"] == sys.argv[2]
          PY
          echo "Simulator scheme approval set for fysen -> $bundle_id"
          xcrun simctl launch "$device" "$bundle_id"
          sleep 10
          xcrun simctl io "$device" screenshot ios/fysen-iphone-smoke.png
          test -s ios/fysen-iphone-smoke.png

          # Open native tabs through the app's own URL scheme; no gesture automation needed.
          xcrun simctl openurl "$device" "fysen://matlyst"
          sleep 10
          xcrun simctl io "$device" screenshot ios/fysen-iphone-matlyst.png
          test -s ios/fysen-iphone-matlyst.png

          # The first custom-scheme dispatch after a fresh CoreSimulator boot
          # can arrive before the app is ready to handle the URL. The observed
          # failure in #1022 showed identical Search/Matlyst screenshots, while
          # the following search and favorites links reached the correct tabs.
          # Retry only that first transition, never waive the visual assertion.
          mkdir -p ios/qa-content
          for screen in smoke matlyst; do
            sips --cropToHeightWidth 1700 1080 \
              "ios/fysen-iphone-$screen.png" \
              --out "ios/qa-content/$screen.png" >/dev/null
          done
          if cmp -s ios/qa-content/smoke.png ios/qa-content/matlyst.png; then
            echo "::warning::First Matlyst deep link did not change app content; retrying once after simulator warm-up."
            xcrun simctl openurl "$device" "fysen://matlyst"
            sleep 10
            xcrun simctl io "$device" screenshot ios/fysen-iphone-matlyst.png
            test -s ios/fysen-iphone-matlyst.png
            sips --cropToHeightWidth 1700 1080 \
              ios/fysen-iphone-matlyst.png \
              --out ios/qa-content/matlyst.png >/dev/null
          fi
          if cmp -s ios/qa-content/smoke.png ios/qa-content/matlyst.png; then
            echo "::error::Matlyst did not replace Search after the initial delivery and one retry."
            exit 1
          fi

          xcrun simctl openurl "$device" "fysen://search?q=ramen"
          sleep 10
          xcrun simctl io "$device" screenshot ios/fysen-iphone-search-results.png
          test -s ios/fysen-iphone-search-results.png
          xcrun simctl openurl "$device" "fysen://favorites"
          sleep 5
          xcrun simctl io "$device" screenshot ios/fysen-iphone-favorites.png
          test -s ios/fysen-iphone-favorites.png

          # The clock and status icons can change even if the app is frozen
          # behind a confirmation dialog. Compare the central APP CONTENT,
          # not entire screenshots. sips is available on macOS runners.
          mkdir -p ios/qa-content
          for screen in smoke matlyst search-results favorites; do
            sips --cropToHeightWidth 1700 1080 \
              "ios/fysen-iphone-$screen.png" \
              --out "ios/qa-content/$screen.png" >/dev/null
          done
          if cmp -s ios/qa-content/smoke.png ios/qa-content/matlyst.png; then
            echo "::error::Matlyst still shows the initial search screen."
            exit 1
          fi
          if cmp -s ios/qa-content/matlyst.png ios/qa-content/search-results.png; then
            echo "::error::Matlyst and search have the same app content: URL navigation may be blocked."
            exit 1
          fi
          if cmp -s ios/qa-content/search-results.png ios/qa-content/favorites.png; then
            echo "::error::Favorites did not replace the search results."
            exit 1
          fi

          # Install the same native release build on a real iPad simulator.
          # This catches iPad-only startup/layout crashes; physical tablet and
          # landscape usability must still be checked before distribution.
          ipad_device="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"],text=True))
          devices=[d for entries in data["devices"].values() for d in entries if d["name"].startswith("iPad") and d["isAvailable"]]
          if not devices: raise SystemExit("No available iPad simulator")
          print(devices[0]["udid"])
          PY
          )"
          echo "Testing iPad simulator $ipad_device"
          xcrun simctl boot "$ipad_device"
          xcrun simctl bootstatus "$ipad_device" -b
          xcrun simctl install "$ipad_device" "$app"
          xcrun simctl launch "$ipad_device" "$bundle_id"
          sleep 12
          xcrun simctl io "$ipad_device" screenshot ios/fysen-ipad-portrait.png
          test -s ios/fysen-ipad-portrait.png
          echo "Unsigned native app launched on iPhone and iPad simulators. iPhone search, Matlyst and Favorites remained distinct." >> "$GITHUB_STEP_SUMMARY"

      - name: Archive simulator app (not a device IPA)
        working-directory: apps/mobile
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/apps/mobile/fysen-ios-simulator.zip" Fysen.app

      - name: Upload simulator app and screenshots for QA, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fysen-iphone-simulator-qa
          path: |
            apps/mobile/fysen-ios-simulator.zip
            apps/mobile/ios/fysen-iphone-smoke.png
            apps/mobile/ios/fysen-iphone-matlyst.png
            apps/mobile/ios/fysen-iphone-search-results.png
            apps/mobile/ios/fysen-iphone-favorites.png
            apps/mobile/ios/fysen-ipad-portrait.png
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
