name: Beijing Palace production proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/beijing-production-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi
      - name: Checkout exact proof revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build menu worker and database
        run: pnpm --filter @fysen/menu-worker... build
      - name: Reconcile exact catalog and print compact failures
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { onboardRestaurantCatalog } from './apps/menu-worker/dist/onboarding.js';
          const summary = await onboardRestaurantCatalog();
          const compact = {
            manifestCount: summary.manifestCount,
            publishedCount: summary.publishedCount,
            alreadyPublishedCount: summary.alreadyPublishedCount,
            failedCount: summary.failedCount,
            failures: summary.results
              .filter((result) => result.outcome === 'failed')
              .map((result) => ({
                slug: result.slug,
                restaurantId: result.restaurantId,
                menuSourceId: result.menuSourceId,
                itemCount: result.itemCount,
                missingRequiredDishes: result.missingRequiredDishes,
                forbiddenDishesPresent: result.forbiddenDishesPresent,
                firstWatch: result.firstWatch ? {
                  outcome: result.firstWatch.outcome,
                  httpStatus: result.firstWatch.httpStatus,
                  extractedItemCount: result.firstWatch.extractedItemCount,
                  errorCode: result.firstWatch.errorCode,
                  errorMessage: result.firstWatch.errorMessage,
                } : null,
                secondWatch: result.secondWatch ? {
                  outcome: result.secondWatch.outcome,
                  httpStatus: result.secondWatch.httpStatus,
                  extractedItemCount: result.secondWatch.extractedItemCount,
                  errorCode: result.secondWatch.errorCode,
                  errorMessage: result.secondWatch.errorMessage,
                } : null,
                warnings: result.warnings,
                error: result.error,
              })),
          };
          console.log('COMPACT_RECONCILE_RESULT=' + JSON.stringify(compact));
          if (summary.failedCount > 0) process.exit(1);
          NODE
