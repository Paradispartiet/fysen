name: Catalog4 main baseline proof

on:
  pull_request:
    paths:
      - ".github/workflows/catalog4-main-baseline-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - name: Checkout exact main baseline
        uses: actions/checkout@v4
        with:
          ref: 7564082d13d1cbe1cf1310f63e40650ae59cdd66
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Isolate four catalog manifests
        shell: bash
        run: |
          mkdir -p apps/menu-worker/research/catalog4-main-baseline
          cp apps/menu-worker/catalog/1947-gandhi-majorstuen-oslo.json apps/menu-worker/research/catalog4-main-baseline/
          cp apps/menu-worker/catalog/habibi-mollergata-oslo.json apps/menu-worker/research/catalog4-main-baseline/
          cp apps/menu-worker/catalog/mathus-chicken-vestli-oslo.json apps/menu-worker/research/catalog4-main-baseline/
          cp apps/menu-worker/catalog/viet-kitchen-bjolsen-oslo.json apps/menu-worker/research/catalog4-main-baseline/

      - name: Validate four independently on main
        id: validation
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/catalog4-main-baseline | tee research/catalog4-main-baseline.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize baseline
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const payload = JSON.parse(await readFile('research/catalog4-main-baseline.json', 'utf8'));
          const summary = {
            main: '7564082d13d1cbe1cf1310f63e40650ae59cdd66',
            exitCode: '${{ steps.validation.outputs.exit_code }}',
            manifestCount: payload.manifestCount,
            acceptedCount: payload.acceptedCount,
            failedCount: payload.failedCount,
            failureFamilyCounts: payload.failureFamilyCounts,
            results: payload.results.map((result) => ({
              slug: result.slug,
              accepted: result.accepted,
              failureFamilies: result.failureFamilies,
              itemCount: result.validation?.menu?.quality?.itemCount ?? null,
              extractorVersion: result.validation?.menu?.extractorVersion ?? null,
              observedDishNames: result.validation?.menu?.observedDishNames ?? [],
              menuError: result.validation?.menu?.error ?? null,
              error: result.error ?? null,
            })),
          };
          await writeFile('research/catalog4-main-baseline-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: catalog4-main-baseline-proof
          path: |
            apps/menu-worker/research/catalog4-main-baseline.json
            apps/menu-worker/research/catalog4-main-baseline-summary.json
          if-no-files-found: error
