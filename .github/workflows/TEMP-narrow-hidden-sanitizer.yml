name: TEMP narrow hidden DOM sanitizer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Narrow sanitizer to proven Webflow invisibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/html-extractor.ts')
          text = path.read_text()
          old = '$("[hidden], [aria-hidden=\'true\'], .w-condition-invisible").remove();'
          new = '$(".w-condition-invisible").remove();'
          if new not in text:
              if old not in text:
                  raise SystemExit('hidden sanitizer anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-extractor.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-extractor.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Narrow hidden DOM recovery sanitization"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
