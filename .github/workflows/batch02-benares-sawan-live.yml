name: Batch 02 Benares Sawan live

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Build exact Benares and Sawan plan
        shell: bash
        run: |
          rm -rf /tmp/batch02 && mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const bySlug=new Map(source.restaurants.map((x)=>[x.restaurant.slug,x]));
          const b=bySlug.get('benares-tordenskiolds-gate-oslo');
          const s=bySlug.get('sawan-president-harbitz-gate-oslo');
          if(!b||!s) throw new Error('Missing Batch 02 rows');
          const restaurants=[
            {...b,menuSource:{...b.menuSource,url:'https://benares.no/meny?menu=menu',sourceType:'html',fetchMode:'browser',sourceSupport:{redirectOrigins:[],browserDataOrigins:[]}}},
            {...s,menuSource:{...s.menuSource,url:'https://www.sawan.no/meny',sourceType:'html',fetchMode:'http',sourceSupport:{redirectOrigins:[],browserDataOrigins:[]}}},
          ];
          const plan={...source,outputDirectory:'research/benares-sawan-generated',concurrency:1,restaurants};
          await mkdir('apps/menu-worker/research/benares-sawan-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/benares-sawan.plan.json',JSON.stringify(plan,null,2)+'\n');
          NODE
      - name: Fresh intake
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/benares-sawan.plan.json | tee research/benares-sawan-intake.json
      - name: Independent validation
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/benares-sawan-generated | tee research/benares-sawan-validation.json
      - name: Summarize all observed names
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const i=JSON.parse(await readFile('research/benares-sawan-intake.json','utf8'));
          const v=JSON.parse(await readFile('research/benares-sawan-validation.json','utf8'));
          const rows=(v.results??[]).map((r)=>({slug:r.slug,accepted:r.accepted,itemCount:r.validation?.menu?.quality?.itemCount??null,extractorVersion:r.validation?.menu?.extractorVersion??null,fingerprint:r.validation?.menu?.fingerprint??null,names:r.validation?.menu?.observedDishNames??[],variants:r.validation?.menu?.observedDishVariants??[],failureFamilies:r.failureFamilies??[],error:r.error??null,menuError:r.validation?.menu?.error??null}));
          const summary={intake:{requested:i.requestedCount,generated:i.generatedCount,failed:i.failedCount},validation:{manifests:v.manifestCount,accepted:v.acceptedCount,failed:v.failedCount,rows}};
          await writeFile('research/benares-sawan-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-benares-sawan-live
          path: |
            apps/menu-worker/research/benares-sawan.plan.json
            apps/menu-worker/research/benares-sawan-intake.json
            apps/menu-worker/research/benares-sawan-validation.json
            apps/menu-worker/research/benares-sawan-summary.json
            apps/menu-worker/research/benares-sawan-generated/*.json
          if-no-files-found: warn
