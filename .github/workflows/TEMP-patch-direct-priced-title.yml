name: TEMP patch direct-priced title provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Patch direct-priced title provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          recovery_path = Path('apps/menu-worker/src/html-description-title-recovery.ts')
          text = recovery_path.read_text()
          text = text.replace(
              'export const HTML_DESCRIPTION_TITLE_RECOVERY_VERSION = "titles-v12";',
              'export const HTML_DESCRIPTION_TITLE_RECOVERY_VERSION = "titles-v13";',
              1,
          )

          anchor = '''function recoverForwardTitleFromSourceExcerpt(\n  item: MenuObservedItem,\n): SourceExcerptTitleRecovery | null {\n'''
          helper = '''function sourceExcerptDirectlyPricesObservedName(\n  item: MenuObservedItem,\n): boolean {\n  const sourceExcerpt = item.sourceExcerpt?.trim() ?? "";\n  if (!sourceExcerpt) return false;\n\n  const current = normalizeVisibleLine(item.name);\n  const foldedCurrent = current.toLocaleLowerCase("nb-NO");\n  const segments = sourceExcerpt\n    .split(SOURCE_EXCERPT_SEPARATOR)\n    .map(normalizeVisibleLine)\n    .filter(Boolean);\n\n  for (let index = 0; index < segments.length - 1; index += 1) {\n    const segment = segments[index] ?? "";\n    const foldedSegment = segment.toLocaleLowerCase("nb-NO");\n    let nameMatches = foldedSegment === foldedCurrent;\n\n    if (!nameMatches && foldedSegment.startsWith(`${foldedCurrent} (`)) {\n      const suffix = segment.slice(current.length).trim();\n      const match = suffix.match(PARENTHETICAL_QUALIFIER);\n      nameMatches = Boolean(match?.[1] && looksLikeAllergenQualifier(match[1]));\n    }\n\n    if (!nameMatches) continue;\n    const next = segments[index + 1] ?? "";\n    if (PRICE_LINE.test(next)) return true;\n  }\n\n  return false;\n}\n\n''' + anchor
          if 'function sourceExcerptDirectlyPricesObservedName' not in text:
              if anchor not in text:
                  raise SystemExit('direct-price helper anchor missing')
              text = text.replace(anchor, helper, 1)

          old = '''    const descriptionRecovery =\n      !forwardRecovery &&\n      looksLikeHtmlDescription(item.name) &&\n      Number.isInteger(position) &&\n      position >= 1\n        ? recoverTitle(lines, position, item.name)\n        : null;\n'''
          new = '''    const directlyPricedObservedName =\n      sourceExcerptDirectlyPricesObservedName(item);\n    const descriptionRecovery =\n      !forwardRecovery &&\n      !directlyPricedObservedName &&\n      looksLikeHtmlDescription(item.name) &&\n      Number.isInteger(position) &&\n      position >= 1\n        ? recoverTitle(lines, position, item.name)\n        : null;\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('description recovery guard anchor missing')
              text = text.replace(old, new, 1)
          recovery_path.write_text(text)

          test_path = Path('apps/menu-worker/src/html-description-title-recovery.test.ts')
          test = test_path.read_text()
          test = test.replace(
              'expect(HTML_DESCRIPTION_TITLE_RECOVERY_VERSION).toBe("titles-v12");',
              'expect(HTML_DESCRIPTION_TITLE_RECOVERY_VERSION).toBe("titles-v13");',
              1,
          )
          test_anchor = '''  it("leaves ordinary short dish names unchanged", () => {\n'''
          tests = '''  it("preserves a directly priced dish title even when its leading verb resembles description prose", () => {\n    const grilled = {\n      ...item("GRILLED VEGETABLE PLATE", 2, 15900),\n      sourceExcerpt: "GRILLED VEGETABLE PLATE — 159,-",\n    };\n    const result = recoverDescriptionNamedHtmlItems(\n      [grilled],\n      ["CHILDREN MENU", "GRILLED VEGETABLE PLATE", "159,-"].join("\\n"),\n    );\n\n    expect(result).toHaveLength(1);\n    expect(result[0]?.name).toBe("GRILLED VEGETABLE PLATE");\n    expect(result[0]?.confidence).toBe(0.9);\n  });\n\n  it("preserves a long directly priced title instead of replacing it with an earlier section label", () => {\n    const offer = {\n      ...item("LET THE KITCHEN BUILD A SHARING MENU FOR THE WHOLE TABLE", 2, 59500),\n      sourceExcerpt:\n        "LET THE KITCHEN BUILD A SHARING MENU FOR THE WHOLE TABLE — 595.0",\n    };\n    const result = recoverDescriptionNamedHtmlItems(\n      [offer],\n      [\n        "TASTING MENU",\n        "LET THE KITCHEN BUILD A SHARING MENU FOR THE WHOLE TABLE",\n        "595.0",\n      ].join("\\n"),\n    );\n\n    expect(result).toHaveLength(1);\n    expect(result[0]?.name).toBe(\n      "LET THE KITCHEN BUILD A SHARING MENU FOR THE WHOLE TABLE",\n    );\n    expect(result[0]?.confidence).toBe(0.9);\n  });\n\n''' + test_anchor
          if 'preserves a directly priced dish title even when its leading verb resembles description prose' not in test:
              if test_anchor not in test:
                  raise SystemExit('description recovery test anchor missing')
              test = test.replace(test_anchor, tests, 1)
          test_path.write_text(test)
          PY

          git diff --check
          git diff -- apps/menu-worker/src/html-description-title-recovery.ts apps/menu-worker/src/html-description-title-recovery.test.ts

      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-description-title-recovery.ts apps/menu-worker/src/html-description-title-recovery.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Preserve directly priced HTML titles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
