name: Probe Confusion production onboarding

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-confusion-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-mutation
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout probe revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Onboard Confusion against production
        run: >-
          pnpm --filter @fysen/menu-worker onboard:manifest --
          apps/menu-worker/catalog/confusion-oslo.json
