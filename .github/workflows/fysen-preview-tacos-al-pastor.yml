name: Fysen preview black tacos al pastor (no approval)
on:
  push:
    branches: [art/tacos-al-pastor-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-tacos-al-pastor.yml"
      - "scripts/preview-tacos-al-pastor-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-tacos-al-pastor-mask-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install masking libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Regenerate masks from locked original source
        run: python scripts/preview-tacos-al-pastor-black.py
      - name: Gate preliminary review only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels")
          audit=json.loads((root/"black-review.json").read_text(encoding="utf8"))
          assert audit["source_native_dimensions"] == [7008,4672]
          assert audit["no_upscale"] and not audit["generated_food_pixels"]
          assert not audit["visual_review_completed"] and not audit["approved_for_fysen"] and not audit["published"]
          for variant in audit["review_variants"]:
              assert (root/f"{variant}-preview.jpg").is_file()
              assert (root/f"{variant}-native-detail-1400.jpg").is_file()
          print("Unapproved preview quality gate passed; 0 public assets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tacos-al-pastor-black-masks-for-visual-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-*.jpg
            assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-review.json
      - name: Commit only small unapproved mask previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-*.jpg
          git add assets/fysen-image-candidates/tacos-al-pastor/abner-velazquez-pexels/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[tacos-photo-bot] Stage 2 unapproved black masking previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
