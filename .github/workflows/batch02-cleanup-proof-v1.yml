name: Batch 02 cleanup live proof v1

on:
  pull_request:
    paths:
      - ".github/workflows/batch02-cleanup-proof-v1.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout cleanup head
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Restore immutable Batch 02 plan and isolate five output holds
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json', 'utf8'));
          const targetSlugs = new Set([
            'jaipur-karl-johans-gate-oslo',
            'indi-spice-welhavens-gate-oslo',
            'dognvill-bjorvika-oslo',
            'dognvill-tjuvholmen-oslo',
            'dognvill-vulkan-oslo',
          ]);
          const restaurants = source.restaurants.filter((entry) => targetSlugs.has(entry.restaurant.slug));
          if (restaurants.length !== 5) throw new Error(`Expected 5 target entries, found ${restaurants.length}`);
          const plan = {
            ...source,
            outputDirectory: 'research/batch02-cleanup-proof-generated',
            concurrency: 1,
            restaurants,
          };
          await mkdir('apps/menu-worker/research/batch02-cleanup-proof-generated', { recursive: true });
          await writeFile('apps/menu-worker/research/batch02-cleanup-proof.plan.json', JSON.stringify(plan, null, 2) + '\n');
          console.log(JSON.stringify(restaurants.map((entry) => entry.restaurant.slug), null, 2));
          NODE

      - name: Fresh intake on cleanup runtime
        id: intake
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js intake:batch research/batch02-cleanup-proof.plan.json | tee research/batch02-cleanup-proof-intake.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Separate serial live validation
        id: validation
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/batch02-cleanup-proof-generated | tee research/batch02-cleanup-proof-validation.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarize complete observed output
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const intake = JSON.parse(await readFile('research/batch02-cleanup-proof-intake.json', 'utf8'));
          const validation = JSON.parse(await readFile('research/batch02-cleanup-proof-validation.json', 'utf8'));
          const compact = (result) => ({
            slug: result.slug,
            accepted: result.accepted,
            failureFamilies: result.failureFamilies ?? [],
            error: result.error ?? null,
            menuError: result.validation?.menu?.error ?? null,
            itemCount: result.validation?.menu?.quality?.itemCount ?? null,
            extractorVersion: result.validation?.menu?.extractorVersion ?? null,
            observedDishNames: result.validation?.menu?.observedDishNames ?? [],
          });
          const summary = {
            cleanupHead: '8715ecfa90ad25b2b89f87fd11078d93748816cb',
            intakeExitCode: '${{ steps.intake.outputs.exit_code }}',
            validationExitCode: '${{ steps.validation.outputs.exit_code }}',
            intake: {
              requestedCount: intake.requestedCount,
              generatedCount: intake.generatedCount,
              failedCount: intake.failedCount,
              results: intake.results,
            },
            validation: {
              manifestCount: validation.manifestCount,
              acceptedCount: validation.acceptedCount,
              failedCount: validation.failedCount,
              failureFamilyCounts: validation.failureFamilyCounts,
              results: validation.results.map(compact),
            },
          };
          await writeFile('research/batch02-cleanup-proof-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (intake.requestedCount !== 5 || intake.generatedCount !== 5 || intake.failedCount !== 0) {
            throw new Error(`Intake gate failed: ${intake.generatedCount}/${intake.requestedCount}, failed=${intake.failedCount}`);
          }
          if (validation.manifestCount !== 5 || validation.acceptedCount !== 5 || validation.failedCount !== 0) {
            throw new Error(`Validation gate failed: ${validation.acceptedCount}/${validation.manifestCount}, failed=${validation.failedCount}`);
          }
          NODE

      - name: Upload live proof artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-cleanup-live-proof-v1
          path: |
            apps/menu-worker/research/batch02-cleanup-proof.plan.json
            apps/menu-worker/research/batch02-cleanup-proof-intake.json
            apps/menu-worker/research/batch02-cleanup-proof-validation.json
            apps/menu-worker/research/batch02-cleanup-proof-summary.json
            apps/menu-worker/research/batch02-cleanup-proof-generated/*.json
          if-no-files-found: warn
