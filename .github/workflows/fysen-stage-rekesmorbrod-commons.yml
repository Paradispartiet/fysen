name: Fysen assess alternate Nordic shrimp sandwich originals
on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths: [".github/workflows/fysen-stage-rekesmorbrod-commons.yml","scripts/stage-rekesmorbrod-commons.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-shrimp-commons-candidates
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install basic image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch licensed-source candidates for manual visual and license review
        run: python scripts/stage-rekesmorbrod-commons.py
      - name: Verify all candidates remain unapproved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          reviews=list(Path("assets/fysen-image-candidates/rekesmorbrod/commons").glob("*/review.json"))
          assert reviews
          for path in reviews:
              m=json.loads(path.read_text())
              assert m["license_verified"] is False
              assert m["approved_for_fysen"] is False
              assert m["published"] is False
          print(f"{len(reviews)} candidate photos staged; no rights/quality approval inferred")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-commons-shrimp-native-alternatives
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/rekesmorbrod/commons/*/source.bytes
            assets/fysen-image-candidates/rekesmorbrod/commons/*/preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/commons/*/native-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/commons/*/review.json
      - name: Commit only small previews and provenance to same PR
        run: |
          find assets/fysen-image-candidates/rekesmorbrod/commons -name source.bytes -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod/commons
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-commons-bot] Review alternate native shrimp photos"
          git push origin HEAD:"$GITHUB_REF_NAME"
