name: Fysen promote reviewed tagliatelle bolognese photo
on:
  push:
    branches: [art/pasta-bolognese-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-promote-pasta-bolognese.yml"
      - "scripts/promote-reviewed-pasta-bolognese.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bolognese-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photographic and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Reproduce SHA-locked native tagliatelle photograph and separate AVIFs
        run: python scripts/promote-reviewed-pasta-bolognese.py
      - name: Run only targeted gallery and original-quality tests
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Validate manifest, dimensions, attribution, and unpublished status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          web=Path("apps/web/public/dish-images")
          m=json.loads((web/"manifest.json").read_text())
          photos=m["images"]
          assert sum(x.get("largeViewEnabled") is True for x in photos)==10
          b=next(x for x in photos if x["id"]=="pasta-bolognese")
          assert b["atlas"]=="pasta-bolognese-thumb-512.avif"
          assert b["largeSource"]=="pasta-bolognese-master-4000.avif"
          assert b["largeSourceNativeWidth"]==4000 and b["largeSourceNativeHeight"]==3000
          assert "CC BY 4.0" in b["photoCredit"]
          assert b["photoLicenseNotice"]=="/dish-images/pasta-bolognese-LICENSE.txt"
          assert (web/"pasta-bolognese-LICENSE.txt").exists()
          with Image.open(web/b["atlas"]) as img: assert img.size==(512,512)
          with Image.open(web/b["largeSource"]) as img: assert img.size==(4000,3000)
          a=json.loads(Path("assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-review.json").read_text())
          assert a["visual_review_completed"] and a["approved_for_fysen"]
          assert a["published"] is False
          print("Ten source-audited masters in PR; no public deployment")
          PY
      - name: Commit reviewed original, mini, manifest, gallery and source license into PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/pasta-bolognese.png
          git add assets/fysen-image-candidates/pasta-bolognese/tagliatelle-trattoria-tony/black-review.json
          git add apps/web/public/dish-images/pasta-bolognese-master-4000.avif
          git add apps/web/public/dish-images/pasta-bolognese-thumb-512.avif
          git add apps/web/public/dish-images/pasta-bolognese-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/pasta-bolognese.md
          git diff --cached --quiet && exit 0
          git commit -m "[bolognese-promote-bot] Integrate reviewed 4000px tagliatelle with own mini and license"
          git push origin HEAD:"$GITHUB_REF_NAME"
