name: Fysen stage genuine gyoza native photos (review only)
on:
  push:
    branches: [art/gyoza-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-gyoza.yml"
      - "scripts/stage-gyoza-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-gyoza-original-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install authentic original image decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download verified sources and native detail crops
        run: python scripts/stage-gyoza-sources.py
      - name: Assert only unapproved source candidates staged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=list(Path("assets/fysen-image-candidates/gyoza").glob("*/review.json"))
          assert files
          for f in files:
            r=json.loads(f.read_text(encoding="utf8"))
            assert r["download_verified"] and r["no_upscale"]
            assert not r["visual_review_completed"] and not r["approved_for_fysen"] and not r["published"]
            assert min(r["native_width"],r["native_height"])>=1600
            assert (f.parent/"preview.jpg").exists() and (f.parent/"native-detail-1400.jpg").exists()
          print(f"STAGED {len(files)} candidates. Approval is 0.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-gyoza-full-originals-for-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/gyoza/*/source.jpeg
            assets/fysen-image-candidates/gyoza/*/preview.jpg
            assets/fysen-image-candidates/gyoza/*/native-detail-1400.jpg
            assets/fysen-image-candidates/gyoza/*/review.json
      - name: Commit lightweight previews only, not full source or finished gallery
        run: |
          find assets/fysen-image-candidates/gyoza -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/gyoza
          git diff --cached --quiet && exit 0
          git commit -m "[gyoza-source-bot] Add unapproved 1400px native detail and photo previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
