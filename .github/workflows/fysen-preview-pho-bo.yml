name: Fysen inspect phở bò black native source previews
on:
  push:
    branches: [art/pho-bo-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-pho-bo.yml"
      - "scripts/preview-pho-bo-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-pho-bo-black-previews
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo masking libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Regenerate source locked black variants
        run: python scripts/preview-pho-bo-black.py
      - name: Assert previews are NOT approved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("assets/fysen-image-candidates/pho-bo/undo-kim-pexels")
          a=json.loads((root/"black-review.json").read_text(encoding="utf8"))
          assert a["source_native_dimensions"]==[5472,3648]
          assert a["no_upscale"] and not a["food_pixels_generated"]
          assert not a["visual_review_completed"]
          assert not a["approved_for_fysen"] and not a["published"]
          for name in ["black-contour","black-grabcut"]:
            assert (root/f"{name}-preview.jpg").exists()
            assert (root/f"{name}-native-detail-1400.jpg").exists()
          print("Two genuine phở bò photo candidates; not approved/published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-pho-bo-black-native-previews
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-*-native.png
            assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-*-preview.jpg
            assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-review.json
      - name: Commit only lightweight evidence to draft branch
        run: |
          find assets/fysen-image-candidates/pho-bo -name 'black-*-native.png' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-review.json
          git add assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "[pho-preview-bot] Stage unapproved genuine phở bò black previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
