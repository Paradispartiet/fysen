name: Remove obsolete preview secret

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-obsolete-preview-secret.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      OBSOLETE_TOKEN: ${{ secrets.FYSEN_PREVIEW_TOKEN }}
    steps:
      - name: Remove obsolete secret if present
        id: remove
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OBSOLETE_TOKEN:-}" ]]; then
            echo 'result=already_absent' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          GH_TOKEN="$OBSOLETE_TOKEN" gh secret delete FYSEN_PREVIEW_TOKEN --repo "$GITHUB_REPOSITORY" || true
          echo 'result=removed_or_unusable' >> "$GITHUB_OUTPUT"
      - name: Record result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.remove.outputs.result }}
        run: |
          set -euo pipefail
          printf 'FYSEN_PREVIEW_TOKEN=%s\nrun_id=%s\n' "$RESULT" "$GITHUB_RUN_ID" > /tmp/result
          encoded="$(base64 -w0 /tmp/result)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/.obsolete-secret-cleanup.txt" -f message="Record obsolete preview secret cleanup ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main >/dev/null
