name: Fysen source review Commons prosciutto pizza
on:
  push:
    branches: [art/pizza-prosciutto-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-stage-prosciutto-commons.yml"
      - "scripts/stage-pizza-prosciutto-commons.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-prosciutto-commons-photo-sources
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photographic decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch Commons originals and 1 to 1 crops
        run: python scripts/stage-pizza-prosciutto-commons.py
      - name: No release without human image inspection
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=list(Path("assets/fysen-image-candidates/pizza-prosciutto/commons").glob("*/review.json"))
          assert len(r)>=2
          for file in r:
              d=json.loads(file.read_text())
              assert d["source_verified"] and not d["approved_for_fysen"] and not d["published"]
              assert (file.parent/"native-detail-1400.jpg").is_file()
          print(len(r),"Commons sources staged, all unapproved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-prosciutto-commons-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pizza-prosciutto/commons/*/source.bytes
            assets/fysen-image-candidates/pizza-prosciutto/commons/*/preview.jpg
            assets/fysen-image-candidates/pizza-prosciutto/commons/*/native-detail-1400.jpg
            assets/fysen-image-candidates/pizza-prosciutto/commons/*/review.json
      - name: Keep only previews and metadata on branch
        run: |
          find assets/fysen-image-candidates/pizza-prosciutto/commons -name source.bytes -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pizza-prosciutto/commons
          git diff --cached --quiet && exit 0
          git commit -m "[prosciutto-commons-bot] Stage Commons original previews and licensing review"
          git push origin HEAD:"$GITHUB_REF_NAME"
