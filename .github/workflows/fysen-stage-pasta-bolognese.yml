name: Fysen stage licensed native tagliatelle photographs
on:
  push:
    branches: [art/pasta-bolognese-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-stage-pasta-bolognese.yml"
      - "scripts/stage-pasta-bolognese-commons.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bolognese-source-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native photo reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Retrieve original Commons photographs for review
        run: python scripts/stage-pasta-bolognese-commons.py
      - name: Source resolution and approval gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          reviews=list(Path("assets/fysen-image-candidates/pasta-bolognese").glob("*/review.json"))
          assert len(reviews)>=2
          for file in reviews:
              m=json.loads(file.read_text())
              assert m["source_verified"] is True
              assert m["license_verified"] is False and m["photographer_verified"] is False
              assert m["approved_for_fysen"] is False and m["published"] is False
              assert min(m["source_width"],m["source_height"])>=2200
          print(f"{len(reviews)} native source photographs await visual/license review")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-bolognese-source-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pasta-bolognese/*/source.bytes
            assets/fysen-image-candidates/pasta-bolognese/*/preview.jpg
            assets/fysen-image-candidates/pasta-bolognese/*/native-detail-1400.jpg
            assets/fysen-image-candidates/pasta-bolognese/*/review.json
      - name: Commit previews to PR only
        run: |
          find assets/fysen-image-candidates/pasta-bolognese -name source.bytes -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pasta-bolognese
          git diff --cached --quiet && exit 0
          git commit -m "[bolognese-source-bot] Stage native photographed ragù sources"
          git push origin HEAD:"$GITHUB_REF_NAME"
