name: VisitOSLO coverage snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/visitoslo-coverage-snapshot.yml"
      - "apps/menu-worker/research/visitoslo-coverage-snapshot.mjs"

permissions:
  contents: write

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu worker
        run: pnpm --filter @fysen/menu-worker... build

      - name: Verify repository Chrome contract
        run: pnpm --filter @fysen/menu-worker browser:smoke

      - name: Capture current VisitOSLO catalogue
        working-directory: apps/menu-worker
        run: node research/visitoslo-coverage-snapshot.mjs

      - name: Commit exact source snapshot to research branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          snapshot="apps/menu-worker/research/visitoslo-catalogue-2026-09-21.snapshot.json"
          test -s "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$snapshot"
          if git diff --cached --quiet; then
            echo "Snapshot unchanged."
            exit 0
          fi
          git commit -m "research: capture VisitOSLO catalogue snapshot"
          git push origin "HEAD:$HEAD_REF"
