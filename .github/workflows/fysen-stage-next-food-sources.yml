name: Fysen stage green curry and bánh mì source candidates (not approved)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/fysen-stage-next-food-sources.yml"
      - "scripts/stage-next-food-photo-sources.py"
permissions:
  contents: write
concurrency:
  group: fysen-green-curry-banh-mi-stage
  cancel-in-progress: false
jobs:
  stage:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'art/fysen-next-source-review-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/fysen-next-source-review-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow for source dimension verification
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download authentic originals and generate unapproved previews
        run: python scripts/stage-next-food-photo-sources.py
      - name: Verify visual-review HOLD and protect public gallery
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          counts={"green-curry":0,"banh-mi":0}
          for dish in counts:
              for file in (Path("assets/fysen-image-candidates")/dish).glob("*/review.json"):
                  review=json.loads(file.read_text(encoding="utf8"))
                  assert review["dish_id"]==review["catalog_id"]==dish
                  assert review["source_download_verified"] and review["no_upscale"]
                  assert not review["visual_review_completed"]
                  assert not review["approved_for_fysen"] and not review["published"]
                  assert min(review["native_width"],review["native_height"])>=1600
                  assert (file.parent/"preview.jpg").is_file()
                  assert (file.parent/"native-detail-1400.jpg").is_file()
                  counts[dish]+=1
          assert all(counts.values()),counts
          print("Candidates staged, zero approved or published:",counts)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-next-food-originals-for-human-inspection
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/green-curry/*/source.jpeg
            assets/fysen-image-candidates/green-curry/*/preview.jpg
            assets/fysen-image-candidates/green-curry/*/native-detail-1400.jpg
            assets/fysen-image-candidates/green-curry/*/review.json
            assets/fysen-image-candidates/banh-mi/*/source.jpeg
            assets/fysen-image-candidates/banh-mi/*/preview.jpg
            assets/fysen-image-candidates/banh-mi/*/native-detail-1400.jpg
            assets/fysen-image-candidates/banh-mi/*/review.json
      - name: Commit review-only thumbnails and source manifest, never originals or public assets
        run: |
          find assets/fysen-image-candidates/{green-curry,banh-mi} -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/green-curry assets/fysen-image-candidates/banh-mi
          git diff --cached --quiet && exit 0
          git commit -m "[source-review-bot] Stage green curry and banh mi unapproved previews"
          git pull --rebase origin art/fysen-next-source-review-20261121
          git push origin HEAD:art/fysen-next-source-review-20261121
