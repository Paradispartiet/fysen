name: Fysen GitHub Pages preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - ".github/workflows/pages-preview.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fysen-github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare static visual preview
        shell: bash
        run: |
          # GitHub Pages is static. Keep the actual Fysen homepage and styles,
          # but remove server-only API/search routes from this runner checkout.
          rm -rf apps/web/app/api apps/web/app/search

          # Keep homepage navigation inside the /fysen Pages base path.
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/web/components/dish-search.tsx": [
                  ('action="/search"', 'action="/fysen/"'),
              ],
              "apps/web/components/suggestion-rail.tsx": [
                  ('return `/search?${params.toString()}`;', 'return `/fysen/?${params.toString()}`;'),
              ],
              "apps/web/components/fysen-logo.tsx": [
                  ('href="/"', 'href="/fysen/"'),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"Expected preview patch target missing in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > apps/web/next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            reactStrictMode: true,
            poweredByHeader: false,
            basePath: "/fysen",
            assetPrefix: "/fysen",
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          };

          export default nextConfig;
          EOF

      - name: Build static Fysen preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm --filter @fysen/web build

      - name: Keep Next assets out of Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
