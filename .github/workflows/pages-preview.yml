name: Fysen static preview export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/contracts/**"
      - ".github/workflows/pages-preview.yml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: fysen-static-preview-export
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare static visual preview
        shell: bash
        run: |
          # The public preview contains only the statically exported homepage.
          # Server-only API/search routes stay private and are not exported.
          rm -rf apps/web/app/api apps/web/app/search

          python - <<'PY'
          from pathlib import Path

          replacements = {
              "apps/web/components/dish-search.tsx": [
                  ('action="/search"', 'action="/fysen-preview/"'),
              ],
              "apps/web/components/suggestion-rail.tsx": [
                  ('return `/search?${params.toString()}`;', 'return `/fysen-preview/?${params.toString()}`;'),
              ],
              "apps/web/components/fysen-logo.tsx": [
                  ('href="/"', 'href="/fysen-preview/"'),
              ],
          }

          for filename, changes in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f"Expected preview patch target missing in {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY

          cat > apps/web/next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            reactStrictMode: true,
            poweredByHeader: false,
            basePath: "/fysen-preview",
            assetPrefix: "/fysen-preview",
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
          };

          export default nextConfig;
          EOF

      - name: Build static Fysen preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm turbo run build --filter=@fysen/web...

      - name: Keep Next assets out of Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Stamp source commit
        run: printf '%s\n' "${GITHUB_SHA}" > apps/web/out/source-main-sha.txt

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fysen-static-preview
          path: apps/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
