name: Fysen static preview export

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fysen-static-preview-export
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prepare functional static preview
        shell: bash
        run: |
          rm -rf apps/web/app/api

          cat > apps/web/app/search/page.tsx <<'EOF'
          import { StaticPreviewSearchPage } from "../../components/static-preview-search-page";

          export default function SearchPage() {
            return <StaticPreviewSearchPage />;
          }
          EOF

          cat > apps/web/next.config.ts <<'EOF'
          import type { NextConfig } from "next";

          const nextConfig: NextConfig = {
            output: "export",
            reactStrictMode: true,
            poweredByHeader: false,
            basePath: "/fysen-preview",
            assetPrefix: "/fysen-preview",
            trailingSlash: true,
            images: { unoptimized: true },
          };

          export default nextConfig;
          EOF

      - name: Build static Fysen preview
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_FYSEN_API_BASE_URL: "https://fysen-api.vercel.app"
          NEXT_PUBLIC_FYSEN_BASE_PATH: "/fysen-preview"
          NEXT_PUBLIC_DISABLE_FUNNEL_TRACKING: "1"
        run: pnpm turbo run build --filter=@fysen/web...

      - name: Verify structural static export
        run: |
          set -euo pipefail
          test -f apps/web/out/index.html
          test -f apps/web/out/search/index.html
          test -d apps/web/out/_next

      - name: Keep Next assets out of Jekyll processing
        run: touch apps/web/out/.nojekyll

      - name: Stamp source commit
        run: printf '%s\n' "${GITHUB_SHA}" > apps/web/out/source-main-sha.txt

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fysen-static-preview
          path: apps/web/out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Publish preview snapshot to public repository
        shell: bash
        env:
          FYSEN_PREVIEW_TOKEN: ${{ secrets.FYSEN_PREVIEW_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${FYSEN_PREVIEW_TOKEN:-}" ]]; then
            echo "::error title=Fysen preview token missing::Repository secret FYSEN_PREVIEW_TOKEN is required; preview publishing must never silently skip."
            exit 1
          fi

          preview_dir="${RUNNER_TEMP}/fysen-preview-site"
          rm -rf "$preview_dir"
          export GIT_TERMINAL_PROMPT=0

          git clone --quiet --depth 1 --branch site \
            "https://x-access-token:${FYSEN_PREVIEW_TOKEN}@github.com/Paradispartiet/fysen-preview.git" \
            "$preview_dir"

          rsync -a --delete --exclude='.git/' apps/web/out/ "$preview_dir/"

          actual_source_sha="$(tr -d '\r\n' < "$preview_dir/source-main-sha.txt")"
          test "$actual_source_sha" = "$SOURCE_SHA"
          test -f "$preview_dir/index.html"
          test -f "$preview_dir/search/index.html"
          test -d "$preview_dir/_next"

          git -C "$preview_dir" config user.name "Fysen Preview Publisher"
          git -C "$preview_dir" config user.email "paradispartiet@gmail.com"
          git -C "$preview_dir" add -A

          if ! git -C "$preview_dir" diff --cached --quiet; then
            git -C "$preview_dir" commit -m "Publish Fysen preview ${SOURCE_SHA}"
            git -C "$preview_dir" push --quiet origin site
          fi

          git -C "$preview_dir" fetch --quiet origin site
          remote_source_sha="$(git -C "$preview_dir" show origin/site:source-main-sha.txt | tr -d '\r\n')"
          test "$remote_source_sha" = "$SOURCE_SHA"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${FYSEN_PREVIEW_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Paradispartiet/fysen-preview/dispatches \
            --data "{\"event_type\":\"publish-fysen-preview\",\"client_payload\":{\"source_sha\":\"${SOURCE_SHA}\"}}"

      - name: Verify public preview matches main
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            public_sha="$(curl --fail --silent --show-error --location \
              "https://paradispartiet.github.io/fysen-preview/source-main-sha.txt?source=${SOURCE_SHA}&attempt=${attempt}" \
              2>/dev/null | tr -d '\r\n' || true)"

            if [[ "$public_sha" == "$SOURCE_SHA" ]]; then
              echo "Public Fysen preview now serves $SOURCE_SHA"
              exit 0
            fi

            echo "Waiting for public preview: expected $SOURCE_SHA, got ${public_sha:-<unavailable>} (attempt $attempt/36)"
            sleep 10
          done

          echo "::error title=Fysen preview is stale::Public preview did not reach main SHA $SOURCE_SHA"
          exit 1
