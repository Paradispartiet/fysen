name: Fysen review alternative cheeseburger photo

on:
  push:
    branches: [art/cheeseburger-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-review-cheeseburger-alternative.yml"
      - "scripts/preview-cheeseburger-alternative.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-cheeseburger-alt-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6
      - name: Verify and crop natural black-background cheeseburger photo
        run: python scripts/preview-cheeseburger-alternative.py
      - name: Ensure alternate photograph is not approved automatically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/cheeseburger/18713426")
          data=json.loads((p/"black-alt-review.json").read_text())
          assert data["native_black_size"]==[2185,1800]
          assert data["approved_for_fysen"] is False
          assert data["published"] is False
          print("Unapproved 2185×1800 native source staged")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-cheeseburger-alternative-native-source
          path: |
            assets/fysen-image-candidates/cheeseburger/18713426/black-native-2185x1800.png
            assets/fysen-image-candidates/cheeseburger/18713426/black-alt-preview.jpg
            assets/fysen-image-candidates/cheeseburger/18713426/black-alt-native-detail-1400.jpg
            assets/fysen-image-candidates/cheeseburger/18713426/black-alt-review.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit review previews (not public assets)
        run: |
          rm -f assets/fysen-image-candidates/cheeseburger/18713426/black-native-2185x1800.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/cheeseburger/18713426/black-alt-preview.jpg assets/fysen-image-candidates/cheeseburger/18713426/black-alt-native-detail-1400.jpg assets/fysen-image-candidates/cheeseburger/18713426/black-alt-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[cheeseburger-alt-bot] Stage native black burger preview"
          git push origin HEAD:"$GITHUB_REF_NAME"
