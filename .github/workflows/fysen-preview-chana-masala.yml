name: Fysen preview black chana masala (review only)
on:
  push:
    branches: [art/chana-masala-native-photo-20261121]
    paths: [".github/workflows/fysen-preview-chana-masala.yml","scripts/preview-chana-masala-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-chana-masala-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source photo and masking libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.12.0.88 numpy==2.2.6
      - name: Compute authentic black-background masks
        run: python scripts/preview-chana-masala-black.py
      - name: Refuse premature approval
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/chana-masala/nazir-whole-bowl")
          r=json.loads((p/"black-review.json").read_text(encoding="utf8"))
          assert (r["native_width"],r["native_height"])==(3814,3024)
          assert r["no_upscale"] and not r["generated_food_pixels"]
          assert not r["visual_review_completed"] and not r["approved_for_fysen"] and not r["published"]
          for variant in r["variants"]:
              assert (p/f"{variant}-preview.jpg").is_file()
              assert (p/f"{variant}-native-detail-1400.jpg").is_file()
          print("Only review previews created, no production images")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-chana-masala-black-masks-for-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-*.jpg
            assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-review.json
      - name: Commit only unapproved preview images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-*.jpg
          git add assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[chana-preview-bot] Preview two black masks, no approval"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
