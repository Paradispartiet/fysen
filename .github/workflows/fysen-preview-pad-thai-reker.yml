name: Fysen review black native shrimp pad thai plate
on:
  push:
    branches: [art/pad-thai-reker-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-pad-thai-reker.yml"
      - "scripts/preview-pad-thai-reker-black.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-pad-thai-reker-black
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source mask libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reuse exact native Pexels source already SHA-verified
        uses: actions/download-artifact@v4
        with:
          name: fysen-pad-thai-reker-originals
          run-id: 44701987558
          github-token: ${{ github.token }}
          path: /tmp/fysen-pad-thai-originals
      - name: Create whole-plate full-native black preview, not a release
        run: python scripts/preview-pad-thai-reker-black.py
      - name: Ensure no automatic visual approval or deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/pad-thai-reker/34723306")
          d=json.loads((p/"black-review.json").read_text())
          assert d["source_original_dimensions"]==[5472,3648]
          assert d["black_corners"] and not d["upscaled_source_pixels"]
          assert d["approved_for_fysen"] is False and d["published"] is False
          assert (p/"black-native-detail-1400.jpg").is_file()
          print("Staged full source photo, awaits visual approval")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-pad-thai-reker-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pad-thai-reker/34723306/black-native-master.png
            assets/fysen-image-candidates/pad-thai-reker/34723306/black-preview.jpg
            assets/fysen-image-candidates/pad-thai-reker/34723306/black-native-detail-1400.jpg
            assets/fysen-image-candidates/pad-thai-reker/34723306/black-review.json
      - name: Commit only lightweight preview and provenance metadata to PR
        run: |
          rm -f assets/fysen-image-candidates/pad-thai-reker/34723306/black-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pad-thai-reker/34723306/black-preview.jpg
          git add assets/fysen-image-candidates/pad-thai-reker/34723306/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/pad-thai-reker/34723306/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[pad-thai-preview-bot] Native pixel black plate preview for review"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
