name: Fysen promote reviewed authentic pizza prosciutto
on:
  push:
    branches: [art/pizza-prosciutto-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-promote-pizza-prosciutto.yml"
      - "scripts/promote-reviewed-pizza-prosciutto.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-prosciutto-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Recover previously verified exact original photo
        uses: actions/download-artifact@v4
        with:
          name: fysen-prosciutto-commons-originals
          run-id: 44607744351
          github-token: ${{ github.token }}
          path: /tmp/fysen-commons-originals
      - name: Produce verified native master, distinct 512 mini and source attribution
        run: python scripts/promote-reviewed-pizza-prosciutto.py
      - name: Only run the two relevant quality checks
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check source licensing, distinct dimensions and unpublished status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text())
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==11
          p=next(x for x in m["images"] if x["id"]=="pizza-prosciutto")
          assert p["kind"]=="Redaksjonelt rettfoto" and p["catalogId"] is None
          assert p["atlas"]=="pizza-prosciutto-thumb-512.avif"
          assert p["largeSource"]=="pizza-prosciutto-master-3949.avif"
          assert p["photoLicense"]=="https://creativecommons.org/licenses/by-sa/4.0/"
          with Image.open(root/p["atlas"]) as im: assert im.size==(512,512)
          with Image.open(root/p["largeSource"]) as im: assert im.size==(3949,2920)
          assert "CC BY-SA 4.0" in (root/"pizza-prosciutto-LICENSE.txt").read_text()
          review=json.loads(Path("assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-alternatives-review.json").read_text())
          assert review["approved_for_fysen"] and review["visual_review_completed"]
          assert review["published"] is False
          print("Photo #11 source checked, gallery tests done, production remains unchanged")
          PY
      - name: Commit only approved photo and related gallery material to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/pizza-prosciutto.png
          git add assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/black-alternatives-review.json
          git add assets/fysen-image-candidates/pizza-prosciutto/commons/parma-ham-pizza-bangkok/review.json
          git add apps/web/public/dish-images/pizza-prosciutto-master-3949.avif
          git add apps/web/public/dish-images/pizza-prosciutto-thumb-512.avif
          git add apps/web/public/dish-images/pizza-prosciutto-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/pizza-prosciutto.md
          git diff --cached --quiet && exit 0
          git commit -m "[prosciutto-promote-bot] Integrate CC BY-SA 4.0 source-locked native pizza master and mini"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
