name: Fysen validate original braised pork bao source (review only)
on:
  push:
    branches: [art/braised-pork-bao-native-photo-20261121]
    paths: [".github/workflows/fysen-stage-braised-pork-bao.yml","scripts/stage-braised-pork-bao.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-braised-pork-bao-sources
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download and SHA-256 verify genuine Wikimedia Commons original
        run: python scripts/stage-braised-pork-bao.py
      - name: Confirm unapproved photo from legitimate source
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0")
          j=json.loads((p/"review.json").read_text(encoding="utf8"))
          assert j["catalog_id"]==j["dish_id"]=="bao"
          assert j["native_width"]==8160 and j["native_height"]==6144
          assert j["source_verified"] and j["no_upscale"]
          assert j["license"]=="CC0 1.0"
          assert not j["approved_for_fysen"] and not j["published"]
          assert (p/"source.jpeg").exists() and (p/"source-preview.jpg").exists()
          print("Authentic CC0 original; unapproved, not published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-braised-bao-source-jpeg-for-review
          retention-days: 7
          if-no-files-found: error
          path: assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0
      - name: Commit only small review source previews and hashes
        run: |
          rm -f assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/source.jpeg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0
          git diff --cached --quiet && exit 0
          git commit -m "[bao-source-bot] Stage unapproved braised pork bao source"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
