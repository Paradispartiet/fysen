name: Fysen stage CC0 steamed dumplings native photo
on:
  push:
    branches: [art/dumplings-native-photo-20261121]
    paths: [".github/workflows/fysen-stage-dumplings-photo.yml","scripts/stage-dumplings-photo.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-dumplings-source-photo
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Check genuine 5472px source and SHA256
        run: python scripts/stage-dumplings-photo.py
      - name: Verify CC0 and remain unapproved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/dumplings/charles-deluvio-cc0")
          d=json.loads((p/"review.json").read_text(encoding="utf8"))
          assert d["source_verified"] and d["no_upscale"]
          assert (d["source_native_width"],d["source_native_height"])==(5472,3648)
          assert d["license"]=="CC0 1.0" and d["catalog_id"]=="dumplings"
          assert not d["approved_for_fysen"] and not d["published"]
          assert (p/"source-preview.jpg").is_file() and (p/"detail-1400.jpg").is_file()
          print("Genuine CC0 dumplings source staged without photo approval or publication")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-dumplings-source-cc0
          retention-days: 7
          if-no-files-found: error
          path: assets/fysen-image-candidates/dumplings/charles-deluvio-cc0
      - name: Commit only small preview and source hash
        run: |
          rm -f assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/source.jpeg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/dumplings/charles-deluvio-cc0
          git diff --cached --quiet && exit 0
          git commit -m "[dumplings-source-bot] Stage genuine unapproved CC0 steamed dumplings"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
