name: Post-50 restaurant production proof

on:
  pull_request:
    paths:
      - ".github/workflows/post50-production-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout exact post-parser main
        uses: actions/checkout@v4
        with:
          ref: e4938d4f99b9edfb9b2f3d1d41450aa012588179
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build database dependency graph
        run: pnpm --filter @fysen/database... build

      - name: Prove catalog, DB and post-promotion watchers read-only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { createDatabasePool } from './packages/database/dist/index.js';

          const files = (await readdir('apps/menu-worker/catalog'))
            .filter((name) => name.endsWith('.json'))
            .sort();
          const manifests = [];
          for (const file of files) {
            const manifest = JSON.parse(await readFile(`apps/menu-worker/catalog/${file}`, 'utf8'));
            manifests.push({ file, slug: manifest.restaurant.slug });
          }
          const catalogSlugs = manifests.map((entry) => entry.slug);
          const uniqueCatalogSlugs = new Set(catalogSlugs);

          const targets = new Map([
            ['beijing-palace-pilestredet-oslo', {
              expectedItems: 35,
              requiredExtractorParts: ['pdf-text-v12'],
              promotedAt: new Date('2026-08-21T02:25:29Z'),
            }],
            ['1947-gandhi-majorstuen-oslo', {
              expectedItems: 41,
              requiredExtractorParts: ['section-first-card-v3', 'text-section-scope-v5'],
              promotedAt: new Date('2026-08-21T02:38:18Z'),
            }],
          ]);
          const acceptedOutcomes = new Set(['changed', 'unchanged', 'not_modified']);

          const pool = createDatabasePool();
          try {
            const restaurants = await pool.query(
              `SELECT r.slug, r.active,
                      count(ms.id) FILTER (WHERE ms.enabled)::int AS enabled_menu_source_count
                 FROM fysen.restaurants r
                 LEFT JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
                GROUP BY r.id, r.slug, r.active
                ORDER BY r.slug`,
            );
            const dbBySlug = new Map(restaurants.rows.map((row) => [row.slug, row]));
            const inactiveCanonical = manifests.filter((entry) => !dbBySlug.get(entry.slug)?.active);
            const activeNotCatalog = restaurants.rows.filter(
              (row) => row.active && !uniqueCatalogSlugs.has(row.slug),
            );

            const totals = await pool.query(
              `SELECT
                 (SELECT count(*)::int FROM fysen.restaurants WHERE active = true) AS active_restaurants,
                 (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled = true) AS enabled_menu_sources`,
            );

            const targetRows = await pool.query(
              `SELECT r.slug, r.active,
                      ms.enabled,
                      ms.minimum_expected_items,
                      ms.last_http_status,
                      ms.consecutive_failures,
                      ms.last_menu_fingerprint,
                      ms.last_checked_at,
                      ms.updated_at AS menu_source_updated_at,
                      s.extractor_version,
                      s.fetched_at AS latest_snapshot_fetched_at,
                      s.item_count AS latest_snapshot_item_count,
                      w.outcome AS latest_outcome,
                      w.http_status AS latest_watch_http_status,
                      w.extracted_item_count,
                      w.error_code,
                      w.error_message,
                      w.started_at AS latest_watch_started_at,
                      w.completed_at AS latest_watch_completed_at
                 FROM fysen.restaurants r
                 JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
                 LEFT JOIN LATERAL (
                   SELECT snap.extractor_version,
                          snap.fetched_at,
                          count(mi.id)::int AS item_count
                     FROM fysen.menu_snapshots snap
                     LEFT JOIN fysen.menu_items mi ON mi.snapshot_id = snap.id
                    WHERE snap.menu_source_id = ms.id
                    GROUP BY snap.id, snap.extractor_version, snap.fetched_at
                    ORDER BY snap.fetched_at DESC
                    LIMIT 1
                 ) s ON true
                 LEFT JOIN LATERAL (
                   SELECT outcome, http_status, extracted_item_count,
                          error_code, error_message, started_at, completed_at
                     FROM fysen.menu_watch_runs
                    WHERE menu_source_id = ms.id
                    ORDER BY started_at DESC
                    LIMIT 1
                 ) w ON true
                WHERE r.slug = ANY($1::text[])
                ORDER BY r.slug, ms.created_at DESC`,
              [[...targets.keys()]],
            );

            const result = {
              catalogCount: manifests.length,
              uniqueCatalogCount: uniqueCatalogSlugs.size,
              databaseCounts: totals.rows[0],
              inactiveCanonical,
              activeNotCatalog,
              targets: targetRows.rows,
            };
            console.log(JSON.stringify(result, null, 2));

            if (manifests.length !== 50 || uniqueCatalogSlugs.size !== 50) {
              throw new Error(`Expected 50 unique catalog manifests, got ${manifests.length}/${uniqueCatalogSlugs.size}`);
            }
            if (inactiveCanonical.length || activeNotCatalog.length) {
              throw new Error(`Catalog/DB drift: inactive=${JSON.stringify(inactiveCanonical)} activeNotCatalog=${JSON.stringify(activeNotCatalog)}`);
            }
            if (Number(totals.rows[0]?.active_restaurants) !== 50 || Number(totals.rows[0]?.enabled_menu_sources) !== 50) {
              throw new Error(`Expected 50 active/50 enabled, got ${JSON.stringify(totals.rows[0])}`);
            }
            if (targetRows.rows.length !== targets.size) {
              throw new Error(`Expected ${targets.size} target rows, got ${targetRows.rows.length}`);
            }

            for (const row of targetRows.rows) {
              const expected = targets.get(row.slug);
              if (!expected) throw new Error(`Unexpected target slug ${row.slug}`);
              if (!row.active || !row.enabled) throw new Error(`${row.slug} is not active/enabled`);
              if (Number(row.consecutive_failures) !== 0) throw new Error(`${row.slug} consecutive_failures=${row.consecutive_failures}`);
              if (!row.last_menu_fingerprint) throw new Error(`${row.slug} has no menu fingerprint`);
              if (Number(row.latest_snapshot_item_count) !== expected.expectedItems) {
                throw new Error(`${row.slug} snapshot items=${row.latest_snapshot_item_count}/${expected.expectedItems}`);
              }
              const extractor = String(row.extractor_version ?? '');
              for (const part of expected.requiredExtractorParts) {
                if (!extractor.includes(part)) throw new Error(`${row.slug} extractor missing ${part}: ${extractor}`);
              }
              if (!acceptedOutcomes.has(row.latest_outcome)) {
                throw new Error(`${row.slug} latest watcher outcome=${row.latest_outcome}`);
              }
              if (row.error_code || row.error_message) {
                throw new Error(`${row.slug} watcher error=${row.error_code}: ${row.error_message}`);
              }
              if (!row.latest_watch_started_at || new Date(row.latest_watch_started_at) < expected.promotedAt) {
                throw new Error(`${row.slug} has no watcher after promotion ${expected.promotedAt.toISOString()}`);
              }
              if (row.latest_outcome !== 'not_modified' && Number(row.extracted_item_count) !== expected.expectedItems) {
                throw new Error(`${row.slug} watcher items=${row.extracted_item_count}/${expected.expectedItems}`);
              }
            }
          } finally {
            await pool.end();
          }
          NODE
