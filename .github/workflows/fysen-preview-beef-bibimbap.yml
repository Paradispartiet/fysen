name: Fysen preview Andy Li beef bibimbap on black
on:
  push:
    branches: [art/beef-bibimbap-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-beef-bibimbap.yml"
      - "scripts/preview-beef-bibimbap-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bibimbap-black-review
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-pixel photo tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reproduce verified 8160px original and inspect two masks
        run: python scripts/preview-beef-bibimbap-black.py
      - name: Enforce no catalog mapping, automatic approval or publication
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          dir=Path("assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0")
          a=json.loads((dir/"black-review.json").read_text(encoding="utf8"))
          assert a["native_size"]==[8160,6144]
          assert a["catalog_id"] is None
          assert a["no_upscale"] and not a["food_pixels_generated"]
          assert not a["visual_review_completed"] and not a["approved_for_fysen"] and not a["published"]
          for name in ("black-contour","black-grabcut"):
            assert (dir/f"{name}-preview.jpg").is_file()
            assert (dir/f"{name}-native-detail-1400.jpg").is_file()
          print("Two black original-pixel previews; 0 approved, 0 catalog mapping")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-bibimbap-unapproved-black-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-*-native.png
            assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-*-preview.jpg
            assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-review.json
      - name: Commit only unapproved preview evidence
        run: |
          find assets/fysen-image-candidates/bibimbap -name 'black-*-native.png' -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-review.json
          git add assets/fysen-image-candidates/bibimbap/andy-li-saero-cc0/black-*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "[bibimbap-preview-bot] Stage native black review photos, not gallery"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
