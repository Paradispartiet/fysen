name: Fysen integrate genuine CC0 steamed dumplings photo (draft only)
on:
  push:
    branches: [art/dumplings-native-photo-20261121]
    paths: [".github/workflows/fysen-promote-dumplings-photo.yml","scripts/promote-reviewed-dumplings.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-dumplings-native-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source-locked native AVIF imaging dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Build reviewed authentic dumplings master and separate 512 miniature
        run: python scripts/promote-reviewed-dumplings.py
      - name: Run ONLY the two targeted Fysen dish-photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify true original-pixel master, CC0 license and unpublished status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==28
          d=m["images"][28]
          assert d["id"]==d["catalogId"]=="dumplings"
          assert d["kind"]=="Redaksjonelt rettfoto"
          assert d["atlas"]=="dumplings-thumb-512.avif"
          assert d["largeSource"]=="dumplings-master-4100.avif"
          assert d["photoCredit"]=="Charles Deluvio / Wikimedia Commons · CC0 1.0"
          assert d["photoLicense"]=="https://creativecommons.org/publicdomain/zero/1.0/"
          assert "CC0 1.0" in (root/"dumplings-LICENSE.txt").read_text(encoding="utf8")
          assert "Fyllet er ikke dokumentert" in d["variantCaution"]
          assert "ikke chili- eller soyadipp" in d["variantCaution"]
          with Image.open(root/d["largeSource"]) as im:assert im.size==(4100,3200)
          with Image.open(root/d["atlas"]) as im:assert im.size==(512,512)
          a=json.loads(Path("assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-review.json").read_text(encoding="utf8"))
          assert a["reviewed_variant"]=="black-clean-grabcut"
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert a["approved_for_fysen"] and a["published"] is False
          print("DUMPLINGS: 28/44 approved authentic originals on DRAFT ONLY")
          PY
      - name: Commit only reviewed dumpling image, manifest, notes and focused tests to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/dumplings.png
          git add assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/review.json
          git add assets/fysen-image-candidates/dumplings/charles-deluvio-cc0/black-review.json
          git add apps/web/public/dish-images/dumplings-master-4100.avif
          git add apps/web/public/dish-images/dumplings-thumb-512.avif
          git add apps/web/public/dish-images/dumplings-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/dumplings.md
          git diff --cached --quiet && exit 0
          git commit -m "[dumplings-photo-bot] Add genuine CC0 steamed dumplings 4100px and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
