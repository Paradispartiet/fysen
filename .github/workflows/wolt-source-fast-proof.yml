name: Fast Wolt source proof

on:
  pull_request:
    paths:
      - ".github/workflows/wolt-source-fast-proof.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "3"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Build source variants
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const read = async (path) => JSON.parse(await readFile(path, 'utf8'));
          const write = async (name, manifest) => {
            const dir = `research/wolt-fast/${name}`;
            await mkdir(dir, { recursive: true });
            await writeFile(`${dir}/manifest.json`, JSON.stringify(manifest, null, 2) + '\n');
          };
          await write('hrimnir', await read('catalog/hrimnir-ramen-storgata.json'));
          const registan = await read('catalog/registan-gronland-oslo.json');
          registan.menuSource.url = 'https://wolt.com/nb/nor/oslo/restaurant/registan-reg';
          registan.menuSource.fetchMode = 'http';
          registan.menuSource.sourceSupport = { redirectOrigins: [], browserDataOrigins: [] };
          await write('registan-wolt', registan);
          const viet = await read('catalog/viet-kitchen-bjolsen-oslo.json');
          viet.menuSource.url = 'https://wolt.com/nb/nor/oslo/restaurant/viet-kitchen-oslo';
          viet.menuSource.fetchMode = 'http';
          viet.menuSource.sourceSupport = { redirectOrigins: [], browserDataOrigins: [] };
          await write('viet-wolt', viet);
          NODE
      - name: Validate independently
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          mkdir -p research/wolt-fast-results
          for name in hrimnir registan-wolt viet-wolt; do
            node dist/index.js validate:batch "research/wolt-fast/$name" > "research/wolt-fast-results/$name.json" 2>&1
            echo $? > "research/wolt-fast-results/$name.exit"
          done
          exit 0
      - name: Summarize
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const names = ['hrimnir','registan-wolt','viet-wolt'];
          const summary = [];
          for (const name of names) {
            const exitCode = Number((await readFile(`research/wolt-fast-results/${name}.exit`, 'utf8')).trim());
            const payload = JSON.parse(await readFile(`research/wolt-fast-results/${name}.json`, 'utf8'));
            const result = payload.results?.[0] ?? {};
            summary.push({
              name,
              exitCode,
              accepted: result.accepted ?? false,
              failureFamilies: result.failureFamilies ?? [],
              error: result.error ?? null,
              menuError: result.validation?.menu?.error ?? null,
              itemCount: result.validation?.menu?.quality?.itemCount ?? null,
              extractorVersion: result.validation?.menu?.extractorVersion ?? null,
              observedDishNames: result.validation?.menu?.observedDishNames ?? [],
              missingRequiredDishes: result.validation?.menu?.quality?.missingRequiredDishes ?? [],
              forbiddenDishesPresent: result.validation?.menu?.quality?.forbiddenDishesPresent ?? [],
              hoursOutcome: result.validation?.hours?.outcome ?? null,
            });
          }
          await writeFile('research/wolt-fast-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wolt-source-fast-proof
          path: |
            apps/menu-worker/research/wolt-fast-results/*
            apps/menu-worker/research/wolt-fast-summary.json
          if-no-files-found: error
