name: Fysen integrate reviewed chana masala native photo (draft only)
on:
  push:
    branches: [art/chana-masala-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-promote-chana-masala.yml"
      - "scripts/promote-reviewed-chana-masala.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-chana-masala-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install source photo and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate native-source verified master and separate thumbnail
        run: python scripts/promote-reviewed-chana-masala.py
      - name: Run ONLY two relevant dish-image test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Confirm exact size, license and unpublished status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(manifest["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in manifest["images"])==22
          p=manifest["images"][22]
          assert p["id"]==p["catalogId"]=="chana-masala"
          assert p["atlas"]=="chana-masala-thumb-512.avif"
          assert p["largeSource"]=="chana-masala-master-3814.avif"
          assert p["photoCredit"]=="Muhammad Khawar Nazir / Pexels"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "Pexels License" in (root/"chana-masala-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(root/p["atlas"]) as im: assert im.size==(512,512)
          with Image.open(root/p["largeSource"]) as im: assert im.size==(3814,3024)
          a=json.loads(Path("assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-review.json").read_text(encoding="utf8"))
          assert a["reviewed_variant"]=="black-grabcut" and a["approved_for_fysen"]
          assert a["published"] is False and a["no_upscale"] and not a["generated_food_pixels"]
          print("22/44 native large photos on UNPUBLISHED DRAFT")
          PY
      - name: Commit only reviewed photo assets, gallery and targeted tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/chana-masala.png
          git add assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/review.json
          git add assets/fysen-image-candidates/chana-masala/nazir-whole-bowl/black-review.json
          git add apps/web/public/dish-images/chana-masala-master-3814.avif
          git add apps/web/public/dish-images/chana-masala-thumb-512.avif
          git add apps/web/public/dish-images/chana-masala-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/chana-masala.md
          git diff --cached --quiet && exit 0
          git commit -m "[chana-photo-bot] Add source-native chana photo and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
