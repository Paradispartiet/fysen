name: TEMP retry Mesob transport once

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-mesob-transport-retry.yml"

permissions:
  contents: read
  actions: read

env:
  FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
  FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  mesob-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Restore exact geocoded Mesob plan
        shell: bash
        run: |
          rm -rf /tmp/batch02 && mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const base=structuredClone(source.restaurants.find(x=>x.restaurant.slug==='mesob-motzfeldts-gate-oslo'));
          if(!base)throw new Error('Missing Mesob plan');
          base.menuSource={...base.menuSource,url:'https://mesobrestaurant.no/menu/',sourceType:'html',fetchMode:'http',sourceSupport:{redirectOrigins:[],browserDataOrigins:[]}};
          await mkdir('apps/menu-worker/research/mesob-retry-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/mesob-retry.plan.json',JSON.stringify({...source,outputDirectory:'research/mesob-retry-generated',concurrency:1,restaurants:[base]},null,2)+'\n');
          NODE
      - name: One identical fresh intake retry
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/mesob-retry.plan.json | tee research/mesob-retry-intake.json
      - name: Independent second-fetch validation
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/mesob-retry-generated | tee research/mesob-retry-validation.json
      - name: Gate Mesob output clean
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const i=JSON.parse(await readFile('research/mesob-retry-intake.json','utf8'));
          const v=JSON.parse(await readFile('research/mesob-retry-validation.json','utf8'));
          const r=v.results?.[0];const names=r?.validation?.menu?.observedDishNames??[];const count=r?.validation?.menu?.quality?.itemCount??0;
          const failures=[];
          if(i.requestedCount!==1||i.generatedCount!==1||i.failedCount!==0)failures.push('intake-not-1/1');
          if(v.manifestCount!==1||v.acceptedCount!==1||v.failedCount!==0||!r?.accepted)failures.push('validation-not-1/1');
          if(count<20)failures.push(`coverage:${count}<20`);
          if(!names.some(n=>n.includes('KITFO')))failures.push('missing-KITFO');
          for(const n of ['Chili nivo','MenuDrinksEvents'])if(names.includes(n))failures.push(`forbidden:${n}`);
          const summary={retryOrdinal:1,itemCount:count,extractorVersion:r?.validation?.menu?.extractorVersion??null,failureFamilies:r?.failureFamilies??[],failures,names};
          await writeFile('research/mesob-retry-summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if(failures.length)throw new Error(`Mesob retry failed ${JSON.stringify(failures)}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-mesob-transport-retry
          path: |
            apps/menu-worker/research/mesob-retry-intake.json
            apps/menu-worker/research/mesob-retry-validation.json
            apps/menu-worker/research/mesob-retry-summary.json
            apps/menu-worker/research/mesob-retry-generated/*.json
          if-no-files-found: warn
