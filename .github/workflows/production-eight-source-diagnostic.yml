name: Production four-source diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/production-eight-source-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
    steps:
      - name: Checkout exact rollback main
        uses: actions/checkout@v4
        with:
          ref: 640021bae29238f0649c2ef679483b7c967e9895
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Isolate exact four inactive canonical manifests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readdir, readFile, writeFile } from 'node:fs/promises';
          const targetSlugs = new Set([
            'coyo-sorenga-oslo',
            'lahori-dera-gronland-oslo',
            'oche-aker-brygge-oslo',
            'oche-torggata-oslo',
          ]);
          const browserSlugs = new Set([
            'lahori-dera-gronland-oslo',
            'oche-aker-brygge-oslo',
            'oche-torggata-oslo',
          ]);
          const catalogDir = 'apps/menu-worker/catalog';
          const outDir = 'apps/menu-worker/research/production-four-source-diagnostic';
          const browserDir = 'apps/menu-worker/research/production-html-browser-diagnostic';
          await mkdir(outDir, { recursive: true });
          await mkdir(browserDir, { recursive: true });
          const found = [];
          for (const file of (await readdir(catalogDir)).filter((name) => name.endsWith('.json')).sort()) {
            const raw = await readFile(`${catalogDir}/${file}`, 'utf8');
            const manifest = JSON.parse(raw);
            if (!targetSlugs.has(manifest.restaurant.slug)) continue;
            await writeFile(`${outDir}/${file}`, raw);
            found.push({
              file,
              slug: manifest.restaurant.slug,
              sourceType: manifest.menuSource.sourceType,
              sourceUrl: manifest.menuSource.url,
              minimumExpectedItems: manifest.menuSource.minimumExpectedItems,
            });
            if (browserSlugs.has(manifest.restaurant.slug)) {
              manifest.menuSource.fetchMode = 'browser';
              manifest.menuSource.sourceSupport ??= { redirectOrigins: [], browserDataOrigins: [] };
              await writeFile(`${browserDir}/${file}`, JSON.stringify(manifest, null, 2) + '\n');
            }
          }
          if (found.length !== targetSlugs.size) {
            const foundSlugs = new Set(found.map((entry) => entry.slug));
            const missing = [...targetSlugs].filter((slug) => !foundSlugs.has(slug));
            throw new Error(`Expected ${targetSlugs.size} manifests, found ${found.length}; missing=${missing.join(',')}`);
          }
          await writeFile('apps/menu-worker/research/production-four-source-manifests.json', JSON.stringify(found, null, 2) + '\n');
          console.log(JSON.stringify(found, null, 2));
          NODE

      - name: Inspect raw HTTP structure for HTML sources
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, readdir, writeFile } from 'node:fs/promises';
          import { load } from 'cheerio';
          import { HttpMenuClient } from './dist/http-client.js';
          import { extractScopedHtmlMenu } from './dist/html-source-extractor.js';

          const dir = 'research/production-four-source-diagnostic';
          const needlesBySlug = new Map([
            ['lahori-dera-gronland-oslo', ['Kylling Tikka Masala', 'Lahori Lam Karahi Fresh', 'Chapli Kebab', 'Saag Paneer', 'Mix Grill']],
            ['oche-aker-brygge-oslo', ['Pollo', 'Funghi', 'Margherita', 'Nduja', 'Oche Burger & Fries']],
            ['oche-torggata-oslo', ['Pollo', 'Funghi', 'Margherita', 'Nduja', 'Oche Burger & Fries']],
          ]);
          const client = new HttpMenuClient();
          const reports = [];
          const normalize = (value) => String(value ?? '').normalize('NFKC').replace(/\s+/g, ' ').trim();

          for (const file of (await readdir(dir)).filter((name) => name.endsWith('.json')).sort()) {
            const manifest = JSON.parse(await readFile(`${dir}/${file}`, 'utf8'));
            if (!needlesBySlug.has(manifest.restaurant.slug)) continue;
            const fetched = await client.fetchSource({
              url: manifest.menuSource.url,
              userAgent: manifest.menuSource.userAgent,
              etag: null,
              lastModified: null,
            }, { allowedRedirectOrigins: manifest.menuSource.sourceSupport?.redirectOrigins ?? [] });
            if (fetched.kind !== 'content') throw new Error(`${manifest.restaurant.slug}: unexpected ${fetched.kind}`);
            const $ = load(fetched.body);
            const bodyText = normalize($('body').text());
            const scoped = extractScopedHtmlMenu(fetched.body);
            const needles = [];
            for (const needle of needlesBySlug.get(manifest.restaurant.slug) ?? []) {
              const lowerNeedle = normalize(needle).toLocaleLowerCase('nb-NO');
              const candidates = $('body *').toArray()
                .map((element) => ({ element, text: normalize($(element).text()) }))
                .filter((entry) => entry.text.toLocaleLowerCase('nb-NO').includes(lowerNeedle))
                .sort((a, b) => a.text.length - b.text.length);
              const best = candidates[0] ?? null;
              needles.push({
                needle,
                rawBodyContains: bodyText.toLocaleLowerCase('nb-NO').includes(lowerNeedle),
                bestElement: best ? {
                  tag: best.element.tagName,
                  id: $(best.element).attr('id') ?? null,
                  className: $(best.element).attr('class') ?? null,
                  text: best.text.slice(0, 600),
                  html: ($.html(best.element) ?? '').slice(0, 1800),
                  parentTag: best.element.parent?.tagName ?? null,
                  parentClass: best.element.parent ? ($(best.element.parent).attr('class') ?? null) : null,
                } : null,
              });
            }
            reports.push({
              slug: manifest.restaurant.slug,
              url: manifest.menuSource.url,
              status: fetched.status,
              contentType: fetched.contentType,
              bodyBytes: fetched.bodyBytes.length,
              bodyTextLength: bodyText.length,
              scopedItemCount: scoped.items.length,
              scopedVisibleTextSample: scoped.visibleText.slice(0, 6000),
              domCounts: {
                h1: $('h1').length,
                h2: $('h2').length,
                h3: $('h3').length,
                h4: $('h4').length,
                li: $('li').length,
                article: $('article').length,
                section: $('section').length,
                script: $('script').length,
              },
              needles,
            });
          }
          await writeFile('research/production-html-http-structure.json', JSON.stringify(reports, null, 2) + '\n');
          console.log(JSON.stringify(reports.map((r) => ({ slug: r.slug, status: r.status, bodyBytes: r.bodyBytes, bodyTextLength: r.bodyTextLength, scopedItemCount: r.scopedItemCount, domCounts: r.domCounts, needles: r.needles.map((n) => ({ needle: n.needle, rawBodyContains: n.rawBodyContains, tag: n.bestElement?.tag ?? null, className: n.bestElement?.className ?? null })) })), null, 2));
          NODE

      - name: Live validation pass 1
        id: pass1
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/production-four-source-diagnostic | tee research/production-four-source-pass1.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Live validation pass 2
        id: pass2
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/production-four-source-diagnostic | tee research/production-four-source-pass2.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Browser-mode validation for three HTML sources
        id: browser
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/production-html-browser-diagnostic | tee research/production-html-browser-result.json
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compare live passes and browser alternative
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const p1 = JSON.parse(await readFile('research/production-four-source-pass1.json', 'utf8'));
          const p2 = JSON.parse(await readFile('research/production-four-source-pass2.json', 'utf8'));
          const browser = JSON.parse(await readFile('research/production-html-browser-result.json', 'utf8'));
          const manifests = JSON.parse(await readFile('research/production-four-source-manifests.json', 'utf8'));
          const compact = (result) => ({
            slug: result.slug,
            accepted: result.accepted,
            failureFamilies: result.failureFamilies ?? [],
            error: result.error ?? null,
            menuError: result.validation?.menu?.error ?? null,
            itemCount: result.validation?.menu?.quality?.itemCount ?? null,
            extractionMethod: result.validation?.menu?.extractionMethod ?? null,
            extractorVersion: result.validation?.menu?.extractorVersion ?? null,
            observedDishNames: result.validation?.menu?.observedDishNames ?? [],
            hours: result.validation?.hours ?? null,
            actions: result.validation?.actions ?? null,
          });
          const bySlug = (payload) => new Map((payload.results ?? []).map((result) => [result.slug, compact(result)]));
          const a = bySlug(p1);
          const b = bySlug(p2);
          const c = bySlug(browser);
          const comparison = manifests.map((manifest) => ({
            ...manifest,
            pass1: a.get(manifest.slug) ?? null,
            pass2: b.get(manifest.slug) ?? null,
            browser: c.get(manifest.slug) ?? null,
          }));
          const summary = {
            pass1ExitCode: '${{ steps.pass1.outputs.exit_code }}',
            pass2ExitCode: '${{ steps.pass2.outputs.exit_code }}',
            browserExitCode: '${{ steps.browser.outputs.exit_code }}',
            pass1: { manifestCount: p1.manifestCount, acceptedCount: p1.acceptedCount, failedCount: p1.failedCount, failureFamilyCounts: p1.failureFamilyCounts },
            pass2: { manifestCount: p2.manifestCount, acceptedCount: p2.acceptedCount, failedCount: p2.failedCount, failureFamilyCounts: p2.failureFamilyCounts },
            browserRun: { manifestCount: browser.manifestCount, acceptedCount: browser.acceptedCount, failedCount: browser.failedCount, failureFamilyCounts: browser.failureFamilyCounts },
            comparison,
          };
          await writeFile('research/production-four-source-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-four-source-diagnostic
          path: |
            apps/menu-worker/research/production-four-source-manifests.json
            apps/menu-worker/research/production-html-http-structure.json
            apps/menu-worker/research/production-four-source-pass1.json
            apps/menu-worker/research/production-four-source-pass2.json
            apps/menu-worker/research/production-html-browser-result.json
            apps/menu-worker/research/production-four-source-summary.json
          if-no-files-found: error
