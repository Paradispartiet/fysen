name: Parser cleanup proof

on:
  pull_request:
    paths:
      - ".github/workflows/parser-cleanup-proof.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 700d24cb3c1e96a8fb5db5f2aa5f2457132d24c5
          persist-credentials: false

      - name: Patch generic navigation and cocktail filters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()
          text = text.replace(
            r'/^(?:hjemmeside|homepage|mine\s+favoritter|my\s+favou?rites|favoritter|favou?rites|pers\.?|medium|gluten[- ]?free|glutenfri)$/iu;',
            r'/^(?:hjemmeside|homepage|top\s+of\s+page|mine\s+favoritter|my\s+favou?rites|favoritter|favou?rites|pers\.?|medium|gluten[- ]?free|glutenfri)$/iu;'
          )
          anchor = '''const BOTTLED_BEVERAGE_VOLUME =
  /(?:^flaske$|\\b(?:flaske\\s+0[,.]\\d{1,2}(?:\\s*l)?|0[,.]\\d{1,2}\\s*l?\\s+flaske)\\)?\\s*[-–—]?$)/iu;
'''
          replacement = anchor + '''const COCKTAIL_DESCRIPTION_ITEM =
  /^(?:(?:mimosa|(?:black|white)\\s+russian(?:\\s+kahlua)?|classic\\s+mojito)$|(?=.*\\b(?:gin|vodka|rom|rum|tequila|whisk(?:e)?y|bourbon|aperol|prosecco|kahlua|makers\\s+mark|jack\\s+daniels|cointreau)\\b)(?=.*\\b(?:tonic|cola|cranberry|prosecco|lime|sitron|lemon|appelsin|orange|eggehvite|egg\\s*whites?|ginger\\s+ale|ingefærøl|lemon\\s+soda|sitronbrus)\\b).+)$/iu;
'''
          if anchor not in text:
            raise SystemExit('beverage anchor not found')
          text = text.replace(anchor, replacement)
          text = text.replace(
            '    !BOTTLED_BEVERAGE_VOLUME.test(filterName)\n',
            '    !BOTTLED_BEVERAGE_VOLUME.test(filterName) &&\n    !COCKTAIL_DESCRIPTION_ITEM.test(filterName)\n'
          )
          if 'top\\s+of\\s+page' not in text or 'COCKTAIL_DESCRIPTION_ITEM' not in text:
            raise SystemExit('proof patch failed')
          path.write_text(text)
          PY
          git diff --check

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Prove generic filter behavior
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createMenuItemSourceKey, normalizeDishName } from './packages/menu-core/dist/index.js';
          import { isCanonicalHtmlMenuItem } from './apps/menu-worker/dist/menu-source-runtime.js';
          const item = (name) => ({
            sourceKey: createMenuItemSourceKey(name), name, normalizedName: normalizeDishName(name),
            description: null, sectionName: null, priceMinor: 20500, currency: 'NOK', position: 0,
            extractionMethod: 'html_heuristic', confidence: 0.9, sourceExcerpt: name,
          });
          const reject = [
            'top of page', 'Rom, cola og lime', 'Vodka, cranberry og lime', 'Mimosa',
            'Black Russian Kahlua', 'White Russian', 'Vodka Cranberry',
            'Aperol, Prosecco, appelsin', 'Hendricks gin, agurk, tonic',
            'Makers mark, eggehvite, sitron', 'Vodka, Ingefærøl og sitron',
            'Jack Daniels, Cointreau, Yuzu, sukkerlake, sitronbrus', 'Classic Mojito',
          ];
          const preserve = [
            'Fish & Chips', 'Sesame Chicken', 'Vegan Burger', 'Rum Raisin Ice Cream',
            'Gin-cured salmon', 'Orange Chicken', 'Whiskey-glazed ribs',
          ];
          const badReject = reject.filter((name) => isCanonicalHtmlMenuItem(item(name)));
          const badPreserve = preserve.filter((name) => !isCanonicalHtmlMenuItem(item(name)));
          console.log(JSON.stringify({ badReject, badPreserve }, null, 2));
          if (badReject.length || badPreserve.length) process.exit(1);
          NODE

      - name: Validate Confusion live with proof filter
        working-directory: apps/menu-worker
        run: node dist/index.js validate:manifest catalog/confusion-oslo.json

      - name: Validate Tyrkisk live with proof filter
        working-directory: apps/menu-worker
        run: node dist/index.js validate:manifest catalog/tyrkisk-kjokken-lindeberg-oslo.json
