name: Fysen stage sharp ramen photo candidates

on:
  push:
    branches: [art/ramen-native-black-master-20261119]
    paths:
      - ".github/workflows/fysen-stage-ramen-alternatives.yml"
      - "scripts/stage-ramen-alternatives.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-ramen-alternatives:
    if: "!contains(github.event.head_commit.message, '[ramen-candidate-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch Pexels original photos and generate audit previews
        run: python scripts/stage-ramen-alternatives.py
      - name: Check candidate source metadata stays unapproved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          folder = Path("assets/fysen-image-candidates/ramen-alternatives")
          entries = list(folder.glob("*/review.json"))
          assert entries
          for path in entries:
              data = json.loads(path.read_text())
              assert data["source_verified"] is True
              assert data["visual_review_completed"] is False
              assert data["approved_for_fysen"] is False
              assert min(data["actual_native_size"]) >= 3000
          print("CANDIDATES staged:", len(entries), "none public")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-ramen-source-review
          path: |
            assets/fysen-image-candidates/ramen-alternatives/*/preview.jpg
            assets/fysen-image-candidates/ramen-alternatives/*/native-detail-1400.jpg
            assets/fysen-image-candidates/ramen-alternatives/*/review.json
          retention-days: 7
          if-no-files-found: error
      - name: Commit to same PR (not public)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/ramen-alternatives
          git diff --cached --quiet && exit 0
          git commit -m "[ramen-candidate-bot] Stage two licensed ramen originals for native-detail review"
          git push origin HEAD:"$GITHUB_REF_NAME"
