name: TEMP Batch 02 Mesob Sawan stage trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-mesob-sawan-stage-trace.yml"

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Capture parser/source policy locations
        shell: bash
        run: |
          mkdir -p trace
          {
            echo '=== cross-origin error location ==='
            grep -R -n -C 12 'Cross-origin crawler redirect blocked' apps/menu-worker/src || true
            echo
            echo '=== redirectOrigins references ==='
            grep -R -n -C 8 'redirectOrigins' apps/menu-worker/src || true
            echo
            echo '=== html source extractor exports ==='
            grep -n '^export ' apps/menu-worker/src/html-source-extractor.ts || true
            echo
            echo '=== related html exports ==='
            grep -n '^export ' apps/menu-worker/src/html-description-title-recovery.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/html-output-canonicalizer.ts || true
          } > trace/source-policy-and-exports.txt
          cat trace/source-policy-and-exports.txt

      - name: Capture Sawan redirect chain from runner
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee trace/sawan-node-redirect-chain.json
          const target='https://www.sawan.no/meny';
          const out=[];
          let current=target;
          for(let hop=0;hop<8;hop++){
            try{
              const response=await fetch(current,{redirect:'manual',headers:{'user-agent':'FysenMenuBot/0.1'},signal:AbortSignal.timeout(20000)});
              out.push({hop,url:current,status:response.status,location:response.headers.get('location'),contentType:response.headers.get('content-type')});
              const loc=response.headers.get('location');
              if(!(response.status>=300&&response.status<400&&loc)) break;
              current=new URL(loc,current).href;
            }catch(error){
              out.push({hop,url:current,error:{name:error?.name??null,message:error?.message??String(error),cause:error?.cause?{name:error.cause.name??null,message:error.cause.message??String(error.cause),code:error.cause.code??null}:null}});
              break;
            }
          }
          console.log(JSON.stringify(out,null,2));
          NODE
          set +e
          curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 40 -A 'FysenMenuBot/0.1' -D trace/sawan-curl-headers.txt -o trace/sawan-final.html -w '%{http_code} %{url_effective}\n' 'https://www.sawan.no/meny' | tee trace/sawan-curl-result.txt
          exit 0

      - name: Capture Mesob raw card structure
        shell: bash
        run: |
          curl -sS -L --max-redirs 8 --connect-timeout 10 --max-time 40 -A 'FysenMenuBot/0.1' -D trace/mesob-curl-headers.txt -o trace/mesob-menu.html 'https://mesobrestaurant.no/menu/'
          {
            echo '=== byte/count overview ==='
            wc -c trace/mesob-menu.html
            printf 'price-like kr nodes: '; grep -Eo 'kr[[:space:]]*[0-9]+([.,][0-9]+)?|[0-9]+([.,][0-9]+)?[[:space:]]*kr' trace/mesob-menu.html | wc -l
            echo
            echo '=== KITFO context ==='
            grep -in -C 18 'KITFO' trace/mesob-menu.html | head -n 180 || true
            echo
            echo '=== DERO WET context ==='
            grep -in -C 18 'DERO WET' trace/mesob-menu.html | head -n 180 || true
            echo
            echo '=== Strawberry context ==='
            grep -in -C 18 'Strawberry cheesecace' trace/mesob-menu.html | head -n 180 || true
          } > trace/mesob-raw-context.txt
          cat trace/mesob-raw-context.txt

      - name: Capture runtime module exports
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee ../../trace/runtime-exports.json
          const modules=['html-source-extractor','html-description-title-recovery','html-text-section-scope','html-output-canonicalizer'];
          const out={};
          for(const name of modules){
            const mod=await import(`./dist/${name}.js`);
            out[name]=Object.entries(mod).map(([key,value])=>({key,type:typeof value,arity:typeof value==='function'?value.length:null}));
          }
          console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-mesob-sawan-stage-trace
          path: trace/**
          if-no-files-found: error
