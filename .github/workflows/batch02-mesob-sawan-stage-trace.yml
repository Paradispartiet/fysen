name: TEMP Batch 02 Mesob Sawan stage trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-mesob-sawan-stage-trace.yml"

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Restore captured Mesob and Sawan source bytes
        shell: bash
        run: |
          mkdir -p trace /tmp/captured
          gh run download 32627799893 --repo "$GITHUB_REPOSITORY" --name batch02-mesob-sawan-stage-trace --dir /tmp/captured
          cp /tmp/captured/mesob-menu.html trace/mesob.html
          cp /tmp/captured/sawan-final.html trace/sawan-menu.html
          sha256sum trace/mesob.html trace/sawan-menu.html | tee trace/captured-source-sha256.txt
          wc -c trace/mesob.html trace/sawan-menu.html | tee trace/captured-source-bytes.txt

      - name: Replay complete HTML runtime stage chain
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee ../../trace/full-runtime-stage-trace.json
          import {readFile} from 'node:fs/promises';
          import {normalizeDishName} from '@fysen/menu-core';
          import {extractHtmlVisibleText,stripExplicitlyHiddenHtmlContent} from './dist/html-extractor.js';
          import {extractScopedHtmlMenu} from './dist/html-source-extractor.js';
          import {normalizeHtmlHeadingLineBreaks} from './dist/html-heading-normalizer.js';
          import {recoverEmbeddedStructuredMenuJson} from './dist/html-embedded-menu-json-recovery.js';
          import {recoverDescriptionNamedHtmlItems} from './dist/html-description-title-recovery.js';
          import {recoverTrailingPriceCardHtmlItems,recoverInlineMarkedPriceTextItems,isStrongNumberedTrailingPriceCardRecovery} from './dist/html-trailing-price-card-recovery.js';
          import {recoverPriceWrappedHtmlItems} from './dist/html-price-wrapped-recovery.js';
          import {recoverAdjacentHeadingPriceHtmlItems} from './dist/html-adjacent-heading-price-recovery.js';
          import {supplementStrongHeadingRecovery} from './dist/html-heading-recovery-supplement.js';
          import {recoverExplicitFromPriceHtmlItems} from './dist/html-explicit-from-price-recovery.js';
          import {recoverFirstCardAfterPlainFoodSections} from './dist/html-section-first-card-recovery.js';
          import {filterHtmlBeverageSectionItemsWithScopedProvenance} from './dist/html-text-section-scope.js';
          import {canonicalizeHtmlOutputItems} from './dist/html-output-canonicalizer.js';
          import {normalizeHtmlPriceNotation,normalizeHtmlItemName,isCanonicalHtmlMenuItem} from './dist/menu-source-runtime.js';

          const brief=(items)=>({count:items.length,names:items.map((x)=>x.name),items:items.map((x)=>({name:x.name,priceMinor:x.priceMinor,sectionName:x.sectionName,position:x.position,confidence:x.confidence,sourceExcerpt:x.sourceExcerpt}))});
          const mergeMissing=(items,recovered)=>{
            if(!recovered.length) return items;
            const output=[...items]; const existing=new Set(items.map((x)=>x.normalizedName));
            for(const candidate of recovered){if(existing.has(candidate.normalizedName)) continue; output.push(candidate); existing.add(candidate.normalizedName);}
            return output.sort((a,b)=>a.position-b.position);
          };
          const mergeFrom=(items,recovered)=>{
            if(!recovered.length) return items;
            const output=[...items];
            for(const candidate of recovered){
              const matches=output.map((item,index)=>({item,index})).filter(({item})=>item.normalizedName===candidate.normalizedName);
              if(matches.length===0){output.push(candidate);continue;}
              if(matches.length!==1) continue;
              const match=matches[0];
              output[match.index]={...match.item,priceMinor:candidate.priceMinor,priceKind:'from',priceMaxMinor:null,confidence:Math.max(match.item.confidence,candidate.confidence),sourceExcerpt:candidate.sourceExcerpt??match.item.sourceExcerpt};
            }
            return output.sort((a,b)=>a.position-b.position);
          };

          const reports={};
          for(const [key,path] of [['mesob','../../trace/mesob.html'],['sawan','../../trace/sawan-menu.html']]){
            const original=await readFile(path,'utf8');
            const normalizedHtml=normalizeHtmlPriceNotation(normalizeHtmlHeadingLineBreaks(original));
            const extracted=extractScopedHtmlMenu(normalizedHtml);
            const recoveryHtml=extracted.method==='html_heuristic'?stripExplicitlyHiddenHtmlContent(normalizedHtml):normalizedHtml;
            const fullVisibleText=extractHtmlVisibleText(recoveryHtml);
            const embedded=recoverEmbeddedStructuredMenuJson(recoveryHtml).filter(isCanonicalHtmlMenuItem);
            const recovered=recoverDescriptionNamedHtmlItems(extracted.items,extracted.visibleText);
            const trailingRaw=recoverTrailingPriceCardHtmlItems(recoveryHtml);
            const trailing=recoverDescriptionNamedHtmlItems(trailingRaw,extracted.visibleText);
            const priceWrapped=recoverPriceWrappedHtmlItems(extracted.visibleText);
            const inlineMarked=recoverInlineMarkedPriceTextItems(extracted.visibleText);
            const headingPrice=recoverAdjacentHeadingPriceHtmlItems(recoveryHtml);
            const explicitFrom=recoverExplicitFromPriceHtmlItems(extracted.visibleText);
            const sectionFirst=recoverFirstCardAfterPlainFoodSections(extracted.visibleText);
            const semanticCategoryCardsPreferred=trailing.length>=4&&trailing.every((item)=>item.sectionName!==null&&item.confidence>=0.99);
            const strongNumberedCardsPreferred=isStrongNumberedTrailingPriceCardRecovery(trailing);
            const isolated=semanticCategoryCardsPreferred||strongNumberedCardsPreferred;
            const trailingQualifies=isolated||(trailing.length>=4&&(recovered.length===0||trailing.length>=Math.max(6,Math.ceil(recovered.length*1.5))));
            const headingThreshold=Math.ceil(recovered.length*0.75);
            const preferred=trailingQualifies?trailing:headingPrice.length>=4&&(recovered.length===0||headingPrice.length>=headingThreshold)?headingPrice:priceWrapped.length>=3&&priceWrapped.length>=recovered.length*2?priceWrapped:recovered;
            const recoveredSupplemented=extracted.method==='html_heuristic'&&!isolated?mergeMissing(preferred,recovered):preferred;
            const headingSupplemented=extracted.method==='html_heuristic'?supplementStrongHeadingRecovery(recoveredSupplemented,headingPrice):recoveredSupplemented;
            const inlineSupplemented=extracted.method==='html_heuristic'&&!isolated?mergeMissing(headingSupplemented,inlineMarked):headingSupplemented;
            const sectionSupplemented=extracted.method==='html_heuristic'&&!isolated?mergeMissing(inlineSupplemented,sectionFirst):inlineSupplemented;
            const wrappedSupplemented=extracted.method==='html_heuristic'&&!isolated?mergeMissing(sectionSupplemented,priceWrapped):sectionSupplemented;
            const priceEnriched=extracted.method==='html_heuristic'&&!isolated?mergeFrom(wrappedSupplemented,explicitFrom):wrappedSupplemented;
            const normalized=priceEnriched.map(normalizeHtmlItemName);
            const canonical=normalized.filter(isCanonicalHtmlMenuItem);
            const beverageScoped=filterHtmlBeverageSectionItemsWithScopedProvenance(canonical,extracted.visibleText,fullVisibleText);
            const output=canonicalizeHtmlOutputItems(beverageScoped);
            reports[key]={
              input:{originalBytes:Buffer.byteLength(original),normalizedBytes:Buffer.byteLength(normalizedHtml),method:extracted.method},
              decisions:{semanticCategoryCardsPreferred,strongNumberedCardsPreferred,isolatedTrailingRecoveryPreferred:isolated,trailingPriceCardQualifies:trailingQualifies,headingPriceCoverageThreshold:headingThreshold,preferredSource:preferred===trailing?'trailing':preferred===headingPrice?'headingPrice':preferred===priceWrapped?'priceWrapped':'recovered'},
              stages:{
                extracted:brief(extracted.items),embedded:brief(embedded),descriptionRecovered:brief(recovered),trailingRaw:brief(trailingRaw),trailingRecovered:brief(trailing),priceWrapped:brief(priceWrapped),inlineMarked:brief(inlineMarked),headingPrice:brief(headingPrice),explicitFrom:brief(explicitFrom),sectionFirst:brief(sectionFirst),preferred:brief(preferred),recoveredSupplemented:brief(recoveredSupplemented),headingSupplemented:brief(headingSupplemented),inlineSupplemented:brief(inlineSupplemented),sectionSupplemented:brief(sectionSupplemented),wrappedSupplemented:brief(wrappedSupplemented),priceEnriched:brief(priceEnriched),normalized:brief(normalized),canonicalFilter:brief(canonical),textSectionScope:brief(beverageScoped),outputCanonical:brief(output)
              }
            };
          }
          console.log(JSON.stringify(reports,null,2));
          NODE

      - name: Emit compact transition summary
        shell: bash
        run: |
          node --input-type=module <<'NODE' | tee trace/full-runtime-transition-summary.json
          import {readFile} from 'node:fs/promises';
          const all=JSON.parse(await readFile('trace/full-runtime-stage-trace.json','utf8'));
          const out={};
          for(const [key,value] of Object.entries(all)){
            out[key]={decisions:value.decisions,counts:Object.fromEntries(Object.entries(value.stages).map(([stage,v])=>[stage,v.count])),names:Object.fromEntries(Object.entries(value.stages).filter(([stage])=>['extracted','descriptionRecovered','preferred','canonicalFilter','textSectionScope','outputCanonical'].includes(stage)).map(([stage,v])=>[stage,v.names]))};
          }
          console.log(JSON.stringify(out,null,2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-mesob-sawan-stage-trace
          path: trace/**
          if-no-files-found: error
