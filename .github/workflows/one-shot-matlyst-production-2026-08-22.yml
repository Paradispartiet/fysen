name: One-shot Matlyst production release 2026-08-22

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-matlyst-production-2026-08-22.yml

permissions:
  contents: read

concurrency:
  group: fysen-vercel-production-release
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: team_mV3NpMYd5l7yGmuZkbTf46y8
  VERCEL_PROJECT_ID: prj_G0Vm4jhCg3hWRvVBSEIt5klHO6sS

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error title=Missing VERCEL_TOKEN::Repository secret VERCEL_TOKEN is required."
            exit 1
          fi

      - name: Checkout locked main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Deploy web explicitly to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          if [[ "$source_sha" != "$GITHUB_SHA" ]]; then
            echo "Locked source $source_sha does not match workflow SHA $GITHUB_SHA" >&2
            exit 1
          fi
          rm -rf .vercel
          pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(
            pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
              --meta "fysenSourceSha=$source_sha" \
              --meta "fysenReleaseMode=manual-matlyst-restore-2026-08-22"
          )"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $deployment_url"

      - name: Verify public production alias
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 \
              'https://fysen.vercel.app/' >/tmp/fysen-home.html; then
              echo "Fysen production alias is reachable for $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for production alias ($attempt/24)"
            sleep 5
          done
          exit 1

      - name: Summarize release
        shell: bash
        run: |
          {
            echo '## One-shot Matlyst production release'
            echo
            echo "- Source: \`$GITHUB_SHA\`"
            echo '- Deployment: `${{ steps.deploy.outputs.deployment_url }}`'
          } >> "$GITHUB_STEP_SUMMARY"
