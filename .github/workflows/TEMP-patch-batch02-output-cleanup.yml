name: TEMP patch Batch 02 output cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply guarded runtime patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'{label}: expected anchor missing in {path}')
              p.write_text(text.replace(old, new, 1))

          # Export full visible text so final section evidence is not limited to food-scoped text.
          replace_once(
              'apps/menu-worker/src/html-extractor.ts',
              'function extractVisibleText(html: string): string {',
              'export function extractHtmlVisibleText(html: string): string {',
              'visible text export',
          )
          replace_once(
              'apps/menu-worker/src/html-extractor.ts',
              '  const visibleText = extractVisibleText(html);',
              '  const visibleText = extractHtmlVisibleText(html);',
              'visible text caller',
          )

          # Prefer a repeated DOM dish-heading that is immediately followed by its price.
          replace_once(
              'apps/menu-worker/src/html-source-extractor.ts',
              'export const HTML_SOURCE_EXTRACTOR_VERSION = "html-v16";',
              'export const HTML_SOURCE_EXTRACTOR_VERSION = "html-v17";',
              'source extractor version',
          )
          source_path = Path('apps/menu-worker/src/html-source-extractor.ts')
          source = source_path.read_text()
          helper_anchor = '''function looksLikeStandaloneBlockTitle(value: string): boolean {\n  const title = canonicalCardTitle(value);\n  if (\n    !plausibleCardTitle(title) ||\n    isBeverageItemName(title) ||\n    isObviousMetadataItem(title) ||\n    isPlainFoodSectionLabel(title)\n  ) {\n    return false;\n  }\n  const words = title.split(/\\s+/).filter(Boolean);\n  if (words.length > 8) return false;\n  if (/[.!?]$/u.test(title) || /[,;:]$/u.test(title)) return false;\n  return !/^(?:with|served|topped|contains?|including|med|servert|toppet|inneholder|inkludert)\\b/iu.test(title);\n}\n'''
          helper = helper_anchor + '''\nfunction looksLikeStandaloneHeadingTitle(value: string): boolean {\n  const title = canonicalCardTitle(value);\n  if (\n    !plausibleCardTitle(title) ||\n    isBeverageItemName(title) ||\n    isObviousMetadataItem(title) ||\n    isPlainFoodSectionLabel(title)\n  ) {\n    return false;\n  }\n  const words = title.split(/\\s+/).filter(Boolean);\n  if (words.length > 16 || /[,;:]$/u.test(title)) return false;\n  return !/^(?:with|served|topped|contains?|including|med|servert|toppet|inneholder|inkludert)\\b/iu.test(title);\n}\n'''
          if 'function looksLikeStandaloneHeadingTitle' not in source:
              if helper_anchor not in source:
                  raise SystemExit('standalone heading helper anchor missing')
              source = source.replace(helper_anchor, helper, 1)

          old_heading_block = '''      const firstContent = firstContentIndex === null ? "" : lines[firstContentIndex] ?? "";\n      const repeatedLevel = hasRepeatedHeadingLevel(headingLevels, lastHeading);\n      const strongUniqueCard = !repeatedLevel && looksLikeStrongDescriptionLine(firstContent);\n      if (firstContent && looksLikeDescriptionLine(firstContent) && (repeatedLevel || strongUniqueCard)) {\n        const headingTitle = recoveredTitle(lines, lastHeading, headingLevels);\n        if (headingTitle && looksLikeStandaloneBlockTitle(headingTitle)) {\n          titleIndex = lastHeading;\n          name = headingTitle;\n        }\n      }\n'''
          new_heading_block = '''      const firstContent = firstContentIndex === null ? "" : lines[firstContentIndex] ?? "";\n      const repeatedLevel = hasRepeatedHeadingLevel(headingLevels, lastHeading);\n      const strongUniqueCard = !repeatedLevel && looksLikeStrongDescriptionLine(firstContent);\n      const headingTitle = recoveredTitle(lines, lastHeading, headingLevels);\n      const directRepeatedHeadingPrice = firstContentIndex === null && repeatedLevel;\n      const descriptionAnchoredHeading =\n        Boolean(firstContent) &&\n        looksLikeDescriptionLine(firstContent) &&\n        (repeatedLevel || strongUniqueCard);\n      if (\n        headingTitle &&\n        ((directRepeatedHeadingPrice && looksLikeStandaloneHeadingTitle(headingTitle)) ||\n          (descriptionAnchoredHeading && looksLikeStandaloneBlockTitle(headingTitle)))\n      ) {\n        titleIndex = lastHeading;\n        name = headingTitle;\n      }\n'''
          if new_heading_block not in source:
              if old_heading_block not in source:
                  raise SystemExit('standalone heading selection anchor missing')
              source = source.replace(old_heading_block, new_heading_block, 1)
          source_path.write_text(source)

          # Preserve beverage-section evidence when visible item lines carry allergen suffixes.
          replace_once(
              'apps/menu-worker/src/html-text-section-scope.ts',
              'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v5";',
              'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v6";',
              'text section version',
          )
          scope_path = Path('apps/menu-worker/src/html-text-section-scope.ts')
          scope = scope_path.read_text()
          allergen_anchor = 'const TRAILING_LEADER = /\\s*_{3,}\\s*$/u;\n'
          allergen_insert = allergen_anchor + '''const TRAILING_ITEM_ALLERGEN_CODES =\n  /\\s+\\((?:[\\p{L}\\d]{1,5}\\s*(?:[,/+ ]\\s*)?){1,20}\\)$/u;\n'''
          if 'const TRAILING_ITEM_ALLERGEN_CODES' not in scope:
              if allergen_anchor not in scope:
                  raise SystemExit('text section allergen anchor missing')
              scope = scope.replace(allergen_anchor, allergen_insert, 1)
          line_old = '''function lineReferencesItem(line: string, itemName: string): boolean {\n  const normalizedLine = normalizeDishName(line);\n  const normalizedName = normalizeDishName(itemName);\n'''
          line_new = '''function lineReferencesItem(line: string, itemName: string): boolean {\n  const evidenceLine = normalizeLine(line)\n    .replace(TRAILING_ITEM_ALLERGEN_CODES, "")\n    .trim();\n  const normalizedLine = normalizeDishName(evidenceLine);\n  const normalizedName = normalizeDishName(itemName);\n'''
          if line_new not in scope:
              if line_old not in scope:
                  raise SystemExit('line evidence anchor missing')
              scope = scope.replace(line_old, line_new, 1)
          scope_path.write_text(scope)

          # Run final beverage scope against full HTML evidence and then structural output canonicalization.
          runtime_path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          runtime = runtime_path.read_text()
          extractor_import_old = 'import { HTML_EXTRACTOR_VERSION } from "./html-extractor.js";\n'
          extractor_import_new = '''import {\n  extractHtmlVisibleText,\n  HTML_EXTRACTOR_VERSION,\n} from "./html-extractor.js";\n'''
          if 'extractHtmlVisibleText' not in runtime:
              if extractor_import_old not in runtime:
                  raise SystemExit('runtime html extractor import anchor missing')
              runtime = runtime.replace(extractor_import_old, extractor_import_new, 1)
          source_import_anchor = '''import {\n  extractScopedHtmlMenu,\n  HTML_SOURCE_EXTRACTOR_VERSION,\n} from "./html-source-extractor.js";\n'''
          canonicalizer_import = source_import_anchor + '''import {\n  canonicalizeHtmlOutputItems,\n  HTML_OUTPUT_CANONICALIZER_VERSION,\n} from "./html-output-canonicalizer.js";\n'''
          if 'HTML_OUTPUT_CANONICALIZER_VERSION' not in runtime:
              if source_import_anchor not in runtime:
                  raise SystemExit('runtime canonicalizer import anchor missing')
              runtime = runtime.replace(source_import_anchor, canonicalizer_import, 1)
          version_old = 'const HTML_RUNTIME_EXTRACTOR_VERSION = `${HTML_SOURCE_EXTRACTOR_VERSION}+${HTML_EXTRACTOR_VERSION}+${HTML_DESCRIPTION_TITLE_RECOVERY_VERSION}+${HTML_HEADING_NORMALIZER_VERSION}+${HTML_PRICE_NOTATION_NORMALIZER_VERSION}+${HTML_ITEM_NAME_NORMALIZER_VERSION}+${HTML_NON_DISH_FILTER_VERSION}+${HTML_BEVERAGE_FILTER_VERSION}+${HTML_TRAILING_PRICE_CARD_RECOVERY_VERSION}+${HTML_PRICE_WRAPPED_RECOVERY_VERSION}+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}+${HTML_EXPLICIT_FROM_PRICE_RECOVERY_VERSION}+${HTML_SECTION_FIRST_CARD_RECOVERY_VERSION}+${HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION}+${HTML_TEXT_SECTION_SCOPE_VERSION}`;\n'
          version_new = 'const HTML_RUNTIME_EXTRACTOR_VERSION = `${HTML_SOURCE_EXTRACTOR_VERSION}+${HTML_EXTRACTOR_VERSION}+${HTML_DESCRIPTION_TITLE_RECOVERY_VERSION}+${HTML_HEADING_NORMALIZER_VERSION}+${HTML_PRICE_NOTATION_NORMALIZER_VERSION}+${HTML_ITEM_NAME_NORMALIZER_VERSION}+${HTML_NON_DISH_FILTER_VERSION}+${HTML_BEVERAGE_FILTER_VERSION}+${HTML_TRAILING_PRICE_CARD_RECOVERY_VERSION}+${HTML_PRICE_WRAPPED_RECOVERY_VERSION}+${HTML_ADJACENT_HEADING_PRICE_RECOVERY_VERSION}+${HTML_HEADING_RECOVERY_SUPPLEMENT_VERSION}+${HTML_EXPLICIT_FROM_PRICE_RECOVERY_VERSION}+${HTML_SECTION_FIRST_CARD_RECOVERY_VERSION}+${HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION}+${HTML_TEXT_SECTION_SCOPE_VERSION}+${HTML_OUTPUT_CANONICALIZER_VERSION}`;\n'
          if version_new not in runtime:
              if version_old not in runtime:
                  raise SystemExit('runtime version anchor missing')
              runtime = runtime.replace(version_old, version_new, 1)
          normalized_anchor = '''    const normalizedHtml = normalizeHtmlPriceNotation(\n      normalizeHtmlHeadingLineBreaks(fetched.body),\n    );\n    const extracted = extractScopedHtmlMenu(normalizedHtml);\n'''
          normalized_new = '''    const normalizedHtml = normalizeHtmlPriceNotation(\n      normalizeHtmlHeadingLineBreaks(fetched.body),\n    );\n    const fullVisibleText = extractHtmlVisibleText(normalizedHtml);\n    const extracted = extractScopedHtmlMenu(normalizedHtml);\n'''
          if 'const fullVisibleText = extractHtmlVisibleText(normalizedHtml);' not in runtime:
              if normalized_anchor not in runtime:
                  raise SystemExit('runtime full visible anchor missing')
              runtime = runtime.replace(normalized_anchor, normalized_new, 1)
          final_old = '''    const canonicalItems = normalizedItems.filter(isCanonicalHtmlMenuItem);\n    const items =\n      extracted.method === "html_heuristic"\n        ? filterPlainTextBeverageSectionItems(\n            canonicalItems,\n            extracted.visibleText,\n          )\n        : canonicalItems;\n'''
          final_new = '''    const canonicalItems = normalizedItems.filter(isCanonicalHtmlMenuItem);\n    const beverageScopedItems =\n      extracted.method === "html_heuristic"\n        ? filterPlainTextBeverageSectionItems(canonicalItems, fullVisibleText)\n        : canonicalItems;\n    const items =\n      extracted.method === "html_heuristic"\n        ? canonicalizeHtmlOutputItems(beverageScopedItems)\n        : beverageScopedItems;\n'''
          if final_new not in runtime:
              if final_old not in runtime:
                  raise SystemExit('runtime final output anchor missing')
              runtime = runtime.replace(final_old, final_new, 1)
          runtime_path.write_text(runtime)

          # Lock version contracts in existing tests.
          replace_once(
              'apps/menu-worker/src/html-source-extractor.test.ts',
              'expect(HTML_SOURCE_EXTRACTOR_VERSION).toBe("html-v16");',
              'expect(HTML_SOURCE_EXTRACTOR_VERSION).toBe("html-v17");',
              'source extractor test version',
          )
          replace_once(
              'apps/menu-worker/src/html-text-section-scope.test.ts',
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v5");',
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v6");',
              'text scope test version',
          )

          version_test_path = Path('apps/menu-worker/src/menu-source-runtime-version.test.ts')
          version_test = version_test_path.read_text()
          import_anchor = 'import { HTML_SOURCE_EXTRACTOR_VERSION } from "./html-source-extractor.js";\n'
          import_new = import_anchor + 'import { HTML_OUTPUT_CANONICALIZER_VERSION } from "./html-output-canonicalizer.js";\n'
          if 'HTML_OUTPUT_CANONICALIZER_VERSION' not in version_test:
              if import_anchor not in version_test:
                  raise SystemExit('version test canonicalizer import anchor missing')
              version_test = version_test.replace(import_anchor, import_new, 1)
          array_old = '''      HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION,\n      HTML_TEXT_SECTION_SCOPE_VERSION,\n    ].join("+");\n'''
          array_new = '''      HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION,\n      HTML_TEXT_SECTION_SCOPE_VERSION,\n      HTML_OUTPUT_CANONICALIZER_VERSION,\n    ].join("+");\n'''
          if array_new not in version_test:
              if array_old not in version_test:
                  raise SystemExit('version test array anchor missing')
              version_test = version_test.replace(array_old, array_new, 1)
          version_test = version_test.replace(
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v5");',
              'expect(HTML_TEXT_SECTION_SCOPE_VERSION).toBe("text-section-scope-v6");\n    expect(HTML_OUTPUT_CANONICALIZER_VERSION).toBe("output-canonical-v1");',
              1,
          )
          version_test_path.write_text(version_test)
          PY

          git diff --check
          git diff -- apps/menu-worker/src/html-extractor.ts apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/html-source-extractor.test.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts

      - name: Commit permanent patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-extractor.ts apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/html-source-extractor.test.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clean structural HTML output artifacts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
