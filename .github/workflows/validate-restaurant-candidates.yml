name: TEMP patch Finstua scoped provenance

on:
  push:
    branches:
      - fix/finstua-allergen-price-blocks-20260926

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Finstua text-scope patch and self-clean
        shell: bash
        env:
          BASE_SHA: eb7681d3cd5ec63a56919a1ecbe18cb748875857
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path("apps/menu-worker/src/html-text-section-scope.ts")
          text = source.read_text()

          replacements = [
              (
                  'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v16";',
                  'export const HTML_TEXT_SECTION_SCOPE_VERSION = "text-section-scope-v17";',
              ),
              (
                  '''interface BeverageSectionFilterOptions {\n  readonly matchTrailingAllergenCodes?: boolean;\n}''',
                  '''interface BeverageSectionFilterOptions {\n  readonly matchTrailingAllergenCodes?: boolean;\n  readonly allowUnknownDirectPricedDescription?: boolean;\n}''',
              ),
              (
                  '''    const allowDirectPricedFoodDescription =\n      looksLikeDescriptionFragment(item.name) &&\n      hasDirectPriceSourceProvenance(item) &&\n      evidence.hasFoodOccurrence &&\n      !evidence.hasBeverageOccurrence;''',
                  '''    const allowDirectPricedFoodDescription =\n      looksLikeDescriptionFragment(item.name) &&\n      hasDirectPriceSourceProvenance(item) &&\n      !evidence.hasBeverageOccurrence &&\n      (evidence.hasFoodOccurrence ||\n        options.allowUnknownDirectPricedDescription === true);''',
              ),
              (
                  '''  const scopedFiltered = filterPlainTextBeverageSectionItems(\n    scopedItems,\n    scopedVisibleText,\n  );''',
                  '''  const scopedFiltered = filterPlainTextBeverageSectionItems(\n    scopedItems,\n    scopedVisibleText,\n    { allowUnknownDirectPricedDescription: true },\n  );''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one source match, got {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)
          source.write_text(text)

          test = Path("apps/menu-worker/src/html-text-section-scope-finstua-regression.test.ts")
          t = test.read_text()
          marker = "\n});\n"
          pos = t.rfind(marker)
          if pos < 0:
              raise SystemExit("test suite closing marker not found")
          addition = r'''

  it("keeps scoped direct-priced descriptions when the scoped slice starts after the section heading", () => {
    const charcuterie =
      "Spekefjøl med tronfjellskinke, speket elgpølse og fenalår serveres med ramsløkost, pickles, rømme og flatbrød";
    const toast =
      "Toast Skagen servert på kefirbrød med ørretrogn, sitron og pepperrot";
    const items = [
      item(charcuterie, 31500, `${charcuterie} — (M, G1, G2, S) — Kr. 315,-`),
      item(toast, 32500, `${toast} — (SK, M, G1, E, SP) — Kr. 325,-`),
    ];
    const scopedVisibleText = [
      charcuterie,
      "(M, G1, G2, S)",
      "Kr. 315,-",
      toast,
      "(SK, M, G1, E, SP)",
      "Kr. 325,-",
    ].join("\n");
    const fullVisibleText = [
      "Lunsjretter",
      charcuterie,
      "(M, G1, G2, S)",
      "Kr. 315,-",
      "Sandwiches",
      toast,
      "(SK, M, G1, E, SP)",
      "Kr. 325,-",
    ].join("\n");

    const result = filterHtmlBeverageSectionItemsWithScopedProvenance(
      items,
      scopedVisibleText,
      fullVisibleText,
    );

    expect(result.map((entry) => entry.name)).toEqual([
      charcuterie,
      toast,
    ]);
  });'''
          test.write_text(t[:pos] + addition + t[pos:])
          PY

          git show "$BASE_SHA:.github/workflows/validate-restaurant-candidates.yml" > .github/workflows/validate-restaurant-candidates.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src/html-text-section-scope.ts \
                  apps/menu-worker/src/html-text-section-scope-finstua-regression.test.ts \
                  .github/workflows/validate-restaurant-candidates.yml
          git commit -m "Fix scoped direct-price provenance for Finstua"
          git push origin "HEAD:${GITHUB_REF_NAME}"
