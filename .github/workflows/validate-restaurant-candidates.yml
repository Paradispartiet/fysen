name: Validate Fysen restaurant changes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "apps/menu-worker/candidates/*.json"
      - "apps/menu-worker/catalog/*.json"
      - "apps/menu-worker/src/**"
      - "packages/menu-core/src/**"
      - ".github/workflows/validate-restaurant-candidates.yml"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path relative to apps/menu-worker, e.g. candidates/example.json, catalog/example.json or a directory"
        required: true
        default: "candidates"
        type: string

permissions:
  contents: read

concurrency:
  group: fysen-restaurant-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Collect exact-head PR proof manifests
        if: github.event_name == 'pull_request'
        id: proof
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          proof_file="$RUNNER_TEMP/fysen-proof-manifests.txt"
          changed_file="$RUNNER_TEMP/fysen-changed-files.txt"
          : > "$proof_file"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"

          # Manifest changes prove themselves. Deleted manifests are intentionally
          # excluded because there is no source contract left to validate.
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/menu-worker/candidates/*.json' \
            'apps/menu-worker/catalog/*.json' \
            | sed 's#^apps/menu-worker/##' \
            >> "$proof_file"

          runtime_changed=false
          while IFS= read -r path; do
            case "$path" in
              apps/menu-worker/src/*.test.ts|packages/menu-core/src/*.test.ts)
                ;;
              apps/menu-worker/src/*|packages/menu-core/src/*)
                runtime_changed=true
                ;;
            esac
          done < "$changed_file"

          # A parser/runtime PR can request concrete live proofs directly in its
          # normal PR body. This replaces disposable proof branches/workflows.
          requested="$(
            printf '%s\n' "$PR_BODY" \
              | sed -nE 's/^[[:space:]]*Live-proof manifests:[[:space:]]*(.*)$/\1/ip' \
              | tail -n 1
          )"

          if [[ -n "${requested//[[:space:]]/}" ]]; then
            IFS=',' read -ra entries <<< "$requested"
            for raw in "${entries[@]}"; do
              manifest="$(printf '%s' "$raw" | xargs)"
              [[ -n "$manifest" ]] || continue
              case "$manifest" in
                catalog/*.json|candidates/*.json)
                  ;;
                *)
                  echo "Live-proof manifest must be catalog/*.json or candidates/*.json: $manifest" >&2
                  exit 1
                  ;;
              esac
              case "$manifest" in
                *..*)
                  echo "Live-proof manifest may not contain '..': $manifest" >&2
                  exit 1
                  ;;
              esac
              if [[ ! -f "apps/menu-worker/$manifest" ]]; then
                echo "Requested live-proof manifest does not exist on PR head: $manifest" >&2
                exit 1
              fi
              echo "$manifest" >> "$proof_file"
            done
          fi

          sort -u "$proof_file" -o "$proof_file"

          if [[ "$runtime_changed" == "true" && ! -s "$proof_file" ]]; then
            cat >&2 <<'EOF'
          Menu runtime code changed, but this PR declares no concrete live-source proof.
          Add a line to the PR body, for example:
          Live-proof manifests: catalog/example-oslo.json
          The permanent workflow will validate it on this exact PR head; do not create a TEMP proof PR.
          EOF
            exit 1
          fi

          echo "Runtime changed: $runtime_changed"
          echo "Exact-head live-proof manifests:"
          cat "$proof_file" || true
          echo "proof_file=$proof_file" >> "$GITHUB_OUTPUT"

      - name: Strictly validate changed/requested manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROOF_FILE: ${{ steps.proof.outputs.proof_file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PROOF_FILE" ]]; then
            echo "No restaurant manifests require live validation."
            exit 0
          fi

          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            echo "Strict live validation: $manifest"
            # validate:manifest performs one direct validation; it does not hide
            # a first-pass failure behind batch retry behavior.
            pnpm --filter @fysen/menu-worker validate:manifest "$manifest"
          done < "$PROOF_FILE"

      - name: TEMP inspect Finstua recovery families
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 888
        working-directory: apps/menu-worker
        shell: bash
        env:
          FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
        run: |
          node --input-type=module <<'NODE'
          import {
            extractMenuSource,
            fetchMenuSource,
            isCanonicalHtmlMenuItem,
            normalizeHtmlItemName,
            normalizeHtmlPriceNotation,
          } from './dist/menu-source-runtime.js';
          import { stripExplicitlyHiddenHtmlContent } from './dist/html-extractor.js';
          import { normalizeHtmlHeadingLineBreaks } from './dist/html-heading-normalizer.js';
          import { extractScopedHtmlMenu } from './dist/html-source-extractor.js';
          import { recoverEmbeddedStructuredMenuJson } from './dist/html-embedded-menu-json-recovery.js';
          import { recoverDescriptionNamedHtmlItems } from './dist/html-description-title-recovery.js';
          import {
            recoverInlineMarkedPriceTextItems,
            recoverTrailingPriceCardHtmlItems,
          } from './dist/html-trailing-price-card-recovery.js';
          import { recoverPriceWrappedHtmlItems } from './dist/html-price-wrapped-recovery.js';
          import { recoverAdjacentHeadingPriceHtmlItems } from './dist/html-adjacent-heading-price-recovery.js';
          import { recoverStrongTitlePriceHtmlItems } from './dist/html-strong-title-price-recovery.js';
          import { recoverExplicitFromPriceHtmlItems } from './dist/html-explicit-from-price-recovery.js';
          import { recoverFirstCardAfterPlainFoodSections } from './dist/html-section-first-card-recovery.js';

          const input = {
            url: 'https://www.frognerseteren.no/restaurant-finstua-meny',
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: process.env.FYSEN_MENU_BOT_USER_AGENT ?? 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
            maxResponseBytes: 4194304,
            sourceSupport: { redirectOrigins: [], browserDataOrigins: [] },
          };

          const fetched = await fetchMenuSource(input);
          if (fetched.kind !== 'content') throw new Error(`Unexpected fetch kind ${fetched.kind}`);
          const normalizedHtml = normalizeHtmlPriceNotation(normalizeHtmlHeadingLineBreaks(fetched.body));
          const scoped = extractScopedHtmlMenu(normalizedHtml);
          const recoveryHtml = stripExplicitlyHiddenHtmlContent(normalizedHtml);
          const rawTrailing = recoverTrailingPriceCardHtmlItems(recoveryHtml);
          const families = {
            scoped: scoped.items,
            recovered: recoverDescriptionNamedHtmlItems(scoped.items, scoped.visibleText),
            rawTrailing,
            trailing: recoverDescriptionNamedHtmlItems(rawTrailing, scoped.visibleText),
            wrapped: recoverPriceWrappedHtmlItems(scoped.visibleText),
            inline: recoverInlineMarkedPriceTextItems(scoped.visibleText),
            heading: recoverAdjacentHeadingPriceHtmlItems(recoveryHtml),
            strong: recoverStrongTitlePriceHtmlItems(recoveryHtml),
            explicitFrom: recoverExplicitFromPriceHtmlItems(scoped.visibleText),
            sectionFirst: recoverFirstCardAfterPlainFoodSections(scoped.visibleText),
            embedded: recoverEmbeddedStructuredMenuJson(recoveryHtml).filter(isCanonicalHtmlMenuItem),
          };
          const final = await extractMenuSource('html', fetched);

          const compact = (items) => items.map((item) => ({
            name: item.name,
            priceMinor: item.priceMinor,
            sectionName: item.sectionName,
            confidence: item.confidence,
          }));
          for (const [name, items] of Object.entries(families)) {
            const canonical = items.map(normalizeHtmlItemName).filter(isCanonicalHtmlMenuItem);
            console.log(`\n=== FAMILY ${name} raw=${items.length} canonical=${canonical.length} ===`);
            console.log(JSON.stringify(compact(items), null, 2));
          }
          console.log(`\n=== FINAL count=${final.items.length} version=${final.extractorVersion} ===`);
          console.log(JSON.stringify(compact(final.items), null, 2));
          NODE

      - name: Validate requested manifest or directory
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          case "$MANIFEST_PATH" in
            /*|*".."*)
              echo "manifest_path must stay inside apps/menu-worker" >&2
              exit 1
              ;;
            *.json)
              pnpm --filter @fysen/menu-worker validate:manifest "$MANIFEST_PATH"
              ;;
            *)
              pnpm --filter @fysen/menu-worker validate:batch "$MANIFEST_PATH"
              ;;
          esac
