name: Validate Fysen restaurant changes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "apps/menu-worker/candidates/*.json"
      - "apps/menu-worker/catalog/*.json"
      - "apps/menu-worker/src/**"
      - "packages/menu-core/src/**"
      - ".github/workflows/validate-restaurant-candidates.yml"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path relative to apps/menu-worker, e.g. candidates/example.json, catalog/example.json or a directory"
        required: true
        default: "candidates"
        type: string

permissions:
  contents: read

concurrency:
  group: fysen-restaurant-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: TEMP inspect Finstua runtime selection
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { normalizeHtmlHeadingLineBreaks } from "./apps/menu-worker/dist/html-heading-normalizer.js";
          import { stripExplicitlyHiddenHtmlContent } from "./apps/menu-worker/dist/html-extractor.js";
          import { extractScopedHtmlMenu } from "./apps/menu-worker/dist/html-source-extractor.js";
          import { recoverDescriptionNamedHtmlItems } from "./apps/menu-worker/dist/html-description-title-recovery.js";
          import {
            recoverTrailingPriceCardHtmlItems,
            isStrongDirectTrailingPriceCardRecovery,
            isStrongNumberedTrailingPriceCardRecovery,
          } from "./apps/menu-worker/dist/html-trailing-price-card-recovery.js";
          import { recoverPriceWrappedHtmlItems } from "./apps/menu-worker/dist/html-price-wrapped-recovery.js";
          import { recoverAdjacentHeadingPriceHtmlItems } from "./apps/menu-worker/dist/html-adjacent-heading-price-recovery.js";
          import { recoverStrongTitlePriceHtmlItems } from "./apps/menu-worker/dist/html-strong-title-price-recovery.js";
          import { recoverExplicitFromPriceHtmlItems } from "./apps/menu-worker/dist/html-explicit-from-price-recovery.js";
          import { recoverFirstCardAfterPlainFoodSections } from "./apps/menu-worker/dist/html-section-first-card-recovery.js";
          import {
            extractMenuSource,
            fetchMenuSource,
            isCanonicalHtmlMenuItem,
            normalizeHtmlPriceNotation,
            shouldPreferDominantHeadingRecovery,
          } from "./apps/menu-worker/dist/menu-source-runtime.js";

          const manifest = JSON.parse(
            fs.readFileSync("./apps/menu-worker/catalog/frognerseteren-finstua-oslo.json", "utf8"),
          );
          const source = manifest.menuSource;
          const fetched = await fetchMenuSource({
            url: source.url,
            sourceType: source.sourceType,
            fetchMode: source.fetchMode,
            userAgent: source.userAgent,
            etag: null,
            lastModified: null,
            maxResponseBytes: source.maxResponseBytes ?? null,
            sourceSupport: source.sourceSupport,
          });
          if (fetched.kind !== "content") throw new Error("Expected live content");

          const normalizedHtml = normalizeHtmlPriceNotation(
            normalizeHtmlHeadingLineBreaks(fetched.body),
          );
          const scoped = extractScopedHtmlMenu(normalizedHtml);
          const recoveryHtml = stripExplicitlyHiddenHtmlContent(normalizedHtml);
          const recovered = recoverDescriptionNamedHtmlItems(scoped.items, scoped.visibleText);
          const trailingRaw = recoverTrailingPriceCardHtmlItems(recoveryHtml);
          const trailing = recoverDescriptionNamedHtmlItems(trailingRaw, scoped.visibleText);
          const wrapped = recoverPriceWrappedHtmlItems(scoped.visibleText);
          const inline = recoverTrailingPriceCardHtmlItems ? [] : [];
          const heading = recoverAdjacentHeadingPriceHtmlItems(recoveryHtml);
          const strong = recoverStrongTitlePriceHtmlItems(recoveryHtml);
          const from = recoverExplicitFromPriceHtmlItems(scoped.visibleText);
          const sectionFirst = recoverFirstCardAfterPlainFoodSections(scoped.visibleText);

          const strongPreferred =
            strong.length >= 6 &&
            strong.length >= recovered.length &&
            strong.length >= trailing.length;
          const semanticTrailing =
            trailing.length >= 4 &&
            trailing.every((item) => item.sectionName !== null && item.confidence >= 0.99);
          const numberedTrailing = isStrongNumberedTrailingPriceCardRecovery(trailing);
          const directTrailing =
            isStrongDirectTrailingPriceCardRecovery(trailing) &&
            trailing.length >= recovered.length;
          const isolatedTrailing = semanticTrailing || numberedTrailing || directTrailing;
          const headingDominates = shouldPreferDominantHeadingRecovery(
            heading.length,
            trailing.length,
            recovered.length,
          );
          const isolatedSemantic = isolatedTrailing || strongPreferred || headingDominates;
          const trailingQualifies =
            isolatedTrailing ||
            (trailing.length >= 4 &&
              (recovered.length === 0 ||
                trailing.length >= Math.max(6, Math.ceil(recovered.length * 1.5))));
          const headingThreshold = Math.ceil(recovered.length * 0.75);
          const headingCoverage =
            heading.length >= 4 &&
            (recovered.length === 0 || heading.length >= headingThreshold);
          const wrappedDominates =
            wrapped.length >= 3 && wrapped.length >= recovered.length * 2;

          let preferred = "recovered";
          if (strongPreferred) preferred = "strong";
          else if (headingDominates) preferred = "heading";
          else if (isolatedTrailing) preferred = "trailing-isolated";
          else if (trailingQualifies) preferred = "trailing-qualified";
          else if (headingCoverage) preferred = "heading-coverage";
          else if (wrappedDominates) preferred = "wrapped";

          console.log("Finstua family counts", JSON.stringify({
            scoped: scoped.items.length,
            recovered: recovered.length,
            trailing: trailing.length,
            heading: heading.length,
            strong: strong.length,
            wrapped: wrapped.length,
            from: from.length,
            sectionFirst: sectionFirst.length,
          }));
          console.log("Finstua selection", JSON.stringify({
            strongPreferred,
            semanticTrailing,
            numberedTrailing,
            directTrailing,
            isolatedTrailing,
            headingDominates,
            isolatedSemantic,
            trailingQualifies,
            headingThreshold,
            headingCoverage,
            wrappedDominates,
            preferred,
          }));
          const dump = (label, items) => {
            const canonical = items.filter(isCanonicalHtmlMenuItem);
            console.log(`Finstua ${label}: raw=${items.length} canonical=${canonical.length}`);
            for (const item of canonical) {
              console.log(`Finstua ${label}: ${item.priceMinor} :: ${item.name}`);
            }
          };
          dump("heading", heading);
          dump("wrapped", wrapped);
          const final = await extractMenuSource(source.sourceType, fetched);
          console.log(`Finstua final: ${final.items.length}`);
          for (const item of final.items) {
            console.log(`Finstua final: ${item.priceMinor} :: ${item.name}`);
          }
          NODE

      - name: Collect exact-head PR proof manifests
        if: github.event_name == 'pull_request'
        id: proof
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          proof_file="$RUNNER_TEMP/fysen-proof-manifests.txt"
          changed_file="$RUNNER_TEMP/fysen-changed-files.txt"
          : > "$proof_file"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"

          # Manifest changes prove themselves. Deleted manifests are intentionally
          # excluded because there is no source contract left to validate.
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/menu-worker/candidates/*.json' \
            'apps/menu-worker/catalog/*.json' \
            | sed 's#^apps/menu-worker/##' \
            >> "$proof_file"

          runtime_changed=false
          while IFS= read -r path; do
            case "$path" in
              apps/menu-worker/src/*.test.ts|packages/menu-core/src/*.test.ts)
                ;;
              apps/menu-worker/src/*|packages/menu-core/src/*)
                runtime_changed=true
                ;;
            esac
          done < "$changed_file"

          # A parser/runtime PR can request concrete live proofs directly in its
          # normal PR body. This replaces disposable proof branches/workflows.
          requested="$(
            printf '%s\n' "$PR_BODY" \
              | sed -nE 's/^[[:space:]]*Live-proof manifests:[[:space:]]*(.*)$/\1/ip' \
              | tail -n 1
          )"

          if [[ -n "${requested//[[:space:]]/}" ]]; then
            IFS=',' read -ra entries <<< "$requested"
            for raw in "${entries[@]}"; do
              manifest="$(printf '%s' "$raw" | xargs)"
              [[ -n "$manifest" ]] || continue
              case "$manifest" in
                catalog/*.json|candidates/*.json)
                  ;;
                *)
                  echo "Live-proof manifest must be catalog/*.json or candidates/*.json: $manifest" >&2
                  exit 1
                  ;;
              esac
              case "$manifest" in
                *..*)
                  echo "Live-proof manifest may not contain '..': $manifest" >&2
                  exit 1
                  ;;
              esac
              if [[ ! -f "apps/menu-worker/$manifest" ]]; then
                echo "Requested live-proof manifest does not exist on PR head: $manifest" >&2
                exit 1
              fi
              echo "$manifest" >> "$proof_file"
            done
          fi

          sort -u "$proof_file" -o "$proof_file"

          if [[ "$runtime_changed" == "true" && ! -s "$proof_file" ]]; then
            cat >&2 <<'EOF'
          Menu runtime code changed, but this PR declares no concrete live-source proof.
          Add a line to the PR body, for example:
          Live-proof manifests: catalog/example-oslo.json
          The permanent workflow will validate it on this exact PR head; do not create a TEMP proof PR.
          EOF
            exit 1
          fi

          echo "Runtime changed: $runtime_changed"
          echo "Exact-head live-proof manifests:"
          cat "$proof_file" || true
          echo "proof_file=$proof_file" >> "$GITHUB_OUTPUT"

      - name: Strictly validate changed/requested manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROOF_FILE: ${{ steps.proof.outputs.proof_file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PROOF_FILE" ]]; then
            echo "No restaurant manifests require live validation."
            exit 0
          fi

          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            echo "Strict live validation: $manifest"
            # validate:manifest performs one direct validation; it does not hide
            # a first-pass failure behind batch retry behavior.
            pnpm --filter @fysen/menu-worker validate:manifest "$manifest"
          done < "$PROOF_FILE"

      - name: Validate requested manifest or directory
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          case "$MANIFEST_PATH" in
            /*|*".."*)
              echo "manifest_path must stay inside apps/menu-worker" >&2
              exit 1
              ;;
            *.json)
              pnpm --filter @fysen/menu-worker validate:manifest "$MANIFEST_PATH"
              ;;
            *)
              pnpm --filter @fysen/menu-worker validate:batch "$MANIFEST_PATH"
              ;;
          esac
