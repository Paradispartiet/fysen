name: Validate Fysen restaurant changes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "apps/menu-worker/candidates/*.json"
      - "apps/menu-worker/catalog/*.json"
      - "apps/menu-worker/src/**"
      - "packages/menu-core/src/**"
      - ".github/workflows/validate-restaurant-candidates.yml"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path relative to apps/menu-worker, e.g. candidates/example.json, catalog/example.json or a directory"
        required: true
        default: "candidates"
        type: string

permissions:
  contents: read

concurrency:
  # Targeted PR proofs must not queue behind an older explicitly requested
  # complete-catalog scan. Keep cancellation within each test scope.
  group: "fysen-restaurant-proof-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Live-proof catalog: true') && 'full' || 'targeted' }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Full-catalog proof uses the same time budget as the nightly catalog job.
    timeout-minutes: "${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Live-proof catalog: true') && 90 || 20 }}"
    env:
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Collect exact-head PR proof manifests
        if: github.event_name == 'pull_request'
        id: proof
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          proof_file="$RUNNER_TEMP/fysen-proof-manifests.txt"
          changed_file="$RUNNER_TEMP/fysen-changed-files.txt"
          : > "$proof_file"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"

          # Manifest changes prove themselves. Deleted manifests are intentionally
          # excluded because there is no source contract left to validate.
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
            'apps/menu-worker/candidates/*.json' \
            'apps/menu-worker/catalog/*.json' \
            | sed 's#^apps/menu-worker/##' \
            >> "$proof_file"

          runtime_changed=false
          while IFS= read -r path; do
            case "$path" in
              apps/menu-worker/src/*.test.ts|packages/menu-core/src/*.test.ts)
                ;;
              apps/menu-worker/src/*|packages/menu-core/src/*)
                runtime_changed=true
                ;;
            esac
          done < "$changed_file"

          # A parser/runtime PR can request concrete live proofs directly in its
          # normal PR body. This replaces disposable proof branches/workflows.
          requested="$(
            printf '%s\n' "$PR_BODY" \
              | sed -nE 's/^[[:space:]]*Live-proof manifests:[[:space:]]*(.*)$/\1/ip' \
              | tail -n 1
          )"

          if [[ -n "${requested//[[:space:]]/}" ]]; then
            IFS=',' read -ra entries <<< "$requested"
            for raw in "${entries[@]}"; do
              manifest="$(printf '%s' "$raw" | xargs)"
              [[ -n "$manifest" ]] || continue
              case "$manifest" in
                catalog/*.json|candidates/*.json)
                  ;;
                *)
                  echo "Live-proof manifest must be catalog/*.json or candidates/*.json: $manifest" >&2
                  exit 1
                  ;;
              esac
              case "$manifest" in
                *..*)
                  echo "Live-proof manifest may not contain '..': $manifest" >&2
                  exit 1
                  ;;
              esac
              if [[ ! -f "apps/menu-worker/$manifest" ]]; then
                echo "Requested live-proof manifest does not exist on PR head: $manifest" >&2
                exit 1
              fi
              echo "$manifest" >> "$proof_file"
            done
          fi

          sort -u "$proof_file" -o "$proof_file"

          if [[ "$runtime_changed" == "true" && ! -s "$proof_file" ]]; then
            cat >&2 <<'EOF'
          Menu runtime code changed, but this PR declares no concrete live-source proof.
          Add a line to the PR body, for example:
          Live-proof manifests: catalog/example-oslo.json
          The permanent workflow will validate it on this exact PR head; do not create a TEMP proof PR.
          EOF
            exit 1
          fi

          echo "Runtime changed: $runtime_changed"
          echo "Exact-head live-proof manifests:"
          cat "$proof_file" || true
          echo "proof_file=$proof_file" >> "$GITHUB_OUTPUT"

      - name: Strictly validate changed/requested manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PROOF_FILE: ${{ steps.proof.outputs.proof_file }}
        run: |
          set -euo pipefail
          if [[ ! -s "$PROOF_FILE" ]]; then
            echo "No restaurant manifests require live validation."
            exit 0
          fi

          failures=()
          while IFS= read -r manifest; do
            [[ -n "$manifest" ]] || continue
            echo "Strict live validation: $manifest"
            # Run each exact-head proof even when another source fails.
            # Do not hide first-pass errors behind batch retries.
            if pnpm --filter @fysen/menu-worker validate:manifest "$manifest"; then
              echo "PASS: $manifest"
            else
              failures+=("$manifest")
              echo "FAIL: $manifest" >&2
            fi
          done < "$PROOF_FILE"
          if (( ${#failures[@]} > 0 )); then
            printf 'Strict source proofs failed (%s):\n' "${#failures[@]}" >&2
            printf ' - %s\n' "${failures[@]}" >&2
            exit 1
          fi

      - name: Diagnose missing Viet Kitchen menu row (PR 1079 only)
        if: "always() && github.event_name == 'pull_request' && github.event.pull_request.number == 1079"
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { load } from "cheerio";
          import { HttpMenuClient } from "./dist/http-client.js";
          import { extractMenuSource } from "./dist/menu-source-runtime.js";
          import { recoverEmbeddedStructuredMenuJson } from "./dist/html-embedded-menu-json-recovery.js";
          import { extractScopedHtmlMenu } from "./dist/html-source-extractor.js";

          const manifest = JSON.parse(readFileSync("catalog/viet-kitchen-bjolsen-oslo.json", "utf8"));
          const needle = "BÚN BÒ XÀO XẢ ỚT";
          const match = (x) => typeof x === "string" && x.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase().includes(needle.normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase());
          const fetched = await new HttpMenuClient().fetchSource({
            url: manifest.menuSource.url, userAgent: manifest.menuSource.userAgent,
            etag: null, lastModified: null
          });
          if (fetched.kind !== "content") throw new Error("Unexpected HTTP 304");
          const embedded = recoverEmbeddedStructuredMenuJson(fetched.body);
          const scoped = extractScopedHtmlMenu(fetched.body);
          const extracted = await extractMenuSource("html", fetched);
          console.log("DIAGNOSTIC_SUMMARY", JSON.stringify({
            httpStatus:fetched.status, rawSha256:fetched.rawSha256, rawLength:fetched.body.length,
            rawLiteralNeedle:match(fetched.body), scopedMethod:scoped.method,
            scopedCount:scoped.items.length, scopedNeedle:scoped.items.filter(x=>match(x.name)).map(x=>({name:x.name,priceMinor:x.priceMinor})),
            embeddedCount:embedded.length, embeddedNeedle:embedded.filter(x=>match(x.name)).map(x=>({name:x.name,priceMinor:x.priceMinor,sectionName:x.sectionName})),
            extractedCount:extracted.items.length, extractedNeedle:extracted.items.filter(x=>match(x.name)).map(x=>({name:x.name,priceMinor:x.priceMinor,sectionName:x.sectionName}))
          }));
          const $=load(fetched.body);
          const hits=[];
          const candidateInfo=[];
          for (const [scriptIndex,element] of $("script").toArray().entries()) {
            const tx=$(element).html()?.trim()??"";
            let doc; try{doc=JSON.parse(tx)}catch{continue}
            const seen=new Set(); let visited=0;
            const walk=(value,path,depth)=>{
              if (depth>19 || visited++>100000 || value===null || typeof value!=="object")return;
              if(seen.has(value))return;seen.add(value);
              if(Array.isArray(value)){for(let i=0;i<value.length;i++)walk(value[i],path+"["+i+"]",depth+1);return}
              const rec=value;
              for(const [key,val] of Object.entries(rec)){
                if(match(val)){
                  if(hits.length<35)hits.push({scriptIndex,path:path+"."+key,keys:Object.keys(rec).slice(0,16),name:rec.name??rec.name_no??rec.title,price:rec.price,id:rec.id,item_ids:rec.item_ids?.slice?.(0,8)});
                }
              }
              if(Array.isArray(rec.categories)&&Array.isArray(rec.items)&&candidateInfo.length<30){
                const matched=rec.items.filter(x=>x&&typeof x==="object"&&match(x.name??x.name_no??x.title));
                const linked=matched.map(x=>({id:x.id,name:x.name??x.name_no,price:x.price,categories:rec.categories.filter(c=>c?.item_ids?.some?.(id=>String(id)===String(x.id))).map(c=>c.name)}));
                candidateInfo.push({scriptIndex,path,categories:rec.categories.length,items:rec.items.length,matched:linked});
              }
              for(const [key,val] of Object.entries(rec))walk(val,path+"."+key,depth+1);
            };
            walk(doc,"root",0);
          }
          console.log("DIAGNOSTIC_SCRIPT_HITS",JSON.stringify({count:hits.length,hits}));
          console.log("DIAGNOSTIC_MENU_CANDIDATES",JSON.stringify(candidateInfo));
          NODE

      - name: Validate requested manifest or directory
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          case "$MANIFEST_PATH" in
            /*|*".."*)
              echo "manifest_path must stay inside apps/menu-worker" >&2
              exit 1
              ;;
            *.json)
              pnpm --filter @fysen/menu-worker validate:manifest "$MANIFEST_PATH"
              ;;
            *)
              pnpm --filter @fysen/menu-worker validate:batch "$MANIFEST_PATH"
              ;;
          esac

      - name: Validate the complete canonical catalog when requested
        if: "always() && github.event_name == 'pull_request' && steps.proof.outcome == 'success' && contains(github.event.pull_request.body, 'Live-proof catalog: true')"
        working-directory: apps/menu-worker
        shell: bash
        env:
          FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "12"
          FYSEN_CANDIDATE_VALIDATION_MAX_ATTEMPTS: "3"
          FYSEN_CANDIDATE_VALIDATION_PROGRESS: "1"
        run: |
          set -euo pipefail
          mkdir -p reports/restaurant-proof
          set +e
          node dist/index.js validate:batch catalog > reports/restaurant-proof/catalog.json
          status=$?
          set -e
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { results, ...summary } = JSON.parse(readFileSync('reports/restaurant-proof/catalog.json', 'utf8'));
          const failures = results.filter(result => !result.accepted).map(result => ({
            slug: result.slug, failureFamilies: result.failureFamilies, error: result.error,
            errors: result.validation?.errors,
            menuError: result.validation?.menu?.error,
            quality: result.validation?.menu?.quality,
            actionErrors: result.validation?.actions?.filter(action => !action.accepted),
          }));
          console.log(JSON.stringify({ ...summary, failures }, null, 2));
          NODE
          exit "$status"

      - name: Upload complete catalog proof
        if: "always() && github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'Live-proof catalog: true')"
        uses: actions/upload-artifact@v4
        with:
          name: fysen-pr-catalog-proof-${{ github.run_id }}
          path: apps/menu-worker/reports/restaurant-proof/catalog.json
          if-no-files-found: warn
          retention-days: 14
