name: Validate Fysen restaurant candidates

on:
  pull_request:
    paths:
      - "apps/menu-worker/candidates/*.json"
      - "apps/menu-worker/catalog/*.json"
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path relative to apps/menu-worker, e.g. candidates/example.json or candidates"
        required: true
        default: "candidates"
        type: string

permissions:
  contents: read

concurrency:
  group: fysen-candidate-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Validate changed restaurant manifests
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          mapfile -t manifests < <(
            git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- \
              'apps/menu-worker/candidates/*.json' \
              'apps/menu-worker/catalog/*.json'
          )

          if [[ ${#manifests[@]} -eq 0 ]]; then
            echo "No added or modified restaurant manifests require validation."
            exit 0
          fi

          for path in "${manifests[@]}"; do
            relative_path="${path#apps/menu-worker/}"
            echo "Validating $relative_path"
            pnpm --filter @fysen/menu-worker validate:manifest -- "$relative_path"
          done

      - name: Validate requested manifest or directory
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          case "$MANIFEST_PATH" in
            /*|*".."*)
              echo "manifest_path must stay inside apps/menu-worker" >&2
              exit 1
              ;;
            *.json)
              pnpm --filter @fysen/menu-worker validate:manifest -- "$MANIFEST_PATH"
              ;;
            *)
              pnpm --filter @fysen/menu-worker validate:batch -- "$MANIFEST_PATH"
              ;;
          esac
