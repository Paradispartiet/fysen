name: Fysen mapo tofu photo (draft only)
on:
  push:
    branches: [art/mapo-tofu-native-photo-20261121]
    paths: [".github/workflows/fysen-promote-mapo-tofu-photo.yml", "scripts/promote-reviewed-mapo-tofu.py"]
permissions:
  contents: write
concurrency:
  group: fysen-mapo-tofu-draft
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - run: python scripts/promote-reviewed-mapo-tofu.py
      - run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Commit tested assets to the draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/dish-images/mapo-tofu-master-3825.avif \
            apps/web/public/dish-images/mapo-tofu-thumb-512.avif \
            apps/web/public/dish-images/mapo-tofu-LICENSE.txt \
            apps/web/public/dish-images/manifest.json \
            assets/fysen-dish-originals/mapo-tofu.png \
            docs/fysen-image-reviews/mapo-tofu.md
          git commit -m "Add reviewed native mapo tofu photo and thumbnail"
          git push origin HEAD:"$GITHUB_REF_NAME"
