name: TEMP Aura sourceKey diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aura-sourcekey-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Inspect Aura recovery boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            fetchMenuSource,
            extractMenuSource,
            normalizeHtmlItemName,
            normalizeHtmlPriceNotation,
          } from './apps/menu-worker/dist/menu-source-runtime.js';
          import { normalizeHtmlHeadingLineBreaks } from './apps/menu-worker/dist/html-heading-normalizer.js';
          import { extractScopedHtmlMenu } from './apps/menu-worker/dist/html-source-extractor.js';
          import { recoverDescriptionNamedHtmlItems } from './apps/menu-worker/dist/html-description-title-recovery.js';
          import { recoverTrailingPriceCardHtmlItems } from './apps/menu-worker/dist/html-trailing-price-card-recovery.js';
          import { recoverAdjacentHeadingPriceHtmlItems } from './apps/menu-worker/dist/html-adjacent-heading-price-recovery.js';

          const fetched = await fetchMenuSource({
            url: 'https://aurarestaurant.no/meny/',
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
          });
          if (fetched.kind !== 'content') {
            throw new Error(`Aura diagnostic expected content, got ${fetched.kind}`);
          }

          const normalizedHtml = normalizeHtmlPriceNotation(normalizeHtmlHeadingLineBreaks(fetched.body));
          const scoped = extractScopedHtmlMenu(normalizedHtml);
          const recovered = scoped.method === 'html_heuristic'
            ? recoverDescriptionNamedHtmlItems(scoped.items, scoped.visibleText)
            : scoped.items;
          const trailing = scoped.method === 'html_heuristic'
            ? recoverTrailingPriceCardHtmlItems(normalizedHtml)
            : [];
          const heading = scoped.method === 'html_heuristic'
            ? recoverAdjacentHeadingPriceHtmlItems(normalizedHtml)
            : [];
          const finalRuntime = await extractMenuSource('html', fetched);

          const compact = (item) => ({
            sourceKey: item.sourceKey,
            name: item.name,
            normalizedName: item.normalizedName,
            sectionName: item.sectionName,
            priceMinor: item.priceMinor,
            priceKind: item.priceKind ?? 'exact',
            position: item.position,
            confidence: item.confidence,
            sourceExcerpt: item.sourceExcerpt,
          });

          const summarize = (label, items) => {
            const normalized = items.map(normalizeHtmlItemName);
            const keyGroups = new Map();
            for (const item of normalized) {
              const group = keyGroups.get(item.sourceKey) ?? [];
              group.push(item);
              keyGroups.set(item.sourceKey, group);
            }
            return {
              label,
              itemCount: items.length,
              turmericBeforeNormalization: items.filter((item) => /turmeric ice cream/i.test(item.name)).map(compact),
              turmericAfterNormalization: normalized.filter((item) => item.normalizedName === 'turmeric ice cream').map(compact),
              duplicateCanonicalKeys: [...keyGroups.entries()]
                .filter(([, group]) => group.length > 1)
                .map(([sourceKey, group]) => ({ sourceKey, items: group.map(compact) })),
            };
          };

          console.log(JSON.stringify({
            scoped: summarize('scoped', scoped.items),
            recovered: summarize('recovered', recovered),
            trailing: summarize('trailing', trailing),
            heading: summarize('heading', heading),
            finalRuntime: summarize('finalRuntime', finalRuntime.items),
          }, null, 2));
          NODE
