name: TEMP Aura sourceKey diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/temp-aura-sourcekey-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Inspect Aura supplement boundaries
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {
            fetchMenuSource,
            normalizeHtmlItemName,
            normalizeHtmlPriceNotation,
          } from './apps/menu-worker/dist/menu-source-runtime.js';
          import { normalizeHtmlHeadingLineBreaks } from './apps/menu-worker/dist/html-heading-normalizer.js';
          import { extractScopedHtmlMenu } from './apps/menu-worker/dist/html-source-extractor.js';
          import { recoverDescriptionNamedHtmlItems } from './apps/menu-worker/dist/html-description-title-recovery.js';
          import { recoverFirstCardAfterPlainFoodSections } from './apps/menu-worker/dist/html-section-first-card-recovery.js';
          import { recoverExplicitFromPriceHtmlItems } from './apps/menu-worker/dist/html-explicit-from-price-recovery.js';

          const fetched = await fetchMenuSource({
            url: 'https://aurarestaurant.no/meny/',
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
          });
          if (fetched.kind !== 'content') throw new Error(`Expected content, got ${fetched.kind}`);

          const normalizedHtml = normalizeHtmlPriceNotation(normalizeHtmlHeadingLineBreaks(fetched.body));
          const scoped = extractScopedHtmlMenu(normalizedHtml);
          const recovered = recoverDescriptionNamedHtmlItems(scoped.items, scoped.visibleText);
          const sectionFirst = recoverFirstCardAfterPlainFoodSections(scoped.visibleText);
          const explicitFrom = recoverExplicitFromPriceHtmlItems(scoped.visibleText);

          const compact = (item) => ({
            sourceKey: item.sourceKey,
            name: item.name,
            normalizedName: item.normalizedName,
            priceMinor: item.priceMinor,
            priceKind: item.priceKind ?? 'exact',
            position: item.position,
            sourceExcerpt: item.sourceExcerpt,
          });
          const turmeric = (items) => items
            .map(normalizeHtmlItemName)
            .filter((item) => item.normalizedName === 'turmeric ice cream')
            .map(compact);

          console.log(JSON.stringify({
            recoveredCount: recovered.length,
            recoveredTurmeric: turmeric(recovered),
            sectionFirstCount: sectionFirst.length,
            sectionFirstTurmericBeforeNormalization: sectionFirst.filter((item) => /turmeric ice cream/i.test(item.name)).map(compact),
            sectionFirstTurmericAfterNormalization: turmeric(sectionFirst),
            explicitFromCount: explicitFrom.length,
            explicitFromTurmeric: turmeric(explicitFrom),
          }, null, 2));
          NODE
