name: Fysen integrate reviewed native falafel to draft only
on:
  push:
    branches: [art/falafel-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-falafel.yml"
      - "scripts/promote-reviewed-falafel.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-falafel-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-pixel and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Recreate inspected source-locked photo and two independent AVIFs
        run: python scripts/promote-reviewed-falafel.py
      - name: Run ONLY the two targeted Matlyst photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify precise photo dimensions, license and unpublished state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(p.get("largeViewEnabled") is True for p in m["images"])==20
          photo=next(p for p in m["images"] if p["id"]=="falafel")
          assert photo["catalogId"]=="falafel"
          assert photo["kind"]=="Redaksjonelt rettfoto"
          assert photo["atlas"]=="falafel-thumb-512.avif"
          assert photo["largeSource"]=="falafel-master-4284.avif"
          assert photo["photoCredit"]=="Saya P / Pexels"
          assert photo["photoLicense"]=="https://www.pexels.com/license/"
          assert "Pexels License" in (root/"falafel-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(root/photo["atlas"]) as pic: assert pic.size==(512,512)
          with Image.open(root/photo["largeSource"]) as pic: assert pic.size==(4284,5712)
          a=json.loads(Path("assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-review.json").read_text(encoding="utf8"))
          assert a["reviewed_variant"]=="black-grabcut"
          assert a["approved_for_fysen"] and a["published"] is False
          assert a["no_upscale"] and not a["generated_food_pixels"]
          print("20/44 verified native large dish photos on UNPUBLISHED draft branch")
          PY
      - name: Commit ONLY approved draft photo assets, gallery and focused tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/falafel.png
          git add assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/review.json
          git add assets/fysen-image-candidates/falafel/saya-p-bowl-pexels/black-review.json
          git add apps/web/public/dish-images/falafel-master-4284.avif
          git add apps/web/public/dish-images/falafel-thumb-512.avif
          git add apps/web/public/dish-images/falafel-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/falafel.md
          git diff --cached --quiet && exit 0
          git commit -m "[falafel-photo-bot] Add approved 4284px source photo and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
