name: TEMP integrate embedded runtime

on:
  pull_request:
    branches:
      - agent/restore-four-production-sources

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.event.pull_request.head.ref == 'agent/final-production-source-integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Patch menu source runtime deterministically
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()

          import_anchor = 'import { BrowserMenuClient } from "./browser-client.js";\n'
          import_block = '''import { BrowserMenuClient } from "./browser-client.js";\nimport {\n  HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION,\n  recoverEmbeddedStructuredMenuJson,\n} from "./html-embedded-menu-json-recovery.js";\n'''
          if 'HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION' not in text:
              if import_anchor not in text:
                  raise SystemExit('embedded import anchor missing')
              text = text.replace(import_anchor, import_block, 1)

          version_old = '+${HTML_SECTION_FIRST_CARD_RECOVERY_VERSION}+${HTML_TEXT_SECTION_SCOPE_VERSION}`;'
          version_new = '+${HTML_SECTION_FIRST_CARD_RECOVERY_VERSION}+${HTML_EMBEDDED_MENU_JSON_RECOVERY_VERSION}+${HTML_TEXT_SECTION_SCOPE_VERSION}`;'
          if version_new not in text:
              if version_old not in text:
                  raise SystemExit('runtime version anchor missing')
              text = text.replace(version_old, version_new, 1)

          extraction_anchor = '''    const extracted = extractScopedHtmlMenu(normalizedHtml);\n    assertExtractionMethodForSourceType(sourceType, extracted.method);\n'''
          extraction_block = '''    const extracted = extractScopedHtmlMenu(normalizedHtml);\n    assertExtractionMethodForSourceType(sourceType, extracted.method);\n    const embeddedItems =\n      extracted.method === "html_heuristic"\n        ? recoverEmbeddedStructuredMenuJson(normalizedHtml).filter(\n            isCanonicalHtmlMenuItem,\n          )\n        : [];\n    if (embeddedItems.length >= 4) {\n      return {\n        items: embeddedItems,\n        method: extracted.method,\n        extractorVersion: HTML_RUNTIME_EXTRACTOR_VERSION,\n      };\n    }\n'''
          if 'recoverEmbeddedStructuredMenuJson(normalizedHtml)' not in text:
              if extraction_anchor not in text:
                  raise SystemExit('embedded extraction anchor missing')
              text = text.replace(extraction_anchor, extraction_block, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/menu-source-runtime.ts
      - name: Commit runtime patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/menu-source-runtime.ts
          if git diff --cached --quiet; then
            echo "Runtime already integrated"
            exit 0
          fi
          git commit -m "Koble embedded menu JSON inn i runtime"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
