name: Materialize Fysen production catalog

# Production materialization is a legacy database operation.
# Fysen Free publishes static index data without Supabase. Keep paid/legacy
# production materialization manual-only until the DB workflow is explicitly
# resumed; parser or catalog commits must not initiate costly DB writes.
on:
  workflow_dispatch:

permissions:
  contents: read

# Keep materialization independent: GitHub replaces an older pending run when a
# newer run enters the same concurrency group, even with cancel-in-progress false.
# Sharing this queue with Watch Fysen menus can therefore cancel a catalog push
# before its materialization job ever starts.
concurrency:
  group: fysen-production-catalog-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      # Each onboarding pool can use two sessions; 8 workers can exceed the
      # production session-pooler limit of 15 before API/watcher traffic.
      # Four workers cap onboarding and maintenance at 8 sessions, leaving
      # headroom without sharing the watcher queue or suppressing failures.
      FYSEN_CATALOG_MATERIALIZATION_CONCURRENCY: "4"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout catalog revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Materialize canonical production catalog
        working-directory: apps/menu-worker
        run: node dist/catalog-materialization-cli.js
