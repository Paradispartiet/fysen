name: Fysen preview green curry on black (review only)
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - ".github/workflows/fysen-preview-green-curry-black.yml"
      - "scripts/preview-green-curry-black.py"
permissions:
  contents: write
concurrency:
  group: fysen-green-curry-mask-preview
  cancel-in-progress: false
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'art/fysen-next-source-review-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: art/fysen-next-source-review-20261121
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow for native-pixel mask
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify exact source and create black-background unapproved candidate
        run: python scripts/preview-green-curry-black.py
      - name: Verify safe review-only output
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path("assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels")
          q=json.loads((root/"black-polygon-review.json").read_text(encoding="utf8"))
          assert q["dish_id"]==q["catalog_id"]=="green-curry"
          assert q["no_upscale"] and not q["generated_food_pixels"]
          assert not q["mask_is_approved"] and not q["visual_review_completed"]
          assert not q["approved_for_fysen"] and not q["published"]
          assert q["candidate_dimensions"]==[3017,3771]
          assert (root/"black-polygon-preview.jpg").is_file()
          assert (root/"black-polygon-detail-1400.jpg").is_file()
          print("MASK PREVIEW ONLY, NO PUBLISHING")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-green-curry-black-full-native-for-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon-native.png
            assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon-preview.jpg
            assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon-detail-1400.jpg
            assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon-review.json
      - name: Commit only small review previews and metadata
        run: |
          rm assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon-native.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/green-curry/max-griss-chicken-pexels/black-polygon*
          git diff --cached --quiet && exit 0
          git commit -m "[image-review-bot] Green curry black-bowl preview, unapproved"
          git pull --rebase origin art/fysen-next-source-review-20261121
          git push origin HEAD:art/fysen-next-source-review-20261121
