name: Final all-50 Coyo Wolt proof

on:
  pull_request:
    paths:
      - ".github/workflows/final-all50-coyo-wolt-proof.yml"

permissions:
  contents: read

jobs:
  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Assert 50 canonical manifests
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          const files = (await readdir('catalog')).filter((x) => x.endsWith('.json')).sort();
          const slugs = [];
          for (const file of files) slugs.push(JSON.parse(await readFile(`catalog/${file}`, 'utf8')).restaurant.slug);
          if (files.length !== 50 || new Set(slugs).size !== 50) throw new Error(`Expected 50 unique manifests, got ${files.length}/${new Set(slugs).size}`);
          NODE
      - name: Live validate all 50 canonical manifests
        working-directory: apps/menu-worker
        run: |
          mkdir -p research
          set +e
          node dist/index.js validate:batch catalog | tee research/final-all50.json
          exit 0
      - name: Prepare repaired seven
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readdir, readFile, writeFile } from 'node:fs/promises';
          const wanted = new Set(['coyo-sorenga-oslo','lahori-dera-gronland-oslo','oche-aker-brygge-oslo','oche-torggata-oslo','hrimnir-ramen-storgata','registan-gronland-oslo','viet-kitchen-bjolsen-oslo']);
          await mkdir('research/final-seven-repeat', { recursive: true });
          let count = 0;
          for (const file of (await readdir('catalog')).filter((x) => x.endsWith('.json')).sort()) {
            const raw = await readFile(`catalog/${file}`, 'utf8');
            if (!wanted.has(JSON.parse(raw).restaurant.slug)) continue;
            await writeFile(`research/final-seven-repeat/${file}`, raw);
            count += 1;
          }
          if (count !== 7) throw new Error(`Expected 7 repeat manifests, got ${count}`);
          NODE
      - name: Repeat repaired seven
        working-directory: apps/menu-worker
        run: |
          set +e
          node dist/index.js validate:batch research/final-seven-repeat | tee research/final-seven-repeat.json
          exit 0
      - name: Gate and summarize
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const all = JSON.parse(await readFile('research/final-all50.json','utf8'));
          const repeat = JSON.parse(await readFile('research/final-seven-repeat.json','utf8'));
          const compact = (r) => ({ slug:r.slug, accepted:r.accepted, failureFamilies:r.failureFamilies, menuError:r.validation?.menu?.error ?? null, itemCount:r.validation?.menu?.quality?.itemCount ?? null, hoursAccepted:r.validation?.hours?.accepted ?? null });
          const summary = {
            all50: { manifestCount:all.manifestCount, acceptedCount:all.acceptedCount, failedCount:all.failedCount, failureFamilyCounts:all.failureFamilyCounts },
            failed: all.results.filter((r) => !r.accepted).map(compact),
            repairedSeven: repeat.results.map(compact),
          };
          await writeFile('research/final-all50-summary.json', JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          if (all.manifestCount !== 50 || all.acceptedCount !== 50 || all.failedCount !== 0) throw new Error(`All-50 gate failed ${all.acceptedCount}/${all.manifestCount}`);
          if (repeat.manifestCount !== 7 || repeat.acceptedCount !== 7 || repeat.failedCount !== 0) throw new Error(`Repeat gate failed ${repeat.acceptedCount}/${repeat.manifestCount}`);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-all50-coyo-wolt-serial-proof
          path: |
            apps/menu-worker/research/final-all50.json
            apps/menu-worker/research/final-seven-repeat.json
            apps/menu-worker/research/final-all50-summary.json
          if-no-files-found: error
