name: TEMP Korndokki category diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/temp-korndokki-category-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Inspect discounted Foodora price DOM
        shell: bash
        run: |
          cd apps/menu-worker
          node --input-type=module <<'NODE'
          import { load } from 'cheerio';
          import {
            fetchMenuSource,
            normalizeHtmlPriceNotation,
          } from './dist/menu-source-runtime.js';
          import { normalizeHtmlHeadingLineBreaks } from './dist/html-heading-normalizer.js';

          const fetched = await fetchMenuSource({
            url: 'https://www.foodora.no/restaurant/q839/korndokki-mathallen',
            sourceType: 'html',
            fetchMode: 'http',
            userAgent: 'FysenMenuBot/0.1',
            etag: null,
            lastModified: null,
          });
          if (fetched.kind !== 'content') throw new Error(`Expected content, got ${fetched.kind}`);

          const html = normalizeHtmlPriceNotation(normalizeHtmlHeadingLineBreaks(fetched.body));
          const $ = load(html);
          const clean = (value) => value.normalize('NFKC').replace(/\s+/g, ' ').trim();
          const targets = [];

          $("[data-testid='menu-product']").each((_, card) => {
            const name = clean($(card).find("[data-testid='menu-product-name']").first().text());
            if (name !== 'Beef Bulgogi Bowl' && name !== 'Tteokbokki') return;
            const price = $(card).find("[data-testid='menu-product-price']").first();
            const descendants = price.find('*').toArray().map((node) => ({
              tag: node.tagName,
              text: clean($(node).text()),
              class: $(node).attr('class') ?? null,
              ariaLabel: $(node).attr('aria-label') ?? null,
              dataTestId: $(node).attr('data-testid') ?? null,
              style: $(node).attr('style') ?? null,
            }));
            targets.push({
              name,
              priceText: clean(price.text()),
              priceHtml: price.html(),
              priceAttrs: price.attr(),
              descendants,
              cardHtml: $(card).html()?.slice(0, 5000) ?? null,
            });
          });

          console.log(JSON.stringify({ httpStatus: fetched.status, targets }, null, 2));
          NODE
