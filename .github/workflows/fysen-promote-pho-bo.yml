name: Fysen promote source-locked phở bò photo to draft only
on:
  push:
    branches: [art/pho-bo-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-pho-bo.yml"
      - "scripts/promote-reviewed-pho-bo.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-pho-bo-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Regenerate and verify visual source and build separate AVIF images
        run: python scripts/promote-reviewed-pho-bo.py
      - name: Run ONLY focused gallery and full-resolution quality tests
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Validate dimensions, license, original pixels, and HOLD status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          base=Path("apps/web/public/dish-images")
          data=json.loads((base/"manifest.json").read_text(encoding="utf8"))
          assert len(data["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in data["images"])==18
          p=next(x for x in data["images"] if x["id"]=="pho")
          assert p["catalogId"]=="pho" and p["kind"]=="Redaksjonelt rettfoto"
          assert p["atlas"]=="pho-bo-thumb-512.avif"
          assert p["largeSource"]=="pho-bo-master-5472.avif"
          assert p["photoCredit"]=="UNDO KIM / Pexels"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "UNDO KIM" in (base/"pho-bo-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(base/p["largeSource"]) as im: assert im.size==(5472,3648)
          with Image.open(base/p["atlas"]) as im: assert im.size==(512,512)
          record=json.loads(Path("assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-review.json").read_text(encoding="utf8"))
          assert record["reviewed_variant"]=="black-grabcut"
          assert record["approved_for_fysen"] is True
          assert record["published"] is False
          print("DRAFT: 18/44 real native full-size photos, no main release")
          PY
      - name: Commit ONLY verified images and gallery files to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/pho.png
          git add assets/fysen-image-candidates/pho-bo/undo-kim-pexels/review.json
          git add assets/fysen-image-candidates/pho-bo/undo-kim-pexels/black-review.json
          git add apps/web/public/dish-images/pho-bo-master-5472.avif
          git add apps/web/public/dish-images/pho-bo-thumb-512.avif
          git add apps/web/public/dish-images/pho-bo-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/pho.md
          git diff --cached --quiet && exit 0
          git commit -m "[pho-promote-bot] Add reviewed native 5472px phở bò and separate 512px mini (draft)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
