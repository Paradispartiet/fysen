name: Watch Fysen menus

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Fysen database"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-source
  cancel-in-progress: false

jobs:
  watch:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_WATCH_BATCH_SIZE: "25"
      FYSEN_HOURS_WATCH_BATCH_SIZE: "25"
      FYSEN_ACTION_VERIFY_BATCH_SIZE: "25"
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Watch due menu sources
        id: watch_menu_sources
        continue-on-error: true
        run: pnpm --filter @fysen/menu-worker run:due

      - name: Onboard catalog candidates
        id: onboard_catalog
        continue-on-error: true
        run: pnpm --filter @fysen/menu-worker onboard:catalog

      - name: Watch due restaurant hours
        id: watch_restaurant_hours
        continue-on-error: true
        run: pnpm --filter @fysen/menu-worker watch:hours

      - name: Reverify expiring restaurant actions
        id: verify_restaurant_actions
        continue-on-error: true
        run: pnpm --filter @fysen/menu-worker verify:actions

      - name: Preserve operational failure signal
        if: always()
        shell: bash
        env:
          MENU_SOURCES_OUTCOME: ${{ steps.watch_menu_sources.outcome }}
          RESTAURANT_HOURS_OUTCOME: ${{ steps.watch_restaurant_hours.outcome }}
          RESTAURANT_ACTIONS_OUTCOME: ${{ steps.verify_restaurant_actions.outcome }}
          ONBOARD_CATALOG_OUTCOME: ${{ steps.onboard_catalog.outcome }}
        run: |
          failed=0
          check_stage() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" = "failure" ]; then
              echo "Operational stage failed: $name" >&2
              failed=1
            fi
          }

          check_stage "Watch due menu sources" "$MENU_SOURCES_OUTCOME"
          check_stage "Watch due restaurant hours" "$RESTAURANT_HOURS_OUTCOME"
          check_stage "Reverify expiring restaurant actions" "$RESTAURANT_ACTIONS_OUTCOME"
          check_stage "Onboard catalog candidates" "$ONBOARD_CATALOG_OUTCOME"

          exit "$failed"
