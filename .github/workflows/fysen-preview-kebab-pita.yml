name: Fysen isolated kebab pita photo review
on:
  push:
    branches: [art/kebab-pita-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-preview-kebab-pita.yml"
      - "scripts/preview-kebab-pita-black.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-kebab-pita-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image-processing dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Reuse verified source artifact from previous successful staging
        uses: actions/download-artifact@v4
        with:
          name: fysen-kebab-pita-originals
          run-id: 44611780097
          github-token: ${{ github.token }}
          path: /tmp/fysen-kebab-originals
      - name: Generate two native-pixel black review candidates
        run: python scripts/preview-kebab-pita-black.py
      - name: Check preview remains unapproved
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables")
          data=json.loads((p/"black-review.json").read_text())
          assert data["source_dimensions"]==[4000,7112]
          assert not data["pixel_upscaled"] and not data["ingredients_generated"]
          assert not data["approved_for_fysen"] and not data["published"]
          assert (p/"black-grabcut-preview.jpg").exists()
          print("Unapproved native kebab review only")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-kebab-pita-black-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-native.png
            assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-preview.jpg
            assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-detail-1400.jpg
            assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-review.json
      - name: Commit only review images to draft PR
        run: |
          rm -f assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-native.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-preview.jpg
          git add assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-*-detail-1400.jpg
          git add assets/fysen-image-candidates/kebab-pita/doner-fresh-vegetables/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[kebab-preview-bot] Stage black native photo previews for visual review"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
