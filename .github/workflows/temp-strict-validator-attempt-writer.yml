name: TEMP write strict validator attempt contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-strict-validator-attempt-writer.yml"

permissions:
  contents: write

env:
  TARGET_BRANCH: agent/strict-validator-attempt-contract

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Add explicit validator max-attempt contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/menu-worker/src/batch-validator.ts')
          text = path.read_text()
          text = text.replace(
          '''interface RestaurantBatchValidationOptions {\n  readonly concurrency?: number;\n  readonly validatePath?: (\n''',
          '''interface RestaurantBatchValidationOptions {\n  readonly concurrency?: number;\n  readonly maxAttempts?: number;\n  readonly validatePath?: (\n''')
          text = text.replace(
          '''  readonly concurrency: number;\n  readonly failureFamilyCounts: Readonly<\n''',
          '''  readonly concurrency: number;\n  readonly maxAttempts: number;\n  readonly failureFamilyCounts: Readonly<\n''')
          text = text.replace(
          '''function boundedRetryDelayMs(value: number | undefined): number {\n''',
          '''function boundedMaxAttempts(value: number | undefined): number {\n  if (value === undefined) return MAX_VALIDATION_ATTEMPTS;\n  if (!Number.isInteger(value) || value < 1 || value > MAX_VALIDATION_ATTEMPTS) {\n    throw new Error(\n      `Batch validation max attempts must be an integer between 1 and ${MAX_VALIDATION_ATTEMPTS}`,\n    );\n  }\n  return value;\n}\n\nfunction boundedRetryDelayMs(value: number | undefined): number {\n''')
          text = text.replace(
          '''  retryDelayMs: number,\n): Promise<RestaurantManifestValidationResult> {\n''',
          '''  retryDelayMs: number,\n  maxAttempts: number,\n): Promise<RestaurantManifestValidationResult> {\n''')
          text = text.replace(
          '''    attempt <= MAX_VALIDATION_ATTEMPTS &&\n''',
          '''    attempt <= maxAttempts &&\n''')
          text = text.replace(
          '''  const concurrency = boundedConcurrency(options.concurrency);\n  const retryDelayMs = boundedRetryDelayMs(options.retryDelayMs);\n''',
          '''  const concurrency = boundedConcurrency(options.concurrency);\n  const maxAttempts = boundedMaxAttempts(options.maxAttempts);\n  const retryDelayMs = boundedRetryDelayMs(options.retryDelayMs);\n''')
          text = text.replace(
          '''        retryDelayMs,\n      );\n''',
          '''        retryDelayMs,\n        maxAttempts,\n      );\n''')
          text = text.replace(
          '''    concurrency,\n    failureFamilyCounts,\n''',
          '''    concurrency,\n    maxAttempts,\n    failureFamilyCounts,\n''')
          path.write_text(text)

          path = Path('apps/menu-worker/src/index.ts')
          text = path.read_text()
          text = text.replace(
          '''    const summary = await validateRestaurantManifestBatch(directory, {\n      concurrency: configuredConcurrency,\n    });\n''',
          '''    const configuredMaxAttempts = Number.parseInt(\n      process.env.FYSEN_CANDIDATE_VALIDATION_MAX_ATTEMPTS ?? "3",\n      10,\n    );\n    const summary = await validateRestaurantManifestBatch(directory, {\n      concurrency: configuredConcurrency,\n      maxAttempts: configuredMaxAttempts,\n    });\n''')
          path.write_text(text)

          path = Path('apps/menu-worker/src/batch-validator.test.ts')
          text = path.read_text()
          marker = '''  it("does not retry a deterministic quality failure", async () => {\n'''
          addition = '''  it("supports an explicit one-attempt strict gate without transient retry", async () => {\n    const directory = await mkdtemp(join(tmpdir(), "fysen-batch-validator-"));\n    await writeFile(join(directory, "a.json"), "{}");\n    let calls = 0;\n\n    const summary = await validateRestaurantManifestBatch(directory, {\n      maxAttempts: 1,\n      retryDelayMs: 0,\n      validatePath: async () => {\n        calls += 1;\n        return validation("a", {\n          menuAccepted: false,\n          menuError: "Network timeout fetching source",\n        });\n      },\n    });\n\n    expect(calls).toBe(1);\n    expect(summary.maxAttempts).toBe(1);\n    expect(summary.acceptedCount).toBe(0);\n    expect(summary.failedCount).toBe(1);\n    expect(summary.failureFamilyCounts.transport).toBe(1);\n  });\n\n'''
          if marker not in text:
              raise SystemExit('test marker not found')
          text = text.replace(marker, addition + marker)
          text = text.replace(
          '''    expect(summary.acceptedCount).toBe(1);\n    expect(summary.failedCount).toBe(0);\n''',
          '''    expect(summary.maxAttempts).toBe(3);\n    expect(summary.acceptedCount).toBe(1);\n    expect(summary.failedCount).toBe(0);\n''',
          1)
          text = text.replace(
          '''    await expect(\n      validateRestaurantManifestBatch(directory, { retryDelayMs: -1 }),\n    ).rejects.toThrow("between 0 and 10000");\n''',
          '''    await expect(\n      validateRestaurantManifestBatch(directory, { retryDelayMs: -1 }),\n    ).rejects.toThrow("between 0 and 10000");\n    await expect(\n      validateRestaurantManifestBatch(directory, { maxAttempts: 0 }),\n    ).rejects.toThrow("between 1 and 3");\n    await expect(\n      validateRestaurantManifestBatch(directory, { maxAttempts: 4 }),\n    ).rejects.toThrow("between 1 and 3");\n''')
          path.write_text(text)
          PY
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec vitest run src/batch-validator.test.ts
      - run: pnpm --filter @fysen/menu-worker test
      - run: pnpm --filter @fysen/menu-worker typecheck
      - name: Commit permanent files only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src/batch-validator.ts apps/menu-worker/src/index.ts apps/menu-worker/src/batch-validator.test.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No permanent changes to commit"
            exit 0
          fi
          git commit -m "Expose strict validator attempt count"
          git push origin "HEAD:${TARGET_BRANCH}"
