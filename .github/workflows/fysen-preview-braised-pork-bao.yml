name: Fysen preview black-background braised pork bao (no approval)
on:
  push:
    branches: [art/braised-pork-bao-native-photo-20261121]
    paths: [".github/workflows/fysen-preview-braised-pork-bao.yml","scripts/preview-braised-pork-bao-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-bao-black-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate masks from authentic full-size CC0 original
        run: python scripts/preview-braised-pork-bao-black.py
      - name: Verify source, photo and non-approval
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=Path("assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0")
          a=json.loads((d/"black-review.json").read_text(encoding="utf8"))
          assert a["source_native_dimensions"]==[8160,6144]
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["visual_review_completed"] and not a["approved_for_fysen"] and not a["published"]
          for v in a["variants"]:
            assert (d/f"{v}-preview.jpg").is_file()
            assert (d/f"{v}-detail-1400.jpg").is_file()
          print("Three original-image masks; zero published assets")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bao-braised-pork-masks-for-editorial-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-*.jpg
            assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-review.json
      - name: Commit only small unapproved preview assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-*.jpg
          git add assets/fysen-image-candidates/braised-pork-bao/andy-li-cc0/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[bao-preview-bot] Stage unapproved black-background photo masks"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
