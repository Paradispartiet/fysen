name: Probe post-Cafe-Sara production proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-post-cafe-sara-production.yml"

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_PUBLIC_API_URL: https://fysen-api.vercel.app
      FYSEN_PUBLIC_WEB_URL: https://fysen-matsgran-8572s-projects.vercel.app
      AHA_PUBLIC_API_URL: https://aha-canonical-api-production.redground-9c6e20c2.northeurope.azurecontainerapps.io
      AHA_PUBLIC_WEB_URL: https://paradispartiet.github.io/AHA-EchoNet
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi
      - name: Checkout probe revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build proof dependencies
        run: |
          pnpm --filter @fysen/menu-core build
          pnpm --filter @fysen/database build
      - name: Verify exact production catalog and surfaces
        run: node scripts/production-pilot-proof.mjs
