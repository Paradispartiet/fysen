name: Fysen – review authentic yakitori photo originals
on:
  push:
    branches: [art/yakitori-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-stage-yakitori.yml"
      - "scripts/stage-yakitori-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-yakitori-native-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Fetch source-locked photographs
        run: python scripts/stage-yakitori-sources.py
      - name: Check only genuine unpublished source reviews exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path("assets/fysen-image-candidates/yakitori").glob("*/review.json"))
          assert paths
          for p in paths:
              d=json.loads(p.read_text(encoding="utf8"))
              assert d["catalog_id"]==d["dish_id"]=="yakitori"
              assert d["source_verified"] and d["no_upscale"]
              assert not d["approved_for_fysen"] and not d["published"]
              assert (p.parent/"source.jpeg").exists()
              assert (p.parent/"preview.jpg").exists()
              assert (p.parent/"detail-1400.jpg").exists()
          print(f"{len(paths)} sources to inspect; zero approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: yakitori-native-source-inspection
          retention-days: 7
          if-no-files-found: error
          path: assets/fysen-image-candidates/yakitori
      - name: Commit only small previews and metadata, never source originals
        run: |
          find assets/fysen-image-candidates/yakitori -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/yakitori
          git diff --cached --quiet && exit 0
          git commit -m "[yakitori-photo-bot] Stage unapproved Pexels photo previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
