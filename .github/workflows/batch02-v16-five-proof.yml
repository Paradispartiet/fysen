name: Batch 02 v16 five proof

on:
  pull_request:
    paths:
      - ".github/workflows/batch02-v16-five-proof.yml"
      - "apps/menu-worker/src/**"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: pnpm/action-setup@v4
        with: {version: 11.4.0, run_install: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.18.0}
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Build exact five plan
        run: |
          rm -rf /tmp/batch02 && mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import {mkdir,readFile,writeFile} from 'node:fs/promises';
          const source=JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const targets=new Set(['jaipur-karl-johans-gate-oslo','indi-spice-welhavens-gate-oslo','dognvill-bjorvika-oslo','dognvill-tjuvholmen-oslo','dognvill-vulkan-oslo']);
          const restaurants=source.restaurants.filter(e=>targets.has(e.restaurant.slug));
          const plan={...source,outputDirectory:'research/v16-five-generated',concurrency:1,restaurants};
          await mkdir('apps/menu-worker/research/v16-five-generated',{recursive:true});
          await writeFile('apps/menu-worker/research/v16-five.plan.json',JSON.stringify(plan,null,2)+'\n');
          NODE
      - name: Fresh intake five
        working-directory: apps/menu-worker
        run: node dist/index.js intake:batch research/v16-five.plan.json | tee research/v16-five-intake.json
      - name: Validate five
        working-directory: apps/menu-worker
        run: node dist/index.js validate:batch research/v16-five-generated | tee research/v16-five-validation.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: batch02-v16-five-proof
          path: |
            apps/menu-worker/research/v16-five-intake.json
            apps/menu-worker/research/v16-five-validation.json
            apps/menu-worker/research/v16-five-generated/*.json
