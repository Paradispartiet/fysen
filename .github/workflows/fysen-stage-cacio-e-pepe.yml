name: Fysen stage authentic cacio e pepe photo candidates
on:
  push:
    branches: [art/cacio-e-pepe-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-cacio-e-pepe.yml"
      - "scripts/stage-cacio-e-pepe-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-cacio-e-pepe-photo-source
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install photo decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Retrieve real source photos and create original-pixel details
        run: python scripts/stage-cacio-e-pepe-sources.py
      - name: Assert every source still requires review
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          files=list(Path("assets/fysen-image-candidates/cacio-e-pepe").glob("*/review.json"))
          assert files
          for f in files:
            m=json.loads(f.read_text())
            assert m["source_download_verified"]
            assert m["approved_for_fysen"] is False
            assert m["published"] is False
            assert m["visual_review_completed"] is False
            assert min(m["native_width"],m["native_height"])>=1600
            assert (f.parent/"preview.jpg").is_file()
            assert (f.parent/"native-detail-1400.jpg").is_file()
          print(len(files),"candidate sources, NONE APPROVED")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-cacio-e-pepe-native-originals
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/cacio-e-pepe/*/source.jpeg
            assets/fysen-image-candidates/cacio-e-pepe/*/preview.jpg
            assets/fysen-image-candidates/cacio-e-pepe/*/native-detail-1400.jpg
            assets/fysen-image-candidates/cacio-e-pepe/*/review.json
      - name: Commit lightweight visual evidence only
        run: |
          find assets/fysen-image-candidates/cacio-e-pepe -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/cacio-e-pepe
          git diff --cached --quiet && exit 0
          git commit -m "[cacio-e-pepe-source-bot] Stage real pasta source previews for editorial check"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
