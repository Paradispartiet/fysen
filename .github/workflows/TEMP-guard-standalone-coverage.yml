name: TEMP guard standalone recovery coverage

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Guard specialized standalone coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/html-source-extractor.ts')
          text = path.read_text()
          old = '''  const standalone = extractStandalonePriceBlocks(visibleText, scopedText.headingLevels);\n  if (\n    standalone.priceCount >= 3 &&\n    standalone.items.length >= 3 &&\n    standalone.items.length * 4 >= standalone.priceCount * 3\n  ) {\n    return {\n      items: standalone.items,\n      method: "html_heuristic",\n      visibleText,\n    };\n  }\n\n  const scoped = extractHtmlMenu(syntheticHtmlFromVisibleText(visibleText));\n'''
          new = '''  const standalone = extractStandalonePriceBlocks(visibleText, scopedText.headingLevels);\n  const standaloneQualifies =\n    standalone.priceCount >= 3 &&\n    standalone.items.length >= 3 &&\n    standalone.items.length * 4 >= standalone.priceCount * 3;\n\n  const scoped = extractHtmlMenu(syntheticHtmlFromVisibleText(visibleText));\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('standalone early-return anchor missing')
              text = text.replace(old, new, 1)

          old2 = '''  const recovered = recoverRepeatedCardTitles(\n    visibleText,\n    scopedText.headingLevels,\n    foodItems,\n  ).map(normalizeNumberedItem);\n  return {\n    ...scoped,\n    items: recovered,\n    visibleText,\n  };\n'''
          new2 = '''  const recovered = recoverRepeatedCardTitles(\n    visibleText,\n    scopedText.headingLevels,\n    foodItems,\n  ).map(normalizeNumberedItem);\n  if (standaloneQualifies && standalone.items.length > recovered.length) {\n    return {\n      items: standalone.items,\n      method: "html_heuristic",\n      visibleText,\n    };\n  }\n  return {\n    ...scoped,\n    items: recovered,\n    visibleText,\n  };\n'''
          if new2 not in text:
              if old2 not in text:
                  raise SystemExit('fallback return anchor missing')
              text = text.replace(old2, new2, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-source-extractor.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Guard specialized HTML recovery coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
