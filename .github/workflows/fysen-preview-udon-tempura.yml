name: Fysen preview authentic udon with ebi tempura
on:
  push:
    branches: [art/udon-tempura-native-photo-20261121]
    paths: [".github/workflows/fysen-preview-udon-tempura.yml","scripts/preview-udon-tempura-black.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-udon-ebitempura-black-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Black-background previews from exact licensed real udon source
        run: python scripts/preview-udon-tempura-black.py
      - name: No approvals or public assets in preview job
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi")
          a=json.loads((p/"black-review.json").read_text(encoding="utf8"))
          assert a["source_dimensions"]==[3024,4032] and a["license"]=="CC BY 4.0"
          assert a["no_upscale"] and not a["generated_food_pixels"]
          assert not a["approved_for_fysen"] and not a["published"]
          for n in a["variants"]:
            assert (p/f"{n}-preview.jpg").is_file()
            assert (p/f"{n}-detail-1400.jpg").is_file()
          print("Only verified authentic masks; no approval")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: udon-tempura-ccby-black-masks-for-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-*.jpg
            assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-review.json
      - name: Commit only unapproved small masks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-*.jpg
          git add assets/fysen-image-candidates/udon-tempura/commons-bukkake-ebi/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[udon-preview-bot] Stage unapproved ebi tempura udon masks"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
