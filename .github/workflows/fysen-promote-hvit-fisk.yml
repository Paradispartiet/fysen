name: Fysen promote reviewed seared white fish source photo
on:
  push:
    branches: [art/stekt-hvit-fisk-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-hvit-fisk.yml"
      - "scripts/promote-reviewed-hvit-fisk.py"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: fysen-white-fish-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Recover original source by SHA from successful earlier photo stage
        uses: actions/download-artifact@v4
        with:
          name: fysen-white-fish-originals
          run-id: 44710362827
          github-token: ${{ github.token }}
          path: /tmp/fysen-white-fish-originals
      - name: Promote only byte-matching reviewed photo to full-size AVIF and own mini
        run: python scripts/promote-reviewed-hvit-fisk.py
      - name: Run exactly two relevant gallery and large-image quality test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify native resolution, attribution, manifest and unpublished status
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text())
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==13
          image=next(x for x in m["images"] if x["id"]=="stekt-hvit-fisk")
          assert image["kind"]=="Redaksjonelt rettfoto" and image["catalogId"] is None
          assert image["atlas"]=="stekt-hvit-fisk-thumb-512.avif"
          assert image["largeSource"]=="stekt-hvit-fisk-master-5464.avif"
          assert "Valeria Boltneva / Pexels" in image["photoCredit"]
          assert image["photoLicenseNotice"]=="/dish-images/stekt-hvit-fisk-LICENSE.txt"
          with Image.open(root/image["atlas"]) as im: assert im.size==(512,512)
          with Image.open(root/image["largeSource"]) as im: assert im.size==(5464,7120)
          data=json.loads(Path("assets/fysen-image-candidates/stekt-hvit-fisk/white-fish-mash-vegetables/black-review.json").read_text())
          assert data["approved_for_fysen"] is True and data["visual_review_completed"] is True
          assert data["reviewed_variant"]=="black-contour"
          assert data["published"] is False
          print("13/44 source-verified PR masters; production still 10/44 and not deployed")
          PY
      - name: Commit only reviewed photo, thumbnail and related gallery edits to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/stekt-hvit-fisk.png
          git add assets/fysen-image-candidates/stekt-hvit-fisk/white-fish-mash-vegetables/review.json
          git add assets/fysen-image-candidates/stekt-hvit-fisk/white-fish-mash-vegetables/black-review.json
          git add apps/web/public/dish-images/stekt-hvit-fisk-master-5464.avif
          git add apps/web/public/dish-images/stekt-hvit-fisk-thumb-512.avif
          git add apps/web/public/dish-images/stekt-hvit-fisk-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/stekt-hvit-fisk.md
          git diff --cached --quiet && exit 0
          git commit -m "[hvit-fisk-promote-bot] Add source-locked seared fish full-size AVIF and own mini"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
