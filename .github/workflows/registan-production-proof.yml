name: Registan production proof

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/registan-production-proof.yml"

permissions:
  contents: read

concurrency:
  group: fysen-production-search-smoke
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      SMOKE_QUERY: "Lagman"
      SMOKE_CITY: "Oslo"
      SMOKE_EXPECTED_RESTAURANT_SLUG: "registan-gronland-oslo"
      SMOKE_EXPECTED_DISH_NAME: "Lagman"
      SMOKE_EXPECTED_PRICE_MINOR: "39900"
      SMOKE_EXPECTED_PRICE_KIND: "from"
      SMOKE_EXPECTED_MATCH_TYPE: "exact"
      SMOKE_EXPECTED_OPENING: "any"
      SMOKE_EXPECTED_ACTION: "none"
      SMOKE_MIN_COUNT: "1"
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build production search dependencies
        run: |
          pnpm --filter @fysen/menu-core build
          pnpm --filter @fysen/database build

      - name: Verify Registan in production search
        shell: bash
        run: node scripts/production-search-smoke.mjs
