name: TEMP Batch 02 source origin trace

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-source-origin-trace.yml"

permissions:
  contents: read
  actions: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Trace requested cross-origin data without fetching it
        working-directory: apps/menu-worker
        shell: bash
        run: |
          mkdir -p /tmp/batch02-origin-trace
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright-core';
          import { assertPublicHttpUrl } from './dist/security.js';

          const targets = [
            { name: 'delicatessen-grunerlokka', url: 'https://favrit.com/nb-no/menu/location/LK4AD79J8nO' },
            { name: 'delicatessen-majorstuen', url: 'https://favrit.com/nb-no/menu/location/LgEAQE59pAo' },
            { name: 'der-peppern-gror-order', url: 'https://order.weorder.com/app/derpeppern' },
          ];
          const browser = await chromium.launch({ channel: 'chrome', headless: true, chromiumSandbox: true });
          const results = [];
          try {
            for (const target of targets) {
              const source = await assertPublicHttpUrl(target.url);
              const context = await browser.newContext({
                acceptDownloads: false,
                ignoreHTTPSErrors: false,
                javaScriptEnabled: true,
                serviceWorkers: 'block',
                userAgent: 'FysenMenuBot/0.1',
              });
              const observed = [];
              const seen = new Set();
              await context.route('**/*', async (route) => {
                const request = route.request();
                let url;
                try { url = new URL(request.url()); } catch { await route.abort('blockedbyclient'); return; }
                const type = request.resourceType();
                const crossOrigin = url.origin !== source.origin;
                const key = `${type} ${url.href}`;
                if (!seen.has(key)) {
                  seen.add(key);
                  observed.push({ type, url: url.href, origin: url.origin, crossOrigin });
                }
                if (url.protocol !== 'https:') {
                  await route.abort('blockedbyclient');
                  return;
                }
                if (crossOrigin && (type === 'document' || type === 'xhr' || type === 'fetch')) {
                  await route.abort('blockedbyclient');
                  return;
                }
                try {
                  await assertPublicHttpUrl(url);
                  await route.continue();
                } catch {
                  await route.abort('blockedbyclient');
                }
              });
              const page = await context.newPage();
              let navigationError = null;
              try {
                await page.goto(source.toString(), { waitUntil: 'domcontentloaded', timeout: 15000 });
                await page.waitForTimeout(4000);
              } catch (error) {
                navigationError = error instanceof Error ? error.message : String(error);
              }
              const crossOriginData = observed.filter((entry) => entry.crossOrigin && ['document', 'xhr', 'fetch'].includes(entry.type));
              const sameOriginData = observed.filter((entry) => !entry.crossOrigin && ['xhr', 'fetch'].includes(entry.type));
              const externalScripts = observed.filter((entry) => entry.crossOrigin && entry.type === 'script');
              results.push({
                ...target,
                finalUrl: page.url(),
                title: await page.title().catch(() => ''),
                navigationError,
                crossOriginData,
                sameOriginData,
                externalScripts,
              });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          const out = { tracedAt: new Date().toISOString(), results };
          await writeFile('/tmp/batch02-origin-trace/origins.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-source-origin-trace
          path: /tmp/batch02-origin-trace
          if-no-files-found: error
