name: Batch 02 residual ten recheck

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-residual-ten-recheck.yml"

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Restore immutable Batch 02 plan and isolate residual ten
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json','utf8'));
          const targets = new Set([
            'benares-tordenskiolds-gate-oslo',
            'mesob-motzfeldts-gate-oslo',
            'new-delhi-tjuvholmen-oslo',
            'sawan-president-harbitz-gate-oslo',
            'the-golden-chimp-torggata-oslo',
            'kverneriet-majorstua-oslo',
            'kverneriet-solli-oslo',
            'delicatessen-grunerlokka-oslo',
            'delicatessen-majorstuen-oslo',
            'der-peppern-gror-radhusplassen-oslo',
          ]);
          const restaurants = source.restaurants.filter((entry) => targets.has(entry.restaurant.slug));
          if (restaurants.length !== 10) throw new Error(`Expected 10 residual seeds, found ${restaurants.length}`);
          const plan = {
            ...source,
            outputDirectory: 'research/batch02-residual-ten-generated',
            concurrency: 2,
            restaurants,
          };
          await mkdir('apps/menu-worker/research/batch02-residual-ten-generated', { recursive: true });
          await writeFile('apps/menu-worker/research/batch02-residual-ten.plan.json', JSON.stringify(plan, null, 2) + '\n');
          NODE

      - name: Fresh intake residual ten
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js intake:batch research/batch02-residual-ten.plan.json | tee research/batch02-residual-ten-intake.json
          exit 0

      - name: Independent serial validation generated residuals
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch research/batch02-residual-ten-generated | tee research/batch02-residual-ten-validation.json
          exit 0

      - name: Summarize exact residual status
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const intake = JSON.parse(await readFile('research/batch02-residual-ten-intake.json','utf8'));
          let validation = {manifestCount:0,acceptedCount:0,failedCount:0,failureFamilyCounts:{},results:[]};
          try { validation = JSON.parse(await readFile('research/batch02-residual-ten-validation.json','utf8')); } catch {}
          const compact = (result) => ({
            slug: result.slug,
            accepted: result.accepted,
            failureFamilies: result.failureFamilies ?? [],
            error: result.error ?? null,
            menuError: result.validation?.menu?.error ?? null,
            itemCount: result.validation?.menu?.quality?.itemCount ?? null,
            extractorVersion: result.validation?.menu?.extractorVersion ?? null,
            observedDishNames: result.validation?.menu?.observedDishNames ?? [],
          });
          const summary = {
            mainRevision: 'bd61619e62ae8647e96708e8c18cadec3a809c54',
            requestedCount: intake.requestedCount,
            generatedCount: intake.generatedCount,
            intakeFailedCount: intake.failedCount,
            intakeResults: intake.results,
            validation: {
              manifestCount: validation.manifestCount,
              acceptedCount: validation.acceptedCount,
              failedCount: validation.failedCount,
              failureFamilyCounts: validation.failureFamilyCounts,
              results: (validation.results ?? []).map(compact),
            },
          };
          await writeFile('research/batch02-residual-ten-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (intake.requestedCount !== 10) throw new Error(`Residual plan drift: requested=${intake.requestedCount}/10`);
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-residual-ten-recheck
          path: |
            apps/menu-worker/research/batch02-residual-ten.plan.json
            apps/menu-worker/research/batch02-residual-ten-intake.json
            apps/menu-worker/research/batch02-residual-ten-validation.json
            apps/menu-worker/research/batch02-residual-ten-summary.json
            apps/menu-worker/research/batch02-residual-ten-generated/*.json
          if-no-files-found: warn
