name: Fysen verify phở bò genuine photo sources
on:
  push:
    branches: [art/pho-bo-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-pho-bo.yml"
      - "scripts/stage-pho-bo-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-pho-bo-source-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source photo decoder
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Retrieve real original source bytes and native-pixel details
        run: python scripts/stage-pho-bo-sources.py
      - name: Confirm no publication or autoapproval
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          paths=list(Path("assets/fysen-image-candidates/pho-bo").glob("*/review.json"))
          assert paths
          for path in paths:
            meta=json.loads(path.read_text(encoding="utf8"))
            assert meta["download_verified"] and meta["no_upscale"]
            assert not meta["approved_for_fysen"] and not meta["published"]
            assert not meta["visual_review_completed"]
            assert min(meta["native_width"],meta["native_height"])>=1600
            assert (path.parent/"preview.jpg").is_file()
            assert (path.parent/"native-detail-1400.jpg").is_file()
          print(len(paths),"source originals verified, no approved or published imagery")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-pho-bo-original-photo-candidates
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pho-bo/*/source.jpeg
            assets/fysen-image-candidates/pho-bo/*/preview.jpg
            assets/fysen-image-candidates/pho-bo/*/native-detail-1400.jpg
            assets/fysen-image-candidates/pho-bo/*/review.json
      - name: Commit only candidate previews and source records
        run: |
          find assets/fysen-image-candidates/pho-bo -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pho-bo
          git diff --cached --quiet && exit 0
          git commit -m "[pho-source-bot] Stage unapproved real beef pho photographic sources"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
