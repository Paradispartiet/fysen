name: New Delhi production proof 56

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/new-delhi-production-proof-56.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Require production database secret
        shell: bash
        run: test -n "$DATABASE_URL" || { echo "FYSEN_PRODUCTION_DATABASE_URL is not configured" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: 2e57e1d324415f2a296b43b54c13e58cb23d4292
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Read-only prove 56 catalog restaurants and New Delhi
        shell: bash
        run: |
          mkdir -p apps/menu-worker/research
          node --input-type=module <<'NODE' | tee apps/menu-worker/research/new-delhi-production-proof-56.json
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { createDatabasePool } from './packages/database/dist/index.js';
          import { searchDishes } from './packages/database/dist/search.js';
          import { normalizeDishName } from './packages/menu-core/dist/index.js';

          const revision='2e57e1d324415f2a296b43b54c13e58cb23d4292';
          const targetSlug='new-delhi-tjuvholmen-oslo';
          const files=(await readdir('apps/menu-worker/catalog')).filter((name)=>name.endsWith('.json')).sort();
          const manifests=[];
          for(const file of files) manifests.push(JSON.parse(await readFile(`apps/menu-worker/catalog/${file}`,'utf8')));
          const manifestBySlug=new Map(manifests.map((manifest)=>[manifest.restaurant.slug,manifest]));
          const catalogSlugs=[...manifestBySlug.keys()];
          if(manifests.length!==56||new Set(catalogSlugs).size!==56) throw new Error(`Catalog=${manifests.length}/${new Set(catalogSlugs).size}; expected 56/56`);
          const candidateFiles=(await readdir('apps/menu-worker/candidates')).filter((name)=>name.endsWith('.json'));
          if(candidateFiles.includes('new-delhi-tjuvholmen-oslo.json')) throw new Error('New Delhi still present in candidates');
          const manifest=manifestBySlug.get(targetSlug);
          if(!manifest) throw new Error('Missing New Delhi catalog manifest');
          if(manifest.menuSource.minimumExpectedItems!==81) throw new Error(`New Delhi minimumExpectedItems=${manifest.menuSource.minimumExpectedItems}`);

          const pool=createDatabasePool();
          try {
            const totals=await pool.query(`SELECT
              (SELECT count(*)::int FROM fysen.restaurants WHERE active=true) AS active_restaurants,
              (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled=true) AS enabled_menu_sources`);
            const restaurantRows=await pool.query(
              `SELECT r.slug,r.active,count(ms.id) FILTER (WHERE ms.enabled)::int AS enabled_source_count
                 FROM fysen.restaurants r
                 LEFT JOIN fysen.menu_sources ms ON ms.restaurant_id=r.id
                WHERE r.slug=ANY($1::text[])
                GROUP BY r.id,r.slug,r.active
                ORDER BY r.slug`,
              [catalogSlugs],
            );
            const sourceRows=await pool.query(
              `SELECT r.slug,ms.id,ms.url,ms.enabled,ms.minimum_expected_items,ms.last_http_status,
                      ms.consecutive_failures,ms.last_checked_at,
                      snap.extractor_version,snap.fetched_at AS snapshot_fetched_at,
                      snap.item_count AS snapshot_item_count,
                      wr.outcome AS latest_watch_outcome,wr.http_status AS latest_watch_http_status,
                      wr.extracted_item_count,wr.error_code,wr.error_message,wr.started_at AS latest_watch_started_at
                 FROM fysen.restaurants r
                 JOIN fysen.menu_sources ms ON ms.restaurant_id=r.id
                 LEFT JOIN LATERAL (
                   SELECT s.extractor_version,s.fetched_at,count(mi.id)::int AS item_count
                     FROM fysen.menu_snapshots s
                     LEFT JOIN fysen.menu_items mi ON mi.snapshot_id=s.id
                    WHERE s.menu_source_id=ms.id
                    GROUP BY s.id,s.extractor_version,s.fetched_at
                    ORDER BY s.fetched_at DESC,s.created_at DESC
                    LIMIT 1
                 ) snap ON true
                 LEFT JOIN LATERAL (
                   SELECT w.outcome,w.http_status,w.extracted_item_count,w.error_code,w.error_message,w.started_at
                     FROM fysen.menu_watch_runs w
                    WHERE w.menu_source_id=ms.id
                    ORDER BY w.started_at DESC
                    LIMIT 1
                 ) wr ON true
                WHERE r.slug=ANY($1::text[])
                ORDER BY r.slug,ms.created_at ASC`,
              [catalogSlugs],
            );
            const enabledBySlug=new Map();
            for(const row of sourceRows.rows){
              if(!row.enabled) continue;
              const existing=enabledBySlug.get(row.slug)??[];
              existing.push(row); enabledBySlug.set(row.slug,existing);
            }
            const drift=[];
            for(const slug of catalogSlugs){
              const m=manifestBySlug.get(slug);
              const restaurant=restaurantRows.rows.find((row)=>row.slug===slug);
              const enabled=enabledBySlug.get(slug)??[];
              if(!restaurant?.active) drift.push({slug,problem:'inactive_restaurant'});
              if(enabled.length!==1){drift.push({slug,problem:'enabled_source_count',count:enabled.length}); continue;}
              if(enabled[0].url!==m.menuSource.url) drift.push({slug,problem:'wrong_enabled_source_url',expected:m.menuSource.url,actual:enabled[0].url});
            }
            const activeNotCatalog=await pool.query(`SELECT slug FROM fysen.restaurants WHERE active=true AND NOT (slug=ANY($1::text[])) ORDER BY slug`,[catalogSlugs]);
            const targetSource=(enabledBySlug.get(targetSlug)??[])[0];
            if(!targetSource) throw new Error('New Delhi has no enabled production source');
            if(targetSource.url!==manifest.menuSource.url) throw new Error(`New Delhi URL=${targetSource.url}`);
            if(Number(targetSource.snapshot_item_count)<81) throw new Error(`New Delhi snapshot=${targetSource.snapshot_item_count}/81`);
            if(Number(targetSource.consecutive_failures)!==0) throw new Error(`New Delhi failures=${targetSource.consecutive_failures}`);
            if(!String(targetSource.extractor_version??'').includes('titles-v14')) throw new Error(`New Delhi extractor=${targetSource.extractor_version}`);
            if(!String(targetSource.extractor_version??'').includes('beverage-v9')) throw new Error(`New Delhi extractor=${targetSource.extractor_version}`);

            const searchProof=[];
            for(const spec of [
              {query:'Mixed Ice Cream',priceMinor:12900},
              {query:'Murgh Malai Chicken Tikka',priceMinor:14900},
            ]){
              const results=await searchDishes(pool,{normalizedQuery:normalizeDishName(spec.query),city:'Oslo',limit:100,latitude:null,longitude:null,sort:'relevance'});
              const hit=results.find((result)=>result.restaurantSlug===targetSlug && result.dishName===spec.query);
              if(!hit) throw new Error(`Production search missing New Delhi ${spec.query}`);
              if(hit.sourceUrl!==manifest.menuSource.url) throw new Error(`Production search source mismatch ${spec.query}: ${hit.sourceUrl}`);
              if(Number(hit.priceMinor)!==spec.priceMinor) throw new Error(`Production search price mismatch ${spec.query}: ${hit.priceMinor}/${spec.priceMinor}`);
              searchProof.push({query:spec.query,dishName:hit.dishName,priceMinor:hit.priceMinor,sourceUrl:hit.sourceUrl,observedAt:hit.observedAt,lastCheckedAt:hit.lastCheckedAt});
            }

            const proof={productionRevision:revision,catalogCount:manifests.length,totals:totals.rows[0],drift,activeNotCatalog:activeNotCatalog.rows,newDelhiSource:targetSource,searchProof};
            await writeFile('apps/menu-worker/research/new-delhi-production-proof-56-structured.json',JSON.stringify(proof,null,2)+'\n');
            console.log(JSON.stringify(proof,null,2));
            if(Number(totals.rows[0]?.active_restaurants)!==56) throw new Error(`Active=${totals.rows[0]?.active_restaurants}/56`);
            if(Number(totals.rows[0]?.enabled_menu_sources)!==56) throw new Error(`Enabled=${totals.rows[0]?.enabled_menu_sources}/56`);
            if(restaurantRows.rows.length!==56) throw new Error(`Production catalog restaurants=${restaurantRows.rows.length}/56`);
            if(drift.length>0||activeNotCatalog.rows.length>0) throw new Error(`Catalog drift ${JSON.stringify({drift,activeNotCatalog:activeNotCatalog.rows})}`);
          } finally { await pool.end(); }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-delhi-production-proof-56
          path: |
            apps/menu-worker/research/new-delhi-production-proof-56.json
            apps/menu-worker/research/new-delhi-production-proof-56-structured.json
          if-no-files-found: warn
