name: TEMP Batch 02 residual three post-435 recheck

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-residual-three-post-435-recheck.yml"

permissions:
  contents: read
  actions: read

jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build

      - name: Restore immutable Batch 02 seeds and create three current rechecks
        shell: bash
        run: |
          rm -rf /tmp/batch02
          mkdir -p /tmp/batch02
          gh run download 32412810199 --repo "$GITHUB_REPOSITORY" --name oslo-batch-02-research --dir /tmp/batch02
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const source = JSON.parse(await readFile('/tmp/batch02/oslo-batch-02.plan.json', 'utf8'));
          const bySlug = new Map(source.restaurants.map((entry) => [entry.restaurant.slug, entry]));
          const variants = [
            { name: 'delicatessen-grunerlokka', slug: 'delicatessen-grunerlokka-oslo', url: 'https://favrit.com/nb-no/menu/location/LK4AD79J8nO', fetchMode: 'http' },
            { name: 'delicatessen-majorstuen', slug: 'delicatessen-majorstuen-oslo', url: 'https://favrit.com/nb-no/menu/location/LgEAQE59pAo', fetchMode: 'http' },
            { name: 'der-peppern-gror', slug: 'der-peppern-gror-radhusplassen-oslo', url: 'https://radhusplassen.derpepperngror.no/meny-norsk/', fetchMode: 'http' },
          ];
          const root = 'apps/menu-worker/research/residual-three-post-435';
          await mkdir(root, { recursive: true });
          for (const variant of variants) {
            const base = bySlug.get(variant.slug);
            if (!base) throw new Error(`Missing immutable Batch 02 seed: ${variant.slug}`);
            const outputDirectory = `research/residual-three-post-435/${variant.name}-generated`;
            await mkdir(`apps/menu-worker/${outputDirectory}`, { recursive: true });
            const entry = {
              ...base,
              menuSource: {
                ...base.menuSource,
                url: variant.url,
                sourceType: 'html',
                fetchMode: variant.fetchMode,
                sourceSupport: { redirectOrigins: [], browserDataOrigins: [] },
              },
            };
            await writeFile(
              `${root}/${variant.name}.plan.json`,
              JSON.stringify({ ...source, outputDirectory, concurrency: 1, restaurants: [entry] }, null, 2) + '\n',
            );
          }
          await writeFile(`${root}/variants.json`, JSON.stringify({ variants }, null, 2) + '\n');
          NODE

      - name: Generate every remaining residual once
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          for plan in research/residual-three-post-435/*.plan.json; do
            name="$(basename "$plan" .plan.json)"
            echo "=== intake $name ==="
            node dist/index.js intake:batch "$plan" | tee "research/residual-three-post-435/$name.intake.json"
          done
          exit 0

      - name: Independently validate every generated candidate on a second fetch
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          for dir in research/residual-three-post-435/*-generated; do
            name="$(basename "$dir" -generated)"
            if compgen -G "$dir/*.json" > /dev/null; then
              echo "=== validate $name ==="
              node dist/index.js validate:batch "$dir" | tee "research/residual-three-post-435/$name.validation.json"
            else
              printf '%s\n' '{"manifestCount":0,"acceptedCount":0,"failedCount":0,"failureFamilyCounts":{},"results":[]}' > "research/residual-three-post-435/$name.validation.json"
            fi
          done
          exit 0

      - name: Summarize remaining source failures
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile, readdir } from 'node:fs/promises';
          const root = 'research/residual-three-post-435';
          const { variants } = JSON.parse(await readFile(`${root}/variants.json`, 'utf8'));
          const rows = [];
          for (const variant of variants) {
            const intake = JSON.parse(await readFile(`${root}/${variant.name}.intake.json`, 'utf8'));
            const validation = JSON.parse(await readFile(`${root}/${variant.name}.validation.json`, 'utf8'));
            const intakeResult = intake.results?.[0] ?? {};
            const validationResult = validation.results?.[0] ?? {};
            let manifest = null;
            try {
              const files = (await readdir(`${root}/${variant.name}-generated`)).filter((file) => file.endsWith('.json'));
              if (files[0]) manifest = JSON.parse(await readFile(`${root}/${variant.name}-generated/${files[0]}`, 'utf8'));
            } catch {}
            rows.push({
              name: variant.name,
              slug: variant.slug,
              url: variant.url,
              intake: {
                outcome: intakeResult.outcome ?? null,
                observedItemCount: intakeResult.observedItemCount ?? null,
                assertionCount: intakeResult.assertionCount ?? null,
                extractorVersion: intakeResult.extractorVersion ?? null,
                error: intakeResult.error ?? null,
              },
              validation: {
                accepted: validationResult.accepted ?? null,
                itemCount: validationResult.validation?.menu?.quality?.itemCount ?? null,
                extractorVersion: validationResult.validation?.menu?.extractorVersion ?? null,
                observedDishNames: validationResult.validation?.menu?.observedDishNames ?? [],
                failureFamilies: validationResult.failureFamilies ?? [],
                error: validationResult.error ?? null,
                menuError: validationResult.validation?.menu?.error ?? null,
              },
              generatedAssertions: manifest?.assertions?.requiredDishes ?? [],
            });
          }
          const summary = {
            mainRevisionUnderTest: '9ca5856438072974198cfef49ba30d09bb588da9',
            targetCount: variants.length,
            generatedCount: rows.filter((row) => row.intake.outcome === 'generated').length,
            liveAcceptedCount: rows.filter((row) => row.validation.accepted === true).length,
            rows,
          };
          await writeFile(`${root}/summary.json`, JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          if (variants.length !== 3 || new Set(variants.map((variant) => variant.slug)).size !== 3) {
            throw new Error('Residual three target drift');
          }
          NODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-residual-three-post-435-recheck
          path: apps/menu-worker/research/residual-three-post-435
          if-no-files-found: error
