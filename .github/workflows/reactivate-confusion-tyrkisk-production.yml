name: Reactivate Confusion and Tyrkisk production

on:
  pull_request:
    paths:
      - ".github/workflows/reactivate-confusion-tyrkisk-production.yml"

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-mutation
  cancel-in-progress: false

jobs:
  reactivate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Checkout exact parser merge
        uses: actions/checkout@v4
        with:
          ref: d60bf00a9a8b9f785af8f4698fc8c6e5b9a0030a
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Re-onboard Confusion
        working-directory: apps/menu-worker
        run: node dist/index.js onboard:manifest catalog/confusion-oslo.json

      - name: Re-onboard Tyrkisk Kjøkken
        working-directory: apps/menu-worker
        run: node dist/index.js onboard:manifest catalog/tyrkisk-kjokken-lindeberg-oslo.json

      - name: Verify exact canonical production state
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import { createDatabasePool } from './packages/database/dist/index.js';

          const directory = 'apps/menu-worker/catalog';
          const files = (await readdir(directory)).filter((name) => name.endsWith('.json')).sort();
          const manifestRows = [];
          for (const file of files) {
            const manifest = JSON.parse(await readFile(`${directory}/${file}`, 'utf8'));
            manifestRows.push({ file, slug: manifest.restaurant.slug, name: manifest.restaurant.name });
          }
          const manifestSlugs = manifestRows.map((row) => row.slug);
          const pool = createDatabasePool();
          try {
            const db = await pool.query(
              `SELECT r.slug, r.name, r.active,
                      count(ms.id)::int AS menu_source_count,
                      count(ms.id) FILTER (WHERE ms.enabled)::int AS enabled_menu_source_count
               FROM fysen.restaurants r
               LEFT JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               GROUP BY r.id, r.slug, r.name, r.active
               ORDER BY r.slug`,
            );
            const dbBySlug = new Map(db.rows.map((row) => [row.slug, row]));
            const catalogNotActive = manifestRows
              .filter((row) => !dbBySlug.get(row.slug)?.active)
              .map((row) => ({ ...row, db: dbBySlug.get(row.slug) ?? null }));
            const activeNotCatalog = db.rows.filter((row) => row.active && !manifestSlugs.includes(row.slug));
            const activeCatalogRows = manifestRows.filter((row) => dbBySlug.get(row.slug)?.active);

            const targetSlugs = [
              'confusion-oslo',
              'kain-neo-filipino-bistro-oslo',
              'tyrkisk-kjokken-lindeberg-oslo',
            ];
            const target = await pool.query(
              `SELECT DISTINCT ON (r.slug)
                      r.slug, r.active, ms.enabled, ms.last_http_status,
                      ms.consecutive_failures, ms.last_menu_fingerprint,
                      w.outcome AS latest_outcome, w.http_status AS latest_watch_http_status,
                      w.extracted_item_count, w.error_code, w.error_message,
                      w.started_at AS latest_watch_started_at
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               LEFT JOIN LATERAL (
                 SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at
                 FROM fysen.menu_watch_runs
                 WHERE menu_source_id = ms.id
                 ORDER BY started_at DESC
                 LIMIT 1
               ) w ON true
               WHERE r.slug = ANY($1::text[])
               ORDER BY r.slug, ms.created_at DESC`,
              [targetSlugs],
            );
            const totals = await pool.query(
              `SELECT
                 (SELECT count(*)::int FROM fysen.restaurants WHERE active = true) AS active_restaurants,
                 (SELECT count(*)::int FROM fysen.menu_sources WHERE enabled = true) AS enabled_menu_sources`,
            );
            const result = {
              manifestCount: manifestRows.length,
              uniqueManifestSlugs: new Set(manifestSlugs).size,
              activeCanonicalRestaurants: activeCatalogRows.length,
              catalogNotActive,
              activeNotCatalog,
              targetRows: target.rows,
              databaseCounts: totals.rows[0],
            };
            console.log(JSON.stringify(result, null, 2));

            if (manifestRows.length !== 45) throw new Error(`Expected 45 manifests, got ${manifestRows.length}`);
            if (new Set(manifestSlugs).size !== 45) throw new Error('Canonical catalog slugs are not unique');
            if (activeCatalogRows.length !== 45 || catalogNotActive.length !== 0) {
              throw new Error(`Expected 45/45 active canonical restaurants: ${JSON.stringify(catalogNotActive)}`);
            }
            const accepted = new Set(['changed','unchanged','not_modified']);
            for (const row of target.rows) {
              if (!row.active || !row.enabled) throw new Error(`${row.slug} is not active/enabled`);
              if (Number(row.consecutive_failures) !== 0) throw new Error(`${row.slug} failures=${row.consecutive_failures}`);
              if (!row.last_menu_fingerprint) throw new Error(`${row.slug} has no fingerprint`);
              if (!accepted.has(row.latest_outcome)) throw new Error(`${row.slug} watcher=${row.latest_outcome}`);
            }
          } finally {
            await pool.end();
          }
          NODE
