name: Diagnose inactive canonical restaurants

on:
  pull_request:
    paths:
      - ".github/workflows/inactive-catalog-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 700d24cb3c1e96a8fb5db5f2aa5f2457132d24c5
          persist-credentials: false

      - name: Apply generic navigation and cocktail filters in proof worktree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()
          text = text.replace(
            r'/^(?:hjemmeside|homepage|mine\s+favoritter|my\s+favou?rites|favoritter|favou?rites|pers\.?|medium|gluten[- ]?free|glutenfri)$/iu;',
            r'/^(?:hjemmeside|homepage|top\s+of\s+page|mine\s+favoritter|my\s+favou?rites|favoritter|favou?rites|pers\.?|medium|gluten[- ]?free|glutenfri)$/iu;'
          )
          anchor = '''const BOTTLED_BEVERAGE_VOLUME =
  /(?:^flaske$|\\b(?:flaske\\s+0[,.]\\d{1,2}(?:\\s*l)?|0[,.]\\d{1,2}\\s*l?\\s+flaske)\\)?\\s*[-–—]?$)/iu;
'''
          replacement = anchor + '''const COCKTAIL_DESCRIPTION_ITEM =
  /^(?:(?:mimosa|(?:black|white)\\s+russian|classic\\s+mojito)$|(?=.*\\b(?:gin|vodka|rom|rum|tequila|whisk(?:e)?y|bourbon|aperol|prosecco|kahlua|makers\\s+mark)\\b)(?=.*\\b(?:tonic|cola|cranberry|prosecco|lime|sitron|lemon|appelsin|orange|eggehvite|egg\\s*white)\\b).+)$/iu;
'''
          if anchor not in text:
            raise SystemExit('beverage anchor not found')
          text = text.replace(anchor, replacement)
          text = text.replace(
            '    !BOTTLED_BEVERAGE_VOLUME.test(filterName)\n',
            '    !BOTTLED_BEVERAGE_VOLUME.test(filterName) &&\n    !COCKTAIL_DESCRIPTION_ITEM.test(filterName)\n'
          )
          if 'top\\s+of\\s+page' not in text or 'COCKTAIL_DESCRIPTION_ITEM' not in text:
            raise SystemExit('proof patch failed')
          path.write_text(text)
          PY
          git diff --check

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Prove generic output-quality filter
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createMenuItemSourceKey, normalizeDishName } from './packages/menu-core/dist/index.js';
          import { isCanonicalHtmlMenuItem } from './apps/menu-worker/dist/menu-source-runtime.js';
          const item = (name) => ({
            sourceKey: createMenuItemSourceKey(name), name, normalizedName: normalizeDishName(name),
            description: null, sectionName: null, priceMinor: 20500, currency: 'NOK', position: 0,
            extractionMethod: 'html_heuristic', confidence: 0.9, sourceExcerpt: name,
          });
          const reject = [
            'top of page', 'Rom, cola og lime', 'Vodka, cranberry og lime', 'Mimosa',
            'Black Russian Kahlua', 'White Russian', 'Vodka Cranberry',
            'Aperol, Prosecco, appelsin', 'Hendricks gin, agurk, tonic',
            'Makers mark, eggehvite, sitron', 'Classic Mojito',
          ];
          const preserve = [
            'Fish & Chips', 'Sesame Chicken', 'Vegan Burger', 'Rum Raisin Ice Cream',
            'Gin-cured salmon', 'Orange Chicken',
          ];
          const badReject = reject.filter((name) => isCanonicalHtmlMenuItem(item(name)));
          const badPreserve = preserve.filter((name) => !isCanonicalHtmlMenuItem(item(name)));
          console.log(JSON.stringify({ reject, preserve, badReject, badPreserve }, null, 2));
          if (badReject.length || badPreserve.length) process.exit(1);
          NODE

      - name: Validate affected inactive canonical manifests live
        shell: bash
        run: |
          failed=0
          for manifest in \
            catalog/confusion-oslo.json \
            catalog/tyrkisk-kjokken-lindeberg-oslo.json
          do
            echo "===== $manifest ====="
            if ! pnpm --filter @fysen/menu-worker validate:manifest "$manifest"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Read latest production failure state
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createDatabasePool } from './packages/database/dist/index.js';
          const slugs = [
            'confusion-oslo',
            'kain-neo-filipino-bistro-oslo',
            'tyrkisk-kjokken-lindeberg-oslo',
          ];
          const pool = createDatabasePool();
          try {
            const { rows } = await pool.query(
              `SELECT r.slug, r.active,
                      ms.enabled AS menu_enabled,
                      ms.last_http_status,
                      ms.consecutive_failures,
                      ms.last_checked_at,
                      ms.last_menu_fingerprint,
                      w.outcome AS latest_menu_outcome,
                      w.http_status AS latest_menu_http_status,
                      w.extracted_item_count,
                      w.error_code AS menu_error_code,
                      w.error_message AS menu_error_message,
                      w.started_at AS menu_watch_started_at
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               LEFT JOIN LATERAL (
                 SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at
                 FROM fysen.menu_watch_runs
                 WHERE menu_source_id = ms.id
                 ORDER BY started_at DESC
                 LIMIT 1
               ) w ON true
               WHERE r.slug = ANY($1::text[])
               ORDER BY r.slug, ms.created_at DESC`,
              [slugs],
            );
            console.log(JSON.stringify(rows, null, 2));
          } finally {
            await pool.end();
          }
          NODE
