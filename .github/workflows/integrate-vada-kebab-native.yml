name: Integrate source-preserving Vada and kebab masks
on:
  push:
    branches: [art/vada-kebab-native-sources-20261125]
    paths:
      - scripts/integrate-vada-kebab-native.py
      - .github/workflows/integrate-vada-kebab-native.yml
      - assets/fysen-image-candidates/*/native-photo-20261125/ai-foreground-mask.png
permissions:
  contents: write
jobs:
  integrate:
    if: "!contains(github.event.head_commit.message, '[native-mask-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install --disable-pip-version-check Pillow==13.0.0
      - name: Apply reviewed AI masks to unmodified source RGB
        run: python scripts/integrate-vada-kebab-native.py
      - name: Check native originals, licenses, thumbnails and gallery
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-image-resolution-contract.test.mjs
      - name: Commit validated integration to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/vada.png assets/fysen-dish-originals/kebab-pita.png
          git add assets/fysen-image-candidates/vada/native-photo-20261125/review.json assets/fysen-image-candidates/kebab-pita/native-photo-20261125/review.json
          git add apps/web/public/dish-images/manifest.json apps/web/public/dish-images/medu-vada-master-8160.avif apps/web/public/dish-images/medu-vada-thumb-512.avif apps/web/public/dish-images/kebab-pita-master-4000.avif apps/web/public/dish-images/kebab-pita-thumb-512.avif apps/web/public/dish-images/vada-LICENSE.txt apps/web/public/dish-images/kebab-pita-LICENSE.txt
          git add docs/fysen-image-reviews/vada.md docs/fysen-image-reviews/kebab-pita.md
          git diff --cached --quiet && exit 0
          git commit -m "[native-mask-bot] Integrate full-resolution source-preserved Vada and kebab photos"
          git push origin HEAD:"$GITHUB_REF_NAME"
