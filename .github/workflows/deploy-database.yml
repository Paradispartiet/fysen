name: Deploy Fysen database

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY to run a manual production migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fysen-production-database
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.confirm == 'DEPLOY') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       vars.FYSEN_DATABASE_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
    steps:
      - name: Require production database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "FYSEN_PRODUCTION_DATABASE_URL is not configured." >&2
            exit 1
          fi

      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false

      - name: Validate bundled Supabase root CA
        shell: bash
        run: |
          certificate="packages/database/certs/supabase-root-2021-ca.crt"
          openssl x509 -in "$certificate" -noout -checkend 2592000
          fingerprint="$(openssl x509 -in "$certificate" -noout -fingerprint -sha256 | cut -d= -f2)"
          expected="80:70:25:AD:50:D4:ED:21:9D:2C:9C:7D:29:9C:00:4F:82:4E:B0:0C:F7:F6:5A:FE:F6:07:D0:7B:72:E6:CA:FA"
          if [ "$fingerprint" != "$expected" ]; then
            echo "Bundled Supabase root CA fingerprint mismatch." >&2
            exit 1
          fi

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build database dependency graph
        run: pnpm --filter @fysen/database... build

      - name: Apply pending production migrations
        run: pnpm --filter @fysen/database migrate

      - name: Verify production database
        run: pnpm --filter @fysen/database verify:production
