name: Refresh Fysen Free menus (bounded, database-independent)
on:
  # Eight small checks per day; at most 12 menu sources per run (UTC).
  schedule:
    - cron: "31 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-fysen-free-menus.yml"
      - "apps/menu-worker/src/free-static-refresh*.ts"
      # Publish validated menu edits immediately rather than waiting for a delayed cron.
      - "apps/menu-worker/catalog/**"
      # Genuine extraction changes invalidate old source interpretation.
      - "apps/menu-worker/src/menu-source-runtime.ts"
      - "apps/menu-worker/src/html-*.ts"
      - "apps/menu-worker/src/manifest-quality.ts"
      - "packages/menu-core/src/**"
      # Pure test changes never need a live menu refresh.
      - "!apps/menu-worker/src/**/*.test.ts"
      - "!packages/menu-core/src/**/*.test.ts"
permissions:
  contents: write
concurrency:
  group: fysen-free-public-index
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout Fysen source and parser
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout isolated public data branch (no force pushes)
        uses: actions/checkout@v4
        with:
          ref: fysen-free-public-index
          path: public-index
          persist-credentials: true
      - name: Setup existing Node and parser dependencies
        uses: ./.github/actions/setup-node-pnpm
      - name: Build reused production menu parser
        run: pnpm --filter @fysen/menu-worker... build
      - name: Focused Free refresh tests
        run: pnpm --filter @fysen/menu-worker exec vitest run src/free-static-refresh.test.ts
      - name: Refresh at most 12 public sources, fail closed
        env:
          FYSEN_HTTP_TIMEOUT_MS: "12000"
          FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
        run: |
          node apps/menu-worker/dist/free-static-refresh.js \
            public-index apps/menu-worker/catalog 12
      - name: Publish only audited, static menu index branch
        working-directory: public-index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.json.gz manifest.json
          if git diff --cached --quiet; then
            echo 'No changes; existing verified menu index is preserved.'
          else
            git commit -m 'data: bounded, quality-gated Free menu refresh'
            git push origin HEAD:refs/heads/fysen-free-public-index
          fi
