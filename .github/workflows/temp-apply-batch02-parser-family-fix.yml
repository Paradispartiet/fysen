name: TEMP apply Batch 02 parser family fix

on:
  push:
    branches:
      - agent/batch02-parser-family-canonicalization
    paths:
      - ".github/workflows/temp-apply-batch02-parser-family-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch02-parser-family-canonicalization
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile

      - name: Apply exact parser-family edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          runtime_path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              'export const HTML_PRICE_NOTATION_NORMALIZER_VERSION = "price-notation-v2";',
              'export const HTML_PRICE_NOTATION_NORMALIZER_VERSION = "price-notation-v3";',
              'price version',
          )
          runtime = replace_once(
              runtime,
              'export const HTML_NON_DISH_FILTER_VERSION = "non-dish-v8";',
              'export const HTML_NON_DISH_FILTER_VERSION = "non-dish-v9";',
              'non-dish version',
          )
          runtime = replace_once(
              runtime,
              'export function normalizeHtmlPriceNotation(html: string): string {\n  return html\n    .replace(/(\\b(?:kr\\.?\\s*)?[1-9]\\d{1,3})(?:\\s*,)?\\s*\\/-/giu, "$1,-")',
              'export function normalizeHtmlPriceNotation(html: string): string {\n  return html\n    .replace(/(\\b(?:kr\\.?\\s*)?[1-9]\\d{1,3})\\s*\\.-/giu, "$1,-")\n    .replace(/(\\b(?:kr\\.?\\s*)?[1-9]\\d{1,3})(?:\\s*,)?\\s*\\/-/giu, "$1,-")',
              'dot-dash normalization',
          )
          runtime = replace_once(
              runtime,
              'const NON_DISH_FRAGMENT_ITEM = /^(?:stk\\.?|biter\\.)\\s+/iu;',
              '''const NON_DISH_BADGE_ITEM =\n  /^(?:veg(?:etarian)?(?:\\s+spicy)?|spicy)$/iu;\nconst BRANDED_MENU_SECTION_ITEM =\n  /^(?:[A-ZÆØÅ]{2,24}\\s+)(?:RAW|MAKI|TACO|SMÅRETTER|SALATER|VEGANSK|SHARING)$/u;\nconst PER_PERSON_PRICE_DISPLAY_ONLY_ITEM =\n  /^(?:(?:nok|kr\\.?)\\s*)?[1-9]\\d{1,3}(?:[.,]\\d{1,2})?\\s*,?[–—-]\\s+per\\s+(?:person|pers\\.?)$/iu;\nconst DAILY_MENU_LABEL_ITEM =\n  /^dagens\\s+(?:veganske|vegetariske)\\s+meny$/iu;\nconst NON_DISH_FRAGMENT_ITEM = /^(?:stk\\.?|biter\\.)\\s+/iu;''',
              'non-dish family constants',
          )
          runtime = replace_once(
              runtime,
              '    !NON_DISH_METADATA_ITEM.test(filterName) &&\n    !NON_DISH_FRAGMENT_ITEM.test(filterName) &&',
              '''    !NON_DISH_METADATA_ITEM.test(filterName) &&\n    !NON_DISH_BADGE_ITEM.test(filterName) &&\n    !BRANDED_MENU_SECTION_ITEM.test(filterName) &&\n    !PER_PERSON_PRICE_DISPLAY_ONLY_ITEM.test(filterName) &&\n    !DAILY_MENU_LABEL_ITEM.test(filterName) &&\n    !NON_DISH_FRAGMENT_ITEM.test(filterName) &&''',
              'non-dish family checks',
          )
          runtime_path.write_text(runtime)

          trailing_path = Path('apps/menu-worker/src/html-trailing-price-card-recovery.ts')
          trailing = trailing_path.read_text()
          trailing = replace_once(
              trailing,
              '  "trailing-price-card-v10";',
              '  "trailing-price-card-v11";',
              'trailing version',
          )
          trailing = replace_once(
              trailing,
              'const TRAILING_MARKED_PRICE =\n  /(?:(fra|from)\\s+)?([1-9]\\d{1,3})(?:[.,](\\d{1,2}))?\\s*(?:,-|kr\\.?|NOK)\\s*$/iu;',
              '''const PRICE_WITH_TRAILING_PARENTHETICAL =\n  /^(?:(fra|from)\\s+)?(?:(?:NOK\\s*)|(?:kr\\.?\\s*))?([1-9]\\d{1,3})(?:[.,](\\d{1,2}))?(?:\\s*(?:,-|kr\\.?|NOK))?\\s*(\\([^()]{1,240}\\))$/iu;\nconst TRAILING_MARKED_PRICE =\n  /(?:(fra|from)\\s+)?([1-9]\\d{1,3})(?:[.,](\\d{1,2}))?\\s*(?:,-|kr\\.?|NOK)\\s*$/iu;''',
              'parenthetical price regex',
          )
          trailing = replace_once(
              trailing,
              '  const trailing = line.match(TRAILING_MARKED_PRICE);',
              '''  const annotated = line.match(PRICE_WITH_TRAILING_PARENTHETICAL);\n  if (annotated?.[2]) {\n    const priceMinor = parsedAmount(annotated[2], annotated[3]);\n    if (priceMinor === null) return null;\n    return {\n      priceMinor,\n      priceKind: annotated[1] ? "from" : "exact",\n      residual: normalizeVisibleLine(annotated[4] ?? ""),\n    };\n  }\n\n  const trailing = line.match(TRAILING_MARKED_PRICE);''',
              'parenthetical price parsing',
          )
          trailing_path.write_text(trailing)
          PY

      - name: Run focused parser regressions
        run: pnpm --filter @fysen/menu-worker test -- batch02-parser-family-regression.test.ts html-price-notation-normalizer.test.ts html-trailing-price-card-recovery.test.ts

      - name: Run menu-worker test suite and typecheck
        run: |
          pnpm --filter @fysen/menu-worker test
          pnpm --filter @fysen/menu-worker typecheck

      - name: Remove temporary workflow and commit permanent files
        shell: bash
        run: |
          rm .github/workflows/temp-apply-batch02-parser-family-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/html-trailing-price-card-recovery.ts apps/menu-worker/src/batch02-parser-family-regression.test.ts .github/workflows/temp-apply-batch02-parser-family-fix.yml
          git commit -m "Support Batch 02 parser price and label families"
          git push origin HEAD:agent/batch02-parser-family-canonicalization
