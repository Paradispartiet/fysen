name: Fysen stage native shrimp open-sandwich sources

on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-stage-rekesmorbrod.yml"
      - "scripts/stage-rekesmorbrod-native.py"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fysen-rekesmorbrod-photo-sources
  cancel-in-progress: false

jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image reader
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Stage verified source photos without publication
        run: python scripts/stage-rekesmorbrod-native.py
      - name: Verify unapproved source evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          reviews=list(Path("assets/fysen-image-candidates/rekesmorbrod").glob("*/review.json"))
          assert len(reviews)>=2
          for p in reviews:
              d=json.loads(p.read_text())
              assert d["source_verified"] is True
              assert d["approved_for_fysen"] is False and d["published"] is False
              assert min(d["source_width"],d["source_height"])>=2300
              assert (p.parent/"native-detail-1400.jpg").exists()
          print(f"{len(reviews)} source candidates ready for visual review")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-shrimp-sandwich-source-candidates
          if-no-files-found: error
          retention-days: 7
          path: |
            assets/fysen-image-candidates/rekesmorbrod/*/source.jpeg
            assets/fysen-image-candidates/rekesmorbrod/*/preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/*/native-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/*/review.json
      - name: Commit evidence and small preview only
        run: |
          find assets/fysen-image-candidates/rekesmorbrod -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-sources-bot] Review original shrimp sandwich candidates"
          git push origin HEAD:"$GITHUB_REF_NAME"
