name: TEMP Polskie Foodora DOM diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/temp-polskie-dom-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Inspect Foodora semantic menu DOM
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { load } from 'cheerio';

          const url = 'https://www.foodora.no/en/restaurant/wobf/polskie-jadlo';
          const response = await fetch(url, { headers: { 'user-agent': 'FysenMenuBot/0.1' } });
          const html = await response.text();
          const $ = load(html);
          const sections = $("[data-testid='menu-category-section']").toArray().map((section) => {
            const node = $(section);
            return {
              title: node.find("[data-testid='menu-category-section-title']").first().text().replace(/\s+/g, ' ').trim(),
              products: node.find("[data-testid='menu-product']").toArray().map((product) => {
                const card = $(product);
                return {
                  name: card.find("[data-testid='menu-product-name']").first().text().replace(/\s+/g, ' ').trim(),
                  price: card.find("[data-testid='menu-product-price']").first().text().replace(/\s+/g, ' ').trim(),
                  text: card.text().replace(/\s+/g, ' ').trim().slice(0, 500),
                };
              }),
            };
          });
          const testIds = new Map();
          $('[data-testid]').each((_, element) => {
            const id = $(element).attr('data-testid');
            if (!id || !/(menu|product|category)/i.test(id)) return;
            testIds.set(id, (testIds.get(id) ?? 0) + 1);
          });
          const needles = ['Pierogi Polskie', 'Okraszone Cebulką', 'Sztućce'];
          const rawOccurrences = {};
          for (const needle of needles) {
            const snippets = [];
            let from = 0;
            while (snippets.length < 8) {
              const index = html.indexOf(needle, from);
              if (index < 0) break;
              snippets.push(html.slice(Math.max(0, index - 350), Math.min(html.length, index + needle.length + 650)).replace(/\s+/g, ' '));
              from = index + needle.length;
            }
            rawOccurrences[needle] = snippets;
          }
          console.log(JSON.stringify({
            status: response.status,
            htmlLength: html.length,
            sections,
            testIds: Object.fromEntries([...testIds].sort()),
            rawOccurrences,
          }, null, 2));
          NODE
