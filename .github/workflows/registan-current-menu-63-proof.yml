name: TEMP prove Registan refresh and strict 63 catalog

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/registan-current-menu-63-proof.yml"

permissions:
  contents: read

env:
  FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
  FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "1"
  FYSEN_CANDIDATE_VALIDATION_MAX_ATTEMPTS: "1"

jobs:
  registan-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Validate refreshed Registan once
        working-directory: apps/menu-worker
        shell: bash
        run: |
          rm -rf research/registan-refresh && mkdir -p research/registan-refresh
          cp catalog/registan-gronland-oslo.json research/registan-refresh/
          set +e
          node dist/index.js validate:batch research/registan-refresh | tee research/registan-refresh-validation.json
          echo ${PIPESTATUS[0]} > research/registan-refresh-exit.txt
          exit 0
      - name: Gate current 25-item identity
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const v=JSON.parse(await readFile('research/registan-refresh-validation.json','utf8'));
          const status=Number((await readFile('research/registan-refresh-exit.txt','utf8')).trim());
          const r=v.results?.[0];const m=r?.validation?.menu;const names=m?.observedDishNames??[];const vars=m?.observedDishVariants??[];const failures=[];
          if(v.maxAttempts!==1||v.manifestCount!==1||v.acceptedCount!==1||v.failedCount!==0||status!==0||!r?.accepted)failures.push('not-1/1-one-attempt');
          if(m?.quality?.itemCount!==25)failures.push(`count:${m?.quality?.itemCount}`);
          if(!vars.some(x=>x.name==='Usbetisk Plov (Vegetar) 🌱'&&x.priceMinor===34900))failures.push('missing-current-plov');
          if(names.includes('Usbekisk Plov'))failures.push('stale-plov-present');
          if(r?.validation?.hours?.intervalCount!==7||r?.validation?.hours?.accepted!==true)failures.push('hours-not-7/7');
          const summary={accepted:r?.accepted,itemCount:m?.quality?.itemCount,maxAttempts:v.maxAttempts,extractorVersion:m?.extractorVersion,hours:r?.validation?.hours,failures};
          await writeFile('research/registan-refresh-summary.json',JSON.stringify(summary,null,2)+'\n');console.log(JSON.stringify(summary,null,2));
          if(failures.length)throw new Error(JSON.stringify(failures));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registan-current-menu-live-proof
          path: apps/menu-worker/research/registan-refresh-*.json
          if-no-files-found: error

  strict-63:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 11.4.0, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 24.18.0 }
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Prove published-refresh fail-closed safety contract
        run: pnpm --filter @fysen/menu-worker exec vitest run src/onboarding-refresh-safety.test.ts src/catalog-onboarding-failure-policy.test.ts src/production-menu-mutation-workflow.test.ts
      - name: Require exact 63 unique manifests
        working-directory: apps/menu-worker
        run: node --input-type=module -e "const fs=await import('node:fs/promises');const files=(await fs.readdir('catalog')).filter(f=>f.endsWith('.json'));const slugs=[];for(const f of files)slugs.push(JSON.parse(await fs.readFile('catalog/'+f,'utf8')).restaurant.slug);if(files.length!==63||new Set(slugs).size!==63)throw new Error('catalog identity '+files.length+'/'+new Set(slugs).size)"
      - name: Validate exact 63 catalog with one validator attempt
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          node dist/index.js validate:batch catalog | tee research/registan-final63-validation.json
          echo ${PIPESTATUS[0]} > research/registan-final63-exit.txt
          exit 0
      - name: Gate exact 63 result
        working-directory: apps/menu-worker
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const v=JSON.parse(await readFile('research/registan-final63-validation.json','utf8'));const status=Number((await readFile('research/registan-final63-exit.txt','utf8')).trim());const failed=(v.results??[]).filter(r=>!r.accepted).map(r=>({slug:r.slug,failureFamilies:r.failureFamilies??[],error:r.error??r.validation?.menu?.error??null,hoursError:r.validation?.hours?.error??null,actionErrors:(r.validation?.actions??[]).filter(a=>!a.accepted).map(a=>a.error)}));const s={manifestCount:v.manifestCount,acceptedCount:v.acceptedCount,failedCount:v.failedCount,maxAttempts:v.maxAttempts,validatorExitStatus:status,failed};await writeFile('research/registan-final63-summary.json',JSON.stringify(s,null,2)+'\n');console.log(JSON.stringify(s,null,2));if(v.maxAttempts!==1||v.manifestCount!==63||v.acceptedCount!==63||v.failedCount!==0||status!==0||failed.length)throw new Error('strict 63 gate failed');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registan-current-menu-final63-gate
          path: apps/menu-worker/research/registan-final63-*.json
          if-no-files-found: error
