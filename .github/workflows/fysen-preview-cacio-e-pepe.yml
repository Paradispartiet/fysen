name: Fysen inspect full-plate cacio e pepe on black
on:
  push:
    branches: [art/cacio-e-pepe-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-preview-cacio-e-pepe.yml"
      - "scripts/preview-cacio-e-pepe-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-cacio-e-pepe-black-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source-native image tools
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Make source-locked black photo variants
        run: python scripts/preview-cacio-e-pepe-black.py
      - name: Verify review only, with native details
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          base=Path("assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons")
          a=json.loads((base/"black-review.json").read_text())
          assert a["source_dimensions"]==[4577,2498]
          assert not a["native_pixels_upscaled"] and not a["food_pixels_generated"]
          assert a["approved_for_fysen"] is False and a["published"] is False
          for variant in ["black-contour","black-grabcut"]:
            assert (base/f"{variant}-preview.jpg").exists()
            assert (base/f"{variant}-native-detail-1400.jpg").exists()
          print("Two BLACK previews exist; 0 approved, 0 published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-cacio-e-pepe-black-native-previews
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-*-native.png
            assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-*-preview.jpg
            assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-*-native-detail-1400.jpg
            assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-review.json
      - name: Commit only lightweight NONAPPROVED previews
        run: |
          find assets/fysen-image-candidates/cacio-e-pepe -name "black-*-native.png" -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons
          git diff --cached --quiet && exit 0
          git commit -m "[cacio-e-pepe-preview-bot] Stage unapproved source-native black photos"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
