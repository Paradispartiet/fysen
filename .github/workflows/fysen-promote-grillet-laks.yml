name: Fysen promote approved grilled salmon photo

on:
  push:
    branches: [art/grillet-laks-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-promote-grillet-laks.yml"
      - "scripts/promote-reviewed-grillet-laks.py"
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fysen-grillet-laks-promotion
  cancel-in-progress: false
jobs:
  promote:
    if: "!contains(github.event.head_commit.message, '[salmon-promote-bot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AVIF and native photo codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 pillow-avif-plugin==1.5.2
      - name: Regenerate reviewed native image and integrate exact source
        run: python scripts/promote-reviewed-grillet-laks.py
      - name: Run only focused image and provenance tests
        run: node --test apps/web/tests/dish-image-large-view-quality.test.mjs apps/web/tests/dish-photo-gallery.test.mjs
      - name: Check 7 approved sources and publication guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path("apps/web/public/dish-images/manifest.json")
          photos=json.loads(src.read_text())["images"]
          entry=next(x for x in photos if x["id"]=="grillet-laks")
          assert sum(x.get("largeViewEnabled",False) for x in photos)==7
          assert entry["largeSource"]=="grillet-laks-master-3489.avif"
          assert entry["atlas"]=="grillet-laks-thumb-512.avif"
          assert entry["largeSourceNativeWidth"]==3489
          assert entry["largeSourceNativeHeight"]==3450
          assert entry["catalogId"] is None
          evidence=json.loads(Path("assets/fysen-image-candidates/grillet-laks/29149758/black-review.json").read_text())
          assert evidence["approved_for_fysen"] is True
          assert evidence["published"] is False
          print("7 reviewed full-size photos, no deployment initiated")
          PY
      - name: Commit reviewed original and public image pointers into same PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/grillet-laks.png
          git add assets/fysen-image-candidates/grillet-laks/29149758/black-review.json
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/public/dish-images/grillet-laks-master-3489.avif
          git add apps/web/public/dish-images/grillet-laks-thumb-512.avif
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/grillet-laks.md
          git diff --cached --quiet && exit 0
          git commit -m "[salmon-promote-bot] Add verified grilled salmon master and independent mini"
          git push origin HEAD:"$GITHUB_REF_NAME"
