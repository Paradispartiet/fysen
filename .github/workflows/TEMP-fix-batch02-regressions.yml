name: TEMP fix Batch 02 regressions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Apply proven generic regression fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # 1. At equal coverage keep the specialized standalone recovery.
          replace_once(
              'apps/menu-worker/src/html-source-extractor.ts',
              'if (standaloneQualifies && standalone.items.length > recovered.length) {',
              'if (standaloneQualifies && standalone.items.length >= recovered.length) {',
          )

          # 2. Allergen evidence may strip compact codes, never arbitrary words.
          replace_once(
              'apps/menu-worker/src/html-text-section-scope.ts',
              '''const TRAILING_ITEM_ALLERGEN_CODES =\n  /\\s+\\((?:[\\p{L}\\d]{1,5}\\s*(?:[,/+ ]\\s*)?){1,20}\\)$/u;''',
              '''const TRAILING_ITEM_ALLERGEN_CODES =\n  /\\s+\\((?:[\\p{L}]{1,2}|\\d{1,2})(?:\\s*[,/+ ]\\s*(?:[\\p{L}]{1,2}|\\d{1,2}))*\\)$/u;''',
          )

          scope_path = Path('apps/menu-worker/src/html-text-section-scope.ts')
          scope = scope_path.read_text()
          helper = '''\n\nexport function filterHtmlBeverageSectionItemsWithScopedProvenance(\n  items: readonly MenuObservedItem[],\n  scopedVisibleText: string,\n  fullVisibleText: string,\n): readonly MenuObservedItem[] {\n  if (items.length === 0) return items;\n\n  const scopedLines = scopedVisibleText\n    .split("\\n")\n    .map(normalizeLine)\n    .filter(Boolean);\n  const scopedItems: MenuObservedItem[] = [];\n  const fullPageRecoveryItems: MenuObservedItem[] = [];\n\n  for (const item of items) {\n    if (scopedLines.some((line) => lineReferencesItem(line, item.name))) {\n      scopedItems.push(item);\n    } else {\n      fullPageRecoveryItems.push(item);\n    }\n  }\n\n  const scopedFiltered = filterPlainTextBeverageSectionItems(\n    scopedItems,\n    scopedVisibleText,\n  );\n  const fullPageFiltered = filterPlainTextBeverageSectionItems(\n    fullPageRecoveryItems,\n    fullVisibleText,\n  );\n\n  const unique = new Map<string, MenuObservedItem>();\n  for (const item of fullPageFiltered) unique.set(item.sourceKey, item);\n  for (const item of scopedFiltered) unique.set(item.sourceKey, item);\n  return [...unique.values()].sort((left, right) => left.position - right.position);\n}\n'''
          if 'filterHtmlBeverageSectionItemsWithScopedProvenance' not in scope:
              scope_path.write_text(scope.rstrip() + helper)

          # 3. A punctuated numeric prefix is a menu index, not a quantity prefix.
          canonical_path = Path('apps/menu-worker/src/html-output-canonicalizer.ts')
          canonical = canonical_path.read_text()
          old = '''  if (!excerptHead) return false;\n  const normalizedExcerptHead = normalizeDishName(excerptHead);'''
          new = '''  if (!excerptHead) return false;\n  if (!/^\\d+\\s+/u.test(excerptHead)) return false;\n  const normalizedExcerptHead = normalizeDishName(excerptHead);'''
          if new not in canonical:
              if old not in canonical:
                  raise SystemExit('numeric-prefix canonicalizer anchor missing')
              canonical_path.write_text(canonical.replace(old, new, 1))

          # 4. Full-page beverage evidence applies only to items absent from the
          # already food-scoped extraction text.
          runtime_path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          runtime = runtime_path.read_text()
          old_import = '''import {\n  filterPlainTextBeverageSectionItems,\n  HTML_TEXT_SECTION_SCOPE_VERSION,\n} from "./html-text-section-scope.js";'''
          new_import = '''import {\n  filterHtmlBeverageSectionItemsWithScopedProvenance,\n  HTML_TEXT_SECTION_SCOPE_VERSION,\n} from "./html-text-section-scope.js";'''
          old_call = '''    const beverageScopedItems =\n      extracted.method === "html_heuristic"\n        ? filterPlainTextBeverageSectionItems(canonicalItems, fullVisibleText)\n        : canonicalItems;'''
          new_call = '''    const beverageScopedItems =\n      extracted.method === "html_heuristic"\n        ? filterHtmlBeverageSectionItemsWithScopedProvenance(\n            canonicalItems,\n            extracted.visibleText,\n            fullVisibleText,\n          )\n        : canonicalItems;'''
          if new_import not in runtime:
              if old_import not in runtime:
                  raise SystemExit('runtime scope import anchor missing')
              runtime = runtime.replace(old_import, new_import, 1)
          if new_call not in runtime:
              if old_call not in runtime:
                  raise SystemExit('runtime beverage call anchor missing')
              runtime = runtime.replace(old_call, new_call, 1)
          runtime_path.write_text(runtime)

          # Regression: parenthetical words are not allergen codes, and scoped
          # food provenance protects food from a repeated full-page drink copy.
          scope_test_path = Path('apps/menu-worker/src/html-text-section-scope.test.ts')
          scope_test = scope_test_path.read_text()
          scope_test = scope_test.replace(
              '''  filterPlainTextBeverageSectionItems,\n  HTML_TEXT_SECTION_SCOPE_VERSION,''',
              '''  filterHtmlBeverageSectionItemsWithScopedProvenance,\n  filterPlainTextBeverageSectionItems,\n  HTML_TEXT_SECTION_SCOPE_VERSION,''',
              1,
          )
          scope_regression = '''\n\n  it("does not strip parenthetical words as allergen codes", () => {\n    const items = [item("House Special", 1, 24900)];\n    const visibleText = `\n      Chef Selection\n      House Special\n      249\n      Drikke\n      House Special (VEGAN)\n      79\n    `;\n\n    expect(\n      filterPlainTextBeverageSectionItems(items, visibleText).map(\n        (entry) => entry.name,\n      ),\n    ).toEqual(["House Special"]);\n  });\n\n  it("uses full-page drink evidence only for items absent from scoped food text", () => {\n    const items = [\n      item("House Special", 1, 24900),\n      item("House Soda", 2, 5500),\n    ];\n    const scopedVisibleText = `\n      Chef Selection\n      House Special\n      249\n    `;\n    const fullVisibleText = `\n      Chef Selection\n      House Special\n      249\n      Drikke\n      House Special\n      79\n      House Soda\n      55\n    `;\n\n    expect(\n      filterHtmlBeverageSectionItemsWithScopedProvenance(\n        items,\n        scopedVisibleText,\n        fullVisibleText,\n      ).map((entry) => entry.name),\n    ).toEqual(["House Special"]);\n  });\n'''
          if 'does not strip parenthetical words as allergen codes' not in scope_test:
              marker = '\n});\n'
              if not scope_test.endswith(marker):
                  raise SystemExit('scope test final marker missing')
              scope_test = scope_test[:-len(marker)] + scope_regression + marker
          scope_test_path.write_text(scope_test)

          # Regression: indexed numbered dish aliases stay available.
          canonical_test_path = Path('apps/menu-worker/src/html-output-canonicalizer.test.ts')
          canonical_test = canonical_test_path.read_text()
          canonical_regression = '''\n\n  it("preserves a canonical suffix when the numeric prefix is a menu index", () => {\n    const items = [\n      item("KEBAB PIZZA", 29900, null, "65. KEBAB PIZZA — 299"),\n      item("65. KEBAB PIZZA", 29900),\n    ];\n    expect(canonicalizeHtmlOutputItems(items).map((entry) => entry.name)).toEqual([\n      "KEBAB PIZZA",\n      "65. KEBAB PIZZA",\n    ]);\n  });\n'''
          if 'numeric prefix is a menu index' not in canonical_test:
              marker = '\n});\n'
              if not canonical_test.endswith(marker):
                  raise SystemExit('canonicalizer test final marker missing')
              canonical_test = canonical_test[:-len(marker)] + canonical_regression + marker
          canonical_test_path.write_text(canonical_test)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/html-output-canonicalizer.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/html-output-canonicalizer.test.ts

      - name: Commit permanent fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-source-extractor.ts apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/html-output-canonicalizer.ts apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/html-output-canonicalizer.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix Batch 02 cleanup regressions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
