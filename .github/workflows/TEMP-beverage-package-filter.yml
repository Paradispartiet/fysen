name: TEMP beverage package filter

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/inline-priced-title-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Filter beverage package metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/menu-source-runtime.ts')
          text = path.read_text()
          anchor = '''const BEVERAGE_STYLE_ITEM =\n'''
          helper = '''const BEVERAGE_PACKAGE_ITEM =\n  /^(?:with\\s+)?(?:wine|drink|beverage)\\s+package$/iu;\n''' + anchor
          if 'const BEVERAGE_PACKAGE_ITEM' not in text:
              if anchor not in text:
                  raise SystemExit('beverage style anchor missing')
              text = text.replace(anchor, helper, 1)
          old = '''    !BEVERAGE_MENU_ITEM.test(filterName) &&\n    !BEVERAGE_STYLE_ITEM.test(filterName) &&\n'''
          new = '''    !BEVERAGE_MENU_ITEM.test(filterName) &&\n    !BEVERAGE_PACKAGE_ITEM.test(filterName) &&\n    !BEVERAGE_STYLE_ITEM.test(filterName) &&\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('canonical beverage filter anchor missing')
              text = text.replace(old, new, 1)
          text = text.replace(
              'export const HTML_BEVERAGE_FILTER_VERSION = "beverage-v8";',
              'export const HTML_BEVERAGE_FILTER_VERSION = "beverage-v9";',
              1,
          )
          path.write_text(text)

          test = Path('apps/menu-worker/src/menu-source-runtime-version.test.ts')
          t = test.read_text().replace('toBe("beverage-v8")', 'toBe("beverage-v9")')
          test.write_text(t)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/menu-source-runtime.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
          git commit -m "Filter beverage package metadata"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
