name: Final 44-dish gallery browser proof
on:
  push:
    branches: [art/vada-kebab-native-sources-20261125]
    paths:
      - .github/workflows/final-dish-gallery-browser-proof.yml
      - apps/web/tests/final-dish-gallery-browser-proof.mjs
      - apps/web/components/dish-photo-gallery.tsx
permissions:
  contents: read
concurrency:
  group: final-dish-gallery-browser-proof
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-pnpm
      - name: Build final draft app
        run: |
          pnpm --filter @fysen/contracts build
          pnpm --filter @fysen/web build
      - name: Existing responsive homepage journeys and final image browser checks
        env:
          FYSEN_QA_BASE: http://127.0.0.1:3000
          FYSEN_QA_OUTPUT_DIR: ${{ runner.temp }}/fysen-final-dish-qa
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @fysen/web start --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/fysen-final-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 90); do
            if curl --silent --show-error --fail --max-time 5 "$FYSEN_QA_BASE/" >/dev/null 2>&1; then
              ready=1
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/fysen-final-next.log"
              exit 1
            fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then
            cat "$RUNNER_TEMP/fysen-final-next.log"
            exit 1
          fi
          pnpm --filter @fysen/web exec node tests/home-mobile-tablet-proof.mjs
          pnpm --filter @fysen/web exec node tests/final-dish-gallery-browser-proof.mjs
          echo "PASS: all 44 AVIF thumbnails, last three full-size images, credit and AI disclosures, search navigation, no overflow on mobile and iPad. No deploy." >> "$GITHUB_STEP_SUMMARY"
      - name: Keep browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-dish-gallery-mobile-ipad-proof
          path: |
            ${{ runner.temp }}/fysen-final-dish-qa/
            ${{ runner.temp }}/fysen-final-next.log
          retention-days: 7
          if-no-files-found: ignore
