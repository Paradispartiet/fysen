name: Reactivate Kain production

on:
  pull_request:
    paths:
      - ".github/workflows/reactivate-kain-production.yml"

permissions:
  contents: read

concurrency:
  group: fysen-production-menu-mutation
  cancel-in-progress: false

jobs:
  reactivate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.FYSEN_PRODUCTION_DATABASE_URL }}
      DATABASE_SSL: "verify-full"
      NODE_ENV: production
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: 700d24cb3c1e96a8fb5db5f2aa5f2457132d24c5
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build menu worker and dependencies
        run: pnpm --filter @fysen/menu-worker... build

      - name: Re-onboard Kain from canonical manifest
        working-directory: apps/menu-worker
        run: node dist/index.js onboard:manifest catalog/kain-neo-filipino-bistro-oslo.json

      - name: Verify Kain active and healthy
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createDatabasePool } from './packages/database/dist/index.js';
          const pool = createDatabasePool();
          try {
            const { rows } = await pool.query(
              `SELECT r.slug, r.active, ms.enabled, ms.last_http_status, ms.consecutive_failures,
                      ms.last_menu_fingerprint, w.outcome, w.http_status, w.extracted_item_count,
                      w.error_code, w.error_message, w.started_at
               FROM fysen.restaurants r
               JOIN fysen.menu_sources ms ON ms.restaurant_id = r.id
               LEFT JOIN LATERAL (
                 SELECT outcome, http_status, extracted_item_count, error_code, error_message, started_at
                 FROM fysen.menu_watch_runs
                 WHERE menu_source_id = ms.id
                 ORDER BY started_at DESC
                 LIMIT 1
               ) w ON true
               WHERE r.slug = 'kain-neo-filipino-bistro-oslo'
               ORDER BY ms.created_at DESC
               LIMIT 1`,
            );
            console.log(JSON.stringify(rows[0] ?? null, null, 2));
            const row = rows[0];
            if (!row?.active || !row.enabled) throw new Error('Kain is not active/enabled');
            if (Number(row.consecutive_failures) !== 0) throw new Error(`Kain failures=${row.consecutive_failures}`);
            if (!['changed','unchanged','not_modified'].includes(row.outcome)) throw new Error(`Kain watcher=${row.outcome}`);
            if (!row.last_menu_fingerprint) throw new Error('Kain fingerprint missing');
          } finally {
            await pool.end();
          }
          NODE
