name: Fysen stage authentic tacos al pastor originals (unapproved)
on:
  push:
    branches: [art/tacos-al-pastor-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-stage-tacos-al-pastor.yml"
      - "scripts/stage-tacos-al-pastor-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-tacos-al-pastor-source-review
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image inspection package
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download original photos and calculate source hashes
        run: python scripts/stage-tacos-al-pastor-sources.py
      - name: Gate unapproved review only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          records=list(Path("assets/fysen-image-candidates/tacos-al-pastor").glob("*/review.json"))
          assert records
          for path in records:
              r=json.loads(path.read_text(encoding="utf8"))
              assert r["dish_id"] == r["catalog_id"] == "tacos-al-pastor"
              assert r["source_verified"] and r["no_upscale"]
              assert min(r["native_width"],r["native_height"])>=1600
              assert not r["visual_review_completed"] and not r["approved_for_fysen"] and not r["published"]
              assert (path.parent/"source.jpeg").is_file()
              assert (path.parent/"preview.jpg").is_file()
              assert (path.parent/"native-detail-1400.jpg").is_file()
          print(f"Review gate passed: {len(records)} unapproved sources, no gallery changes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-tacos-al-pastor-originals-for-inspection
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/tacos-al-pastor/*/source.jpeg
            assets/fysen-image-candidates/tacos-al-pastor/*/preview.jpg
            assets/fysen-image-candidates/tacos-al-pastor/*/native-detail-1400.jpg
            assets/fysen-image-candidates/tacos-al-pastor/*/review.json
      - name: Commit only lightweight reviews, no original bytes or public files
        run: |
          find assets/fysen-image-candidates/tacos-al-pastor -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/tacos-al-pastor
          git diff --cached --quiet && exit 0
          git commit -m "[tacos-photo-bot] Stage unapproved source previews"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
