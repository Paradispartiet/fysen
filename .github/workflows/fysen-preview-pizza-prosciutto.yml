name: Fysen review masked whole prosciutto pizza at native resolution
on:
  push:
    branches: [art/pizza-prosciutto-native-photo-20261119]
    paths:
      - ".github/workflows/fysen-preview-pizza-prosciutto.yml"
      - "scripts/preview-pizza-prosciutto-black.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-prosciutto-black-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image segmentation libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Generate black preview preserving authentic food pixels
        run: python scripts/preview-pizza-prosciutto-black.py
      - name: Reject autoapproval of any generated preview
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/pizza-prosciutto/18285316")
          d=json.loads((p/"black-review.json").read_text())
          assert d["original_pixels_upscaled"] is False
          assert d["approved_for_fysen"] is False and d["published"] is False
          assert d["native_output_dimensions"]==[5464,6000]
          assert (p/"black-native-detail-1400.jpg").is_file()
          print("Photo ready for actual visual review, NOT approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-prosciutto-black-photo-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/pizza-prosciutto/18285316/black-native-master.png
            assets/fysen-image-candidates/pizza-prosciutto/18285316/black-preview.jpg
            assets/fysen-image-candidates/pizza-prosciutto/18285316/black-native-detail-1400.jpg
            assets/fysen-image-candidates/pizza-prosciutto/18285316/black-review.json
      - name: Commit only preview, detail and unapproved metadata
        run: |
          rm -f assets/fysen-image-candidates/pizza-prosciutto/18285316/black-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/pizza-prosciutto/18285316/black-preview.jpg
          git add assets/fysen-image-candidates/pizza-prosciutto/18285316/black-native-detail-1400.jpg
          git add assets/fysen-image-candidates/pizza-prosciutto/18285316/black-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[prosciutto-preview-bot] Stage black whole-pizza photo for review"
          git push origin HEAD:"$GITHUB_REF_NAME"
