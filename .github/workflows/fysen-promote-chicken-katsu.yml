name: Fysen integrate reviewed chicken katsu native photo (draft only)
on:
  push:
    branches: [art/chicken-katsu-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-promote-chicken-katsu.yml"
      - "scripts/promote-reviewed-chicken-katsu.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-chicken-katsu-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install native image and AVIF libraries
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Recreate SHA-locked authentic chicken katsu, native AVIF and mini
        run: python scripts/promote-reviewed-chicken-katsu.py
      - name: Run only the two targeted dish-photo test files
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Verify exact sizes, truthful photo attribution and unpublished state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          root=Path("apps/web/public/dish-images")
          m=json.loads((root/"manifest.json").read_text(encoding="utf8"))
          assert len(m["images"])==44
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==24
          p=m["images"][24]
          assert p["id"]==p["catalogId"]=="katsu"
          assert p["kind"]=="Redaksjonelt rettfoto"
          assert p["atlas"]=="chicken-katsu-thumb-512.avif"
          assert p["largeSource"]=="chicken-katsu-master-5472.avif"
          assert p["photoCredit"]=="Cohesion Singapore / Pexels"
          assert p["photoLicense"]=="https://www.pexels.com/license/"
          assert "Pexels License" in (root/"chicken-katsu-LICENSE.txt").read_text(encoding="utf8")
          with Image.open(root/p["atlas"]) as img:assert img.size==(512,512)
          with Image.open(root/p["largeSource"]) as img:assert img.size==(5472,3648)
          audit=json.loads(Path("assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-review.json").read_text(encoding="utf8"))
          assert audit["reviewed_variant"]=="black-clean-grabcut"
          assert audit["approved_for_fysen"] and audit["published"] is False
          assert audit["no_upscale"] and not audit["generated_food_pixels"]
          assert "ikke svin" in p["variantCaution"].lower()
          print("24/44 verified native large photos on UNPUBLISHED DRAFT")
          PY
      - name: Commit only reviewed image, metadata and focused photo tests to draft
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/katsu.png
          git add assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/review.json
          git add assets/fysen-image-candidates/chicken-katsu/cohesion-singapore-katsu-rice/black-review.json
          git add apps/web/public/dish-images/chicken-katsu-master-5472.avif
          git add apps/web/public/dish-images/chicken-katsu-thumb-512.avif
          git add apps/web/public/dish-images/chicken-katsu-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/katsu.md
          git diff --cached --quiet && exit 0
          git commit -m "[katsu-photo-bot] Add reviewed native 5472px chicken katsu and 512 mini, draft only"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
