name: Fysen stage chicken katsu original photos for review only
on:
  push:
    branches: [art/chicken-katsu-native-photo-20261121]
    paths:
      - ".github/workflows/fysen-stage-chicken-katsu.yml"
      - "scripts/stage-chicken-katsu-sources.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-chicken-katsu-source-review
  cancel-in-progress: false
jobs:
  source-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Download actual original images and lock hashes
        run: python scripts/stage-chicken-katsu-sources.py
      - name: No approval/publication allowed from staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=list(Path("assets/fysen-image-candidates/chicken-katsu").glob("*/review.json"))
          assert paths
          for path in paths:
              d=json.loads(path.read_text(encoding="utf8"))
              assert d["dish_id"]==d["catalog_id"]=="katsu"
              assert d["source_verified"] and d["no_upscale"]
              assert min(d["native_width"],d["native_height"])>=1600
              assert not d["visual_review_completed"] and not d["approved_for_fysen"] and not d["published"]
              assert (path.parent/"source.jpeg").is_file()
              assert (path.parent/"preview.jpg").is_file()
              assert (path.parent/"native-detail-1400.jpg").is_file()
          print(len(paths),"source previews passed; 0 approved and 0 published")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-katsu-original-photos-for-editorial-inspection
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/chicken-katsu/*/source.jpeg
            assets/fysen-image-candidates/chicken-katsu/*/preview.jpg
            assets/fysen-image-candidates/chicken-katsu/*/native-detail-1400.jpg
            assets/fysen-image-candidates/chicken-katsu/*/review.json
      - name: Commit only preview-sized evidence, not original JPEG binaries
        run: |
          find assets/fysen-image-candidates/chicken-katsu -name source.jpeg -delete
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/chicken-katsu
          git diff --cached --quiet && exit 0
          git commit -m "[katsu-source-bot] Stage authentic unapproved chicken katsu photos"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
