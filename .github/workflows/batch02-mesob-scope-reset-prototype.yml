name: TEMP Batch 02 Mesob scope reset prototype

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/batch02-mesob-scope-reset-prototype.yml"

permissions:
  contents: read
  actions: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - name: Apply isolated menu-root reset prototype
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/menu-worker/src/html-text-section-scope.ts')
          s=p.read_text()
          s=s.replace('text-section-scope-v8','text-section-scope-v9-prototype')
          needle='const MENU_END_SECTION_LABEL =\n'
          insert='const MENU_ROOT_SECTION_LABEL = /^(?:menu|meny|our\\s+menu|vår\\s+meny)$/iu;\n'
          if insert not in s:
              s=s.replace(needle,insert+needle)
          needle2='    if (!countedSection && BEVERAGE_SECTION_LABEL.test(sectionLabel)) {\n'
          reset='    if (!countedSection && !sawPrice && MENU_ROOT_SECTION_LABEL.test(sectionLabel)) {\n      state = "unknown";\n      states[index] = "unknown";\n      continue;\n    }\n'
          if reset not in s:
              s=s.replace(needle2,reset+needle2)
          p.write_text(s)
          PY
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Restore captured Mesob bytes and inspect prototype final output
        shell: bash
        run: |
          mkdir -p trace /tmp/captured
          gh run download 32628090223 --repo "$GITHUB_REPOSITORY" --name batch02-mesob-sawan-stage-trace --dir /tmp/captured
          cp /tmp/captured/mesob.html trace/mesob.html
          cd apps/menu-worker
          node --input-type=module <<'NODE' | tee ../../trace/mesob-scope-reset-output.json
          import {readFile} from 'node:fs/promises';
          import {extractMenuSource,extractorVersionForSourceType} from './dist/menu-source-runtime.js';
          const raw=await readFile('../../trace/mesob.html','utf8');
          const result=await extractMenuSource('html',{body:raw});
          console.log(JSON.stringify({extractorVersion:extractorVersionForSourceType('html'),count:result.items.length,items:result.items.map(x=>({name:x.name,priceMinor:x.priceMinor,sectionName:x.sectionName,confidence:x.confidence,sourceExcerpt:x.sourceExcerpt}))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch02-mesob-scope-reset-prototype
          path: trace/**
          if-no-files-found: error
