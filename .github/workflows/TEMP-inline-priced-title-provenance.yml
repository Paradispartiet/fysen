name: TEMP inline-priced title provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/inline-priced-title-provenance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Preserve direct inline-priced observed titles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/menu-worker/src/html-description-title-recovery.ts')
          text = path.read_text()
          text = text.replace(
              'export const HTML_DESCRIPTION_TITLE_RECOVERY_VERSION = "titles-v13";',
              'export const HTML_DESCRIPTION_TITLE_RECOVERY_VERSION = "titles-v14";',
              1,
          )
          price_anchor = '''const PRICE_LINE =\n  /^(?:(?:kr\\.?\\s*)?[1-9]\\d{1,3}(?:[.,]\\d{1,2})?(?:\\s*(?:,-|kr\\.?|nok))?)$/iu;\n'''
          price_extra = price_anchor + '''const INLINE_PRICE_AT_END =\n  /\\s+(?:(?:kr\\.?\\s*)?[1-9]\\d{1,3}(?:[.,]\\d{1,2})?\\s*(?:,-|kr\\.?|nok)?)$/iu;\n'''
          if 'const INLINE_PRICE_AT_END' not in text:
              if price_anchor not in text:
                  raise SystemExit('price anchor missing')
              text = text.replace(price_anchor, price_extra, 1)

          anchor = '''function sourceExcerptDirectlyPricesObservedName(\n  item: MenuObservedItem,\n): boolean {\n'''
          helper = '''function sourceExcerptInlinePricesObservedName(\n  item: MenuObservedItem,\n): boolean {\n  const sourceExcerpt = item.sourceExcerpt?.trim() ?? "";\n  if (!sourceExcerpt) return false;\n\n  const current = normalizeVisibleLine(item.name);\n  const foldedCurrent = current.toLocaleLowerCase("nb-NO");\n  const segments = sourceExcerpt\n    .split(SOURCE_EXCERPT_SEPARATOR)\n    .map(normalizeVisibleLine)\n    .filter(Boolean);\n\n  for (const segment of segments) {\n    if (!INLINE_PRICE_AT_END.test(segment)) continue;\n    const titlePart = segment.replace(INLINE_PRICE_AT_END, "").trim();\n    const foldedTitlePart = titlePart.toLocaleLowerCase("nb-NO");\n    if (foldedTitlePart === foldedCurrent) return true;\n\n    if (foldedTitlePart.startsWith(`${foldedCurrent} (`)) {\n      const suffix = titlePart.slice(current.length).trim();\n      const match = suffix.match(PARENTHETICAL_QUALIFIER);\n      if (match?.[1] && looksLikeAllergenQualifier(match[1])) return true;\n    }\n  }\n\n  return false;\n}\n\n''' + anchor
          if 'function sourceExcerptInlinePricesObservedName' not in text:
              if anchor not in text:
                  raise SystemExit('source excerpt anchor missing')
              text = text.replace(anchor, helper, 1)

          old = '''    const directlyPricedObservedName =\n      looksLikeDirectlyPricedObservedTitle(item.name) &&\n      sourceExcerptDirectlyPricesObservedName(item);\n'''
          new = '''    const directlyPricedObservedName =\n      sourceExcerptInlinePricesObservedName(item) ||\n      (looksLikeDirectlyPricedObservedTitle(item.name) &&\n        sourceExcerptDirectlyPricesObservedName(item));\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('directly priced guard anchor missing')
              text = text.replace(old, new, 1)
          path.write_text(text)

          version_test = Path('apps/menu-worker/src/html-description-title-recovery.test.ts')
          vt = version_test.read_text().replace('toBe("titles-v13")', 'toBe("titles-v14")')
          version_test.write_text(vt)

          runtime_version = Path('apps/menu-worker/src/menu-source-runtime-version.test.ts')
          rv = runtime_version.read_text().replace('+titles-v13+', '+titles-v14+')
          runtime_version.write_text(rv)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-description-title-recovery.ts apps/menu-worker/src/html-description-title-recovery.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-description-title-recovery.ts apps/menu-worker/src/html-description-title-recovery.test.ts apps/menu-worker/src/menu-source-runtime-version.test.ts
          git commit -m "Preserve inline-priced observed titles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
