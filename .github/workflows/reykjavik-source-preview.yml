name: Iceland menu source probes (read-only)
on:
  pull_request:
    paths:
      - "apps/menu-worker/src/reykjavik-*.ts"
      - "docs/reykjavik-*-review.json"
      - ".github/workflows/reykjavik-source-preview.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  street-food:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec tsx src/reykjavik-street-food-probe.ts

  rok:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec tsx src/reykjavik-rok-probe.ts

  kitchen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec tsx src/reykjavik-kitchen-probe.ts

  bistro:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec vitest run src/reykjavik-bistro-preview.test.ts
      - run: pnpm --filter @fysen/menu-worker exec tsx src/reykjavik-bistro-probe.ts

  gamla:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm --filter @fysen/menu-worker... build
      - run: pnpm --filter @fysen/menu-worker exec vitest run src/reykjavik-gamla-preview.test.ts
      - run: pnpm --filter @fysen/menu-worker exec tsx src/reykjavik-gamla-probe.ts
