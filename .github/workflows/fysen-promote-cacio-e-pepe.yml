name: Fysen promote genuine cacio e pepe photo to draft
on:
  push:
    branches: [art/cacio-e-pepe-native-photo-20261120]
    paths:
      - ".github/workflows/fysen-promote-cacio-e-pepe.yml"
      - "scripts/promote-reviewed-cacio-e-pepe.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-cacio-e-pepe-draft-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native image and AVIF dependencies
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Recreate exact visually inspected original pixels, then build AVIF pair
        run: python scripts/promote-reviewed-cacio-e-pepe.py
      - name: Test ONLY photo-gallery and full-resolution source constraints
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Enforce source dimensions, CC license and draft-only status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          import pillow_avif
          public=Path("apps/web/public/dish-images")
          m=json.loads((public/"manifest.json").read_text(encoding="utf8"))
          assert sum(x.get("largeViewEnabled") is True for x in m["images"])==16
          p=next(x for x in m["images"] if x["id"]=="cacio-e-pepe")
          assert p["kind"]=="Redaksjonelt rettfoto" and p["catalogId"]=="cacio-e-pepe"
          assert p["atlas"]=="cacio-e-pepe-thumb-512.avif"
          assert p["largeSource"]=="cacio-e-pepe-master-4577.avif"
          assert p["photoLicense"]=="https://creativecommons.org/licenses/by-sa/3.0/"
          assert "DocteurCosmos" in p["photoCredit"]
          assert "CC BY-SA 3.0" in (public/"cacio-e-pepe-LICENSE.txt").read_text()
          with Image.open(public/p["atlas"]) as img: assert img.size==(512,512)
          with Image.open(public/p["largeSource"]) as img: assert img.size==(4577,2498)
          audit=json.loads(Path("assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-review.json").read_text())
          assert audit["reviewed_variant"]=="black-contour"
          assert audit["approved_for_fysen"] and audit["visual_review_completed"] and audit["published"] is False
          print("16/44 source-verified full-size masters on draft; main untouched and still 10/44")
          PY
      - name: Commit ONLY reviewed photo, manifest and targeted tests to draft branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/cacio-e-pepe.png
          git add assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/review.json
          git add assets/fysen-image-candidates/cacio-e-pepe/docteurcosmos-commons/black-review.json
          git add apps/web/public/dish-images/cacio-e-pepe-master-4577.avif
          git add apps/web/public/dish-images/cacio-e-pepe-thumb-512.avif
          git add apps/web/public/dish-images/cacio-e-pepe-LICENSE.txt
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add apps/web/tests/dish-image-large-view-quality.test.mjs
          git add docs/fysen-image-reviews/cacio-e-pepe.md
          git diff --cached --quiet && exit 0
          git commit -m "[cacio-e-pepe-promote-bot] Add source-locked 4577px master and 512 mini (draft only)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
