name: Polskie source route proof

on:
  pull_request:
    paths:
      - ".github/workflows/polskie-source-route-proof.yml"

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FYSEN_MENU_BOT_USER_AGENT: "FysenMenuBot/0.1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @fysen/menu-worker... build
      - name: Build three route variants
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          const base = JSON.parse(await readFile('catalog/polskie-jadlo-oslo.json', 'utf8'));
          const variants = {
            en: 'https://www.foodora.no/en/restaurant/wobf/polskie-jadlo',
            nb: 'https://www.foodora.no/restaurant/wobf/polskie-jadlo',
            reviews: 'https://www.foodora.no/restaurant/wobf/polskie-jadlo/reviews',
          };
          for (const [key, url] of Object.entries(variants)) {
            const dir = `research/polskie-${key}`;
            await mkdir(dir, { recursive: true });
            const manifest = structuredClone(base);
            manifest.menuSource.url = url;
            await writeFile(`${dir}/polskie-jadlo-oslo.json`, JSON.stringify(manifest, null, 2) + '\n');
          }
          NODE
      - name: Validate each route independently
        working-directory: apps/menu-worker
        shell: bash
        run: |
          set +e
          for key in en nb reviews; do
            node dist/index.js validate:batch "research/polskie-$key" > "research/polskie-$key-result.json" 2>&1
            echo "$?" > "research/polskie-$key-exit.txt"
          done
          exit 0
      - name: Summarize routes
        working-directory: apps/menu-worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const summary = {};
          for (const key of ['en', 'nb', 'reviews']) {
            const payload = JSON.parse(await readFile(`research/polskie-${key}-result.json`, 'utf8'));
            const result = payload.results?.[0];
            summary[key] = {
              accepted: result?.accepted ?? false,
              failureFamilies: result?.failureFamilies ?? [],
              menuError: result?.validation?.menu?.error ?? result?.error ?? null,
              itemCount: result?.validation?.menu?.quality?.itemCount ?? null,
              observedDishNames: result?.validation?.menu?.observedDishNames ?? [],
              httpStatus: result?.validation?.menu?.httpStatus ?? null,
            };
          }
          await writeFile('research/polskie-route-summary.json', JSON.stringify(summary, null, 2) + '\n');
          console.log(JSON.stringify(summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: polskie-source-route-proof
          path: apps/menu-worker/research/polskie-route-summary.json
          if-no-files-found: error
