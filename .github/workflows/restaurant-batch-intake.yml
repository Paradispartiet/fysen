name: Restaurant batch intake

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "apps/menu-worker/research/*.seed.json"
      - "apps/menu-worker/src/**"
      - "packages/menu-core/src/**"
      - ".github/workflows/restaurant-batch-intake.yml"
  workflow_dispatch:
    inputs:
      seed_path:
        description: "Research seed relative to repository root"
        required: true
        default: "apps/menu-worker/research/oslo-batch-03.seed.json"
        type: string

permissions:
  contents: read

concurrency:
  group: fysen-restaurant-batch-intake-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FYSEN_CANDIDATE_VALIDATION_CONCURRENCY: "4"
      FYSEN_CANDIDATE_VALIDATION_MAX_ATTEMPTS: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Fysen workspace
        uses: ./.github/actions/setup-node-pnpm

      - name: Build menu-worker dependency graph
        run: pnpm --filter @fysen/menu-worker... build

      - name: Select research seed
        id: seed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DISPATCH_SEED: ${{ inputs.seed_path }}
        run: |
          set -euo pipefail
          validate_seed() {
            local candidate="$1"
            case "$candidate" in
              apps/menu-worker/research/*.seed.json) ;;
              *) echo "Seed must be apps/menu-worker/research/*.seed.json: $candidate" >&2; exit 1 ;;
            esac
            case "$candidate" in
              *..*) echo "Seed may not contain '..': $candidate" >&2; exit 1 ;;
            esac
            [[ -f "$candidate" ]] || { echo "Seed does not exist: $candidate" >&2; exit 1; }
          }

          reproof=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            seed="$DISPATCH_SEED"
            validate_seed "$seed"
          else
            mapfile -t seeds < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" -- 'apps/menu-worker/research/*.seed.json')
            if [[ "${#seeds[@]}" -gt 1 ]]; then
              echo "A restaurant intake PR may change at most one research seed; found ${#seeds[@]}." >&2
              printf '%s\n' "${seeds[@]}" >&2
              exit 1
            fi
            if [[ "${#seeds[@]}" -eq 1 ]]; then
              seed="${seeds[0]}"
            else
              seed="$(
                printf '%s\n' "$PR_BODY" \
                  | sed -nE 's/^[[:space:]]*Batch-intake seed:[[:space:]]*(.*)$/\1/ip' \
                  | tail -n 1 \
                  | xargs
              )"
              if [[ -z "$seed" ]]; then
                cat >&2 <<'EOF'
          Menu runtime changed without a changed research seed.
          Declare the exact existing seed to remeasure in the PR body, for example:
          Batch-intake seed: apps/menu-worker/research/oslo-batch-03.seed.json
          EOF
                exit 1
              fi
              reproof=true
            fi
            validate_seed "$seed"
          fi
          echo "Selected seed: $seed"
          echo "Historical reproof: $reproof"
          echo "path=$seed" >> "$GITHUB_OUTPUT"
          echo "reproof=$reproof" >> "$GITHUB_OUTPUT"

      - name: Resolve Oslo coordinates and dedupe against catalog
        id: resolve
        shell: bash
        env:
          SEED_PATH: ${{ steps.seed.outputs.path }}
          REPROOF: ${{ steps.seed.outputs.reproof }}
        run: |
          set -euo pipefail
          resolved="$RUNNER_TEMP/restaurant-batch-resolved.json"
          report="$RUNNER_TEMP/restaurant-batch-coordinate-report.json"
          node --input-type=module - "$SEED_PATH" "$resolved" "$report" <<'NODE'
          import { readFile, readdir, writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const [, , seedPath, resolvedPath, reportPath] = process.argv;
          const reproof = process.env.REPROOF === "true";
          const seed = JSON.parse(await readFile(seedPath, "utf8"));
          if (seed.version !== 1 || !Array.isArray(seed.restaurants) || seed.restaurants.length === 0) {
            throw new Error("Research seed must be version 1 with at least one restaurant");
          }

          const catalogDirectory = "apps/menu-worker/catalog";
          const catalogSlugs = new Set();
          for (const fileName of (await readdir(catalogDirectory)).filter((name) => name.endsWith(".json"))) {
            const manifest = JSON.parse(await readFile(join(catalogDirectory, fileName), "utf8"));
            if (manifest?.restaurant?.slug) catalogSlugs.add(manifest.restaurant.slug);
          }

          const seedSlugs = seed.restaurants.map((entry) => entry?.restaurant?.slug);
          if (new Set(seedSlugs).size !== seedSlugs.length) {
            throw new Error("Research seed contains duplicate restaurant slugs");
          }
          const collisions = seedSlugs.filter((slug) => catalogSlugs.has(slug));
          const nonCanonical = seedSlugs.filter((slug) => !catalogSlugs.has(slug));
          if (!reproof && collisions.length > 0) {
            throw new Error(`Research seed collides with canonical catalog: ${collisions.join(", ")}`);
          }

          let selectedEntries = seed.restaurants;
          if (reproof) {
            selectedEntries = seed.restaurants.filter((entry) => catalogSlugs.has(entry?.restaurant?.slug));
            if (selectedEntries.length === 0) {
              throw new Error("Historical reproof seed has no currently canonical restaurants to remeasure");
            }
            console.log(
              `Historical reproof selected ${selectedEntries.length}/${seed.restaurants.length} currently canonical restaurants; skipped ${nonCanonical.length} non-canonical seed entries.`
            );
            if (nonCanonical.length > 0) {
              console.log(`Historical reproof skipped non-canonical slugs: ${nonCanonical.join(", ")}`);
            }
          }

          async function addressHits(address) {
            const queryUrl = new URL("https://ws.geonorge.no/adresser/v1/sok");
            queryUrl.searchParams.set("sok", address);
            queryUrl.searchParams.set("treffPerSide", "10");
            const response = await fetch(queryUrl, {
              headers: { "user-agent": "FysenMenuBot/0.1 restaurant-batch-geocoder" }
            });
            if (!response.ok) {
              throw new Error(`Kartverket address lookup returned HTTP ${response.status} for ${address}`);
            }
            const payload = await response.json();
            return Array.isArray(payload?.adresser) ? payload.adresser : [];
          }

          function chooseOsloHit(hits, postalMatch) {
            const osloHits = hits.filter(
              (hit) => !hit.kommunenummer || String(hit.kommunenummer) === "0301"
            );
            if (postalMatch) {
              return osloHits.find(
                (candidate) => String(candidate.postnummer ?? "") === postalMatch
              ) ?? null;
            }
            return osloHits[0] ?? null;
          }

          function canonicalAddressFromHit(hit, fallback) {
            if (!hit?.adressetekst) return fallback;
            const postnummer = String(hit.postnummer ?? "").trim();
            const poststed = String(hit.poststed ?? "Oslo").trim() || "Oslo";
            return postnummer ? `${hit.adressetekst}, ${postnummer} ${poststed}` : fallback;
          }

          async function geocode(entry) {
            const restaurant = entry.restaurant;
            if (Number.isFinite(restaurant.latitude) && Number.isFinite(restaurant.longitude)) {
              return {
                restaurant: { ...restaurant },
                evidence: {
                  slug: restaurant.slug,
                  inputAddress: restaurant.address,
                  provider: "seed",
                  latitude: restaurant.latitude,
                  longitude: restaurant.longitude
                }
              };
            }

            const postalMatch = restaurant.address.match(/\b(\d{4})\s+Oslo\b/i)?.[1] ?? null;
            let lookupAddress = restaurant.address;
            let hit = chooseOsloHit(await addressHits(lookupAddress), postalMatch);
            let fallbackFromPublishedRange = false;
            let fallbackFromMissingHouseSuffix = false;

            if (!hit?.representasjonspunkt) {
              const range = restaurant.address.match(/^(.*?\s)(\d+)([A-Za-z]?)-(\d+)([A-Za-z]?)(,?\s+\d{4}\s+Oslo)$/i);
              if (range) {
                const [, prefix, firstNumber, firstSuffix, lastNumber, lastSuffix, tail] = range;
                for (const fallbackAddress of [
                  `${prefix}${firstNumber}${firstSuffix}${tail}`,
                  `${prefix}${lastNumber}${lastSuffix}${tail}`
                ]) {
                  const fallbackHit = chooseOsloHit(await addressHits(fallbackAddress), postalMatch);
                  if (fallbackHit?.representasjonspunkt) {
                    lookupAddress = fallbackAddress;
                    hit = fallbackHit;
                    fallbackFromPublishedRange = true;
                    break;
                  }
                }
              }
            }

            if (!hit?.representasjonspunkt) {
              const unsuffixed = restaurant.address.match(/^(.*?\s)(\d+)(,?\s+\d{4}\s+Oslo)$/i);
              if (unsuffixed) {
                const [, prefix, number, tail] = unsuffixed;
                for (const suffix of ["A", "B", "C", "D"]) {
                  const fallbackAddress = `${prefix}${number}${suffix}${tail}`;
                  const fallbackHit = chooseOsloHit(await addressHits(fallbackAddress), postalMatch);
                  if (fallbackHit?.representasjonspunkt) {
                    lookupAddress = fallbackAddress;
                    hit = fallbackHit;
                    fallbackFromMissingHouseSuffix = true;
                    break;
                  }
                }
              }
            }

            if (!hit?.representasjonspunkt) {
              throw new Error(
                `${restaurant.slug}: no Oslo address point matching published postcode returned by Kartverket for ${restaurant.address}`
              );
            }
            if (hit.kommunenummer && String(hit.kommunenummer) !== "0301") {
              throw new Error(`${restaurant.slug}: Kartverket resolved outside Oslo municipality`);
            }
            if (postalMatch && String(hit.postnummer ?? "") !== postalMatch) {
              throw new Error(
                `${restaurant.slug}: Kartverket postcode ${String(hit.postnummer ?? "") || "missing"} does not match published postcode ${postalMatch}`
              );
            }

            const latitude = Number(hit.representasjonspunkt.lat);
            const longitude = Number(hit.representasjonspunkt.lon);
            if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) {
              throw new Error(`${restaurant.slug}: Kartverket returned invalid coordinates`);
            }

            const resolvedAddress = fallbackFromMissingHouseSuffix
              ? canonicalAddressFromHit(hit, restaurant.address)
              : restaurant.address;

            return {
              restaurant: { ...restaurant, address: resolvedAddress, latitude, longitude },
              evidence: {
                slug: restaurant.slug,
                inputAddress: restaurant.address,
                resolvedAddress,
                lookupAddress,
                fallbackFromPublishedRange,
                fallbackFromMissingHouseSuffix,
                matchedAddress: hit.adressetekst ?? null,
                postnummer: hit.postnummer ?? null,
                kommunenummer: hit.kommunenummer ?? null,
                provider: "Kartverket Adresser API v1",
                latitude,
                longitude
              }
            };
          }

          const resolvedRestaurants = [];
          const evidence = [];
          for (const entry of selectedEntries) {
            if (entry.version !== 1 || !entry?.restaurant?.slug || !entry?.restaurant?.address) {
              throw new Error("Every research seed entry must be version 1 with restaurant slug and address");
            }
            const result = await geocode(entry);
            resolvedRestaurants.push({ ...entry, restaurant: result.restaurant });
            evidence.push(result.evidence);
          }

          const runtimePlan = {
            version: 1,
            outputDirectory: "candidates",
            concurrency: reproof ? 1 : (seed.concurrency ?? 4),
            restaurants: resolvedRestaurants
          };
          await writeFile(resolvedPath, `${JSON.stringify(runtimePlan, null, 2)}\n`);
          await writeFile(reportPath, `${JSON.stringify({
            version: 1,
            seed: seed.batch ?? seedPath,
            seedRequestedCount: seed.restaurants.length,
            requestedCount: resolvedRestaurants.length,
            catalogBaselineCount: catalogSlugs.size,
            reproof,
            catalogCollisions: collisions,
            skippedNonCanonicalSlugs: reproof ? nonCanonical : [],
            evidence
          }, null, 2)}\n`);
          console.log(
            `Resolved ${resolvedRestaurants.length} restaurant address points against catalog baseline ${catalogSlugs.size}; reproof=${reproof}.`
          );
          NODE
          echo "resolved=$resolved" >> "$GITHUB_OUTPUT"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Generate candidates from live menu sources
        id: intake
        shell: bash
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.resolved }}
        run: |
          set -euo pipefail
          rm -f apps/menu-worker/candidates/*.json
          cd apps/menu-worker
          pnpm intake:batch "$RESOLVED_PLAN" | tee "$RUNNER_TEMP/restaurant-batch-intake-summary.json"

      - name: Assert full generation and strict live validation
        shell: bash
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.resolved }}
        run: |
          set -euo pipefail
          requested="$(node -e 'const x=require(process.argv[1]); console.log(x.restaurants.length)' "$RESOLVED_PLAN")"
          generated="$(find apps/menu-worker/candidates -maxdepth 1 -type f -name '*.json' | wc -l | tr -d ' ')"
          echo "Requested: $requested; generated: $generated"
          [[ "$generated" -eq "$requested" ]] || {
            echo "Batch generation was incomplete" >&2
            exit 1
          }
          cd apps/menu-worker
          pnpm validate:batch candidates

      - name: Upload exact-head intake artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-batch-intake-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/menu-worker/candidates/*.json
            ${{ steps.resolve.outputs.resolved }}
            ${{ steps.resolve.outputs.report }}
            ${{ runner.temp }}/restaurant-batch-intake-summary.json
