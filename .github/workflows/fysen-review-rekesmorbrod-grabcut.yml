name: Fysen review tightly seeded shrimp matte
on:
  push:
    branches: [art/rekesmorbrod-native-photo-20261119]
    paths: [".github/workflows/fysen-review-rekesmorbrod-grabcut.yml","scripts/preview-rekesmorbrod-grabcut.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-shrimp-grabcut-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install local segmentation and image codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 opencv-python-headless==4.11.0.86 numpy==2.2.6
      - name: Render native-source preview with hard foreground/background seeds
        run: python scripts/preview-rekesmorbrod-grabcut.py
      - name: Guard: no unreviewed image published or approved
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/fysen-image-candidates/rekesmorbrod/40853857")
          x=json.loads((p/"black-grabcut-review.json").read_text())
          assert x["output_native_size"] == [3950,3340]
          assert x["visual_review_completed"] is False
          assert x["approved_for_fysen"] is False
          assert x["published"] is False
          print("Only visual review preview; not approved")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fysen-shrimp-grabcut-review
          retention-days: 7
          if-no-files-found: error
          path: |
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-native-master.png
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-preview.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-detail-1400.jpg
            assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-review.json
      - name: Commit only preview artifacts to review PR
        run: |
          rm -f assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-native-master.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-preview.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-detail-1400.jpg
          git add assets/fysen-image-candidates/rekesmorbrod/40853857/black-grabcut-review.json
          git diff --cached --quiet && exit 0
          git commit -m "[shrimp-grabcut-bot] Stage native photo mask for review"
          git push origin HEAD:"$GITHUB_REF_NAME"
