name: Fysen promote reviewed native grilled-steak master
on:
  push:
    branches: [art/grillet-biff-native-photo-20261119]
    paths: [".github/workflows/fysen-promote-grillet-biff.yml","scripts/promote-reviewed-grillet-biff.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fysen-promote-grillet-biff
  cancel-in-progress: false
jobs:
  approved-steak-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image and AVIF codecs
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0 pillow-avif-plugin==1.5.2
      - name: Reproduce SHA-locked 6000px steak original and separate thumbnail
        run: python scripts/promote-reviewed-grillet-biff.py
      - name: Run focused gallery and large-photo tests only
        run: node --test apps/web/tests/dish-photo-gallery.test.mjs apps/web/tests/dish-image-large-view-quality.test.mjs
      - name: Check exact dish, eight approved photos, and publication guard
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path("apps/web/public/dish-images/manifest.json").read_text())
          photos=manifest["images"]
          steak=next(x for x in photos if x["id"]=="grillet-biff")
          assert sum(x.get("largeViewEnabled") is True for x in photos)==8
          assert steak["atlas"]=="grillet-biff-thumb-512.avif"
          assert steak["largeSource"]=="grillet-biff-master-6000.avif"
          assert steak["largeSourceNativeWidth"]==6000 and steak["largeSourceNativeHeight"]==4000
          assert steak["catalogId"] is None
          review=json.loads(Path("assets/fysen-image-candidates/grillet-biff/27643022/black-review.json").read_text())
          assert review["approved_for_fysen"] is True
          assert review["published"] is False
          print("Eight source-audited masters in PR. No deployment.")
          PY
      - name: Commit approved media and provenance to the same PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/fysen-dish-originals/grillet-biff.png
          git add assets/fysen-image-candidates/grillet-biff/27643022/black-review.json
          git add apps/web/public/dish-images/grillet-biff-master-6000.avif
          git add apps/web/public/dish-images/grillet-biff-thumb-512.avif
          git add apps/web/public/dish-images/manifest.json
          git add apps/web/styles/dish-photos.css
          git add apps/web/components/dish-photo-gallery.tsx
          git add apps/web/tests/dish-photo-gallery.test.mjs
          git add docs/fysen-image-reviews/grillet-biff.md
          git diff --cached --quiet && exit 0
          git commit -m "[steak-promote-bot] Integrate verified native steak with separate mini"
          git push origin HEAD:"$GITHUB_REF_NAME"
