name: TEMP scope allergen provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/batch02-output-cleanup-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Scope allergen matching to recovered items
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scope_path = Path('apps/menu-worker/src/html-text-section-scope.ts')
          text = scope_path.read_text()

          old = '''function lineReferencesItem(line: string, itemName: string): boolean {\n  const evidenceLine = normalizeLine(line)\n    .replace(TRAILING_ITEM_ALLERGEN_CODES, "")\n    .trim();\n  const normalizedLine = normalizeDishName(evidenceLine);'''
          new = '''function lineReferencesItem(\n  line: string,\n  itemName: string,\n  matchTrailingAllergenCodes = false,\n): boolean {\n  const normalizedEvidenceLine = normalizeLine(line);\n  const evidenceLine = matchTrailingAllergenCodes\n    ? normalizedEvidenceLine.replace(TRAILING_ITEM_ALLERGEN_CODES, "").trim()\n    : normalizedEvidenceLine;\n  const normalizedLine = normalizeDishName(evidenceLine);'''
          if new not in text:
              if old not in text:
                  raise SystemExit('lineReferencesItem anchor missing')
              text = text.replace(old, new, 1)

          old = '''function sectionEvidenceForItem(\n  item: MenuObservedItem,\n  lines: readonly string[],\n  states: readonly MenuSectionState[],\n): ItemSectionEvidence {'''
          new = '''function sectionEvidenceForItem(\n  item: MenuObservedItem,\n  lines: readonly string[],\n  states: readonly MenuSectionState[],\n  matchTrailingAllergenCodes = false,\n): ItemSectionEvidence {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('sectionEvidence signature anchor missing')
              text = text.replace(old, new, 1)

          old = '''    if (!lineReferencesItem(line, item.name)) continue;'''
          new = '''    if (\n      !lineReferencesItem(line, item.name, matchTrailingAllergenCodes)\n    )\n      continue;'''
          if new not in text:
              if old not in text:
                  raise SystemExit('sectionEvidence line match anchor missing')
              text = text.replace(old, new, 1)

          old = '''export function filterPlainTextBeverageSectionItems(\n  items: readonly MenuObservedItem[],\n  visibleText: string,\n): readonly MenuObservedItem[] {'''
          new = '''interface BeverageSectionFilterOptions {\n  readonly matchTrailingAllergenCodes?: boolean;\n}\n\nexport function filterPlainTextBeverageSectionItems(\n  items: readonly MenuObservedItem[],\n  visibleText: string,\n  options: BeverageSectionFilterOptions = {},\n): readonly MenuObservedItem[] {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('filter signature anchor missing')
              text = text.replace(old, new, 1)

          old = '''    const evidence = sectionEvidenceForItem(item, lines, states);'''
          new = '''    const evidence = sectionEvidenceForItem(\n      item,\n      lines,\n      states,\n      options.matchTrailingAllergenCodes ?? false,\n    );'''
          if new not in text:
              if old not in text:
                  raise SystemExit('filter evidence call anchor missing')
              text = text.replace(old, new, 1)

          old = '''    if (scopedLines.some((line) => lineReferencesItem(line, item.name))) {'''
          new = '''    if (\n      scopedLines.some((line) =>\n        lineReferencesItem(line, item.name, true),\n      )\n    ) {'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scoped provenance anchor missing')
              text = text.replace(old, new, 1)

          old = '''  const fullPageFiltered = filterPlainTextBeverageSectionItems(\n    fullPageRecoveryItems,\n    fullVisibleText,\n  );'''
          new = '''  const fullPageFiltered = filterPlainTextBeverageSectionItems(\n    fullPageRecoveryItems,\n    fullVisibleText,\n    { matchTrailingAllergenCodes: true },\n  );'''
          if new not in text:
              if old not in text:
                  raise SystemExit('full-page filter anchor missing')
              text = text.replace(old, new, 1)

          scope_path.write_text(text)

          batch_path = Path('apps/menu-worker/src/batch02-output-cleanup.test.ts')
          batch = batch_path.read_text()
          old = '''      filterPlainTextBeverageSectionItems(items, visibleText).map((entry) => entry.name),'''
          new = '''      filterPlainTextBeverageSectionItems(items, visibleText, {\n        matchTrailingAllergenCodes: true,\n      }).map((entry) => entry.name),'''
          if new not in batch:
              if old not in batch:
                  raise SystemExit('batch allergen test call anchor missing')
              batch = batch.replace(old, new, 1)
          batch_path.write_text(batch)

          test_path = Path('apps/menu-worker/src/html-text-section-scope.test.ts')
          tests = test_path.read_text()
          tests = tests.replace('''      House Soda\n      55\n    `;''', '''      House Soda (M)\n      55\n    `;''', 1)
          regression = '''\n\n  it("uses allergen tolerance for scoped provenance without beverage-stamping scoped food", () => {\n    const items = [item("Tunfisk Kebab", 1, 16900)];\n    const scopedVisibleText = `\n      Vin\n      Tunfisk Kebab (M, E, HV, F)\n      KR 169\n    `;\n\n    expect(\n      filterHtmlBeverageSectionItemsWithScopedProvenance(\n        items,\n        scopedVisibleText,\n        scopedVisibleText,\n      ).map((entry) => entry.name),\n    ).toEqual(["Tunfisk Kebab"]);\n  });\n'''
          if 'without beverage-stamping scoped food' not in tests:
              marker = '\n\n});'
              if not tests.endswith(marker):
                  raise SystemExit('scope test final marker missing')
              tests = tests[:-len(marker)] + regression + marker
          test_path.write_text(tests)
          PY
          git diff --check
          git diff -- apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/batch02-output-cleanup.test.ts
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/menu-worker/src/html-text-section-scope.ts apps/menu-worker/src/html-text-section-scope.test.ts apps/menu-worker/src/batch02-output-cleanup.test.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Scope allergen evidence to recovered HTML items"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
