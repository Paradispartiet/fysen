name: Setup Fysen Node workspace
description: Install the canonical pnpm and Node versions, cache the pnpm store and install locked workspace dependencies.
runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0
        run_install: false

    - name: Configure pnpm store
      shell: bash
      run: |
        pnpm config set store-dir "$HOME/.pnpm-store"
        mkdir -p "$(pnpm store path --silent)"

    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
