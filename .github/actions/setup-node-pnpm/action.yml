name: Setup Fysen Node workspace
description: Install the canonical pnpm and Node versions, cache the pnpm store and install locked workspace dependencies.
runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0
        run_install: false

    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0

    - name: Configure pnpm store
      shell: bash
      run: pnpm config set store-dir "$HOME/.pnpm-store"

    - name: Cache pnpm store
      uses: actions/cache@v4
      with:
        path: ~/.pnpm-store
        key: pnpm-${{ runner.os }}-node24-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-node24-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
