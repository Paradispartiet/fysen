name: Setup Fysen Node workspace
description: Install the canonical pnpm and Node versions and workspace dependencies.
runs:
  using: composite
  steps:
    - name: pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0
        run_install: false

    - name: Node
      uses: actions/setup-node@v4
      with:
        node-version: 24.18.0

    - name: Install dependencies
      shell: bash
      run: pnpm install --no-frozen-lockfile
