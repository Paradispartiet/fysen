<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#070807">
    <title>Du er frakoblet – Fysen</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; padding: max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); display: grid; place-items: center; background: #070807; color: #f3f0e8; font: 16px/1.55 system-ui, sans-serif; }
      main { width: min(100%, 460px); }
      strong { color: #79c987; font-size: 28px; }
      h1 { font-size: clamp(32px, 8vw, 46px); letter-spacing: -.04em; line-height: 1.1; }
      p { color: #c8cfc7; }
      button { margin-top: 16px; min-height: 50px; padding: 0 22px; border: 0; border-radius: 12px; background: #79c987; color: #070807; font: inherit; font-weight: 750; }
    </style>
  </head>
  <body>
    <main>
      <strong>fysen</strong>
      <h1>Ingen nettilkobling</h1>
      <p>Vi kan ikke hente ferske menyer akkurat nå. Fysen viser ikke gamle restauranttreff som om de er oppdaterte. Sjekk tilkoblingen og prøv igjen.</p>
      <button type="button" onclick="location.reload()">Prøv igjen</button>
    </main>
  </body>
</html>
